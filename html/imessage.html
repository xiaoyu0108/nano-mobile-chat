<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="../js/nano-runtime.js?v=20261023a"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>iMessage</title>
<link rel="stylesheet" href="../css/imessage.css?v=20261018b">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
<script src="../js/appearance.js"></script>
</head>
<body>
<div class="app">

<!-- ============ 列表页 ============ -->
<section class="list-screen" id="listScreen">
 <header class="list-top">
  <button class="nav-btn" id="editBtn" type="button">编辑</button>
  <button class="nav-btn menu-btn" id="listMenuBtn" type="button" aria-label="更多">
   <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 7h16M4 12h16M4 17h16" stroke="#8e8e93" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
  </button>
 </header>
 <h1 class="list-title" id="listTitle">信息</h1>
 <main class="list-scroll" id="threadList"></main>
 <div class="edit-toolbar" id="editToolbar">
  <span class="edit-count" id="editCount">未选择</span>
  <button class="delete-selected" id="deleteSelected" type="button" disabled>删除</button>
 </div>
 <div class="search-dock" id="searchDock">
  <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#8e8e93" stroke-width="2"/><path d="M16.5 16.5L21 21" stroke="#8e8e93" stroke-width="2" stroke-linecap="round"/></svg>
  <span class="search-text">搜索</span>
 </div>
 <button class="compose" id="composeBtn" type="button" aria-label="马甲管理">
  <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.4" stroke="#8e8e93" stroke-width="1.8"/><path d="M5 20c0-3.4 3.1-5.6 7-5.6s7 2.2 7 5.6" stroke="#8e8e93" stroke-width="1.8" stroke-linecap="round"/><path d="M19 4v4M21 6h-4" stroke="#8e8e93" stroke-width="1.8" stroke-linecap="round"/></svg>
 </button>
 <div class="button-menu" id="listMenu">
  <button id="menuNew" type="button"><svg viewBox="0 0 24 24" fill="none"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17v3z" stroke="#8e8e93" stroke-width="1.8" stroke-linejoin="round"/></svg>新增消息</button>
  <button id="menuRefresh" type="button"><svg viewBox="0 0 24 24" fill="none"><path d="M20 12a8 8 0 1 1-2.3-5.6" stroke="#8e8e93" stroke-width="1.8" stroke-linecap="round"/><path d="M20 4v4h-4" stroke="#8e8e93" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>刷新消息</button>
  <button id="menuAlias" type="button"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.4" stroke="#8e8e93" stroke-width="1.8"/><path d="M5 20c0-3.4 3.1-5.6 7-5.6s7 2.2 7 5.6" stroke="#8e8e93" stroke-width="1.8" stroke-linecap="round"/><path d="M19 4v4M21 6h-4" stroke="#8e8e93" stroke-width="1.8" stroke-linecap="round"/></svg>马甲管理</button>
 </div>
</section>

<!-- ============ 聊天页 ============ -->
<section class="chat-screen" id="chatScreen">
 <div class="chat-bg" id="chatBg"></div>
 <header class="chat-header">
  <button class="circle-btn" id="chatBack" type="button" aria-label="返回">
   <svg viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="#8e8e93" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="chat-person" id="chatPerson">
   <div class="mini-avatar" id="chatAvatar"><svg viewBox="0 0 52 52"><circle cx="26" cy="19" r="9" fill="#fff"/><path d="M9 46c0-9.4 7.6-15 17-15s17 5.6 17 15z" fill="#fff"/></svg></div>
   <div class="person-name" id="chatName">聊天<span class="chev-down"></span></div>
  </div>
  <button class="circle-btn" id="chatVideo" type="button" aria-label="视频通话">
   <svg viewBox="0 0 24 24" fill="none">
    <rect x="2.5" y="6.5" width="13" height="11" rx="3" stroke="#8e8e93" stroke-width="1.8"/>
    <path d="M15.5 10.5l6-3.5v10l-6-3.5" stroke="#8e8e93" stroke-width="1.8" stroke-linejoin="round"/>
   </svg>
  </button>
 </header>

 <main class="messages" id="messages"></main>

 <form class="composer" id="composer">
  <div class="quote-bar" id="quoteBar">
   <span class="qb-text" id="quoteText"></span>
   <span class="qb-close" id="quoteClose">✕</span>
  </div>
  <div class="row">
   <button type="button" class="plus" id="plusBtn" aria-label="更多">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#8e8e93" stroke-width="2" stroke-linecap="round"/></svg>
   </button>
   <div class="input-wrap">
    <input class="input" id="messageInput" placeholder="iMessage" autocomplete="off">
    <button type="button" class="wave-btn" id="waveBtn" aria-label="发送/回复">
     <svg viewBox="0 0 24 24" fill="none"><path d="M3 12h2M7 8v8M11 5v14M15 9v6M19 11v2" stroke="#8e8e93" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
   </div>
  </div>
 </form>
</section>

<!-- ============ 聊天设置页 ============ -->
<section class="chat-settings" id="chatSettings">
 <div class="cs-nav">
  <button class="cs-nav-btn" id="csBack">返回</button>
  <div class="cs-nav-title">聊天设置</div>
  <div style="width:34px"></div>
 </div>
 <div class="cs-body">
  <div class="cs-profile">
   <div class="cs-avatar" id="csAvatar"><svg viewBox="0 0 52 52"><circle cx="26" cy="19" r="9" fill="#fff"/><path d="M9 46c0-9.4 7.6-15 17-15s17 5.6 17 15z" fill="#fff"/></svg></div>
   <div class="cs-name" id="csName">聊天</div>
   <div class="cs-sub">iMessage</div>
  </div>
  <section class="cs-section">
   <div class="cs-label">联系人</div>
   <div class="cs-group">
    <div class="cs-row" id="rowRemark"><span class="cs-key">备注</span><span class="cs-value" id="valRemark">聊天</span><span class="cs-chev"></span></div>
   </div>
  </section>
  <section class="cs-section">
   <div class="cs-label">聊天</div>
   <div class="cs-group">
    <div class="cs-row" id="rowBg"><span class="cs-key">聊天背景</span><span class="cs-value" id="valBg">默认</span><span class="cs-chev"></span></div>
    <div class="cs-row" id="rowSearch"><span class="cs-key">查找记录</span><span class="cs-chev"></span></div>
    <div class="cs-row" id="rowClear"><span class="cs-key cs-danger">清空记录</span><span class="cs-chev"></span></div>
   </div>
  </section>
 </div>
</section>

<!-- ============ 新信息页 ============ -->
<section class="newmsg-screen" id="newmsgScreen">
 <div class="nm-header">
  <button class="nm-cancel" id="nmCancel" type="button">取消</button>
  <button class="nm-send" id="nmSend" type="button" disabled>发送</button>
 </div>
 <div class="nm-row">
  <div class="nm-field" id="nmRecipientRow">
   <span class="nm-field-label">收件人</span>
   <span class="nm-field-value empty" id="nmRecipientValue">选择人物</span>
   <span class="nm-field-chev"></span>
  </div>
 </div>
 <div class="nm-row">
  <div class="nm-field" id="nmSenderRow">
   <span class="nm-field-label">发送人</span>
   <span class="nm-field-value empty" id="nmSenderValue">我 / 马甲</span>
   <span class="nm-field-chev"></span>
  </div>
 </div>
 <div class="nm-blank"></div>
 <div class="nm-composer">
  <button class="nm-plus" id="nmPlus" type="button" aria-label="附件">
   <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#8e8e93" stroke-width="1.8" stroke-linecap="round"/></svg>
  </button>
  <div class="nm-input">
   <input id="nmInput" placeholder="输入消息…" autocomplete="off">
   <svg class="nm-mic" viewBox="0 0 24 24" fill="none"><rect x="9" y="3" width="6" height="11" rx="3" stroke="#8e8e93" stroke-width="1.6"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4" stroke="#8e8e93" stroke-width="1.6" stroke-linecap="round"/></svg>
  </div>
 </div>
</section>



<div class="overlay" id="overlay"></div>

<!-- 气泡菜单 -->
<div class="bubble-menu" id="bubbleMenu">
 <button id="bmQuote"><svg viewBox="0 0 24 24" fill="none" width="18" height="18"><path d="M7 7h4v4H9c0 2 1 3 3 3v2c-3 0-5-2-5-5V7zM15 7h4v4h-2c0 2 1 3 3 3v2c-3 0-5-2-5-5V7z" fill="#8e8e93"/></svg>引用</button>
 <button id="bmEdit"><svg viewBox="0 0 24 24" fill="none" width="18" height="18"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17v3z" stroke="#8e8e93" stroke-width="1.8" stroke-linejoin="round"/></svg>编辑</button>
 <button class="danger" id="bmDelete"><svg viewBox="0 0 24 24" fill="none" width="18" height="18"><path d="M5 7h14M9 7V5h6v2M7 7l1 13h8l1-13" stroke="#ff3b30" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>删除</button>
</div>

<!-- 表态 -->
<div class="reaction-bar" id="reactionBar">
 <button data-r="❤️">❤️</button><button data-r="👍">👍</button><button data-r="👎">👎</button>
 <button data-r="😂">😂</button><button data-r="😮">😮</button><button data-r="😢">😢</button>
</div>

<!-- 更多：三个悬浮功能（无外层包裹） -->
<div class="plus-cards" id="plusSheet">
 <div class="ps-card" id="plusReroll">
  <div class="ps-icon reroll"><svg viewBox="0 0 24 24"><path d="M12 5V2L8 6l4 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z" fill="#fff"/></svg></div>
  <div class="ps-label">重 roll</div>
 </div>
 <div class="ps-card" id="plusImage">
  <div class="ps-icon image"><svg viewBox="0 0 24 24"><path d="M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2zM8.5 11a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zM5 19l4.5-6 3 3.5L15.5 13 19 19H5z" fill="#fff"/></svg></div>
  <div class="ps-label">图片</div>
 </div>
 <div class="ps-card" id="plusSticker">
  <div class="ps-icon sticker"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#fff" stroke-width="1.8"/><circle cx="9" cy="10" r="1.25" fill="#fff"/><circle cx="15" cy="10" r="1.25" fill="#fff"/><path d="M8.4 14.2c1 1.1 2.2 1.7 3.6 1.7s2.6-.6 3.6-1.7" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg></div>
  <div class="ps-label">表情包</div>
 </div>
</div>

<!-- 编辑弹窗 -->
<div class="edit-sheet" id="editSheet">
 <div class="es-header">
  <button class="es-cancel" id="esCancel" type="button">取消</button>
  <div class="es-title">编辑消息</div>
  <button class="es-save" id="esSave" type="button">保存</button>
 </div>
 <div class="es-body"><textarea id="esInput"></textarea></div>
</div>

<!-- 表情包弹窗（来源：emoji 数据） -->
<div class="im-emoji-overlay" id="imEmojiOverlay">
 <div class="im-emoji-panel" id="imEmojiPanel">
  <div class="im-ep-header">
   <div class="im-ep-title">表情包</div>
   <button class="im-ep-close" id="imEmojiClose" type="button">✕</button>
  </div>
  <div class="im-ep-groups" id="imEmojiGroups"></div>
  <div class="im-ep-grid" id="imEmojiGrid"></div>
  <div class="im-ep-empty" id="imEmojiEmpty" style="display:none">暂无表情包，请先在「更多 → 表情包」中添加</div>
 </div>
</div>

<!-- 选择人 -->
<div class="picker-sheet" id="pickerSheet">
 <div class="ps-header">
  <button class="ps-cancel" id="pickerCancel" type="button">取消</button>
  <div class="ps-title" id="pickerTitle">选择</div>
  <div style="width:34px"></div>
 </div>
 <div class="ps-list" id="pickerList"></div>
</div>

<!-- 首页搜索 -->
<div class="search-sheet" id="searchSheet">
 <div class="ss-header">
  <button class="ss-cancel" id="ssCancel" type="button">取消</button>
  <div class="ss-title">搜索消息</div>
  <div style="width:34px"></div>
 </div>
 <div class="ss-input-wrap"><input class="ss-input" id="ssInput" placeholder="搜索发过消息的人"></div>
 <div class="ss-results" id="ssResults"></div>
</div>

<!-- 通用 sheet -->
<div class="sheet" id="sheet">
 <div class="sheet-header">
  <button class="sheet-cancel" id="sheetCancel" type="button">取消</button>
  <div class="sheet-title" id="sheetTitle">设置</div>
  <div style="width:34px"></div>
 </div>
 <div class="sheet-body" id="sheetBody"></div>
</div>

<!-- 马甲管理 -->
<div class="alias-sheet" id="aliasSheet">
 <div class="as-header">
  <button class="as-cancel" id="asCancel" type="button">取消</button>
  <div class="as-title">身份</div>
  <button class="as-save" id="asSave" type="button">完成</button>
 </div>
 <div class="as-body" id="asBody"></div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="bgFile" accept="image/*" style="display:none">
<input type="file" id="imgFile" accept="image/*" style="display:none">
</div>
<script src="../js/nano-notify.js?v=20261022f"></script>
<script src="../js/reroll-reason.js?v=20261022a"></script>
<script src="../js/cycle-store.js?v=20261021b"></script>
<script src="../js/mem-link.js?v=20261006a"></script>
    <script src="../js/nano-prompts.js?v=20261021b"></script>
    <script src="../js/imessage.js?v=20261021b"></script>
<script src="../js/api-float.js"></script>
<script src="../swipe-back.js"></script>
</body>
</html>
