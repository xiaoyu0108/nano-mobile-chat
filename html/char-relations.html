<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="../js/nano-runtime.js?v=20261026d"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>角色关系</title>
<link rel="stylesheet" href="../css/inner-setting.css?v=20261024i">
<link rel="stylesheet" href="../css/char-relations.css?v=20261026e">
<script src="../js/appearance.js?v=20261026d"></script>
</head>
<body>

<div class="page-nav" id="pageNav">
    <button class="nav-back" id="navBack" data-back aria-label="返回">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="nav-title">角色关系</div>
    <div class="nav-spacer"></div>
</div>

<div class="container rel-container">
    <div class="rel-hero">
        <div class="rel-char-head">
            <div class="rel-avatar rel-hero-avatar" id="relHeroAvatar">?</div>
            <div class="rel-hero-text">
                <div class="rel-hero-title" id="relHeroTitle">角色关系</div>
                <div class="rel-hero-desc">只对当前 user 绑定的角色设置。每个 char 独立保存，互不影响。</div>
            </div>
        </div>
        <div class="rel-pick-wrap" id="relPickWrap" style="display:none;">
            <select id="charPick" class="rel-select rel-pick"></select>
        </div>
    </div>

    <div class="list-group">
        <div class="list-item">
            <div class="item-left">
                <div class="item-icon" style="color:#3a3a3c;">◎</div>
                <div class="item-text">悄悄话</div>
                <div class="rel-item-desc">允许这个 char 和你勾选的角色说悄悄话；两个人都开启才会生成。</div>
            </div>
            <div class="item-right">
                <input type="checkbox" class="ios-switch" id="privateEnabled">
            </div>
        </div>
        <div class="list-item">
            <div class="item-left">
                <div class="item-icon" style="color:#3a3a3c;">↻</div>
                <div class="item-text">共享近况</div>
                <div class="rel-item-desc">让 ta 在回复时读到勾选角色最近几轮与你的聊天。</div>
            </div>
            <div class="item-right">
                <input type="checkbox" class="ios-switch" id="shareEnabled">
            </div>
        </div>
        <div class="list-item">
            <div class="item-left">
                <div class="item-icon" style="color:#3a3a3c;">◷</div>
                <div class="item-text">共享轮数</div>
            </div>
            <div class="item-right">
                <select id="shareRounds" class="rel-select">
                    <option value="2">2 轮</option>
                    <option value="3" selected>3 轮</option>
                    <option value="5">5 轮</option>
                    <option value="8">8 轮</option>
                </select>
            </div>
        </div>
    </div>

    <div class="rel-auto-note" id="autoNote">
        开启悄悄话后，大约每 3 天会自动刷新一次（只在你打开 App 时检查，一次只生成一段，避免浪费 API）。
    </div>

    <div class="rel-section-title">和谁有关系</div>
    <div class="rel-search-wrap">
        <input id="shareSearch" class="rel-search" type="search" placeholder="搜索当前 user 绑定的角色…" autocomplete="off">
    </div>
    <div class="list-group rel-char-list" id="shareList">
        <div class="rel-empty">正在读取角色…</div>
    </div>
    <div class="rel-tip">只有这里勾选的角色，才会进入 ta 的共享上下文，也才会和 ta 说悄悄话。只显示当前 user 绑定的角色。</div>

    <div class="rel-actions">
        <button id="openRecords" class="rel-primary" type="button">查看悄悄话</button>
    </div>
</div>

<div class="rel-toast" id="relToast"></div>

<script src="../js/swipe-back.js"></script>
<script src="../js/char-relations.js?v=20261026f"></script>
</body>
</html>
