<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>一起去 · 旅途</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&display=swap">
<style>
:root{--ink:#111;--g1:#f5f5f5;--g2:#e8e8e8;--g3:#9a9a9a;--pk:#f8e1e6;--pk2:#c85d7a;--bk:#2e2e2e}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#fff;color:var(--ink);font:300 15px/2 "Noto Sans SC","PingFang SC","Helvetica Neue",sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
svg{display:block}
:focus-visible{outline:1.5px solid var(--ink);outline-offset:2px}
#app{position:absolute;inset:0;display:flex;flex-direction:column;max-width:600px;margin:0 auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow:hidden}
.pt{position:absolute;top:-20px;width:9px;height:9px;background:var(--pk);border-radius:50% 0 50% 0;opacity:.8;animation:fall linear infinite;pointer-events:none}
@keyframes fall{to{transform:translate(60px,110vh) rotate(540deg)}}
header,.route,#scroll,.chips,.bar{position:relative}
header{display:flex;align-items:center;gap:2px;padding:8px 12px 8px 8px}
header .t{flex:1;min-width:0;line-height:1.4;padding-left:4px}
header b{font-weight:500;font-size:16px;letter-spacing:.08em}
header small{display:block;color:var(--g3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--g3);transition:.2s}
.ib:hover{color:var(--ink);background:var(--g1)}
#fp{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--pk2);background:var(--pk);border-radius:99px;padding:0 10px;line-height:24px;margin-right:4px}
#fp.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.3)}}
.route{display:flex;padding:6px 22px 14px;border-bottom:1px solid var(--g2)}
.st{flex:1;text-align:center;position:relative;font-size:11px;color:var(--g3);line-height:1.3}
.st::before{content:"";position:absolute;top:5px;left:-50%;right:50%;height:1px;background:var(--g2)}
.st:first-child::before{display:none}
.st i{display:block;width:11px;height:11px;border-radius:50%;background:#fff;border:1px solid var(--g3);margin:0 auto 6px;position:relative;transition:.3s}
.st.p i{background:var(--ink);border-color:var(--ink)}
.st.c i{background:var(--pk2);border-color:var(--pk2);box-shadow:0 0 0 4px var(--pk);animation:pulse 2.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px #f8e1e655}}
/* 隐藏滚动条（右侧下滑与横向选择栏） */
html,body,#scroll,.cards,.chips,.sheet{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar,#scroll::-webkit-scrollbar,.cards::-webkit-scrollbar,.chips::-webkit-scrollbar,.sheet::-webkit-scrollbar{display:none;width:0;height:0}
.st.c{color:var(--ink)}
#scroll{flex:1;overflow-y:auto;padding:10px 24px 26px}
.m{margin:20px 0}
.m.char{margin:26px 0}
.who{font-size:11px;color:#b08390;letter-spacing:.18em;margin-bottom:5px}
.char p{margin:0 0 .82em;text-align:justify;text-justify:inter-ideograph;line-height:2.02;letter-spacing:.012em}
.char p:last-child{margin-bottom:0}
.m .trans{margin-top:8px;font-size:12.5px;line-height:1.8;color:var(--g3);letter-spacing:.01em;border-left:2px solid var(--pk);padding-left:11px;white-space:pre-wrap}
.user{display:flex;flex-direction:column;align-items:flex-end;margin:16px 0}
.bub{max-width:82%;background:var(--bk);color:#fff;border-radius:20px 20px 7px 20px;padding:5px 16px;font-size:13.5px;line-height:1.8;animation:bin .35s cubic-bezier(.3,1.4,.5,1);transform-origin:right bottom}
@keyframes bin{from{transform:scale(.7);opacity:0}}
.sys{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;margin:28px 0;font-size:11.5px;color:#a98792}
.sys>span{max-width:100%;background:#fdf7f9;border:1px solid #f2e3e8;border-radius:999px;padding:4px 16px;line-height:1.6;letter-spacing:.1em;text-align:center}
.sys::before,.sys::after{display:none}
.acts{display:flex;gap:2px;margin-top:2px;margin-left:-6px}
.user .acts{margin:2px -6px 0 0}.sys .acts{justify-content:center;margin:0}
.acts .ib{width:28px;height:28px}
.ed{width:100%;min-height:80px;border:1px solid var(--g2);border-radius:14px;padding:8px 12px;background:#fff;resize:vertical}
.cards{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:8px -24px 0;padding:6px 24px}
.card{flex:0 0 150px;scroll-snap-align:start;border:1px solid var(--g2);border-radius:18px;padding:12px;position:relative;background:#fff;transition:.35s}
.cards.in .card{animation:ci .55s backwards}.cards.in .card:nth-child(2){animation-delay:.12s}.cards.in .card:nth-child(3){animation-delay:.24s}
@keyframes ci{from{opacity:0;transform:translateY(16px) rotate(2deg)}}
.card .ic{width:34px;height:34px;border-radius:50%;background:var(--pk);display:grid;place-items:center;color:var(--pk2)}
.card h4{font-weight:500;font-size:15px;margin-top:8px;line-height:1.4}
.card p{font-size:12px;color:var(--g3);line-height:1.5;min-height:36px;margin-top:2px}
.card .b{display:flex;gap:6px;margin-top:8px}
.card .b button{flex:1;border:1px solid var(--g2);border-radius:99px;line-height:24px;font-size:12px;transition:.2s}
.card .b button:hover{border-color:var(--ink)}
.card.go{border-color:var(--pk2);background:#fffafb}
.card.go::after{content:"去";position:absolute;right:10px;top:10px;width:26px;height:26px;border:1.5px solid var(--pk2);color:var(--pk2);border-radius:50%;display:grid;place-items:center;font-size:12px;transform:rotate(-12deg)}
.card.go.pop::after{animation:st .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes st{from{transform:scale(2.4) rotate(-40deg);opacity:0}}
.card.no{opacity:.45;transform:scale(.96)}.card.no h4{text-decoration:line-through}
.bp{position:fixed;width:7px;height:7px;border-radius:50%;background:var(--pk2);pointer-events:none;z-index:20;animation:bp .75s ease-out forwards}
.bp:nth-child(2n){background:var(--pk)}
@keyframes bp{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
.ty i{display:inline-block;width:5px;height:5px;margin-right:5px;border-radius:50%;background:var(--g3);animation:b 1s infinite}
.ty i:nth-child(2){animation-delay:.15s}.ty i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{opacity:.2;transform:translateY(-4px)}}
.chips{display:flex;gap:8px;padding:8px 18px 0;overflow-x:auto}
.chips button{display:flex;align-items:center;gap:5px;border:1px solid var(--g2);border-radius:99px;padding:0 12px;font-size:12px;line-height:26px;color:#555;white-space:nowrap;background:#fff;transition:.2s}
.chips button:hover{border-color:var(--pk2);color:var(--pk2)}.chips button:active{transform:scale(.92)}
.bar{display:flex;gap:8px;align-items:flex-end;padding:8px 18px 14px}
#inp{flex:1;resize:none;max-height:120px;border:1px solid var(--g2);border-radius:20px;padding:8px 16px;line-height:1.6;background:#fff}
#send{height:40px;min-width:64px;padding:0 18px;border-radius:99px;background:var(--ink);color:#fff;font-size:14px;transition:.25s}
#send.re{background:var(--pk);color:var(--ink)}
#send:disabled{opacity:.4}
#mask{position:fixed;inset:0;background:#0000002e;opacity:0;pointer-events:none;transition:.25s;z-index:5}
#mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:600px;max-height:84%;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:20px 22px calc(26px + env(safe-area-inset-bottom,0px));transform:translate(-50%,105%);transition:transform .35s;z-index:6}
.sheet.on{transform:translate(-50%,0)}
.sheet h3{font-weight:500;font-size:16px;margin-bottom:6px}
.sheet label{display:block;font-size:12px;color:var(--g3);margin:16px 0 6px}
.sheet input[type=number],.sheet input[type=text],.sheet select,.sheet textarea,.sheet input:not([type]){width:100%;border:1px solid var(--g2);border-radius:10px;padding:8px 12px;background:#fff;line-height:1.6}
.hint{font-size:12px;color:var(--pk2);margin-top:4px;line-height:1.6}
.r2{display:flex;gap:8px;margin-top:8px}.r2 input{flex:1}
.pl{border:1px solid var(--g2);border-radius:99px;padding:0 16px;font-size:13px;white-space:nowrap;line-height:34px}
.pl.k{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabs{display:flex;gap:20px;margin-bottom:8px}
.tabs button{font-size:15px;color:var(--g3);padding:2px 0;border-bottom:1.5px solid transparent}
.tabs .on{color:var(--ink);border-color:var(--pk2)}
.it{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--g1)}
.it .d{font-size:11px;color:var(--pk2);width:30px;flex:none}
.it .n{flex:1}
.tx{background:linear-gradient(var(--g3),var(--g3)) no-repeat 0 55%/0 1px;transition:background-size .7s,color .7s}
.it em{font-style:normal;font-size:11px;color:var(--pk2);margin-left:8px;opacity:0;transition:opacity .5s .5s}
.it.done .tx{background-size:100% 1px;color:var(--g3)}.it.done em{opacity:1}
.it .ib{width:28px;height:28px}
.empty{color:var(--g3);font-size:13px;padding:10px 0}
.rc{display:block;width:100%;text-align:left;border:1px solid var(--g2);border-radius:16px;padding:10px 14px;margin-top:10px;line-height:1.6}
.rc small{display:block;color:var(--g3);font-size:12px}
.dlg{position:fixed;left:50%;top:50%;width:min(320px,88%);background:#fff;border-radius:20px;padding:24px;z-index:7;transform:translate(-50%,-48%) scale(.96);opacity:0;pointer-events:none;transition:.25s}
.dlg.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
.dlg .sw{display:flex;justify-content:space-between;align-items:center;margin:14px 0}
.dlg .sw input{width:20px;height:20px;accent-color:var(--ink)}
.dlg .bt{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.dlg .bt button{padding:6px;border-radius:99px;border:1px solid var(--g2)}
.dlg .bt .k{background:var(--ink);color:#fff;border-color:var(--ink)}
#cover{position:fixed;inset:0;background:#fff;z-index:4;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
#cover.on{display:flex}
#cover .big{width:56px;height:56px;border-radius:50%;background:var(--pk);color:var(--pk2);display:grid;place-items:center;animation:pulse 2.4s infinite}
#cover .bt{display:flex;gap:10px;margin-top:10px}
#ov{position:fixed;inset:0;background:#fffffff2;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
#ov.on{display:flex}
#ov svg{width:min(340px,86%);overflow:visible}
.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 2.2s ease-in-out forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.fi{opacity:0;animation:fi .6s 1.8s forwards}.f0{opacity:0;animation:fi .5s .1s forwards}
@keyframes fi{to{opacity:1}}
#ov p{margin-top:18px;font-size:13px;color:var(--g3);letter-spacing:.2em}
#toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);background:var(--bk);color:#fff;border-radius:99px;padding:0 16px;line-height:34px;font-size:13px;display:flex;gap:6px;align-items:center;opacity:0;pointer-events:none;transition:.35s;z-index:12}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* 拍照消息 */
.m.photo{display:flex;flex-direction:column;align-items:flex-start;margin:18px 0}
.m.photo .ph{max-width:86%;background:#fff;padding:7px 7px 22px;box-shadow:0 0 0 1px rgba(0,0,0,.07),0 10px 24px rgba(0,0,0,.12);transform:rotate(-1.6deg)}
.m.photo .ph img{display:block;width:100%;max-height:52vh;object-fit:cover}
.m.photo .ph .cap{padding:7px 4px 0;font-size:11px;color:var(--g3);letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m.photo .phacts{display:flex;gap:4px;margin-top:3px;margin-left:-6px}
.m.photo .phacts .ib{width:28px;height:28px}
.m.photo .ph .loading{width:230px;height:230px;display:grid;place-items:center;background:linear-gradient(100deg,#eee 30%,#fafafa 50%,#eee 70%) 0 0/300% 100%;animation:sh 1.2s linear infinite;color:var(--g3);font-size:12px}
@keyframes sh{to{background-position:-300% 0}}
.m.photo .ph.fail{box-shadow:0 0 0 1px #f3c6cf;background:#fff7f9}
.m.photo .ph.fail .loading{background:#fff7f9;color:var(--pk2)}
/* 旁白：像一页旅行手记，不再用居中的长斜体 */
.m.narr{display:flex;flex-direction:column;align-items:stretch;gap:0;margin:24px 0;padding:0 2px}
.m.narr .nlab{display:flex;align-items:center;justify-content:center;gap:8px;font-size:9.5px;letter-spacing:.3em;color:#c09aa6;margin-bottom:8px;text-indent:.3em}
.m.narr .nlab::before,.m.narr .nlab::after{content:"";width:18px;height:1px;background:#eedde2}
.m.narr .nt{position:relative;width:100%;max-width:none;text-align:justify;text-justify:inter-ideograph;white-space:pre-wrap;color:#8d5b6a;
  font-family:"Noto Serif SC","Songti SC",Georgia,"Times New Roman",serif;font-style:normal;
  font-size:14.5px;line-height:2.1;letter-spacing:.025em;
  background:linear-gradient(180deg,#fdf9fa 0%,#fffbfc 100%);
  border:1px solid #f4e4e9;border-radius:16px;padding:15px 18px;
  box-shadow:0 8px 22px rgba(200,93,122,.055)}
.m.narr .nt::before,.m.narr .nt::after{display:none}
.m.narr .acts{justify-content:center;margin-top:4px}
/* 回顾模式：隐藏输入和编辑入口，只保留当时的页面 */
body.is-replay .bar,body.is-replay .chips{display:none}
body.is-replay #route .st{cursor:default}
/* 旅行记录列表 */
.rcrow{display:flex;align-items:center;gap:6px;margin-top:10px}
.rcrow .rc{flex:1;margin-top:0}
.rcrow .ib{width:32px;height:32px;flex:none;color:var(--g3)}
/* 大图查看 */
#pv{position:fixed;inset:0;z-index:30;background:#0b0b0cf0;display:none;align-items:center;justify-content:center;padding:18px}
#pv.on{display:flex}
#pv img{max-width:100%;max-height:88vh;object-fit:contain;border-radius:10px;box-shadow:0 20px 60px #0008;animation:pvin .25s}
@keyframes pvin{from{opacity:0;transform:scale(.96)}}
#pv .ib{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top,0px));color:#fff;background:#ffffff22}
#pv .ib:hover{background:#ffffff33;color:#fff}
/* 提示词 / 旁白输入 */
#narrDlg textarea{width:100%;min-height:96px;border:1px solid var(--g2);border-radius:12px;padding:10px 12px;line-height:1.7;resize:vertical}
#shPrompt textarea{min-height:180px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.5px;line-height:1.7;color:#444}
@media(prefers-reduced-motion:reduce){.pt{display:none}*{animation-duration:.01s!important;transition:none!important}}
</style></head><body>
<div id="app">
  <header>
    <button class="ib" id="back" data-i="chev" aria-label="返回"></button>
    <div class="t"><b id="tTitle">一起去</b><small id="sub"></small></div>
    <div id="fp"></div>
    <button class="ib" id="bRec" data-i="book" aria-label="旅行记录"></button>
    <button class="ib" id="bPlan" data-i="list" aria-label="行程"></button>
    <button class="ib" id="bSet" data-i="sliders" aria-label="设置"></button>
  </header>
  <div class="route" id="route"></div>
  <div id="scroll"><div id="log"></div></div>
  <div class="chips" id="chips"></div>
  <div class="bar">
    <textarea id="inp" rows="1" placeholder="写点什么…（留空点“回复”才会调用）"></textarea>
    <button id="send" class="re">回复</button>
  </div>
</div>
<div id="mask"></div>
<div id="cover"><div class="big" id="cbig"></div><p id="ctxt" style="font-size:15px"></p>
  <div class="bt"><button class="pl k" id="again">再次出发</button><button class="pl" id="cRec">旅行记录</button></div></div>

<div class="sheet" id="shPlan">
  <div class="tabs"><button class="on" data-t="plan">行程</button><button data-t="guide">攻略</button></div>
  <div id="tPlan"></div><div id="tGuide" hidden></div>
</div>
<div class="sheet" id="shRec"><h3>旅行记录</h3><div id="recList"></div><div id="recView" hidden></div></div>
<div class="sheet" id="shSet">
  <h3>叙事设置</h3>
  <label>每次回复字数（每次回复前读取）</label>
  <input type="number" id="len" min="50" max="5000" step="50" value="500">
  <label>人称</label>
  <select id="person"><option value="first">第一人称（我）</option><option value="second">第二人称（你）</option><option value="third">第三人称（他/她）</option></select>
  <label>描写 user</label>
  <select id="umode"><option value="off">关闭</option><option value="low">低</option><option value="mid" selected>中</option><option value="high">高</option></select>
  <div class="hint" id="uhint"></div>
  <label>文风</label>
  <select id="ssel"></select>
  <textarea id="styleTxt" rows="3" style="margin-top:8px" placeholder="文风描述，可直接 DIY…"></textarea>
  <div class="r2"><input id="sname" placeholder="预设名称" maxlength="12"><button class="pl k" id="ssave">保存</button><button class="pl" id="sdel">删除</button></div>
</div>
<div class="dlg" id="dlg">
  <h3 style="font-weight:500">离开旅行？</h3>
  <p style="font-size:13px;color:var(--g3);line-height:1.7">「回到线上」会自动总结本次旅行、写进「旅途」并生成卡片回到私聊；「直接退出」回到好友页，下次点开这个角色会继续这趟旅行。</p>
  <div class="sw"><span style="font-size:14px">直接退出时也总结这段旅行的记忆（向量）</span><input type="checkbox" id="sum"></div>
  <div class="bt"><button class="k" id="online">回到线上</button><button id="leave">直接退出</button><button id="stay" style="border:0;color:var(--g3)">继续旅行</button></div>
</div>
<div class="dlg" id="cf">
  <h3 style="font-weight:500">确认删除？</h3>
  <p id="cft" style="font-size:13px;color:var(--g3);line-height:1.7"></p>
  <div class="bt"><button class="k" id="cfy">删除</button><button id="cfn">取消</button></div>
</div>
<div class="dlg" id="narrDlg">
  <h3 style="font-weight:500">写一段旁白</h3>
  <p style="font-size:12px;color:var(--g3);line-height:1.6;margin-bottom:10px">旁白会用特殊字体与颜色显示，并作为这趟旅行的叙事上下文。</p>
  <textarea id="narrTxt" placeholder="例如：风把巷子里的灯笼吹得轻轻晃动，谁都没有先开口。"></textarea>
  <div class="bt"><button class="k" id="narrOk">发送旁白</button><button id="narrCancel">取消</button></div>
</div>
<div class="sheet" id="shPrompt">
  <h3>照片提示词</h3>
  <p style="font-size:12px;color:var(--g3);line-height:1.6;margin-bottom:10px">这是这张照片的完整提示词。可以直接修改后重roll。</p>
  <textarea id="promptView" rows="9" spellcheck="false"></textarea>
  <div class="r2" style="margin-top:12px"><button class="pl k" id="promptReroll">重roll</button><button class="pl" id="promptClose">关闭</button></div>
</div>
<div id="pv"><img id="pvImg" alt="拍立得"><button class="ib" id="pvClose" aria-label="关闭"></button></div>
<div id="ov"></div>
<div id="toast"></div>

<script src="../js/nano-runtime.js?v=20261106a"></script>
<script>window.__NANO_FONT_ONLY = true;</script>
<script src="../js/appearance.js?v=20261106a"></script>
<script src="../js/nano-gallery.js?v=20261106a"></script>
<script src="../js/localforage.min.js?v=20261106a"></script>
<script src="../js/mem-link.js?v=20261106a"></script>
<script src="../js/builtin-worldbook.js?v=20261025b"></script>
<script src="../js/travel-store.js?v=20261109a"></script>
<script src="../js/travel-api.js?v=20261102a"></script>
<script>
/* ===== API 接入点 =====
   window.TravelAPI.generate(payload) -> {text, choices:[{type:'地点'|'美食',name,desc}]}

const ACTIVE_DB = 'nano_travel_chat_db';
const ACTIVE_STORE = 'sessions';
let _activeDbPromise = null;
function activeDbOpen(){
  if (typeof indexedDB === 'undefined') return Promise.resolve(null);
  if (_activeDbPromise) return _activeDbPromise;
  _activeDbPromise = new Promise(resolve=>{
    try{
      const req = indexedDB.open(ACTIVE_DB, 1);
      req.onupgradeneeded = e=>{
        const db = e.target.result;
        if (!db.objectStoreNames.contains(ACTIVE_STORE)) db.createObjectStore(ACTIVE_STORE);
      };
      req.onsuccess = ()=>resolve(req.result);
      req.onerror = ()=>resolve(null);
      req.onblocked = ()=>resolve(null);
    }catch(e){ resolve(null); }
  });
  return _activeDbPromise;
}
function activeDbSet(key, value){
  return activeDbOpen().then(db=>{
    if (!db) return false;
    return new Promise(resolve=>{
      try{
        const tx = db.transaction(ACTIVE_STORE, 'readwrite');
        tx.objectStore(ACTIVE_STORE).put(value, key);
        tx.oncomplete = ()=>resolve(true);
        tx.onerror = ()=>resolve(false);
        tx.onabort = ()=>resolve(false);
      }catch(e){ resolve(false); }
    });
  }).catch(()=>false);
}
function activeDbGet(key){
  return activeDbOpen().then(db=>{
    if (!db) return null;
    return new Promise(resolve=>{
      try{
        const req = db.transaction(ACTIVE_STORE, 'readonly').objectStore(ACTIVE_STORE).get(key);
        req.onsuccess = ()=>resolve(req.result || null);
        req.onerror = ()=>resolve(null);
      }catch(e){ resolve(null); }
    });
  }).catch(()=>null);
}

  const lower=String(userText||'').toLowerCase();
  const parts=[];
  (books||[]).forEach(w=>{

    const sc=w.scope||'global';
    const bound=(w.boundCharacters||[]).some(b=>ids.indexOf(String(b))!==-1);
    if(sc==='local'&&!bound)return;
    if(sc==='online'&&(w.boundCharacters||[]).length&&!bound)return;
    w.entries.forEach(en=>{
      if(!en||!en.content)return;
      if(en.enabled===false)return;
      if(en.permanent!==true){
        const kw=String(en.keywords||'').trim();
        if(kw && !kw.split(/[,，、；\s]+/).filter(Boolean).some(k=>lower.indexOf(k.toLowerCase())!==-1))return;
      }
      parts.push((en.title?('【'+en.title+'】\n'):'')+String(en.content).trim());
    });
  });
  return parts.join('\n\n').slice(0,6000);
}

function cosine(a,b){
  if(!Array.isArray(a)||!Array.isArray(b)||a.length!==b.length)return 0;
  let s=0,na=0,nb=0;
  for(let i=0;i<a.length;i++){s+=a[i]*b[i];na+=a[i]*a[i];nb+=b[i]*b[i]}
  return na&&nb?s/Math.sqrt(na*nb):0;
}

async function retrieveVector(query,list){
  if(!list||!list.length)return [];
  let qv=null;
  try{qv=await TravelAPI.embed(query)}catch(e){}
  if(qv){
    const scored=list.map(x=>({x,s:cosine(qv,x.embedding||[])}));
    if(scored.some(o=>o.s>0))return scored.sort((a,b)=>b.s-a.s).filter(o=>o.s>0).slice(0,4).map(o=>o.x);
  }
  const q=String(query||'').toLowerCase();
  const words=q.split(/[\s,，。！？、]+/).filter(w=>w.length>=2);
  const scored=list.map(x=>{
    let s=0; const c=String(x.content||'').toLowerCase();
    words.forEach(w=>{if(c.indexOf(w)!==-1)s+=2});
    const meta=x.travelMeta||{};
    const mts=Date.parse(meta.date||'');
    if(!isNaN(mts))s+=Math.max(0,1-(Date.now()-mts)/(365*86400000));
    if((meta.places||[]).some(p=>p&&q.indexOf(String(p).toLowerCase())!==-1))s+=3;
    return {x,s};
  });
  return scored.sort((a,b)=>b.s-a.s).slice(0,4).map(o=>o.x);
}

const charCount=s=>String(s==null?'':s).replace(/\s+/g,'').length;
async function ensureTravelLength(text,desired,built){
  const target=Math.max(0,Number(desired)||0);
  if(!target)return {text,extended:false};
  let out=String(text||'').trim(),n=charCount(out),tries=0,extended=false;
  while(n<target&&tries<3){
    const need=target-n;
    let raw='';
    try{
      raw=await TravelAPI.callChat({
        messages:built.messages.concat([
          {role:'assistant',content:out},
          {role:'user',content:'【续写补足 · 只输出正文】上一段正文只写了 '+n+' 字，还没有达到 '+target+' 字的要求。'
            +'请从最后一句自然接着往下写，至少再写 '+Math.max(need,120)+' 字；不要重复已经写过的内容，不要总结，不要提前收尾，不要输出 JSON、标题或解释。'}
        ]),
        temperature:0.85,maxTokens:Math.max(900,Math.min(8000,Math.round(Math.max(need,120)*2.4)))
      });
    }catch(e){break}
    let add=String(raw||'').trim();
    try{
      const j=TravelAPI.looseJson(raw);
      if(j&&typeof j==='object'&&!Array.isArray(j)){
        const picked=String(j.text||j.narrative||j.reply||j.content||'').trim();
        if(picked)add=picked;
      }
    }catch(e){}
    if(/^[\s]*[\[{]/.test(add)&&/"(?:text|narrative|choices)"\s*:/.test(add))add='';
    add=add.replace(/^```[\w-]*\s*/,'').replace(/\s*```$/,'').trim();
    if(charCount(add)<20)break;
    const next=out.replace(/\s+$/,'')+'\n\n'+add;
    const nn=charCount(next);
    if(nn<=n)break;
    out=next;n=nn;tries++;extended=true;
  }
  return {text:out,extended};
}
async function travelGenerate(p){
  const hist=p.history||[],decisions=p.decisions||[];
  const built=await buildContext(p,hist,decisions);
  const targetLen=Math.max(0,Number(built.settings.len)||0);
  const maxTokens=Math.max(900,Math.min(8000,Math.round((targetLen||500)*2.4)));
  const raw=await TravelAPI.callChat({messages:built.messages,temperature:0.9,maxTokens,json:true});
  let data=null;
  try{data=TravelAPI.looseJson(raw)}catch(e){}
  const foreign=charIsForeign();
  if(!data||typeof data!=='object'){
    const txt=String(raw||'').trim();
    if(!txt)throw new Error('主 API 没有返回内容');
    const fixed=await ensureTravelLength(txt,targetLen,built);
    const tr=foreign?await translateToZh(fixed.text):'';
    return {text:fixed.text,translation:tr,choices:fallbackChoices()};
  }
  let text=String(data.text||data.reply||'').trim();
  if(!text){text=String(data.narrative||'').trim()}
  if(!text)throw new Error('主 API 没有返回叙事');
  let translation=foreign?String(data.translation||data.zh||'').trim():'';
  if(foreign&&!translation)translation=await translateToZh(text);
  const fixed=await ensureTravelLength(text,targetLen,built);
  text=fixed.text;
  if(foreign&&fixed.extended)translation=await translateToZh(text);
  let choices=normalizeChoices(data.choices);
  if(choices.length<3){const f=fallbackChoices();choices=choices.concat(f).slice(0,3)}
  return {text:macro(text),translation:macro(translation),choices};
}

  const cont=!!(opt&&opt.continue);
  let at=S.msgs.length;

  const hist=S.msgs.slice(0,at);
  const decisions=hist.flatMap(x=>(x.choices||[]).filter(c=>c.s&&!c.sent).map(c=>({type:c.type,name:c.name,choice:c.s})));
  const settings={len:Math.max(50,+$('#len').value||500),person:$('#person').value,userMode:$('#umode').value,userModeDesc:UM[$('#umode').value],style:$('#styleTxt').value.trim()};
  const ty=E('div','m ty');ty.innerHTML='<i></i><i></i><i></i>';log.append(ty);down();
  let res;
  try{
    res=await window.TravelAPI.generate({
      char:CHAR,user:USER,dest:DEST,stop:GUIDE[S.gi][0],day:day(),time:tm(),settings,decisions,plan:S.plan,
      records:recSum(),invite:INVITE,continue:cont,
      history:hist.map(x=>({role:x.role,text:x.role==='photo'?(''):x.text,translation:x.translation||'',caption:x.caption||''}))
    });
  }catch(e){
    ty.remove();S.busy=false;$('#send').disabled=false;
    S.msgs.splice(at,0,{id:++S.uid,role:'sys',text:'连接失败：'+((e&&e.message)||'请检查主 API')});render();return;
  }
  ty.remove();
  hist.forEach(x=>(x.choices||[]).forEach(c=>{if(c.s)c.sent=true}));
  const m={id:++S.uid,role:'char',text:res.text,translation:res.translation||'',choices:(res.choices||[]).map(c=>({...c})),typing:true,view:''};
  S.msgs.splice(at,0,m);render();
  for(let i=0;i<m.text.length;i+=4){m.view=m.text.slice(0,i+4);refresh(m);if(at===S.msgs.length-1)down();await new Promise(r=>setTimeout(r,16))}
  m.typing=false;m.fresh=true;refresh(m);
  if(!cont){S.n++;setSub();drawRoute();}
  S.busy=false;$('#send').disabled=false;if(at===S.msgs.length-1)down();
  decisions.filter(d=>d.choice==='go').forEach((d,i)=>setTimeout(()=>markDone(d.name),700*(i+1)));
}

        }));

function normalizeReplayRecord(rec){
  rec=rec||{};
  const rawMsgs=Array.isArray(rec.msgs)?rec.msgs:[];
  const journey=rawMsgs.length?rawMsgs:(Array.isArray(rec.journey)?rec.journey:[]);
  const stops=Array.isArray(rec.stops)?rec.stops:(Array.isArray(rec.places)?rec.places:[]);
  return {
    id:String(rec.id||rec.tripId||'replay'),
    tripId:String(rec.tripId||rec.id||''),
    dest:rec.dest||rec.place||rec.title||'',
    title:rec.title||rec.place||rec.dest||'',
    date:rec.date||'',
    stops:stops.filter(Boolean),
    plan:Array.isArray(rec.plan)?rec.plan:[],
    settings:rec.settings||{},
    summary:String(rec.summary||rec.thought||rec.noteChar||''),
    charId:String(rec.charId||CHAR_ID||''),
    charName:rec.charName||rec.name||CHAR,
    userName:rec.userName||USER,
    msgs:journey.filter(Boolean)
  };
}

function enterReplay(rec,opts){
  opts=opts||{};
  if(opts.fromLive&&(S.busy||S.photoBusy)){toast('等这一轮旅行写完后，再打开回顾');return;}
  const r=normalizeReplayRecord(rec);
  if(!r.msgs.length&&!r.plan.length&&!r.summary){toast('这段旅程没有留下可回顾的内容');return;}
  if(!REPLAY_MODE){
    if(opts.fromLive){
      // 进回顾前先把当前旅行落盘：即使用户从回顾页直接关掉 App，也能继续原来的旅程。
      try{saveActiveSession()}catch(e){}

    }else{LIVE_STATE=null;REPLAY_FROM_LIVE=false}
  }
  REPLAY_MODE=true;
  closeAll();

  if(r.userName)USER=r.userName;
  if(r.dest)DEST=r.dest;
  const visited=(r.stops||[]).filter(Boolean);
  const planNames=(r.plan||[]).map(x=>x&&x.name).filter(Boolean);
  const routeNames=[...new Set(visited.length?visited:planNames)].slice(0,6);
  GUIDE=routeNames.length?routeNames.map(n=>[n,'到过']):buildGuide(DEST);
  S.gi=Math.max(0,GUIDE.length-1);

  const planText=(r.plan||[]).map(x=>x&&x.name).filter(Boolean).join('、');
  const src=r.msgs.length?r.msgs:(r.summary?[{role:'narr',text:r.summary}]
    :(planText?[{role:'narr',text:'这趟走过：'+planText+'。'}]:[]));
  S.msgs=src.map((m,i)=>Object.assign({},m,{id:'rp'+i,edit:false,typing:false,fresh:false}));

    if(r.settings.len!=null)$('#len').value=r.settings.len;

  render();drawRoute();scr.scrollTop=0;

    S.msgs=L.msgs;S.plan=L.plan;S.gi=L.gi;S.n=L.n;S.uid=L.uid;S.busy=false;S.photoBusy=false;
    DEST=L.dest;Object.assign(INVITE,L.invite);GUIDE=L.guide;TRIP_ID=L.tripId;CHAR=L.char;USER=L.user;

  }

  // 把用户正在进行的旅行覆盖掉。
  const backToTravel='travel.html?char='+encodeURIComponent(CHAR_ID)+'&name='+encodeURIComponent(CHAR);

  }else if(history.length>1)history.back();
  else location.href=backToTravel;
}
async function loadReplayRecord(tripId){
  const targets=[...new Set([String(tripId||''),REPLAY_JOURNEY_ID].filter(Boolean))];
  const matchRec=target=>REC.find(x=>x&&(String(x.id)===target||String(x.tripId||'')===target||String(x.journeyId||'')===target));
  try{
    if(window.NanoTravelStore&&targets.length){
      await NanoTravelStore.load(true);
      const findTrip=typeof NanoTravelStore.findTrip==='function'?NanoTravelStore.findTrip.bind(NanoTravelStore):null;
      for(const target of targets){
        const hit=findTrip?findTrip(target):null;
        if(hit&&hit.trip)return Object.assign({},hit.trip,{charId:hit.charId||CHAR_ID});
      }
      const mask=readMask();const uid=(mask&&mask.id)||USER_ID;
      const list=NanoTravelStore.listTogether(uid,CHAR_ID)||[];
      for(const target of targets){
        const p=list.find(x=>x&&(String(x.id)===target||String(x.tripId||'')===target||String(x.journeyId||'')===target));
        if(p)return p;
      }
    }
  }catch(e){}
  for(const target of targets){const r=matchRec(target);if(r)return r;}
  if(!targets.length&&REC.length)return REC[REC.length-1];
  // 卡片只带了目的地 / 日期时，按这两个字段兜底找回最近的同一次旅程。
  if(INVITE.dest){
    const r=REC.slice().reverse().find(x=>x&&String(x.dest||x.title||x.place||'')===String(INVITE.dest)&&(!INVITE.date||String(x.date||'')===String(INVITE.date)));
    if(r)return r;
  }
  return null;
}

  const sess={
    version:1,
    charId:CHAR_ID,userId:(readMask().id||USER_ID),chatId:CHAT_ID||CHAR_ID,
    charName:CHAR,userName:USER,dest:DEST,invite:Object.assign({},INVITE),
    tripId:TRIP_ID,msgs:msgs,plan:S.plan,gi:S.gi,n:S.n,uid:S.uid,
    settings:{len:$('#len').value,person:$('#person').value,userMode:$('#umode').value,style:$('#styleTxt').value},
    lastPhoto:lastPhoto?{url:lastPhoto.url,caption:lastPhoto.caption||''}:null,
    savedAt:Date.now()
  };
  // 完整会话写 IndexedDB；localStorage 再存一份（配额不够时自动放弃，不影响 IDB）。
  try{activeDbWritePromise=activeDbSet(ACTIVE_KEY,sess)}catch(e){activeDbWritePromise=null}
  try{localStorage.setItem(ACTIVE_KEY,JSON.stringify(sess))}
  catch(e){
    try{
      const light=Object.assign({},sess,{
        msgs:msgs.map(m=>m&&m.role==='photo'?Object.assign({},m,{url:''}):m),
        lastPhoto:null
      });
      localStorage.setItem(ACTIVE_KEY,JSON.stringify(light));
    }catch(e2){
      // 连去掉图片的轻量存档都塞不进 localStorage 时，至少写一个很小的续玩指针。
      // 真正的聊天记录在 IndexedDB 里，下次点开角色时靠这个指针恢复「一起去」，不会掉回线上。
      try{
        const pointer={
          pointer:true,version:1,
          charId:CHAR_ID,userId:(readMask().id||USER_ID),chatId:CHAT_ID||CHAR_ID,
          charName:CHAR,userName:USER,dest:DEST,invite:Object.assign({},INVITE),
          tripId:TRIP_ID,savedAt:0
        };
        localStorage.setItem(ACTIVE_KEY,JSON.stringify(pointer));
      }catch(e3){}
    }
  }
  // 轻量续玩标记：即使完整会话因为配额/体积写不进去，下次点开角色也能知道这趟还没结束。
  try{
    const mark=JSON.stringify(resumeMark());
    localStorage.setItem(RESUME_MARK_KEY,mark);
    localStorage.setItem('nano_travel_resume_'+(CHAT_ID||CHAR_ID),mark);
  }catch(e){}
  return sess;
}
async function restoreActiveSession(){
  let sess=null;
  try{sess=await activeDbGet(ACTIVE_KEY)}catch(e){sess=null}
  let local=null;
  try{local=JSON.parse(localStorage.getItem(ACTIVE_KEY)||'null')}catch(e){local=null}
  // 两份都有时取更新的那份；IDB 通常带完整图片。
  if(local&&(!sess||Number(local.savedAt||0)>Number(sess.savedAt||0)))sess=local;
  if(!sess||String(sess.charId||'')!==String(CHAR_ID))return false;
  if(sess.savedAt&&Date.now()-Number(sess.savedAt)>7*24*3600*1000)return false;
  DEST=sess.dest||DEST;Object.assign(INVITE,sess.invite||{});GUIDE=buildGuide(DEST);
  if(sess.charName)CHAR=sess.charName;
  if(sess.userName)USER=sess.userName;
  TRIP_ID=sess.tripId||TRIP_ID;
  S.msgs=Array.isArray(sess.msgs)?sess.msgs.slice():[];
  if(!S.msgs.length)return false;
  S.plan=Array.isArray(sess.plan)?sess.plan.slice():[];
  if(!hasProgress())return false;
  S.gi=Math.max(0,Math.min(GUIDE.length-1,Number(sess.gi)||0));
  S.n=Number(sess.n)||0;
  S.uid=Math.max(Number(sess.uid)||0,...S.msgs.map(m=>Number(m&&m.id)||0));
  S.exiting=false;S.busy=false;S.photoBusy=false;
  $('#send').disabled=false;
  $('#tTitle').textContent=CHAR;
  if(sess.settings){
    if(sess.settings.len!=null)$('#len').value=sess.settings.len;
    if(sess.settings.person)$('#person').value=sess.settings.person;
    if(sess.settings.userMode)$('#umode').value=sess.settings.userMode;
    if(sess.settings.style!=null)$('#styleTxt').value=sess.settings.style;
  }
  ACTIVE_LAST_PHOTO=sess.lastPhoto||null;
  if(ACTIVE_LAST_PHOTO){
    const last=[...S.msgs].reverse().find(m=>m.role==='photo');
    if(last){last.url=ACTIVE_LAST_PHOTO.url;last.caption=ACTIVE_LAST_PHOTO.caption||last.caption;last.loading=false;last.fail=false;}
  }
  render();drawRoute();setSub();fp();drawPlan();syncBtn();down();
  return true;
}
function localSummary(){
  const visited=S.plan.filter(p=>p.done).map(p=>p.name);
  const lastChar=[...S.msgs].reverse().find(m=>m.role==='char'&&(m.text||m.translation));
  const lastUser=[...S.msgs].reverse().find(m=>m.role==='user'&&m.text);
  let s='和'+CHAR+'一起去了'+DEST+'。';
  if(visited.length)s+='走过'+visited.join('、')+'。';
  if(lastUser)s+='你说“'+String(lastUser.text).slice(0,42)+'”。';
  if(lastChar)s+=' '+CHAR+'说：“'+String(lastChar.translation||lastChar.text).replace(/\s+/g,' ').slice(0,60)+'”。';
  return s.slice(0,400);
}
async function summarizeTrip(hist){
  const lines=(hist||[]).filter(x=>x&&x.role!=='sys'&&(x.text||x.role==='photo')).map(x=>{
    if(x.role==='photo')return '（拍立得）'+(x.caption||'');
    const raw=String(x.text||'').replace(/\s+/g,' ');
    const tr=x.translation?('（中文：'+String(x.translation).replace(/\s+/g,' ')+'）'):'';
    if(x.role==='narr')return '（旁白）'+raw;
    return (x.role==='user'?USER:CHAR)+'：'+raw+tr;
  }).join('\n').slice(-9000);
  const visited=S.plan.filter(p=>p.done).map(p=>p.name);
  const sys='请把这次旅行总结成一段记忆，供角色以后回忆。必须包含：去过的地点、吃过的东西、关键互动与情绪、'+CHAR+'与'+USER+'的关系变化。'
    +'语气像角色自己的回忆，不要分点，不要提 AI 或提示词，不要编造没有发生的事。大约 250-450 字，只输出总结正文。';
  const usr='这次旅行的目的地：'+DEST+'；日期：'+(INVITE.date||'')+'；同行：'+CHAR+' 和 '+USER+'；已到过：'+(visited.join('、')||'未记录')
    +'；行程：'+JSON.stringify(S.plan)+'\n对话与场景：\n'+lines;
  const txt=await TravelAPI.callChat({messages:[{role:'system',content:sys},{role:'user',content:usr}],temperature:0.75,maxTokens:1000});
  return String(txt||'').trim();
}
async function generateTripCardMeta(brief,visited){
  try{
    const sys='你是角色「'+CHAR+'」。你和「'+USER+'」刚刚结束一趟真实的旅行。请为这次旅行生成一张可以放进「旅途」App 的旅程卡片。'
      +'必须严格保持人设，严禁 OOC、霸总腔、油腻情话；不要编造没有发生的事。'
      +'只输出合法 JSON，不要解释。格式：{"title":"一句话标题，不超过18字","thought":"你作为角色写下的旅程心得，80-160字，第一人称","caption":"拍立得的一句话说明，不超过24字"}';
    const usr='目的地：'+DEST+'；天数：'+(INVITE.days||'1')+'；到过：'+(visited.join('、')||'未记录')
      +'；同行：'+CHAR+' 和 '+USER+'。\n旅程总结：\n'+String(brief||'').slice(0,1800)
      +'\n\n请生成这张旅程卡片。';
    const j=await TravelAPI.callJson({messages:[{role:'system',content:sys},{role:'user',content:usr}],temperature:0.8,maxTokens:800});
    return j&&typeof j==='object'?j:null;
  }catch(e){return null}
}
async function travelExit(i){
  i=i||{};
  const final=i.final!==false;
  // 回到线上时自动总结这一趟，不再依赖用户手动勾选；手动勾选只影响「直接退出」时是否也总结。
  const summarize=!!(i.summarize || final);
  const hasContent=S.msgs.some(m=>m.role!=='sys')||S.plan.length>0;
  const hist=(i.history&&i.history.length)?i.history:S.msgs.map(x=>({role:x.role,text:x.text||'',translation:x.translation||'',caption:x.caption||'',url:x.url||'',choices:x.choices||[]}));
  let brief='';
  if(summarize && hasContent){
    try{brief=await summarizeTrip(hist)}catch(e){brief=''}
  }
  if(!brief)brief=localSummary();
  const visited=[...new Set(S.plan.filter(p=>p.done).map(p=>p.name))];
  if(!visited.length&&GUIDE[S.gi])visited.push(GUIDE[S.gi][0]);
  const lastPhotoMsg=[...S.msgs].reverse().find(m=>m.role==='photo'&&m.url);
  const lastPhoto=lastPhotoMsg?{url:lastPhotoMsg.url,caption:lastPhotoMsg.caption||''}:ACTIVE_LAST_PHOTO;
  const mask=readMask();
  const uid=USER_ID||mask.id||'default';
  const dm=String(INVITE.date||'').match(/\d{4}[-/]\d{1,2}[-/]\d{1,2}/);
  const date=dm?dm[0].replace(/\//g,'-'):new Date().toISOString().slice(0,10);
  // 结束这趟旅程时，用 API 把总结加工成一张真正的旅程卡片
  let cardMeta=null;
  if(final&&hasContent){
    try{cardMeta=await generateTripCardMeta(brief,visited)}catch(e){cardMeta=null}
  }
  const cardTitle=String((cardMeta&&cardMeta.title)||('我们 · '+DEST)).trim();
  const cardThought=String((cardMeta&&cardMeta.thought)||brief||'').trim();
  const cardCaption=String((cardMeta&&cardMeta.caption)||(lastPhoto&&lastPhoto.caption)||'').trim();

  // 完整回顾：保留这次旅行的叙事流程（限制长度，避免撑爆本地存储）
  const journey=(hist||[]).filter(x=>x&&x.role!=='sys').slice(-200).map(x=>{
    // 照片保留完整 dataURL，写进旅途（IndexedDB），不再按大小丢弃。
    return {
      role:x.role,text:String(x.text||'').slice(0,2000),
      translation:String(x.translation||'').slice(0,2000),
      caption:String(x.caption||'').slice(0,300),url:String(x.url||'')
    };
  });
  // 每一步单独兜底，避免某一步失败导致卡片和旅途记录都写不进去。
  // 只有「回到线上」才算结束旅行、写旅途卡片/系统提示；
  // 「直接退出」即使勾选了总结，也只写记忆，保留继续旅行的存档。
  const shouldSync=!!(hasContent&&final);
  // 卡片和本地回顾都用这个 id 回查，必须和真正写进旅途的记录保持一致。
  let savedTripId=TRIP_ID;
  try{ if(window.NanoTravelStore&&hasContent) await NanoTravelStore.load(true); }catch(e){}
  if(summarize&&hasContent){
    try{
      let emb=null;
      try{emb=await TravelAPI.embed(brief)}catch(e){}
      let already=false;
      try{
        const old=await NanoTravelStore.readTravelMemories(CHAR_ID);
        already=(old||[]).some(m=>m&&m.travelMeta&&String(m.travelMeta.tripId||'')===String(TRIP_ID));
      }catch(e){}
      if(!already){
        await NanoTravelStore.addTravelMemory({
          charId:CHAR_ID,userId:uid,summary:brief,embedding:emb,charName:CHAR,tripId:TRIP_ID,
          date,places:visited,meta:{dest:DEST,days:INVITE.days||'1',note:INVITE.note||'',source:'travel-chat'}
        });
      }
    }catch(e){try{console.warn('[travel] 记忆写入失败',e)}catch(e2){}}
  }
  if(shouldSync){
    try{
      const ticketNo='TRV-'+String(TRIP_ID).replace(/[^a-z0-9]/gi,'').slice(-8).toUpperCase();
      const patch={
        tripId:TRIP_ID,journeyId:TRIP_ID,place:DEST,date,cost:null,legs:[],noteMe:'',noteChar:cardThought,summary:brief||cardThought,
        polaroid:lastPhoto?lastPhoto.url:'',caption:cardCaption,
        shared:false,source:'travel-chat',places:visited,days:INVITE.days||'1',ticketNo:ticketNo,
        charId:CHAR_ID,userId:uid,title:cardTitle,thought:cardThought,journey:journey,
        plan:S.plan||[],settings:{person:$('#person').value,userMode:$('#umode').value,style:$('#styleTxt').value},
        userName:USER,charName:CHAR
      };
      let saved=null;
      try{
        const existed=(NanoTravelStore.listTogether(uid,CHAR_ID)||[]).find(p=>p&&(String(p.tripId||'')===String(TRIP_ID)||String(p.journeyId||'')===String(TRIP_ID)||String(p.id)===String(TRIP_ID)));
        if(existed) saved=await NanoTravelStore.updateTrip(existed.id,Object.assign({},patch,{id:existed.id}));
        else saved=await NanoTravelStore.addTogether(uid,CHAR_ID,patch);
      }catch(e){try{console.warn('[travel] 旅途记录写入失败',e)}catch(e2){}}
      const tid=(saved&&saved.id)||TRIP_ID;
      savedTripId=tid;
      const card={
        cardType:'travelReport',travelKind:'together',direction:'char',
        tripId:tid,title:cardTitle,place:DEST,date,days:INVITE.days||'1',
        ticketNo:ticketNo,thought:cardThought,img:lastPhoto?lastPhoto.url:'',
        caption:cardCaption,fromName:CHAR,userName:USER,
        places:visited,createdAt:Date.now(),journeyId:TRIP_ID
      };
      try{
        const chatKey=CHAT_ID||CHAR_ID;
        const msgs=await NanoTravelStore.readChatMessages(chatKey);
        const old=(msgs||[]).find(m=>m&&m.cardData&&m.cardData.cardType==='travelReport'&&String(m.cardData.journeyId||m.cardData.tripId||'')===String(TRIP_ID));
        if(old) await NanoTravelStore.updateChatCard(chatKey,old.id,card);
        else{
          // 先说一句为什么发这张卡，再发卡片；不能只丢一张行程卡过来。
          const lead=String(cardCaption||'').trim()||('刚从'+DEST+'回来，这趟整理好了，给你看看。');
          const leadMsg=NanoTravelStore.baseMessage({type:'left',text:lead.slice(0,120),isCard:false,cardData:{}});
          await NanoTravelStore.appendChatMessage(chatKey,leadMsg);
          const msg=NanoTravelStore.baseMessage({type:'left',cardData:card,text:''});
          await NanoTravelStore.appendChatMessage(chatKey,msg);
        }
      }catch(e){try{console.warn('[travel] 旅程卡片写入失败',e)}catch(e2){}}
      try{await NanoTravelStore.appendSystemNotice(CHAT_ID||CHAR_ID,'已结束「'+DEST+'」出行');}catch(e){}
    }catch(e){try{console.warn('[travel] 旅程同步失败',e)}catch(e2){}}
  }
  try{
    if(shouldSync){
      // REC 只是本地行程列表，localStorage 放不下大图；完整旅程已写进旅途（IDB）。
      const recMsgs=journey.map(x=>x&&x.url&&x.url.length>180000?Object.assign({},x,{url:''}):x);
      // id / tripId 必须和卡片、旅途记录对得上，否则点回顾卡片时回查不到这段旅程。
      REC.push({
        id:String(savedTripId),tripId:String(TRIP_ID),charId:CHAR_ID,charName:CHAR,
        title:DEST,dest:DEST,date,summary:brief,stops:visited,msgs:recMsgs,
        plan:S.plan||[],settings:{person:$('#person').value,userMode:$('#umode').value,style:$('#styleTxt').value}
      });
      REC=REC.slice(-40);saveRec();
    }
  }catch(e){}
  return brief;
}
async function exit(mode){
  if(S.exiting)return;
  S.exiting=true;
  const final=mode==='online';
  if(!final){
    // 直接退出一定要留下续玩存档，哪怕这趟旅行还没有用户消息；
    // 否则下次点开角色会掉回线上聊天。
    saveActiveSession();
    // 等 IndexedDB 真正落盘再离开，避免下次续玩时读不到存档。
    try{ if(activeDbWritePromise) await activeDbWritePromise; }catch(e){}
  }
  closeAll();
  toast(final?'正在整理这次旅行…':'正在保存行程…');
  try{
    await window.TravelAPI.onExit({
      mode,final,summarize:final ? true : $('#sum').checked,
      history:S.msgs.map(x=>({role:x.role,text:x.text||'',translation:x.translation||'',caption:x.caption||'',url:x.url||'',choices:(x.choices||[]).map(c=>({type:c.type,name:c.name,desc:c.desc,s:c.s}))})),
      plan:S.plan,records:recSum()
    });
  }catch(e){}
  if(window.parent&&window.parent!==window){
    try{
      if(final){
        clearTravelResume();
        try{localStorage.setItem('nano_chat_mode_'+(CHAT_ID||CHAR_ID),'online')}catch(e){}
        window.parent.postMessage({type:'openChat',chatId:CHAT_ID||CHAR_ID,chatName:CHAR,name:CHAR,reload:true},'*');
      }else{
        window.parent.postMessage({
          type:'nanoTravelExitToChat',
          chatId:CHAT_ID||CHAR_ID,charId:CHAR_ID,charName:CHAR,userId:(readMask().id||USER_ID),
          dest:DEST,tripId:TRIP_ID,invite:Object.assign({},INVITE)
        },'*');
      }
    }catch(e){}
    return;
  }
  if(final){
    clearTravelResume();
    location.href='chat_inner.html?chat='+encodeURIComponent(CHAT_ID||CHAR_ID)+'&name='+encodeURIComponent(CHAR);
  }else{
    location.href='chat.html';
  }
}
$('#online').onclick=()=>exit('online');$('#leave').onclick=()=>exit('leave');
$('#again').onclick=()=>{$('#cover').classList.remove('on');fresh()};

window.addEventListener('message', function(e){
  var d=e&&e.data;
  if(!d)return;
  if(d.type==='nanoOverlayClosed'&&!REPLAY_MODE){
    try{saveActiveSession()}catch(err){}
  }
});
window.addEventListener('pagehide', function(){
  if(S.exiting||!hasProgress())return;
  try{saveActiveSession()}catch(e){}
});
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState==='hidden'&&!S.exiting&&hasProgress()){
    try{saveActiveSession()}catch(e){}
  }
});

(async function initPage(){
  let restored=false;
  try{
    const rec=await readCharRecord(CHAR_ID);
    CHAR_RECORD=rec||null;
    if(rec&&rec.name)CHAR=rec.name;
    const mask=await loadMaskInfo(true);USER=mask.name||'你';
    await loadRecords();
    if(REPLAY_Q){
      const rr=await loadReplayRecord(REPLAY_TRIP_ID);
      if(rr){ enterReplay(rr,{fromLive:false}); syncBtn(); return; }
      if(REPLAY_FALLBACK.thought){
        enterReplay({
          dest:INVITE.dest||REPLAY_FALLBACK.title||'旅途回顾',title:REPLAY_FALLBACK.title,
          date:INVITE.date,summary:REPLAY_FALLBACK.thought,msgs:[]
        },{fromLive:false});
        syncBtn(); return;
      }
      toast('没有找到这段旅程');
      if(window.parent&&window.parent!==window){
        setTimeout(()=>{try{window.parent.postMessage({type:'closeFullscreen'},'*')}catch(e){}},900);
      }else{
        setTimeout(()=>{location.href='travel.html?char='+encodeURIComponent(CHAR_ID)+'&name='+encodeURIComponent(CHAR)},900);
      }
      return;
    }
    if(RESUME){
      restored=await restoreActiveSession();
      // IndexedDB 刚打开/上一页刚写入时偶尔会比新页面慢一拍，多给几次机会，
      // 避免把「还在落盘」的存档误判成没有存档而掉回线上。
      for(let attempt=0;attempt<3&&!restored;attempt++){
        await new Promise(r=>setTimeout(r,180*(attempt+1)));
        restored=await restoreActiveSession();
      }
      // 存档确实过期/损坏时才清掉，避免下次还试图恢复却总是掉回线上。
      if(!restored){ clearTravelResume(); }
    }
  }catch(e){}
  if(!restored)fresh();
  syncBtn();
})();
