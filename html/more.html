<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="../js/nano-runtime.js?v=20261023a"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>更多</title>
    <link rel="stylesheet" href="../css/more.css">
    <script src="../js/appearance.js"></script>
</head>
<body class="nano-more">

<!-- ===== 顶栏 ===== -->
<div class="top-bar">
    <span class="top-bar-title">More</span>
</div>

<div class="container" id="mainContainer">
    <!-- 名片栏 -->
    <div class="profile-card" id="profileCard">
        <div class="profile-avatar" id="profileAvatar">
            <img id="avatarImage" src="" alt="头像" style="display:none;width:100%;height:100%;object-fit:cover;">
            <svg id="avatarSvg" viewBox="0 0 24 24" fill="#8E8E93"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </div>
        <div class="profile-info" id="profileInfo">
            <div class="profile-name" id="profileName">我</div>
            <div class="profile-desc">Apple账户、iCloud+等</div>
        </div>
        <svg class="chevron-right" viewBox="0 0 8 14"><path d="M1 1l6 6-6 6" stroke="#C7C7CC" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

    <!-- 列表 -->
    <div class="list-group">
        <div class="list-item" data-page="wallet">
            <div class="item-icon icon-wallet">
                <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5" fill="#fff"/><rect x="3" y="8.5" width="18" height="2" fill="#34C759"/><rect x="6" y="13" width="5" height="2" rx="1" fill="#34C759"/></svg>
            </div>
            <span class="item-title">钱包</span>
            <svg class="chevron-right" viewBox="0 0 8 14"><path d="M1 1l6 6-6 6" stroke="#C7C7CC" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="list-item" data-page="favorite">
            <div class="item-icon icon-fav">
                <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
            </div>
            <span class="item-title">收藏</span>
            <svg class="chevron-right" viewBox="0 0 8 14"><path d="M1 1l6 6-6 6" stroke="#C7C7CC" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
    </div>

    <div class="list-group">
        <div class="list-item" data-page="emoji">
            <div class="item-icon icon-emoji">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm3.5 8c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5-1.5-.67-1.5-1.5.67-1.5 1.5-1.5zm-7 0c.83 0 1.5.67 1.5 1.5S9.33 13 8.5 13 7 12.33 7 11.5 7.67 10 8.5 10zm3.5 8c-2.33 0-4.31-1.46-5.11-3.5h10.22c-.8 2.04-2.78 3.5-5.11 3.5z"/></svg>
            </div>
            <span class="item-title">表情包</span>
            <svg class="chevron-right" viewBox="0 0 8 14"><path d="M1 1l6 6-6 6" stroke="#C7C7CC" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="list-item" data-page="worldbook">
            <div class="item-icon icon-world">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
            </div>
            <span class="item-title">世界书</span>
            <svg class="chevron-right" viewBox="0 0 8 14"><path d="M1 1l6 6-6 6" stroke="#C7C7CC" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
    </div>

    <div class="list-group">
        <div class="list-item" data-page="beautify">
            <div class="item-icon icon-beautify">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
            </div>
            <span class="item-title">美化</span>
            <svg class="chevron-right" viewBox="0 0 8 14"><path d="M1 1l6 6-6 6" stroke="#C7C7CC" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="list-item" data-page="storage">
            <div class="item-icon icon-storage">
                <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4V6zm0 5h16v2H4v-2zm0 5h10v2H4v-2z"/></svg>
            </div>
            <span class="item-title">存储</span>
            <svg class="chevron-right" viewBox="0 0 8 14"><path d="M1 1l6 6-6 6" stroke="#C7C7CC" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="list-item" data-page="backup">
            <div class="item-icon icon-data">
                <svg viewBox="0 0 24 24"><path d="M4 6c0 1.1 4 2 8 2s8-.9 8-2M4 12c0 1.1 4 2 8 2s8-.9 8-2M4 18c0 1.1 4 2 8 2s8-.9 8-2M4 6v12c0 1.1 4 2 8 2s8-.9 8-2V6"/></svg>
            </div>
            <span class="item-title">备份</span>
            <svg class="chevron-right" viewBox="0 0 8 14"><path d="M1 1l6 6-6 6" stroke="#C7C7CC" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
    </div>

    <!-- 其他：保活 / 通知 -->
    <div class="list-group">
        <div class="list-item" data-page="other">
            <div class="item-icon icon-other">
                <svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8.94 3a8.99 8.99 0 0 0-.7-2.4l1.7-1.34-2-3.46-2.06.83a9 9 0 0 0-2.08-1.2L15.5 1.5h-4l-.3 1.93a9 9 0 0 0-2.08 1.2l-2.06-.83-2 3.46 1.7 1.34a9 9 0 0 0-.7 2.4L4 12l.06 1a9 9 0 0 0 .7 2.4l-1.7 1.34 2 3.46 2.06-.83a9 9 0 0 0 2.08 1.2l.3 1.93h4l.3-1.93a9 9 0 0 0 2.08-1.2l2.06.83 2-3.46-1.7-1.34c.3-.77.53-1.58.7-2.4L20 12l-.06-1z" transform="scale(0.92) translate(1,1)"/></svg>
            </div>
            <span class="item-title">其他</span>
            <svg class="chevron-right" viewBox="0 0 8 14"><path d="M1 1l6 6-6 6" stroke="#C7C7CC" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
    </div>
</div>

<!-- ===== 修改名字弹窗 ===== -->
<div class="modal-overlay" id="nameModal">
    <div class="modal-box" style="width:300px;">
        <div class="modal-title">修改名字</div>
        <div class="modal-message" style="padding-bottom:12px;">
            <input type="text" id="nameInput" placeholder="输入新名字..." style="width:100%;padding:10px 14px;border-radius:8px;border:0.5px solid #C6C6C8;font-size:15px;outline:none;background:#fff;margin-top:4px;">
        </div>
        <div class="modal-actions" style="display:flex;border-top:0.5px solid rgba(60,60,67,0.24);">
            <button class="modal-action-btn cancel" id="nameCancel" data-close style="flex:1;padding:12px 0;font-size:17px;color:#007AFF;background:none;border:none;border-right:0.5px solid rgba(60,60,67,0.24);cursor:pointer;font-weight:400;">取消</button>
            <button class="modal-action-btn confirm" id="nameConfirm" style="flex:1;padding:12px 0;font-size:17px;color:#007AFF;background:none;border:none;cursor:pointer;font-weight:600;">确定</button>
        </div>
    </div>
</div>

<!-- ===== 更换头像弹窗 ===== -->
<div class="modal-overlay" id="avatarModal">
    <div class="modal-box avatar-modal-box">
        <div class="avatar-modal-header">
            <div class="avatar-modal-title">更换头像</div>
            <div class="avatar-modal-subtitle">选取照片或输入URL更换头像</div>
        </div>

        <div class="avatar-inset-card">
            <!-- 相册 -->
            <div class="avatar-form-row">
                <div class="avatar-row-label">相册</div>
                <div class="avatar-row-content">
                    <label class="avatar-action-link" style="cursor:pointer;">
                        选择照片...
                        <input type="file" id="avatarFileInput" accept="image/*" style="display:none;">
                    </label>
                    <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28' viewBox='0 0 28 28'><rect width='28' height='28' rx='6' fill='%23E5E5EA' /><circle cx='14' cy='11' r='5' fill='%238E8E93' /><path d='M6 24c0-4.4 3.6-8 8-8s8 3.6 8 8' fill='%238E8E93' /></svg>" class="avatar-thumb" id="thumbPreview" alt="预览">
                </div>
            </div>
            <!-- URL -->
            <div class="avatar-form-row">
                <div class="avatar-row-label">URL</div>
                <div class="avatar-row-content">
                    <input type="text" class="avatar-url-input" id="avatarUrlInput" placeholder="输入图片链接...">
                </div>
            </div>
            <!-- 还原 -->
            <div class="avatar-form-row">
                <div class="avatar-row-label">还原</div>
                <div class="avatar-row-content">
                    <button class="avatar-reset-btn" id="avatarResetBtn" title="恢复默认头像">
                        <svg viewBox="0 0 24 24">
                            <polyline points="1 4 1 10 7 10"/>
                            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <div class="avatar-modal-footer">
            <button class="avatar-footer-btn cancel" id="avatarCancel" data-close>取消</button>
            <button class="avatar-footer-btn confirm" id="avatarSave">保存</button>
        </div>
    </div>
</div>

    <script src="../js/more.js?v=20261008a"></script>
<script src="../js/api-float.js"></script>
<script src="../js/nano-own-back.js"></script>
<script src="../swipe-back.js"></script>
</body>
</html>
