<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<script src="../js/nano-runtime.js?v=20261026d"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>后台日志</title>
<link rel="icon" href="../icons/icon-192.png">
<script>window.__NANO_FONT_ONLY = true;</script>
<script src="../js/appearance.js?v=20261026d"></script>
<script src="../js/nano-idb.js"></script>
<link rel="stylesheet" href="../css/settings.css?v=20261023a">
</head>
<body data-page="logs">
<div class="app">
  <header class="nav">
    <a class="back" href="settings.html" aria-label="返回">
      <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <h1>后台日志</h1>
    <button class="nav-refresh" type="button" aria-label="刷新" onclick="location.reload()">
      <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.34 5.66"/><polyline points="20 4 20 11 13 11"/></svg>
    </button>
  </header>

  <main class="scroll">
    <div class="log-toolbar">
      <input class="log-search" id="logSearch" type="search" placeholder="搜索 URL / 错误 / 页面…" autocomplete="off">
      <select class="log-select" id="logApp" aria-label="按 App 筛选">
        <option value="all">全部 App</option>
      </select>
      <select class="log-select" id="logRange" aria-label="显示条数">
        <option value="30">显示 30 条</option>
        <option value="50">显示 50 条</option>
        <option value="100">显示 100 条</option>
        <option value="300">全部 300 条</option>
      </select>
    </div>

    <div class="log-chips" id="logChips">
      <button class="log-chip active" type="button" data-filter="all">全部</button>
      <button class="log-chip" type="button" data-filter="error">只看错误</button>
      <button class="log-chip" type="button" data-filter="chat">聊天 API</button>
      <button class="log-chip" type="button" data-filter="memory">记忆</button>
      <button class="log-chip" type="button" data-filter="push">推送</button>
      <button class="log-chip" type="button" data-filter="mcp">MCP</button>
      <button class="log-chip" type="button" data-filter="market">集市</button>
      <button class="log-chip" type="button" data-filter="link">链接</button>
    </div>

    <div class="log-summary" id="logSummary">正在读取日志…</div>
    <section class="list log-list" id="logList"></section>
    <div class="log-empty" id="logEmpty" style="display:none;">还没有日志。发生 API 请求或错误后，这里会自动出现记录。</div>

    <div class="log-actions">
      <button class="log-btn" type="button" id="logExport">导出 JSON</button>
      <button class="log-btn danger" type="button" id="logClear">清空日志</button>
    </div>
    <p class="hint">只记录 API 请求的地址、状态码、耗时和错误摘要；不会记录聊天正文、API Key 或 Authorization。</p>
  </main>
</div>
<div class="toast" id="toast"></div>
<script src="../js/api-logs.js?v=20261023b"></script>
<script src="../js/settings-logs.js?v=20261023b"></script>
</body>
</html>
