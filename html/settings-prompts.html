<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<script src="../js/nano-runtime.js?v=20261028e"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>提示词</title>
<link rel="icon" href="../icons/icon-192.png">
<script>window.__NANO_FONT_ONLY = true;</script>
<script src="../js/appearance.js?v=20261026d"></script>
<script src="../js/nano-idb.js"></script>
<link rel="stylesheet" href="../css/settings.css?v=20261029e">
<link rel="stylesheet" href="../css/account.css?v=20261025a">
</head>
<body data-page="prompts">
<div class="app">
  <header class="nav">
    <a class="back" href="settings.html" aria-label="返回">
      <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <h1>提示词</h1>
    <button class="nav-refresh" type="button" aria-label="刷新" onclick="location.reload()">
      <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.34 5.66"/><polyline points="20 4 20 11 13 11"/></svg>
    </button>
  </header>

  <main class="scroll">
    <div id="promptSections"></div>
    <p class="hint">每条提示词都有自己的开关：开启＝读取，关闭＝不读取。内置与你添加的提示词可同时开启多条，按顺序一起生效。下面展开的「实际注入」就是运行时真正追加到该 App 系统提示词末尾的内容（已包含全局、社交通用、表达红线），不是示例文案；但不含各 App 自己写死的核心指令，也不含角色人设、世界书、记忆等动态内容——这些始终会另行注入。内置提示词可查看，不可删除。</p>
  </main>
</div>

<div class="modal" id="promptModal">
  <div class="sheet">
    <div class="sheet-head">
      <div class="sheet-title" id="promptSheetTitle">提示词</div>
      <button class="sheet-close" id="promptSheetClose" aria-label="关闭">×</button>
    </div>
    <div class="sheet-body" id="promptSheetBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="promptIconFile" accept=".svg,image/svg+xml" class="hidden">

<script src="../js/nano-prompts.js?v=20261029e"></script>
<script src="../js/settings.js?v=20261029h"></script>
<script src="../js/prompts-setting.js?v=20261029h"></script>
<script src="../js/account.js?v=20261026f"></script>
</body>
</html>
