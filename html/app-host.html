<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="../js/nano-runtime.js?v=20261023a"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>应用</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#f2f2f7;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif}
  html,body{position:fixed;top:0;left:0}
  #appFrame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
  #hostMsg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#8e8e93;background:#f2f2f7;z-index:2;text-align:center;padding:24px}
  #hostMsg svg{width:34px;height:34px;color:#c4c9d4}
  #hostMsg .t{font-size:14px;font-weight:600;color:#4d525e}
  #hostMsg .d{font-size:12.5px;line-height:1.6;max-width:260px}
</style>
</head>
<body>
<iframe id="appFrame" allow="clipboard-write; clipboard-read; microphone; camera; fullscreen; autoplay; encrypted-media"></iframe>
<div id="hostMsg">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 8v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8"></path>
    <rect x="2" y="4" width="20" height="4" rx="1"></rect>
  </svg>
  <div class="t">正在打开应用…</div>
  <div class="d" id="hostMsgText">请稍候</div>
</div>
<script src="../js/nano-gallery.js?v=20261023d"></script>
<script src="../js/nano-files.js?v=20261023d"></script>
<script src="../js/nano-tts.js?v=20261023d"></script>
<script src="../js/app-host.js?v=20261023d"></script>
</body>
</html>
