<!DOCTYPE html>
<html lang="zh">
<head>
<script src="../js/nano-runtime.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="icon" href="../icons/icon-192.png">
    <title>纳米 · 聊天</title>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="../css/chat.css?v=20261018q">
<link rel="stylesheet" href="../css/chat-nano.css?v=20261019a">
<script src="../js/appearance.js?v=20261010a"></script>
    <script src="../js/nano-badge.js"></script>
<script src="../js/group-store.js"></script>
<script src="../js/nano-notify.js?v=20261018b"></script>
</head>
<body class="nano-chat">
<div class="app-container">
    <div class="app-content">

        <!-- 页面顶栏：返回 / 标题 / 加好友 / 建群（位于灵动岛下方） -->
        <div class="page-topbar">
            <button class="page-topbar-btn" id="nanoChatBack" type="button" aria-label="返回"><i class="fas fa-chevron-left"></i></button>
            <div class="nano-chat-title">聊天</div>
            <div class="nano-top-actions">
                <button class="page-topbar-btn" id="maskPageBtn" type="button" aria-label="人设" style="display:none;"><i class="fas fa-bars"></i></button>
                <button class="page-topbar-btn" id="characterPageBtn" type="button" aria-label="加好友"><i class="fas fa-user-plus"></i></button>
                <button class="page-topbar-btn" id="nanoGroupBtn" type="button" aria-label="建群"><i class="fas fa-users"></i></button>
            </div>
        </div>

        <!-- Nano 品牌 -->
        <div class="nano-brand">Nano</div>

        <!-- 状态栏 -->
        <div class="user-status-wrapper">
            <div class="user-status-bar" id="userStatusBar">
                <div class="left">
                    <div class="user-avatar" id="userAvatar">
                        <span id="userAvatarPlaceholder">?</span>
                        <img id="userAvatarImage" style="display:none;" alt="头像">
                    </div>
                    <span class="user-name" id="userNameDisplay">
                        <span class="placeholder">选择人设</span>
                    </span>
                </div>
                <div class="right">
                    <span class="char-count" id="charCountDisplay">0</span>
                    <span class="arrow" id="arrowIcon">⌵</span>
                </div>
            </div>
            <div class="user-dropdown" id="userDropdown"></div>
        </div>

        <!-- 头像行 -->
        <div class="avatar-row" id="avatarRow">
            <div class="avatar-item" data-index="0"></div>
            <div class="avatar-item" data-index="1"></div>
            <div class="avatar-item" data-index="2"></div>
            <div class="avatar-item" data-index="3"></div>
            <div class="avatar-item avatar-add" id="avatarAddBtn"><i class="fas fa-plus"></i></div>
        </div>

        <!-- 搜索框 -->
        <div class="search-wrap">
            <div class="search-box">
                <i class="fas fa-search" id="searchIcon"></i>
                <input type="text" placeholder="搜索联系人、群聊" id="searchInput" autocomplete="off">
                <span class="search-clear hidden" id="searchClear"><i class="fas fa-times-circle"></i></span>
            </div>
        </div>

        <!-- Tab 切换 -->
        <div class="tabs-switch">
            <div class="tab-group">
                <button class="tab-btn active" id="tabFriends">好友</button>
                <button class="tab-btn" id="tabGroups">群聊</button>
            </div>
        </div>

        <!-- 聊天列表 -->
        <div class="chat-list" id="chatList">
            <div class="no-result" id="noResult">未找到相关联系人</div>
        </div>

    </div>
</div>

<!-- 通讯录 -->
<div class="nano-subpage" id="nanoPageContacts">
    <div class="nano-sub-top">
        <button class="page-topbar-btn" data-nano-back type="button" aria-label="返回"><i class="fas fa-chevron-left"></i></button>
        <div class="nano-chat-title">通讯录</div>
        <span class="nano-top-spacer"></span>
    </div>
    <div class="nano-contact-list" id="nanoContactsList"></div>
</div>

<!-- 我的 -->
<div class="nano-subpage" id="nanoPageProfile">
    <div class="nano-sub-top">
        <button class="page-topbar-btn" data-nano-back type="button" aria-label="返回"><i class="fas fa-chevron-left"></i></button>
        <div class="nano-chat-title">我的</div>
        <span class="nano-top-spacer"></span>
    </div>
    <div class="nano-profile-card">
        <div class="nano-profile-avatar" id="nanoProfileAvatar"></div>
        <div class="nano-profile-name" id="nanoProfileName">我</div>
        <div class="nano-profile-sub" id="nanoProfileSub">当前面具</div>
    </div>
    <div class="nano-func-list">
        <button class="nano-func-card" data-open="wallet.html" data-title="钱包">
            <span class="nano-func-ic">¥</span>
            <span class="nano-func-text"><b>钱包</b><i>余额、账单与支付</i></span>
            <span class="nano-func-arrow">›</span>
        </button>
        <button class="nano-func-card" data-open="favorite.html" data-title="收藏">
            <span class="nano-func-ic">★</span>
            <span class="nano-func-text"><b>收藏</b><i>收藏的消息与内容</i></span>
            <span class="nano-func-arrow">›</span>
        </button>
        <button class="nano-func-card" data-open="emoji.html" data-title="表情包">
            <span class="nano-func-ic">☺</span>
            <span class="nano-func-text"><b>表情包</b><i>管理常用表情</i></span>
            <span class="nano-func-arrow">›</span>
        </button>
        <button class="nano-func-card" data-open="mask.html" data-title="面具">
            <span class="nano-func-ic">◐</span>
            <span class="nano-func-text"><b>面具</b><i>切换与管理人物设</i></span>
            <span class="nano-func-arrow">›</span>
        </button>
    </div>
</div>

<!-- 底部 Dock -->
<nav class="nano-dock" id="nanoDock" aria-label="聊天导航">
    <button class="nano-dock-btn active" data-tab="chat" aria-label="聊天">
        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12zM7 9h2v2H7zm4 0h2v2h-2zm4 0h2v2h-2z"/></svg>
    </button>
    <button class="nano-dock-btn" data-tab="contacts" aria-label="通讯录">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
    </button>
    <button class="nano-dock-btn" data-tab="moments" aria-label="朋友圈">
        <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
    </button>
    <button class="nano-dock-btn" data-tab="profile" aria-label="我的">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    </button>
</nav>

<!-- 群聊创建弹窗 -->
<div class="group-modal" id="groupModal">
    <div class="group-modal-card">
        <h4>创建群聊</h4>
        <div class="sub-title" id="groupSubTitle">设置群信息并添加成员</div>
        <div class="group-avatar-picker">
            <div class="g-avatar" id="groupAvatarPicker">
                <span id="groupAvatarPlaceholder">+</span>
                <img id="groupAvatarPreview" style="display:none;" alt="群头像">
            </div>
        </div>
        <div class="group-form-group">
            <label>群名称</label>
            <input type="text" id="groupNameInput" placeholder="输入群名称">
        </div>
        <div class="group-add-member-row">
            <select id="groupMemberSelect"><option value="">选择要添加的成员...</option></select>
            <button class="btn-add-member" id="groupAddMemberBtn">添加</button>
        </div>
        <div class="group-member-list" id="groupMemberList"></div>
        <div class="group-modal-actions">
            <button class="btn-cancel" id="groupCancel" data-close>取消</button>
            <button class="btn-add" id="groupConfirm">创建</button>
        </div>
    </div>
</div>

<!-- 头像弹窗 -->
<div class="ios-modal" id="avatarModal">
    <div class="ios-modal-card">
        <h4>更换头像</h4>
        <div class="ios-modal-actions">
            <button id="modalGallery"><i class="fas fa-images"></i>从图库选择</button>
            <button id="modalUrlBtn"><i class="fas fa-link"></i>输入 URL</button>
            <button class="cancel-btn" id="modalCancel" data-close>取消</button>
        </div>
        <div id="urlInputArea" style="display:none;">
            <div class="url-input-wrap">
                <input type="text" id="urlInput" placeholder="输入图片链接 (https://...)" autocomplete="off">
            </div>
            <button class="url-submit-btn" id="urlSubmit">确认</button>
        </div>
    </div>
</div>

<!-- 群头像弹窗 -->
<div class="ios-modal" id="groupAvatarModal">
    <div class="ios-modal-card">
        <h4>更换群头像</h4>
        <button class="modal-option" id="groupAvatarGallery">从图库选择</button>
        <div class="modal-divider"></div>
        <button class="modal-option" id="groupAvatarUrl">输入图片 URL</button>
        <div class="modal-actions">
            <button class="modal-btn" id="groupAvatarCancel" data-close>取消</button>
        </div>
    </div>
</div>

<input type="file" class="file-input-hidden" id="groupImageFileInput" accept="image/*" style="display:none;">

<script src="../js/chat.js?v=20261018b"></script>
<script src="../js/chat-nano.js?v=20261019a"></script>
<script src="../js/api-float.js"></script>
<script src="../swipe-back.js"></script>
</body>
</html>
