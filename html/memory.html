<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="../js/nano-runtime.js"></script>
    <script src="../js/group-store.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>记忆配置与管理</title>
    <link rel="stylesheet" href="../css/memory.css">
    <script src="../js/appearance.js"></script>
</head>
<body>
<div class="memory-app">

    <!-- ===== 顶栏：返回 / 记忆 / 保存 ===== -->
    <div class="memory-topbar">
        <button class="topbar-back" id="topbarBackBtn" title="返回" data-back>
            <svg viewBox="0 0 24 24" fill="none" stroke="#007aff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"/>
            </svg>
        </button>
        <div class="topbar-title">记忆</div>
        <button class="topbar-save" id="saveConfigBtn" title="保存配置">
            <svg viewBox="0 0 24 24" fill="none" stroke="#007aff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                <polyline points="17 21 17 13 7 13 7 21"/>
                <polyline points="7 3 7 8 15 8"/>
            </svg>
        </button>
    </div>

    <div class="scroll-content">

        <!-- ===== 总结 API ===== -->
        <div class="section-title">总结 API (LLM)</div>
        <div class="ios-group">
            <div class="ios-item">
                <span class="item-label">接口地址</span>
                <input type="text" id="llmUrl" class="ios-input" placeholder="https://api.openai.com/v1">
            </div>
            <div class="ios-item">
                <span class="item-label">API Key</span>
                <input type="text" data-masked-key="1" id="llmKey" class="ios-input" placeholder="输入密钥" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
            </div>
            <div class="ios-item" style="flex-direction:column;align-items:stretch;gap:6px;">
                <span class="item-label">总结模型</span>
                <select id="llmModelSelect" class="ios-select full-select">
                    <option value="">请选择或输入</option>
                </select>
            </div>
            <div class="ios-item" style="gap:10px;flex-wrap:wrap;">
                <button class="text-action-btn" id="fetchLlmModelsBtn" style="flex:1;">拉取模型列表</button>
                <button class="text-action-btn" id="testLlmBtn" style="flex:1;color:#34c759;">测试连接</button>
            </div>
        </div>

        <!-- ===== 向量 API（可选） ===== -->
        <div class="section-title">向量 API (Embedding) <span style="color:#8e8e93;font-weight:400;text-transform:none;">可选</span></div>
        <div class="ios-group">
            <div class="ios-item">
                <span class="item-label">接口地址</span>
                <input type="text" id="embUrl" class="ios-input" placeholder="https://api.siliconflow.cn/v1">
            </div>
            <div class="ios-item">
                <span class="item-label">API Key</span>
                <input type="text" data-masked-key="1" id="embKey" class="ios-input" placeholder="输入密钥（可选）" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
            </div>
            <div class="ios-item" style="flex-direction:column;align-items:stretch;gap:6px;">
                <span class="item-label">Embedding 模型</span>
                <select id="embModelSelect" class="ios-select full-select">
                    <option value="">请选择（留空则只做纯文本总结）</option>
                </select>
            </div>
            <div class="ios-item" style="gap:10px;flex-wrap:wrap;">
                <button class="text-action-btn" id="fetchEmbModelsBtn" style="flex:1;">拉取模型列表</button>
                <button class="text-action-btn" id="testEmbBtn" style="flex:1;color:#34c759;">测试连接</button>
            </div>
        </div>

        <!-- ===== 总结策略 ===== -->
        <div class="section-title">总结策略</div>
        <div class="ios-group">
            <div class="ios-item">
                <span class="item-label">上下文读取条数</span>
                <input type="number" id="contextLimit" class="ios-input" value="30" style="width:70px;">
            </div>
            <div class="ios-item" style="padding-top:0;">
                <span style="font-size:12px;color:#8e8e93;line-height:1.5;">每次回复读取多少条前文喂给模型（越大记得越牢，消耗越多）</span>
            </div>
            <div class="ios-item">
                <span class="item-label">自动总结</span>
                <label class="switch">
                    <input type="checkbox" id="autoSummaryToggle">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="ios-item" id="autoThresholdRow">
                <span class="item-label">触发阈值</span>
                <input type="number" id="autoThreshold" class="ios-input" value="20" style="width:70px;">
                <span style="color:#8e8e93;font-size:13px;margin-left:6px;">条</span>
            </div>
            <div class="ios-item">
                <span class="item-label">未总结条数</span>
                <span id="currentUnsummed" style="color:#007aff;font-size:16px;font-weight:500;">0 条</span>
            </div>
            <div class="ios-item">
                <span class="item-label">记忆库总数</span>
                <span id="totalMemories" style="color:#007aff;font-size:16px;font-weight:500;">0 条</span>
            </div>
        </div>

        <!-- ===== 操作按钮 ===== -->
        <button class="ios-btn" id="manualSummaryBtn">
            <span class="btn-text">手动执行总结</span>
            <div class="spinner"></div>
        </button>

        <!-- ===== 记忆列表 ===== -->
        <div class="section-title">记忆库</div>
        <div class="memory-search-box">
            <svg class="memory-search-icon" viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="1.8" stroke-linecap="round">
                <circle cx="11" cy="11" r="7"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" id="memorySearchInput" placeholder="记忆检索" autocomplete="off">
        </div>
        <div id="memoryListContainer"></div>

    </div>
</div>

<!-- ===== 编辑弹窗 ===== -->
<div class="modal-overlay" id="editModal">
    <div class="ios-sheet">
        <div class="sheet-header">
            <button class="sheet-action-btn destructive" onclick="closeEditModal()" data-close>取消</button>
            <div class="sheet-title">记忆详情</div>
            <button class="sheet-action-btn bold" onclick="saveMemory()">完成</button>
        </div>
        <div class="sheet-body">
            <textarea class="sheet-textarea" id="modalTextarea"></textarea>
        </div>
        <div class="vector-info-box">
            <div class="vector-info-row"><span>记录时间</span><span id="modalDate">-</span></div>
            <div class="vector-info-row"><span>记忆类型</span><span id="modalMemType">-</span></div>
            <div class="vector-info-row"><span>关联角色</span><span id="modalRelatedChar">-</span></div>
            <div class="vector-info-row"><span>向量状态</span><span id="modalVectorStatus">未向量化</span></div>
        </div>
        <button class="sheet-delete-btn" onclick="deleteMemory()">删除此条记忆</button>
    </div>
</div>

<!-- ===== 进度提示 ===== -->
<div class="toast-overlay" id="toastOverlay">
    <div class="toast-box">
        <div class="toast-spinner" id="toastSpinner"></div>
        <div class="toast-text" id="toastText">处理中...</div>
        <div class="toast-progress"><div class="toast-progress-bar" id="toastProgressBar"></div></div>
    </div>
</div>

<script src="../js/mem-link.js?v=20261006a"></script>
<script src="../js/refresh-notify.js?v=20261006a"></script>
<script src="../js/memory.js?v=20261020j"></script>

<script src="../js/api-float.js"></script>
<script src="../swipe-back.js"></script>
</body>
</html>
