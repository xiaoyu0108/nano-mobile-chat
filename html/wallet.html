<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="../js/nano-runtime.js?v=20261023a"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>钱包 · 记账</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="../css/wallet.css?v=20261020j">
    <link rel="stylesheet" href="../css/panel-ui.css?v=20261020j">
    <script src="../js/appearance.js"></script>
</head>
<body class="panel-wallet">

    <div class="app" id="app">

        <!-- ===== 顶栏 ===== -->
        <header class="nav-bar">
            <button class="nav-back" id="backBtn" aria-label="返回" data-back>
                <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <span class="nav-title" id="navTitle">钱包</span>
            <div class="nav-right">
                <button class="nav-action" id="addBtn" aria-label="新增记账">
                    <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </button>
            </div>
        </header>

        <!-- ===== 切换标签 ===== -->
        <div class="tab-switch" id="tabSwitch">
            <button class="tab-btn active" data-tab="wallet">银行卡</button>
            <button class="tab-btn" data-tab="ledger">记账</button>
        </div>

        <!-- ===== 页面容器 ===== -->
        <div class="page-container">

            <!-- ===== 钱包页（与 chat-inner 转账互通） ===== -->
            <div class="page active" id="pageWallet">
                <!-- 银行卡（上下折叠堆叠：选中的展开，未选中的只露一半） -->
                <div class="bank-stack" id="bankStack"></div>
                <div class="card-swipe-hint">上下滑动切换银行卡 / 亲密卡</div>

                <!-- 操作按钮 -->
                <div class="balance-actions">
                    <button class="action-btn recharge" id="rechargeBtn">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 11h-6V5h-2v6H5v2h6v6h2v-6h6z"/></svg>
                        充值
                    </button>
                    <button class="action-btn" id="editCardBtn">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                        更换银行卡
                    </button>
                    <button class="action-btn" id="addCardBtn">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 11h-6V5h-2v6H5v2h6v6h2v-6h6z"/></svg>
                        添加银行卡
                    </button>
                </div>

                <!-- 支付设置 -->
                <button class="pay-setting-row" id="paySettingsBtn" type="button">
                    <span class="pay-setting-main">
                        <span class="pay-setting-title">支付设置</span>
                        <span class="pay-setting-sub" id="paySettingsStatus">未设置支付密码</span>
                    </span>
                    <svg class="row-chevron" viewBox="0 0 8 13" width="8" height="13"><path d="M1 1.5L6.5 6.5L1 11.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>

                <!-- 交易记录（银行卡流水） -->
                <div class="section-header">
                    <span class="section-title">交易记录</span>
                    <span class="section-count" id="walletTxCount">0 笔</span>
                </div>
                <div class="entry-list" id="walletTxList">
                    <div class="empty-entries">
                        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="7" y1="14" x2="17" y2="14"/></svg>
                        <div>暂无交易记录</div>
                    </div>
                </div>
            </div>

            <!-- ===== 记账页（独立，不与银行卡互通） ===== -->
            <div class="page" id="pageLedger">
                <!-- 统计卡片 -->
                <div class="stats-card" id="statsCard">
                    <div class="stat-item">
                        <div class="stat-value income" id="totalIncome">¥0.00</div>
                        <div class="stat-label">总收入</div>
                    </div>
                    <div class="stat-divider"></div>
                    <div class="stat-item">
                        <div class="stat-value expense" id="totalExpense">¥0.00</div>
                        <div class="stat-label">总支出</div>
                    </div>
                    <div class="stat-divider"></div>
                    <div class="stat-item">
                        <div class="stat-value" id="totalBalance" style="color:#1c1c1e;">¥0.00</div>
                        <div class="stat-label">结余</div>
                    </div>
                </div>

                <!-- 记账列表 -->
                <div class="section-header">
                    <span class="section-title">流水记录</span>
                    <span class="section-count" id="entryCount">0 笔</span>
                </div>
                <div class="entry-list" id="entryList">
                    <div class="empty-entries">
                        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="7" y1="14" x2="17" y2="14"/></svg>
                        <div>还没有记账记录<br>点击右上角 + 开始记账</div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- ===== 记账弹窗 ===== -->
    <div class="modal-overlay" id="entryModal">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">记一笔</div>
                <div class="modal-sub" id="modalSub">记录你的收支</div>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <div class="input-row">
                        <span class="label">类型</span>
                        <select id="entryType">
                            <option value="income">收入</option>
                            <option value="expense">支出</option>
                        </select>
                    </div>
                    <div class="input-row">
                        <span class="label">金额</span>
                        <input type="number" id="entryAmount" placeholder="0.00" step="0.01" min="0.01" autofocus>
                    </div>
                    <div class="input-row">
                        <span class="label">用途</span>
                        <input type="text" id="entryDesc" placeholder="例如：午饭、工资" maxlength="30">
                    </div>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" id="entryCancel" data-close>取消</button>
                <button class="btn-confirm" id="entryConfirm">确认</button>
            </div>
        </div>
    </div>

    <!-- ===== 修改弹窗 ===== -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-title">修改记账</div>
                <div class="modal-sub">编辑这条记录</div>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <div class="input-row">
                        <span class="label">类型</span>
                        <select id="editType">
                            <option value="income">收入</option>
                            <option value="expense">支出</option>
                        </select>
                    </div>
                    <div class="input-row">
                        <span class="label">金额</span>
                        <input type="number" id="editAmount" placeholder="0.00" step="0.01" min="0.01">
                    </div>
                    <div class="input-row">
                        <span class="label">用途</span>
                        <input type="text" id="editDesc" placeholder="例如：午饭、工资" maxlength="30">
                    </div>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" id="editCancel" data-close>取消</button>
                <button class="btn-confirm" id="editConfirm">保存</button>
            </div>
        </div>
    </div>

    <!-- ===== 充值弹窗 ===== -->
    <div class="modal-overlay" id="rechargeModal">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-title">充值</div>
                <div class="modal-sub">输入充值金额</div>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <div class="input-row">
                        <span class="label">金额</span>
                        <input type="number" id="rechargeAmount" placeholder="0.00" step="0.01" min="0.01" autofocus>
                    </div>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" id="rechargeCancel" data-close>取消</button>
                <button class="btn-confirm" id="rechargeConfirm">确认充值</button>
            </div>
        </div>
    </div>

    <!-- ===== 支付设置弹窗 ===== -->
    <div class="modal-overlay" id="paySettingsModal">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-title">支付设置</div>
                <div class="modal-sub">商城使用银行卡付款时验证</div>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <div class="input-row">
                        <span class="label">免密支付</span>
                        <label class="ios-switch"><input type="checkbox" id="freePayToggle"><span class="ios-switch-track"></span></label>
                    </div>
                    <div class="input-row">
                        <span class="label">支付密码</span>
                        <input type="text" id="payPasswordInput" data-masked-key="1" inputmode="numeric" maxlength="6" placeholder="6 位数字" autocomplete="off">
                    </div>
                    <div class="input-row">
                        <span class="label">确认密码</span>
                        <input type="text" id="payPasswordConfirm" data-masked-key="1" inputmode="numeric" maxlength="6" placeholder="再次输入" autocomplete="off">
                    </div>
                    <button class="pay-clear-btn" id="payPasswordClear" type="button">清除支付密码</button>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" id="paySettingsCancel" data-close>取消</button>
                <button class="btn-confirm" id="paySettingsSave">保存</button>
            </div>
        </div>
    </div>

    <!-- ===== Toast ===== -->
    <div class="toast" id="toast"></div>

    <script src="../js/bank-theme.js?v=20261006a"></script>
    <script src="../js/family-card-store.js?v=20261006a"></script>
    <script src="../js/nano-pay.js?v=20261020j"></script>
    <script src="../js/wallet.js?v=20261020j"></script>
    <script src="../js/wallet-pay-ui.js?v=20261018a"></script>
<script src="../js/api-float.js"></script>
<script src="../swipe-back.js"></script>
</body>
</html>
