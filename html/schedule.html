<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="../js/nano-runtime.js?v=20261023a"></script>
<script src="../js/nano-idb.js"></script>
<script>window.__NANO_FONT_ONLY = true;</script>
<script src="../js/appearance.js"></script>
<script src="../js/schedule-bridge.js?v=20261019d"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>日程</title>
<style>
:root{
  --bg:#fff;--ink:#000;--ink2:#4a4a4a;--mute:#8c8c8c;--faint:#b9b9b9;
  --line:#e4e4e4;--soft:#f3f3f3;--soft2:#e9e9e9;
  --serif:"Songti SC","Noto Serif SC","Source Han Serif SC","STSong","Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%}
body{max-width:520px;margin:0 auto;min-height:100vh;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- 顶栏 ---------- */
.top{display:flex;justify-content:space-between;align-items:center;padding:calc(var(--safe-top, env(safe-area-inset-top, 0px)) + 14px) 20px 4px}
.who{font-size:13px;color:var(--mute);letter-spacing:.04em;display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:6px 2px;text-align:left}
.who b{color:var(--ink);font-weight:600}
.who .chev{font-size:18px;color:var(--faint);line-height:1}
.top .ibtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line)}
.top .ibtn:active{background:var(--soft)}

/* ---------- 三日标签 ---------- */
.tabs{display:grid;grid-template-columns:repeat(2,1fr);padding:6px 12px 0}
.tab{padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:0;position:relative;color:var(--faint);transition:color .2s}
.tab .lb{font-size:12px}
.tab .nu{font-family:var(--serif);font-size:40px;line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums}
.tab .pg{font-size:11px;margin-top:2px;font-variant-numeric:tabular-nums}
.tab::after{content:"";position:absolute;left:30%;right:30%;bottom:0;height:2px;background:var(--ink);transform:scaleX(0);transition:transform .25s}
.tab.on{color:var(--ink)}
.tab.on::after{transform:scaleX(1)}

/* ---------- 当天概览 ---------- */
.dayhead{padding:16px 20px 6px;border-top:1px solid var(--line);margin-top:0}
.dayhead h1{margin:0;font-size:17px;font-weight:600;display:flex;align-items:baseline;gap:8px}
.dayhead h1 span{font-size:13px;color:var(--mute);font-weight:400}
.dayhead p{margin:4px 0 10px;font-size:12px;color:var(--mute)}
.seg{display:flex;gap:3px;height:4px}
.seg i{flex:1;border-radius:2px;background:var(--soft2)}
.seg i.done{background:#000}
.seg i.cancelled{background:repeating-linear-gradient(135deg,#aaa 0 2px,#fff 2px 4px)}
.seg i.live{background:#000;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}

/* ---------- 时间线 ---------- */
.list{padding:14px 16px 130px;min-height:50vh}
.row{display:grid;grid-template-columns:44px 18px 1fr;padding-bottom:12px;position:relative}
.tm{text-align:right;padding-top:11px;padding-right:2px}
.tm b{display:block;font-family:var(--serif);font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.tm i{display:block;font-style:normal;font-family:var(--serif);font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums;margin-top:1px}
.rail{position:relative}
.rail::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line);transform:translateX(-.5px)}
.row.first .rail::before{top:19px}
.row.last .rail::before{bottom:auto;height:19px}
.row.first.last .rail::before{display:none}
.dot{position:absolute;left:50%;top:15px;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:#fff;border:1.5px solid #000;transition:all .3s}
.st-done .dot{background:#000}
.st-cancelled .dot{border-color:var(--faint);background:#fff}
.live .dot{background:#000;box-shadow:0 0 0 4px rgba(0,0,0,.12)}

.card{margin-left:4px;border:1px solid #000;border-radius:10px;padding:10px 12px;background:#fff;display:flex;gap:10px;align-items:flex-start;text-align:left;width:calc(100% - 4px);transition:background .35s,color .35s,border-color .35s,transform .15s;position:relative}
.card:active{transform:scale(.99)}
.cmain{flex:1;min-width:0}
.ctop{display:flex;align-items:center;gap:7px}
.ctop .ic svg.i{width:15px;height:15px}
.t{font-size:15px;font-weight:600;line-height:1.35;background:linear-gradient(currentColor,currentColor) no-repeat 0 56%/0 1.5px;transition:background-size .55s ease;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.cm{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:5px;font-size:12px;color:var(--mute)}
.cm span{display:inline-flex;align-items:center;gap:4px}
.cm svg.i{width:12px;height:12px}
.badge{display:inline-block;margin-top:7px;font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid currentColor}
.badge.photo{display:inline-flex;align-items:center;gap:4px;border-color:var(--ink);background:var(--ink);color:#fff}
.badge.photo svg.i{width:12px;height:12px;stroke-width:2}
.mark{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--soft);color:var(--ink);flex:none}
.mark svg.i{width:12px;height:12px;stroke-width:2}
.char-row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 4px;border-bottom:1px solid var(--line);text-align:left;background:#fff}
.char-row:last-child{border-bottom:0}
.char-row:active{background:var(--soft)}
.char-av{width:42px;height:42px;border-radius:50%;background:var(--soft);overflow:hidden;display:grid;place-items:center;flex:none;font-family:var(--serif);font-weight:700;font-size:17px}
.char-av img{width:100%;height:100%;object-fit:cover;display:block}
.char-info{flex:1;min-width:0}
.char-name{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.char-sub{display:block;font-size:12px;color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.char-row .chev{color:var(--faint);font-size:18px}
.photo-row{display:flex;align-items:center;gap:12px;width:100%;padding:13px 4px;margin-top:6px;border-top:1px solid var(--line);text-align:left;background:#fff}
.photo-row:active{background:var(--soft)}
.photo-state{font-size:12px;color:var(--ink2);background:var(--soft);border-radius:999px;padding:4px 9px;flex:none}
.report-note{margin:16px 0 0;padding:12px 14px;border-radius:12px;background:var(--soft);font-size:14px;line-height:1.7;color:var(--ink2)}
.rs{margin-top:6px;font-size:12px;color:var(--mute)}
.chk{width:24px;height:24px;border-radius:50%;border:1.5px solid #000;display:grid;place-items:center;flex:none;margin-top:-1px;transition:all .2s}
.chk svg.i{width:14px;height:14px;stroke-width:2.2;opacity:0}
.thumb{width:42px;height:42px;border-radius:6px;object-fit:cover;flex:none;background:var(--soft);margin-top:2px}
.thumb.busy,.pic.busy{background:linear-gradient(100deg,#eee 30%,#fafafa 50%,#eee 70%) 0 0/300% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-300% 0}}

.st-done .card{background:var(--soft);border-color:var(--soft2);color:var(--ink2)}
.st-done .chk{background:#000;border-color:#000;color:#fff}
.st-done .chk svg.i{opacity:1}
.st-done .t{color:var(--mute)}
.st-cancelled .card{border:1px dashed var(--faint);color:var(--faint);background:#fff}
.st-cancelled .t{background-size:100% 1.5px;color:var(--faint)}
.st-cancelled .chk{border-color:var(--faint);pointer-events:none}
.st-cancelled .cm,.st-cancelled .rs{color:var(--faint)}
.st-cancelled .tm b{color:var(--faint);font-weight:400}
.row.live .card{background:#000;color:#fff}
.row.live .cm{color:#bbb}
.row.live .chk{border-color:#fff}
.row.live .tm i{color:var(--mute)}
.row.past.st-todo .card{border-color:var(--faint)}
.row.pick .card{outline:2px solid #000;outline-offset:3px}

.gap{display:grid;grid-template-columns:44px 18px 1fr;padding-bottom:12px}
.gap .rail::before{background:repeating-linear-gradient(#cfcfcf 0 3px,transparent 3px 7px);width:1px}
.gapbtn{margin-left:4px;font-size:11px;color:var(--mute);display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px dashed var(--faint);border-radius:999px;justify-self:start;align-self:center}
.gapbtn svg.i{width:12px;height:12px}
.gapbtn:active{background:var(--soft)}

.nowrow{display:grid;grid-template-columns:44px 18px 1fr;align-items:center;padding-bottom:12px}
.nowrow .rail{height:14px}
.nowrow .rail::before{display:none}
.nowrow .rail b{position:absolute;left:50%;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;background:#000;border-radius:50%}
.nowrow .ln{height:1px;background:#000;margin-left:4px;position:relative}
.nowrow .tm{padding:0}
.nowrow .tm b{font-size:12px}
.empty{text-align:center;padding:60px 20px;color:var(--mute);font-size:14px}
.empty .btn{margin:18px auto 0;max-width:200px}

/* ---------- 底部操作 ---------- */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-bottom, env(safe-area-inset-bottom, 0px)) + 14px);background:#000;color:#fff;border-radius:999px;padding:6px;display:flex;gap:2px;z-index:20}
.dock button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 15px 7px;border-radius:999px;font-size:10px;letter-spacing:.06em;transition:background .15s}
.dock button:active{background:#333}
.dock svg.i{width:19px;height:19px}

/* ---------- 抽屉 ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.38);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;background:#fff;border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.8,.2,1);z-index:41;padding:8px 20px calc(var(--safe-bottom, env(safe-area-inset-bottom, 0px)) + 24px);-webkit-overflow-scrolling:touch}
.sheet.on{transform:none}
.grab{width:38px;height:4px;border-radius:2px;background:var(--soft2);margin:4px auto 14px}
.dhead{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mute)}
.tagp{display:inline-flex;align-items:center;gap:6px}
.tagp svg.i{width:15px;height:15px}
.stat{border:1px solid currentColor;border-radius:999px;padding:1px 9px;font-size:11px;color:var(--ink)}
.dt{font-size:24px;line-height:1.3;margin:12px 0 6px;font-weight:700;background:linear-gradient(currentColor,currentColor) no-repeat 0 58%/0 2px;display:inline;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.dt.strike{background-size:100% 2px;color:var(--mute)}
.dtime{font-family:var(--serif);font-size:18px;margin-top:10px;display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
.dtime span{font-family:var(--sans);font-size:12px;color:var(--mute)}
.dtime em{font-style:normal;font-family:var(--sans);font-size:12px;color:var(--mute);margin-left:auto}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;margin:12px 0 0;font-size:13px;color:var(--ink2)}
.meta div{display:inline-flex;align-items:center;gap:6px}
.meta svg.i{width:14px;height:14px}
.note{margin:16px 0 0;font-size:14px;line-height:1.75;color:var(--ink2)}
.mood{margin:14px 0 0;padding-left:12px;border-left:2px solid #000;font-size:14px;line-height:1.7;font-family:var(--serif)}
.why{margin:14px 0 0;font-size:13px;color:var(--mute)}
.pic{position:relative;margin-top:18px;aspect-ratio:16/10;border-radius:12px;overflow:hidden;background:var(--soft);display:grid;place-items:center}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic .rg{position:absolute;right:10px;bottom:10px;background:#000;color:#fff;font-size:11px;padding:6px 12px;border-radius:999px;display:flex;gap:6px;align-items:center}
.pic .rg svg.i{width:13px;height:13px}
.pic.empty{border:1px dashed var(--faint);background:#fff}
.pic.empty button{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--mute);font-size:12px;padding:30px}
.hist{margin:18px 0 0;padding:0;list-style:none;font-size:12px;color:var(--mute)}
.hist li{display:flex;gap:10px;padding:4px 0}
.hist b{font-family:var(--serif);font-weight:400;color:var(--ink2);font-variant-numeric:tabular-nums}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border:1px solid var(--line);border-radius:12px;font-size:12px}
.act:active{background:var(--soft)}
.act.dark{background:#000;color:#fff;border-color:#000}
.act.dark:active{background:#222}
.sh2{font-size:18px;font-weight:700;margin:2px 0 4px}
.sub{font-size:12px;color:var(--mute);margin:0 0 6px;line-height:1.6}
label.l{display:block;font-size:12px;color:var(--mute);margin:16px 0 6px}
input,textarea,select{width:100%;font:inherit;font-size:16px;border:1px solid #d4d4d4;border-radius:10px;padding:10px 12px;background:#fff;color:#000;outline:none;-webkit-appearance:none;appearance:none}
input:focus,textarea:focus,select:focus{border-color:#000}
textarea{resize:vertical;line-height:1.6}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid #d0d0d0;border-radius:999px;padding:6px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip svg.i{width:14px;height:14px}
.chip.on{background:#000;color:#fff;border-color:#000}
.btn{display:block;width:100%;padding:14px;border-radius:12px;background:#000;color:#fff;font-size:15px;font-weight:600;text-align:center;margin-top:20px}
.btn:active{background:#222}
.btn.ghost{background:#fff;color:#000;border:1px solid #000;margin-top:10px}
.btn.soft{background:var(--soft);color:#000;margin-top:10px}
.btn[disabled]{opacity:.4;pointer-events:none}
.sw{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:14px}
.tg{width:44px;height:26px;border-radius:13px;background:var(--soft2);position:relative;transition:background .2s}
.tg::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s}
.tg.on{background:#000}.tg.on::after{transform:translateX(18px)}
.hr{height:1px;background:var(--line);margin:22px 0 4px}
.toast{position:fixed;left:50%;top:calc(var(--safe-top, env(safe-area-inset-top, 0px)) + 12px);transform:translate(-50%,-20px);background:#000;color:#fff;font-size:13px;padding:10px 16px;border-radius:999px;max-width:88%;text-align:center;opacity:0;pointer-events:none;transition:all .3s;z-index:60;line-height:1.5}
.toast.on{opacity:1;transform:translate(-50%,0)}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;place-items:center;z-index:70;padding:20px}
.viewer.on{display:grid}
.viewer img{max-width:100%;max-height:86vh;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="top">
  <button class="who" id="who" type="button" aria-label="切换角色"></button>
</header>
<nav class="tabs" id="tabs"></nav>
<section class="dayhead" id="dayhead"></section>
<main class="list" id="list"></main>

<nav class="dock" id="dock">
  <button data-d="refresh"></button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog"></div>
<div class="toast" id="toast"></div>
<div class="viewer" id="viewer"><img alt=""></div>

<script>
/* =========================================================
   接入说明（可选）
   window.CharSchedule.hooks.generateSchedule = async ({name, persona, dates, note}) => [ {date,start,end,title,place,who,note,mood,tag}, ... ]
   window.CharSchedule.hooks.generateImage    = async ({prompt, event}) => "图片URL 或 dataURL"
   不设置 hooks 时：优先走设置里的接口；没填接口则用本地生成 + 黑白示意图。
   ========================================================= */
(()=>{
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addD=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return dstr(d)};
const toMin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
const toT=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;
const WK=['日','一','二','三','四','五','六'];
const uid=()=>Math.random().toString(36).slice(2,9);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const today=()=>dstr(new Date());
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const nowT=()=>toT(nowMin());

/* ---------- 图标（SVG，无 emoji） ---------- */
const P={
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
 brief:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/>',
 cup:'<path d="M4 8h13v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V8z"/><path d="M17 10h2a2 2 0 0 1 0 4h-2M8 3v2M12 3v2"/>',
 users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-3.5 3-5.5 6.5-5.5s6 2 6.5 5.5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.5c2.5 0 4 1.5 4.5 4.5"/>',
 moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
 pin:'<path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
 book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2V5z"/><path d="M4 19a2 2 0 0 1 2-2h13"/>',
 check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
 x:'<path d="M6 6l12 12M18 6L6 18"/>',
 refresh:'<path d="M20 11a8 8 0 0 0-14-4L4 9M4 4v5h5M4 13a8 8 0 0 0 14 4l2-2M20 20v-5h-5"/>',
 shuffle:'<path d="M3 7h3.5c5 0 6 10 11 10H21M3 17h3.5c1.8 0 3-1 4-2.3M14 8.3C15 7.4 16 7 17.5 7H21M18 4l3 3-3 3M18 14l3 3-3 3"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 sliders:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
 edit:'<path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 8"/>',
 trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
 undo:'<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>',
 swap:'<path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/>'
};

const KEY='charSchedule.v2';

const DEF={settings:{name:'char',persona:'',style:'黑白胶片摄影，柔和自然光，留白构图',textUrl:'',textKey:'',textModel:'',imgUrl:'',imgKey:'',imgModel:'',imgSize:'1024x1024',charId:'',avatar:''},events:[],gen:{},lastRefresh:0,imgGenDay:'',imgGenAt:0,photoReport:true};
let STORE={version:2,lastCharId:'',chars:{}};
let CHARS=[];
let CHAR=null;

let LEGACY=null;
let warned=false;
let refreshing=false;

function post(msg){
  try{ if(window.parent&&window.parent!==window){ window.parent.postMessage(msg,'*'); return true; } }catch(e){}
  return false;
}
function normalizeStore(o){
  if(!o||typeof o!=='object')return {version:2,lastCharId:'',chars:{}};
  if(!o.chars||typeof o.chars!=='object')o.chars={};
  o.version=2;
  return o;
}
function readLocalStore(){
  try{const r=localStorage.getItem(KEY);if(r)return normalizeStore(JSON.parse(r))}catch(e){}
  return null;
}
function lightStore(store){
  try{
    return JSON.parse(JSON.stringify(store,(k,v)=>{
      if(k==='src'&&typeof v==='string'&&v.indexOf('data:')===0)return '';
      return v;
    }));
  }catch(e){return store}
}
async function persistStore(){
  try{
    if(window.NanoIDB)await NanoIDB.set(IDB_KEY,STORE);
    try{
      const txt=JSON.stringify(lightStore(STORE));
      if(txt.length<4300000)localStorage.setItem(KEY,txt);
    }catch(e){}
  }catch(e){}
}
async function loadStore(){
  let o=null;
  try{ o=await NanoIDB.get(IDB_KEY); }catch(e){}
  if(!o)o=readLocalStore();
  if(!o){
    try{ o=await NanoIDB.get(LEGACY_IDB_KEY); }catch(e){}
    if(!o){ try{const r=localStorage.getItem(LEGACY_KEY);if(r)o=JSON.parse(r)}catch(e){} }
    if(o)LEGACY=o;
  }
  return normalizeStore(o);
}
function charDataFor(ch){
  const id=String(ch.id);
  if(!STORE.chars[id])STORE.chars[id]=JSON.parse(JSON.stringify(DEF));
  const d=STORE.chars[id];
  d.settings=Object.assign({},DEF.settings,d.settings||{});
  d.settings.charId=id;
  d.settings.name=ch.name||d.settings.name||'char';
  d.settings.persona=String(ch.setting||ch.desc||ch.persona||'');
  d.settings.avatar=ch.avatar||d.settings.avatar||'';
  if(!Array.isArray(d.events))d.events=[];
  return d;
}
function save(){
  if(!CHAR)return;
  try{
    S.settings.charId=String(CHAR.id);
    S.settings.name=CHAR.name||S.settings.name||'char';
    const id=String(CHAR.id);
    STORE.chars[id]=S;
    STORE.lastCharId=id;
    const data=JSON.parse(JSON.stringify(STORE,(k,v)=>k[0]==='_'?undefined:v));
    STORE=data;
    if(STORE.chars[id])S=STORE.chars[id];
    persistStore();
  }catch(e){if(!warned){warned=true;toast('本机存储不可用或已满，改动仅在本次打开期间有效')}}
}

function currentMaskId(){

function loadCharacters(){
  return new Promise(resolve=>{
    try{
      const req=indexedDB.open('nano_characters_db',1);
      req.onupgradeneeded=e=>{try{const db=e.target.result;if(!db.objectStoreNames.contains('characters'))db.createObjectStore('characters',{keyPath:'id'})}catch(err){}};
      req.onsuccess=e=>{
        const db=e.target.result;
        try{
          if(!db.objectStoreNames.contains('characters')){resolve([]);return}
          const r=db.transaction('characters','readonly').objectStore('characters').getAll();
          r.onsuccess=()=>resolve(r.result||[]);
          r.onerror=()=>resolve([]);
        }catch(err){resolve([])}
      };
      req.onerror=()=>resolve([]);
    }catch(e){resolve([])}
  });
}

}

function mockDay(date){
  const wd=parseD(date).getDay(),wk=wd===0||wd===6;
  const out=[mk({date,start:'00:00',end:'06:30',title:'睡觉',place:'卧室',who:'',note:'夜里睡得很沉，闹钟还没响。',mood:'……',tag:'rest'})];
  const slots=[
    {p:'wake',r:[420,510],d:[30,45]},{p:'breakfast',r:[480,570],d:[30,40]},
    {p:wk?'leisureAm':'workAm',r:[570,660],d:[75,150]},{p:'lunch',r:[720,780],d:[50,70]},
    {p:wk?'leisurePm':'workPm',r:[840,960],d:[90,150]},{p:'extra',r:[1000,1050],d:[30,50],prob:.5},
    {p:'dinner',r:[1080,1140],d:[60,90]},{p:'night',r:[1200,1260],d:[60,100]},{p:'sleep',r:[1350,1400],d:[20,30]}
  ];
  let cur=0;
  for(const s of slots){
    if(s.prob&&Math.random()>s.prob)continue;
    const it=pick(POOL[s.p]);
    const start=Math.max(rnd(...s.r),cur+10);
    if(start>=1420)continue;
    const end=Math.min(start+rnd(...s.d),1435);
    out.push(mk({date,start:toT(start),end:toT(end),title:it[0],place:it[1],who:it[2],note:it[3],mood:it[4],tag:it[5]}));
    cur=end;
  }
  return out;
}
const mockGen=ds=>ds.flatMap(mockDay);
function mk(o){return {id:uid(),status:'todo',log:[],title:'',place:'',who:'',note:'',mood:'',tag:'life',...o}}
function norm(e,ds){
  const tm=t=>{const m=/^(\d{1,2}):(\d{2})$/.exec(String(t||'').trim());return m?`${pad(+m[1])}:${m[2]}`:null};
  const s=tm(e.start),en=tm(e.end);
  if(!e||!ds.includes(e.date)||!s||!en||!e.title)return null;
  // 跨夜安排（如 23:00-07:00）：日程按当天显示到 23:59，避免整条被丢掉
  const end=toMin(en)<=toMin(s)?'23:59':en;
  return mk({date:e.date,start:s,end,title:String(e.title),place:String(e.place||''),who:String(e.who||e.with||''),note:String(e.note||''),mood:String(e.mood||''),tag:TAGS[e.tag]?e.tag:'life'});
}

const JOB_KEY='nano_schedule_job_v1';
const IMG_JOB_KEY='nano_schedule_img_job_v1';
let activeJobToken='';
let activeImgJobToken='';
function readJob(){try{const raw=localStorage.getItem(JOB_KEY);return raw?JSON.parse(raw):null}catch(e){return null}}
function writeJob(job){try{localStorage.setItem(JOB_KEY,JSON.stringify(job))}catch(e){}}
function clearJob(token){
  try{
    const j=readJob();
    if(!token||!j||j.token===token)localStorage.removeItem(JOB_KEY);
    const rk=j&&j.resultKey;
    if(rk)localStorage.removeItem(rk);
  }catch(e){}
}
function readImgJob(){try{const raw=localStorage.getItem(IMG_JOB_KEY);return raw?JSON.parse(raw):null}catch(e){return null}}
function writeImgJob(job){try{localStorage.setItem(IMG_JOB_KEY,JSON.stringify(job))}catch(e){}}
function clearImgJob(token){
  try{
    const j=readImgJob();
    if(!token||!j||j.token===token){
      localStorage.removeItem(IMG_JOB_KEY);
      if(j&&j.resultKey)localStorage.removeItem(j.resultKey);
    }
  }catch(e){}
}
function parseImageText(txt,prompt){
  let j={};
  try{j=JSON.parse(String(txt||'{}'))}catch(e){throw new Error('生图接口返回的内容不是 JSON')}
  const item=j&&j.data&&j.data[0];
  const src=item&&(item.url||(item.b64_json?'data:image/png;base64,'+item.b64_json:''));
  if(!src)throw new Error('生图接口没有返回图片地址');
  return {src,kind:'api',prompt};
}
function applyImgResult(job,res){
  if(!res||!res.src)return false;
  if(!CHAR||!job.charId||String(job.charId)!==String(CHAR.id))return false;
  const ev=byId(job.eventId);
  if(!ev)return false;
  ev.img=res;
  ev.report={at:Date.now(),note:String(ev.mood||ev.note||'').trim().slice(0,80),delivered:false};
  logEv(ev,'生成画面');
  save();render();
  if(sheetOpen()&&cur===ev.id)detail(ev.id,'view',true);
  return true;
}
function processImgJob(job){
  if(!job||!job.resultKey)return false;
  let raw='';
  try{raw=localStorage.getItem(job.resultKey)||''}catch(e){}
  if(!raw)return false;
  try{localStorage.removeItem(job.resultKey)}catch(e){}
  try{
    const r=JSON.parse(raw);
    if(!r.ok)throw new Error(r.error||r.text||('HTTP '+(r.status||'')));
    const res=parseImageText(r.text,job.prompt);
    applyImgResult(job,res);
    clearImgJob(job.token);
    toast('日程图片已生成并保存');
  }catch(err){
    clearImgJob(job.token);
    showError('日程生图失败：\n'+(err&&err.message||'未知错误')+'（今天不会再次自动调用）');
  }
  return true;
}
function attachImgJob(job){
  if(!job)return;
  if(processImgJob(job))return;
  const onMsg=ev=>{
    if(!ev||!ev.data||ev.data.type!=='chatApiDone'||ev.data.token!==job.token)return;
    window.removeEventListener('message',onMsg);
    setTimeout(()=>processImgJob(job),80);
  };
  window.addEventListener('message',onMsg);
  let tries=0;
  const timer=setInterval(()=>{
    tries++;
    if(tries>72){clearInterval(timer);return}
    if(processImgJob(job)){clearInterval(timer);window.removeEventListener('message',onMsg)}
  },5000);
  setTimeout(()=>{window.removeEventListener('message',onMsg);clearInterval(timer)},6*60*1000);
}
function resumeImgJob(){
  if(!CHAR)return false;
  const job=readImgJob();
  if(!job||!job.charId||String(job.charId)!==String(CHAR.id))return false;
  if(processImgJob(job))return true;
  const age=Date.now()-(job.startedAt||0);
  if(age<5*60*1000){
    toast('日程图片还在后台生成，完成后会自动保存');
    attachImgJob(job);
  }else{
    clearImgJob(job.token);
    showError('上次的日程生图已中断（超过 5 分钟没有结果）');
  }
  return true;
}
function parseEventsText(txt,ds){
  let t=String(txt||'').replace(/```json|```/g,'');
  const a=t.indexOf('{'),b=t.lastIndexOf('}');
  if(a<0||b<0)throw new Error('主 API 返回的内容不是可解析的日程 JSON');
  const data=JSON.parse(t.slice(a,b+1));
  const list=(data.events||[]).map(e=>norm(e,ds)).filter(Boolean);
  if(!list.length)throw new Error('主 API 没有返回有效的日程');
  return list;
}
function waitParentResult(token,resultKey,timeout){
  return new Promise((resolve,reject)=>{
    let done=false;
    function onMsg(ev){
      if(!ev||!ev.data||ev.data.type!=='chatApiDone'||ev.data.token!==token)return;
      finish(true);
    }
    function finish(fromMsg){
      if(done)return;done=true;
      window.removeEventListener('message',onMsg);
      setTimeout(()=>{
        try{
          const raw=localStorage.getItem(resultKey);
          if(!raw)throw new Error('后台没有返回结果');
          localStorage.removeItem(resultKey);
          resolve(JSON.parse(raw));
        }catch(err){reject(err)}
      },fromMsg?40:0);
    }
    window.addEventListener('message',onMsg);
    setTimeout(()=>{if(done)return;done=true;window.removeEventListener('message',onMsg);const e=new Error('后台仍在生成，可稍后回到日程查看');e.background=true;reject(e)},timeout||120000);
  });
}
async function requestViaParent(url,headers,body,token,resultKey){
  await new Promise(resolve=>setTimeout(resolve,20));
  window.parent.postMessage({type:'chatApiFetch',token:token,resultKey:resultKey,url:url,method:'POST',headers:headers,body:body},'*');
  const r=await waitParentResult(token,resultKey,120000);
  if(!r.ok){
    let msg=r.error||('HTTP '+(r.status||''));
    if(!r.error&&r.text)msg+='\n'+String(r.text).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').slice(0,400);
    throw new Error(msg);
  }
  return String(r.text||'');
}
async function getMainConfig(){
  let o=null;
  try{
    o=await new Promise(resolve=>{
      // 不指定版本：以当前实际版本打开，避免 VersionError 读不到配置
      const req=indexedDB.open('nano_api_db');
      req.onupgradeneeded=e=>{try{const db=e.target.result;if(!db.objectStoreNames.contains('api_data'))db.createObjectStore('api_data',{keyPath:'key'})}catch(err){}};
      req.onsuccess=e=>{
        try{
          const db=e.target.result;
          if(!db.objectStoreNames.contains('api_data')){resolve(null);return}
          const r=db.transaction('api_data','readonly').objectStore('api_data').get('nano_api_config');
          r.onsuccess=()=>{
            const rec=r.result;
            let v=rec?(rec.value&&typeof rec.value==='object'?rec.value:rec):null;
            if(typeof v==='string'){try{v=JSON.parse(v)}catch(e){}}
            resolve(v);
          };
          r.onerror=()=>resolve(null);
        }catch(err){resolve(null)}
      };
      req.onerror=()=>resolve(null);
    });
  }catch(e){}
  if(!o){try{o=JSON.parse(localStorage.getItem('nano_api_config')||'null')}catch(e){}}
  if(o&&o.value&&typeof o.value==='object'&&!o.mainUrl)o=o.value;
  return o||null;
}

    rawText=await requestViaParent(endpoint,headers,body,token,resultKey);
  }else{

  }

function buildPrompt(ev){
  const st=S.settings;
  return `${st.style}。主角：${st.name}${st.persona?'（'+st.persona+'）':''}。场景：${ev.place||'室内'}，${ev.title}${ev.who?'，与'+ev.who+'在一起':''}。${ev.note||''}时间约 ${ev.start}。`;
}
function hash(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return h>>>0}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function artSVG(seed){
  const r=rng(hash(seed)),W=640,H=400,g=l=>`hsl(0,0%,${l.toFixed(1)}%)`;
  let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${g(93+r()*5)}"/><stop offset="1" stop-color="${g(68+r()*16)}"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#g)"/>`;
  s+=`<circle cx="${(120+r()*400).toFixed(0)}" cy="${(60+r()*110).toFixed(0)}" r="${(26+r()*42).toFixed(0)}" fill="${r()<.5?'#111':'#fff'}" opacity=".92"/>`;
  for(let i=0;i<4;i++){
    const y=185+i*48+r()*22;let d=`M0 ${H} L0 ${y.toFixed(0)}`;
    for(let x=80;x<=W+80;x+=80)d+=` Q${x-40} ${(y+(r()-.5)*74).toFixed(0)} ${x} ${(y+(r()-.5)*30).toFixed(0)}`;
    s+=`<path d="${d} L${W} ${H}Z" fill="${g(60-i*15)}" opacity=".93"/>`;
  }
  for(let i=0;i<5;i++){const x=r()*W;s+=`<line x1="${x.toFixed(0)}" y1="0" x2="${x.toFixed(0)}" y2="${H}" stroke="#000" stroke-opacity=".05"/>`}
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s+'</svg>');
}
async function genImage(ev,custom){
  const st=S.settings,prompt=(custom||'').trim()||buildPrompt(ev);
  try{
    if(hooks.generateImage){const src=await hooks.generateImage({prompt,event:ev});return {src,kind:'api',prompt}}
    const cfg=await getMainConfig();
    const imgUrl=(cfg&&cfg.imgUrl)||st.imgUrl||'';
    const imgKey=(cfg&&cfg.imgKey)||st.imgKey||'';
    const imgModel=(cfg&&cfg.imgModel)||st.imgModel||'';
    if(!imgUrl)throw new Error('还没有配置生图 API，请到「API → 生图」填写地址、Key 和模型');
    const endpoint=ep(imgUrl,'/images/generations');
    const headers={'Content-Type':'application/json',...(imgKey?{Authorization:'Bearer '+imgKey}:{})};
    const body=JSON.stringify({model:imgModel||undefined,prompt,n:1,size:st.imgSize||'1024x1024'});
    if(window.parent&&window.parent!==window){
      const token='schedimg_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
      const resultKey='sched_img_result_'+token;
      activeImgJobToken=token;
      writeImgJob({token,resultKey,charId:CHAR?String(CHAR.id):'',eventId:ev.id,prompt,startedAt:Date.now()});
      const raw=await requestViaParent(endpoint,headers,body,token,resultKey);
      return parseImageText(raw,prompt);
    }
    const r=await fetch(endpoint,{method:'POST',headers,body});
    if(!r.ok)throw new Error('生图接口返回 HTTP '+r.status);
    return parseImageText(await r.text(),prompt);
  }catch(err){
    const e=new Error((err&&err.message)||'生图失败');
    e.background=!!(err&&err.background);
    throw e;
  }
}

/* ---------- 动作 ---------- */
function setDone(e){e.status=e.status==='done'?'todo':'done';logEv(e,e.status==='done'?'标记完成':'撤回完成');save();render();navigator.vibrate&&navigator.vibrate(8)}
function applyCancel(e,reason){e.status='cancelled';e.reason=reason;logEv(e,'划掉：'+reason);save();render()}
function animateCancel(id,cb){
  const r=document.querySelector(`.row[data-id="${id}"]`);
  if(!r){cb();return}
  r.scrollIntoView({block:'center',behavior:'smooth'});
  setTimeout(()=>{r.classList.remove('st-todo','live');r.classList.add('st-cancelled');setTimeout(cb,750)},250);
}
function applyMove(e,s,en,reason){
  if(!e.movedFrom)e.movedFrom=e.start;
  logEv(e,`改期：${e.start}-${e.end} 改为 ${s}-${en}${reason?'（'+reason+'）':''}`);
  e.start=s;e.end=en;save();render();
}
function flash(id,ms=1000){const r=document.querySelector(`.row[data-id="${id}"]`);if(!r)return;r.scrollIntoView({block:'center',behavior:'smooth'});r.classList.add('pick');setTimeout(()=>r.classList.remove('pick'),ms)}

function applyGenerated(evs,ds){
  const kept=S.events.filter(e=>ds.includes(e.date)&&(e.status==='done'||e.status==='cancelled'));
  S.events=S.events.filter(e=>!ds.includes(e.date)||kept.includes(e));
  evs=evs.filter(n=>!kept.some(k=>k.date===n.date&&overlap(k,n)));
  S.events.push(...evs);
  ds.forEach(d=>S.gen[d]=1);
  S.lastRefresh=Date.now();
  save();render();
}
function processJobResult(job){
  if(!job||!job.resultKey)return false;
  let raw='';
  try{raw=localStorage.getItem(job.resultKey)||''}catch(e){}
  if(!raw)return false;
  try{localStorage.removeItem(job.resultKey)}catch(e){}
  try{
    const r=JSON.parse(raw);
    if(!r.ok)throw new Error(r.error||r.text||('HTTP '+(r.status||'')));
    const evs=parseEventsText(r.text,job.dates);
    if(CHAR&&job.charId&&String(job.charId)===String(CHAR.id)){
      applyGenerated(evs,job.dates);
      clearJob(job.token);
      toast('上次的日程已生成并保存');
    }else{
      clearJob(job.token);
    }
  }catch(err){
    clearJob(job.token);
    showError('日程生成失败：\n'+(err&&err.message||'未知错误'));
  }
  return true;
}
function attachJob(job){
  if(!job)return;
  if(processJobResult(job))return;
  const onMsg=ev=>{
    if(!ev||!ev.data||ev.data.type!=='chatApiDone'||ev.data.token!==job.token)return;
    window.removeEventListener('message',onMsg);
    setTimeout(()=>processJobResult(job),80);
  };
  window.addEventListener('message',onMsg);
  let tries=0;
  const timer=setInterval(()=>{
    tries++;
    if(tries>72){clearInterval(timer);return}
    if(processJobResult(job)){clearInterval(timer);window.removeEventListener('message',onMsg)}
  },5000);
  setTimeout(()=>{window.removeEventListener('message',onMsg);clearInterval(timer)},6*60*1000);
}
function resumeJob(){
  if(!CHAR)return false;
  const job=readJob();
  if(!job||!job.charId||String(job.charId)!==String(CHAR.id))return false;
  if(processJobResult(job))return true;
  const age=Date.now()-(job.startedAt||0);
  if(age<5*60*1000){
    toast('上次的日程还在后台生成，完成后会自动保存');
    attachJob(job);
  }else{
    clearJob(job.token);
    showError('上次的日程生成已中断（超过 5 分钟没有结果），请重新点刷新');
  }
  return true;
}
async function refreshSchedule(note){
  if(!CHAR){openCharSheet();return}
  if(refreshing)return;
  const oldJob=readJob();
  if(oldJob&&oldJob.charId&&String(oldJob.charId)===String(CHAR.id)&&Date.now()-(oldJob.startedAt||0)<5*60*1000){
    toast('上一次生成还在进行，请稍候');
    attachJob(oldJob);
    return;
  }
  if(oldJob)clearJob(oldJob.token);
  refreshing=true;render();
  const ds=dates();
  let evs=null;
  try{
    evs=await llmGen(ds,note||'');
    applyGenerated(evs,ds);
    clearJob(activeJobToken);
    toast('主 API 已生成今天和明天的安排');
  }catch(err){
    refreshing=false;
    render();
    if(err&&err.background){
      const j=readJob();
      if(j)attachJob(j);
      toast('仍在后台生成，完成后会自动保存；可以先返回');
      return;
    }
    clearJob(activeJobToken);
    showError('日程生成失败：\n'+(err&&err.message||'未知错误'));
    return;
  }
  refreshing=false;
  render();
}
async function doRefresh(scope,keepDone,note){
  await refreshSchedule(note);
  closeSheet();
}

function randomChange(){
  const d=dates()[sel];
  let pool=evsOf(d).filter(e=>e.status==='todo');
  if(d===today()){const f=pool.filter(e=>toMin(e.start)>=nowMin());if(f.length)pool=f}
  if(!pool.length){toast('这一天没有可以变动的安排');return}
  const ev=pick(pool),name=S.settings.name;
  flash(ev.id,1200);
  const canMove=toMin(ev.end)+90<1430;
  setTimeout(()=>{
    if(canMove&&Math.random()<.4){
      const sh=pick([30,60,90]),r=pick(MOVE_R);
      applyMove(ev,toT(toMin(ev.start)+sh),toT(toMin(ev.end)+sh),r);
      toast(`${name} 把「${ev.title}」推迟了 ${sh} 分钟：${r}`);
    }else{
      const r=pick(CANCEL_R);
      animateCancel(ev.id,()=>{applyCancel(ev,r);toast(`${name} 划掉了「${ev.title}」：${r}`)});
    }
  },1300);
}

async function randomImage(){
  const d=dates()[sel];
  let pool=evsOf(d).filter(e=>e.status!=='cancelled');
  if(!pool.length){toast('这一天还没有可以生图的安排');return}
  const fresh=pool.filter(e=>!e.img);if(fresh.length)pool=fresh;
  const rows=[...document.querySelectorAll('.row[data-id]')].filter(r=>pool.some(p=>p.id===r.dataset.id));
  for(let i=0;i<9;i++){rows.forEach(r=>r.classList.remove('pick'));const r=pick(rows);r.classList.add('pick');await sleep(90+i*28)}
  const ev=pick(pool);
  rows.forEach(r=>r.classList.remove('pick'));
  flash(ev.id,2200);
  toast(`为「${ev.title}」生成画面`);
  await runImage(ev,'',true);
}
let autoReporting=false;
let imgConfigWarned=false;
function isSleepLike(e){
  return /睡|就寝|晚安|入睡|睡眠/.test(String((e&&e.title)||'')+' '+String((e&&e.note)||''));

function imgDayKey(){return 'nano_schedule_img_day_'+(CHAR?CHAR.id:'default')}
function imgLockedToday(){
  try{if(localStorage.getItem(imgDayKey())===today())return true}catch(e){}
  return S&&S.imgGenDay===today();
}
function markImgDay(){
  if(!S)return;
  S.imgGenDay=today();
  S.imgGenAt=Date.now();
  try{localStorage.setItem(imgDayKey(),today())}catch(e){}
  save();
}
async function runImage(ev,prompt,openAfter,autoReport){
  if(!ev||ev._busy)return;
  if(imgLockedToday()){
    if(!autoReport)toast('今天已经生成过一次日程图片，明天再试');
    return;
  }
  try{
    const cfg=await getMainConfig();
    if(!(cfg&&cfg.imgUrl)&&!S.settings.imgUrl){
      if(!imgConfigWarned){
        imgConfigWarned=true;
        showError('日程生图失败：\n还没有配置生图 API，请到「API → 生图」填写地址、Key 和模型');
      }
      return;
    }
    imgConfigWarned=false;
  }catch(e){}
  markImgDay();
  ev.imgTriedAt=Date.now();
  ev._busy=true;render();if(sheetOpen()&&cur===ev.id)detail(ev.id,'view',true);
  let img=null,errMsg='',errBg=false;
  try{ img=await genImage(ev,prompt); }catch(e){ errMsg=(e&&e.message)||'生图失败'; errBg=!!(e&&e.background); }
  ev._busy=false;
  if(img){
    ev.img=img;
    logEv(ev,'生成画面');
    clearImgJob(activeImgJobToken);
    if(autoReport){
      ev.report={at:Date.now(),note:(ev.mood||ev.note||'').trim().slice(0,80),delivered:false};
    }
  }else if(!errBg){
    clearImgJob(activeImgJobToken);
  }
  save();render();
  if(openAfter||(sheetOpen()&&cur===ev.id))detail(ev.id,'view',openAfter?false:true);
  if(errMsg){
    if(errBg){
      const j=readImgJob();
      if(j&&j.token===activeImgJobToken)attachImgJob(j);
      toast('图片仍在后台生成，完成后会自动保存；可以先返回');
    }else showError('日程生图失败：\n'+errMsg+'（今天不会再次自动调用，避免浪费额度）');
  }
}
async function autoReportTick(){
  if(!CHAR||!S||autoReporting||refreshing)return;
  if(S.photoReport===false)return;
  if(imgLockedToday())return;
  if(!window.NanoScheduleBridge||!window.NanoScheduleBridge.generateDueReport)return;
  autoReporting=true;
  try{
    // 自动报备图只在共享桥接层生成：私聊卡片和日程页引用同一条 event.img
    const res=await window.NanoScheduleBridge.generateDueReport({charId:CHAR.id,charName:CHAR.name});
    if(res&&res.ok===false&&!res.background&&!imgConfigWarned){
      imgConfigWarned=true;
      showError('日程生图失败：\n'+(res.error||'未知错误')+'（今天不会再次自动调用）');
    }
    if(res&&res.ok&&!res.skipped){
      STORE=await loadStore();
      S=charDataFor(CHAR);
      if(!sheetOpen())render();
      else if(cur)detail(cur,'view',true);
    }
  }finally{autoReporting=false}
}

function toText(){
  const n=S.settings.name;let t=`【${n}的日程】\n`;
  dates().forEach((d,i)=>{
    t+=`\n${['今天','明天'][i]||''} ${dateLabel(d)}\n`;
    evsOf(d).forEach(e=>{
      let f=`${e.start}-${e.end} ${e.title}`;
      const ex=[e.place,e.who&&'与'+e.who].filter(Boolean).join('，');if(ex)f+=`（${ex}）`;
      if(e.status==='done')f+=' [已完成]';
      if(e.status==='cancelled')f+=` [已取消：${e.reason||'临时有事'}]`;
      if(e.movedFrom&&e.status!=='cancelled')f+=` [已改期，原 ${e.movedFrom}]`;
      t+=f+'\n';
    });
  });
  return t.trim();
}

const shiftT=(t,m)=>toT(Math.max(0,Math.min(1439,toMin(t)+m)));
sheet.addEventListener('click',async ev=>{
  const t=ev.target;
  if(t.closest('[data-photo]')){
    if(CHAR){
      S.photoReport=S.photoReport===false;
      save();
      openCharSheet();
    }
    return;
  }
  const cr=t.closest('.char-row');
  if(cr){
    const c=CHARS.find(x=>String(x.id)===String(cr.dataset.cid));
    if(c)selectChar(c);
    return;
  }
  const chip=t.closest('[data-v]');
  if(chip){const i=$(chip.dataset.to);if(i){i.value=chip.dataset.v}return}
  const sh=t.closest('[data-shift]');
  if(sh){const m=+sh.dataset.shift;$('#ms').value=shiftT($('#ms').value,m);$('#me').value=shiftT($('#me').value,m);return}
  const tg=t.closest('[data-tag]');
  if(tg){sheet.querySelectorAll('#f_tag .chip').forEach(c=>c.classList.toggle('on',c===tg));return}
  const sc=t.closest('[data-scope]');
  if(sc){sheet.querySelectorAll('#r_scope .chip').forEach(c=>c.classList.toggle('on',c===sc));return}
  if(t.closest('#r_keep')){$('#r_keep').classList.toggle('on');return}
  const b=t.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,e=cur&&byId(cur);
  switch(a){
    case 'close':closeSheet();break;
    case 'back':detail(cur);break;
    case 'done':setDone(e);detail(cur,'view',true);break;
    case 'restore':e.status='todo';e.reason='';logEv(e,'恢复安排');save();render();detail(cur,'view',true);break;
    case 'cancelmode':detail(cur,'cancel',true);break;
    case 'movemode':detail(cur,'move',true);break;
    case 'imgmode':detail(cur,'img',true);break;
    case 'edit':formSheet(e);break;
    case 'del':if(confirm('删除这一项安排？')){S.events=S.events.filter(x=>x.id!==cur);save();closeSheet();render();toast('已删除')}break;
    case 'docancel':{
      const r=$('#rs').value.trim()||'临时有事去不了',id=cur;
      closeSheet();setTimeout(()=>animateCancel(id,()=>{applyCancel(byId(id),r);toast('已划掉')}),300);break}
    case 'domove':{
      const s=$('#ms').value,en=$('#me').value;
      if(!s||!en||toMin(en)<=toMin(s)){toast('结束时间要晚于开始时间');break}
      const r=$('#mr').value.trim();applyMove(e,s,en,r);
      const clash=evsOf(e.date).some(o=>o.id!==e.id&&o.status!=='cancelled'&&overlap(o,e));
      detail(cur);if(clash)toast('已改期，注意和别的安排有重叠');break}
    case 'doimg':runImage(e,$('#ip').value,false);detail(cur,'view');break;
    case 'regen':runImage(e,e.img?.prompt||'',false);break;
    case 'view':{const v=$('#viewer');v.querySelector('img').src=e.img.src;v.classList.add('on');break}
    case 'saveform':{
      const title=$('#f_t').value.trim(),s=$('#f_s').value,en=$('#f_e').value;
      if(!title){toast('先写个标题');break}
      if(!s||!en||toMin(en)<=toMin(s)){toast('结束时间要晚于开始时间');break}
      const tag=sheet.querySelector('#f_tag .chip.on')?.dataset.tag||'life';
      const f={title,start:s,end:en,place:$('#f_p').value.trim(),who:$('#f_w').value.trim(),tag,note:$('#f_n').value.trim(),mood:$('#f_m').value.trim()};
      if(b.dataset.new==='1'){const n=mk({...f,date:b.dataset.date});logEv(n,'新增安排');S.events.push(n);save();closeSheet();render();flash(n.id,1400)}
      else{Object.assign(e,f);logEv(e,'编辑了安排');save();render();detail(cur)}
      break}
    case 'dorefresh':{
      const scope=sheet.querySelector('#r_scope .chip.on').dataset.scope;
      doRefresh(scope,$('#r_keep').classList.contains('on'),$('#r_note').value.trim());break}
    case 'savesettings':{
      const g=id=>$(id).value.trim(),s=S.settings;
      s.name=g('#s_name')||'char';s.persona=g('#s_persona');s.style=g('#s_style');
      s.textUrl=g('#s_turl');s.textKey=g('#s_tkey');s.textModel=g('#s_tmodel');
      s.imgUrl=g('#s_iurl');s.imgKey=g('#s_ikey');s.imgModel=g('#s_imodel');s.imgSize=g('#s_isize')||'1024x1024';
      save();closeSheet();render();toast('设置已保存');break}
    case 'copytext':copy(toText());break;
    case 'exportjson':{const j=JSON.stringify(S,(k,v)=>k[0]==='_'?undefined:v);$('#s_data').value=j;copy(j);break}
    case 'importjson':{
      try{const o=JSON.parse($('#s_data').value);if(!Array.isArray(o.events))throw 0;S={...DEF,...o,settings:{...DEF.settings,...(o.settings||{})}};save();closeSheet();render();toast('已导入')}
      catch(err){toast('数据格式不对，导入失败')}break}
    case 'clearall':if(confirm('清空所有日程？此操作无法撤销')){S.events=[];S.gen={};save();closeSheet();render()}break;
  }
});

function ensureWindow(){
  if(!S||!Array.isArray(S.events))return;
  const t=today();
  const old=S.events.filter(e=>e.date<addD(t,-7));
  if(old.length){S.events=S.events.filter(e=>!old.includes(e));save()}
}
let lastDay=today();
setInterval(()=>{
  if(!CHAR)return;
  if(today()!==lastDay){lastDay=today();ensureWindow();sel=0;render();return}
  if(!sheetOpen())render();
},30000);

window.addEventListener('message',async e=>{
  const d=e&&e.data;if(!d)return;
  if(d.type==='nanoScheduleUpdated'){
    try{
      STORE=await loadStore();
      if(CHAR&&(!d.charId||String(d.charId)===String(CHAR.id))){
        S=charDataFor(CHAR);
        ensureWindow();
        if(!sheetOpen())render();
        else if(cur)detail(cur,'view',true);
      }
    }catch(err){}
  }
  if(d.type==='nanoScheduleReport'){
    if(CHAR&&(!d.charId||String(d.charId)===String(CHAR.id))){
      try{
        STORE=await loadStore();
        S=charDataFor(CHAR);
        if(!sheetOpen())render();
      }catch(err){}
    }
  }
});

  getStore:()=>STORE,
  getChar:()=>CHAR,
  getActiveEvent:()=>evsOf(today()).find(e=>isLive(e))||null,
  cancel(id,reason){const e=byId(id);if(e){applyCancel(e,reason||'临时有事去不了')}},
  move(id,start,end,reason){const e=byId(id);if(e)applyMove(e,start,end,reason||'')},
  setDone(id){const e=byId(id);if(e&&e.status!=='done')setDone(e)},
  add(o){const n=mk(o);S.events.push(n);save();render();return n.id},
  refresh:(note)=>refreshSchedule(note||'')
};

function renderCharPlaceholder(){
  $('#who').innerHTML='<b>日程</b><span class="chev">›</span>';
  $('#tabs').innerHTML='';
  $('#dayhead').innerHTML='';
  $('#list').innerHTML='<div class="empty">先选择一个角色，再生成日程<button class="btn" data-a="pickchar">选择角色</button></div>';
  $('#dock').querySelector('button').innerHTML=I('refresh')+'<span>刷新</span>';
}
$('#list').addEventListener('click',e=>{
  if(e.target.closest('[data-a="pickchar"]'))openCharSheet();
},true);

(async function boot(){
  try{
    STORE=await loadStore();
    CHARS=pickableChars(await loadCharacters());
  }catch(e){STORE=normalizeStore(STORE);CHARS=[]}
  if(!CHARS.length){renderCharPlaceholder();toast('还没有可用的角色');return}
  const q=new URLSearchParams(location.search).get('char');
  const target=CHARS.find(c=>String(c.id)===String(q))||CHARS.find(c=>String(c.id)===String(STORE.lastCharId));
  if(target){
    selectChar(target,true);
    if(!q)setTimeout(openCharSheet,120);
  }else{renderCharPlaceholder();openCharSheet()}
  setTimeout(()=>{try{autoReportTick()}catch(e){}},5000);
  setInterval(()=>{try{autoReportTick()}catch(e){}},45000);
})();
})();
</script>
<script src="../js/nano-own-back.js"></script>
</body>
