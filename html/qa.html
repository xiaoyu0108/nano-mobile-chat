<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Q&A</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{width:0!important;height:0!important;display:none!important}
body{margin:0;background:#111;font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;color:#111}
#app{max-width:480px;height:100dvh;margin:auto;position:relative;overflow:hidden;background:#fff}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer;padding:0}

.pg{height:100%;overflow:auto;padding:calc(var(--safe-top, env(safe-area-inset-top)) + 14px) 18px 40px}
.bar{display:flex;align-items:center;justify-content:space-between;height:44px}
.bar h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.5px}
.bar .r{display:flex;gap:16px}
.hint{color:#8e8e8e;font-size:13px;margin:6px 0 18px}

.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:600;overflow:hidden;flex:none;background:#3a3a3c}
.av.s{background:#000;color:#fff;border:1px solid #ffffff26}.av img{width:100%;height:100%;object-fit:contain;background:#f2f2f2}
label{display:block;font-size:13px;color:#555;margin:16px 0 6px}

.btn{display:block;width:100%;background:#111;color:#fff;border-radius:24px;padding:13px;text-align:center;font-weight:600;margin-top:22px}
.row{display:flex;align-items:center;gap:12px}
/* viewer */
.vw{position:absolute;inset:0;background:#222 center/cover no-repeat;color:#fff;overflow:hidden}

.big{position:absolute;inset:0;display:grid;place-items:center;font-size:140px;color:#ffffff22}

.fab{position:absolute;right:14px;bottom:calc(var(--safe-bottom, env(safe-area-inset-bottom, 0px)) + 84px);width:48px;height:48px;border-radius:50%;background:#1d9bf0;color:#fff;display:grid;place-items:center;box-shadow:0 4px 14px #1d9bf066}
.xn{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;align-items:center;padding:9px 0 calc(var(--safe-bottom, env(safe-area-inset-bottom)) + 9px);border-top:1px solid #eff3f4;background:#fffe;backdrop-filter:blur(10px)}

.ms{flex:1;overflow:auto;padding:4px 10px 112px}

.mb{padding:8px 13px;border-radius:22px;font-size:15px;line-height:1.34;word-break:break-word;position:relative}

.tt{font-size:12px;color:#536471;white-space:nowrap;margin-bottom:18px}
.cdm{width:250px;border-radius:20px;overflow:hidden;background:#0f1419;color:#fff}

.o{display:block;font-weight:500;font-size:14.5px;opacity:.7}.zq{display:block;font-weight:800}
.fb{position:absolute;left:12px;right:12px;bottom:calc(var(--safe-bottom, env(safe-area-inset-bottom, 0px)) + 10px);padding:6px;display:flex;gap:6px;align-items:center;z-index:5;background:rgba(255,255,255,.72);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(255,255,255,.7);border-radius:999px;box-shadow:0 8px 28px rgba(0,0,0,.14)}
.fb .rr{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);display:grid;place-items:center;box-shadow:0 1px 6px rgba(0,0,0,.1);flex:none}

.fb .ac{height:38px;min-width:38px;padding:0 14px;border-radius:19px;background:#1d9bf0;color:#fff;font-weight:700;display:grid;place-items:center;flex:none;box-shadow:0 2px 8px #1d9bf040}
.rtg{position:absolute;left:12px;right:12px;bottom:calc(var(--safe-bottom, env(safe-area-inset-bottom, 0px)) + 68px);background:#fffe;backdrop-filter:blur(10px);border:1px solid #cfd9de;border-radius:14px;padding:6px 10px;font-size:12px;color:#536471;display:flex;justify-content:space-between;gap:8px;z-index:5}
.tp{display:flex;align-items:center;gap:4px;padding:9px 12px;min-height:30px}
.tp i{width:5px;height:5px;border-radius:50%;background:#8b98a5;display:block;animation:tpd 1.15s infinite ease-in-out}
.tp i:nth-child(2){animation-delay:.14s}.tp i:nth-child(3){animation-delay:.28s}
@keyframes tpd{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-3px);opacity:1}}
.st .b .o{color:#6b7280;opacity:1}.st .b .zq{margin-top:2px}
.an .oo{font-weight:500;font-size:14px}.an .zq2{font-weight:800}
.by{display:inline-flex;align-items:center;gap:6px;background:#0008;color:#fff;border-radius:14px;padding:4px 10px 4px 4px;font-size:12px;margin-bottom:8px}

.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.gal .t{position:relative;aspect-ratio:3/4;border-radius:10px;background:#ddd center/cover;border:2px solid transparent}
.gal .t.on{border-color:#111}
.gal .t b{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#000b;color:#fff;font-size:12px;display:grid;place-items:center}
.sh .row .in{flex:1;min-width:0}
.sm{padding:10px 14px;border-radius:12px;background:#111;color:#fff;font-size:13px;white-space:nowrap}.sm.g{background:#f0f0f0;color:#111}
*{touch-action:manipulation}
.xr{align-items:center;cursor:pointer}
.xr b{font-size:16px}.xr .pv.un{color:#0f1419;font-weight:600}

.tt{font-size:11.5px;color:#8b98a5;white-space:nowrap;margin-bottom:6px;display:flex;align-items:center;gap:4px}
.rw.me{gap:6px}
.sep{text-align:center;color:#8b98a5;font-size:12px;margin:16px 0 8px}

.psc{flex:1;overflow:auto;padding-bottom:40px}.cv{height:156px;background:#d6d9de;background-size:cover;background-position:center;position:relative;cursor:pointer}

 const j=pj(raw);let arr=arrOf(j,'msgs');
 arr=arr.filter(x=>x&&String(sOf(x.t||x.text||x.content)).trim()).slice(0,2).map(x=>({t:String(sOf(x.t||x.text||x.content)).trim(),z:String(sOf(x.z)).trim()}));

async function genNewStrangers(n,used){

 const raw=await ai([{role:'system',content:SYS},{role:'user',content:`【新网友】为国际化的 Q&A 平台生成 ${n} 个全新的陌生网友，他们准备给${S.me.un}发私信。每人都有真实姓名、国家/语言、一句话身份性格和一条自然私信；至少 1 位外国网友。不要和这些已有名字重复：${names.join('、')||'（无）'}。外语发言在 z 字段给中文翻译。${peopleFx()}输出：{"items":[{"name":"","lang":"中文或English/한국어/日本語","setting":"","t":"","z":""}]}`}],{}, {anonymous:true,maxTokens:2800});

async function refreshSlots(ids){
 if(window._dmBusy){toast('正在刷新中…');return}
 window._dmBusy=1;showBusy('正在刷新私信…');
 const errors=[];let okCount=0;
 try{
  const picked=(ids||[]).map(id=>S.chars.find(c=>c.id==id)).filter(Boolean).slice(0,5),keys=[],used={};
  S.chars.forEach(c=>used[c.name]=1);Object.values(S.chats).forEach(c=>{if(c&&c.name)used[c.name]=1});
  for(const ch of picked){
   const key=ch.id+'|#c';mkChat(key,ch);const c=S.chats[key];keys.push(key);used[ch.name]=1;
   try{
    const arr=await genCharIncoming(ch);
    arr.forEach((x,i)=>c.msgs.push({r:'th',t:x.t,z:x.z||'',ts:Date.now()+i*1000}));
    c.unread=1;okCount++;
   }catch(e){errors.push(ch.name+'：'+(e.message||e))}
  }
  let need=5-keys.length;
  const existing=Object.values(S.chats).filter(c=>c.kind=='s'&&!keys.includes(c.key));
  // 只有「真正聊过」的陌生人才复用，最多复用 2 个；其余名额优先刷新成全新陌生人
  const chatted=existing.filter(c=>(c.msgs||[]).some(m=>m.r=='me')).sort((a,b)=>lastTs(b)-lastTs(a));
  for(const c of chatted.slice(0,Math.min(2,need))){
   keys.push(c.key);used[c.name]=1;need--;
   try{
    const arr=await genStrangerIncoming(c);
    arr.forEach((x,i)=>c.msgs.push({r:'th',t:x.t,z:x.z||'',ts:Date.now()+i*1000}));
    c.unread=1;okCount++;
   }catch(e){errors.push(c.name+'：'+(e.message||e))}
  }
  if(need>0){
   try{
    const list=await genNewStrangers(need,used);
    list.forEach((x,i)=>{
     let name=x.name;if(used[name])name=name+'_'+Math.floor(Math.random()*90+10);
     const key=(S.sel||'u')+'|'+name;
     S.chats[key]={key,cid:S.sel||'',name,kind:'s',hid:false,lang:x.lang||'中文',setting:x.setting||'',msgs:[{r:'th',t:x.t,z:x.z||'',ts:Date.now()+i*1000}],joined:rj(),unread:1};
     keys.push(key);used[name]=1;
    });
    okCount+=list.length;
   }catch(e){
    errors.push('陌生人：'+(e.message||e));
    // 新网友生成失败才用没聊过的旧陌生人兜底，保证列表不会空掉
    for(const c of existing){
     if(need<=0)break;
     if(keys.includes(c.key))continue;
     keys.push(c.key);used[c.name]=1;need--;
     try{
      const arr=await genStrangerIncoming(c);
      arr.forEach((x,i)=>c.msgs.push({r:'th',t:x.t,z:x.z||'',ts:Date.now()+i*1000}));
      c.unread=1;okCount++;
     }catch(e2){errors.push(c.name+'：'+(e2.message||e2))}
    }
   }
  }
  S.dmSlots=keys.slice(0,5);S.dmRefreshAt=Date.now();save();
 }catch(e){errors.push(e.message||String(e))}
 window._dmBusy=0;hideBusy();
 if(location.hash==''||location.hash=='#inbox')R.inbox();
 if(errors.length)showError(okCount?'刷新未完全成功':'刷新失败',errors.slice(0,4).join('\n')+(errors.length>4?'\n…':''));
 else toast('私信已刷新 · '+S.dmSlots.length+' 个');
}

 app.innerHTML=`<div class="pg"><div class="bar"><button onclick="ve=null;history.back()">${ic('back')}</button><h1>编辑马甲</h1><span style="width:22px"></span></div><p class="hint">默认同步当前 Mask 的昵称与头像；在这里改只影响 Q&A 里的匿名身份</p>
 <div class="row" style="margin-top:14px">${avx(ve.ua,ve.un||'?',72)}<input type="file" accept="image/*" onchange="vkeep();resize(this,u=>{ve.ua=u;R.vest()},400)"></div>
 <label>名字</label><input class="in" id="vn" value="${esc(ve.un)}"><label>@ID（留空则自动生成）</label><input class="in" id="vh" value="${esc(ve.hd)}" placeholder="${esc(hd(ve.un))}"><label>简介</label><textarea class="in" id="vb" placeholder="写点什么吧">${esc(ve.bio)}</textarea>
 <button class="btn" onclick="saveVest()">保存（只改 Q&A 马甲）</button><button class="btn" style="background:#f2f2f2;color:#111" onclick="saveVest(1)">保存并同步到 Mask</button><button class="btn" style="background:#f2f2f2;color:#111" onclick="vkeep();ve.ua='';R.vest()">移除头像</button></div>`};
function saveVest(syncMask){const n=$('vn').value.trim();if(!n)return toast('请填写名字');const ua=ve.ua;S.me=Object.assign({},S.me,{un:n,ua:ua,hd:$('vh').value.trim().replace(/^@/,''),bio:$('vb').value.trim(),ed:1});if(syncMask&&window.QABridge&&QABridge.syncMaskIdentity){try{QABridge.syncMaskIdentity(n,ua).catch(()=>{})}catch(e){}}ve=null;save();toast(syncMask?'已保存并同步到 Mask':'已保存');history.back()}
async function refreshChars(){
 if(!window.QABridge||!QABridge.loadChars)return;
 try{
  let u=null;
  try{u=await QABridge.currentUser()}catch(e){}
  if(u&&u.id&&String(u.id)!==String(USER_ID)){
   try{await IDB.set('S:'+USER_ID,S)}catch(e){}
   location.reload();
   return;
  }
  const list=await QABridge.loadChars();
  if(Array.isArray(list)&&(list.length||!S.chars||!S.chars.length))S.chars=list;
  else if(!Array.isArray(S.chars))S.chars=[];
  if(u){if(!S.me.ed){S.me.un=u.name||S.me.un;S.me.ua=u.avatar||S.me.ua;S.me.bio=u.bio||S.me.bio||'';}S.me.wechat=u.wechat||S.me.wechat||'';S.me.maskId=u.id||S.me.maskId;}
  if(!S.chars.some(c=>c.id==S.sel))S.sel=S.chars[0]?S.chars[0].id:'';
  ensureSlots();save();
 }catch(e){}
}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&ready)refreshChars().then(()=>{if(ready&&(location.hash==''||location.hash=='#home'||location.hash=='#pick'||location.hash=='#inbox'))route()})});
/* ---------- 启动 ---------- */
(async()=>{
 await IDB.open();
 let user={id:'default',name:'我',avatar:'',wechat:'',setting:''},chars=[],charsOk=false;
 try{
  if(window.QABridge){
   try{user=await QABridge.currentUser()}catch(e){}
   USER_ID=user.id||'default';
   chars=await QABridge.loadChars();
   charsOk=true;
  }
 }catch(e){console.warn('[Q&A] bridge boot failed',e)}
 let d=await IDB.get('S:'+USER_ID);
 if(!d){try{d=JSON.parse(localStorage['qb4:'+USER_ID]||'null')}catch(e){}}
 S=Object.assign({},D,d||{});
 S.meta=Object.assign({},S.meta||{},{owner:USER_ID});
 if(!S.chats||typeof S.chats!='object')S.chats={};
 if(!S.bgs||typeof S.bgs!='object')S.bgs={};
 if(!Array.isArray(S.hist))S.hist=[];
 if(!S.prof||typeof S.prof!='object')S.prof={};
 if(!S.altNames||typeof S.altNames!='object')S.altNames={};
 if(!S.me||typeof S.me!='object')S.me={};
 if(!S.me.ed){
  S.me=Object.assign({},S.me,{un:user.name||'我',ua:user.avatar||'',wechat:user.wechat||'',bio:user.bio||S.me.bio||'',maskId:USER_ID});
 }else{
  S.me.maskId=USER_ID;S.me.wechat=user.wechat||S.me.wechat||'';
  if(!S.me.ua&&user.avatar)S.me.ua=user.avatar;
  if(!S.me.un||S.me.un=='我')S.me.un=user.name||'我';
 }
 if(!S.me.joined)S.me.joined=rj();
 // 一次性清掉旧版内置/测试私信，保留提问箱历史、主页和美化设置
 if(S.meta.dmReset!==2){S.chats={};S.dmSlots=[];S.meta.dmReset=2}
 if(Array.isArray(window.QB_CHARS)&&window.QB_CHARS.length){chars=window.QB_CHARS.map(c=>({id:String(c.id),name:c.name,avatar:c.avatar||'',lang:c.lang||'中文',setting:c.setting||''}));charsOk=true}
 EXT=!!(window.QABridge||chars.length);
 if(window.QABridge||chars.length){
  // 读取失败时不要清空本地缓存，否则手机上会误判成「没有 char」
  if(charsOk||chars.length||!Array.isArray(S.chars))S.chars=chars;
  if(!S.chars.some(c=>c.id==S.sel))S.sel=S.chars[0]?S.chars[0].id:'';
 }else{
  if(!Array.isArray(S.chars))S.chars=[];
 }
 if(!S.sel&&S.chars[0])S.sel=S.chars[0].id;
 ensureSlots();
 ready=1;save();route();
 if(!charsOk&&window.QABridge)setTimeout(()=>refreshChars().then(()=>{if(ready&&location.hash!='#view')route()}),1200);
})();
</script></body></html>
