<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>旅途</title>
<style>
:root{
  --ink:#1b1b1d;
  --ink2:#6d6d72;
  --ink3:#a6a6ab;
  --line:#f0f0f1;
  --line2:#e4e4e7;
  --foil:linear-gradient(100deg,#cfe0ff 0%,#e6d8ff 30%,#ffd9ea 55%,#fff0c9 78%,#d4f3e6 100%);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue","Noto Sans SC",sans-serif;
  --num:"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --stub:92px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:#fff;color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{display:flex;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
svg{display:block}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

.app{width:100%;max-width:480px;min-height:100vh;min-height:100dvh;background:#fff;padding-bottom:132px}

/* ---------- top ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:calc(env(safe-area-inset-top) + 8px) 12px 6px}
.top h1{font-size:15px;font-weight:600;text-align:center;letter-spacing:1.5px}
.ib{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.ib:active{background:#f4f4f5}
.ib .ico{width:21px;height:21px}

/* ---------- hero ---------- */
.hero{padding:14px 22px 0}
.hero h2{font-size:27px;font-weight:600;letter-spacing:-.4px;line-height:1.2}
.hero .sub{font-size:12.5px;color:var(--ink3);margin-top:3px}
.spend{display:flex;justify-content:space-between;align-items:flex-end;margin-top:22px}
.spend small{display:block;font-size:11.5px;color:var(--ink3);margin-bottom:6px}
.amt{font-family:var(--num);font-size:42px;font-weight:300;letter-spacing:-1.5px;line-height:1}
.amt i{font-style:normal;font-size:18px;font-weight:400;letter-spacing:0;margin-right:3px;position:relative;top:-14px}
.figs{display:flex;gap:20px;text-align:right}
.figs b{display:block;font-family:var(--num);font-size:20px;font-weight:400;line-height:1.1}
.figs small{margin:0}

/* ---------- footprint trace ---------- */
.lab{font-size:12px;color:var(--ink3);margin:26px 22px 10px}
.trace{display:flex;align-items:flex-start;overflow-x:auto;padding:2px 22px 6px;scrollbar-width:none}
.trace::-webkit-scrollbar{display:none}
.node{flex:none;display:flex;flex-direction:column;align-items:center;gap:7px;min-width:46px;padding:0 2px}
.node .dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink);background:#fff;transition:.25s}
.node em{font-style:normal;font-size:11.5px;color:var(--ink2);white-space:nowrap}
.node.on .dot{background:var(--ink);box-shadow:0 0 0 4px rgba(27,27,29,.09)}
.node.on em{color:var(--ink);font-weight:600}
.link{flex:none;width:26px;margin-top:6.5px;border-top:1.5px dashed #d4d4d8}

/* ---------- type filter ---------- */
.tfs{display:flex;gap:14px;overflow-x:auto;padding:2px 22px 8px;scrollbar-width:none}
.tfs::-webkit-scrollbar{display:none}
.tf{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px}
.tf em{font-style:normal;font-size:10.5px;color:var(--ink3)}
.tc{width:46px;height:46px;border-radius:50%;background:var(--tc);color:var(--td);display:flex;align-items:center;justify-content:center;transition:.2s}
.tc.line{border:1px solid var(--line2)}
.tf.on .tc{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--td)}
.tf.on em{color:var(--ink);font-weight:600}
.tc .ico{width:20px;height:20px}
.tc.s{width:22px;height:22px}
.tc.s .ico{width:12px;height:12px}

/* ---------- list ---------- */
.month{margin:24px 22px 12px;font-size:12px;color:var(--ink3);letter-spacing:.5px}
.list{padding:0 18px;display:flex;flex-direction:column;gap:14px}
.enter .tkw,.enter .pl{animation:rise .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*60ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}}

/* ---------- ticket ---------- */
.tkw{filter:drop-shadow(0 0 .6px rgba(0,0,0,.3)) drop-shadow(0 8px 16px rgba(20,20,40,.06))}
.tk{display:flex;position:relative;overflow:hidden;background:#fff;border-radius:18px;transition:transform .15s;
  -webkit-mask:radial-gradient(circle 8px at calc(100% - var(--stub)) 0,#0000 97%,#000) top/100% 51% no-repeat,radial-gradient(circle 8px at calc(100% - var(--stub)) 100%,#0000 97%,#000) bottom/100% 51% no-repeat;
  mask:radial-gradient(circle 8px at calc(100% - var(--stub)) 0,#0000 97%,#000) top/100% 51% no-repeat,radial-gradient(circle 8px at calc(100% - var(--stub)) 100%,#0000 97%,#000) bottom/100% 51% no-repeat}
.tk::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--foil)}
.list .tkw:active .tk{transform:scale(.982)}
.tk-main{flex:1;min-width:0;padding:16px 14px 13px 18px}
.tk-top{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--ink3)}
.tk-type{display:flex;align-items:center;gap:7px;color:var(--ink);font-size:12.5px;font-weight:500}
.tk-date{display:flex;align-items:center;gap:5px}
.tk-date .ico{width:12px;height:12px;color:var(--td)}
.tk-route{display:flex;align-items:center;gap:8px;margin:14px 0 12px}
.tk-route .c{font-size:20px;font-weight:500;letter-spacing:.3px;line-height:1.15;min-width:0;max-width:42%}
.tk-route .c .cn{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.tk-route .c small{display:block;font-size:11px;font-weight:400;color:var(--ink3);letter-spacing:0;margin-top:3px;white-space:nowrap}
.tk-route .c.r{text-align:right}
.mid{flex:1;min-width:18px;display:flex;align-items:center;gap:4px;color:var(--td);margin-bottom:14px}
.mid::before,.mid::after{content:"";flex:1;height:0;border-top:1.5px dotted #cfcfd4}
.mid .ico{width:15px;height:15px}
.tk-note{font-size:12px;color:var(--ink2);line-height:1.55;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;border-top:1px dashed var(--line2);padding-top:9px}
.tk-note.empty{color:var(--ink3)}
.tk-stub{width:var(--stub);flex:none;border-left:1.5px dashed #dcdce0;padding:16px 8px 13px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:8px;text-align:center}
.tk-stub small{display:block;font-size:10px;color:var(--ink3);line-height:1.3}
.pr b{display:block;font-family:var(--num);font-size:19px;font-weight:500;letter-spacing:-.3px;line-height:1.15}
.pr b i{font-style:normal;font-size:11px;font-weight:400;margin-right:1px;position:relative;top:-4px}
.no b{display:block;font-size:11.5px;font-weight:500;word-break:break-all;line-height:1.3}
.bar{width:100%;height:24px;background:repeating-linear-gradient(90deg,#222 0 2px,transparent 2px 4px,#222 4px 5px,transparent 5px 8px,#222 8px 11px,transparent 11px 13px,#222 13px 14px,transparent 14px 17px);opacity:.8}

/* ---------- together card ---------- */
.pl{display:flex;gap:18px;background:#fff;border-radius:20px;padding:16px 16px 16px 14px;align-items:center;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 8px 18px rgba(20,20,40,.05);transition:transform .15s}
.pl:active{transform:scale(.985)}
.thumb{width:86px;flex:none;background:#fff;padding:5px 5px 18px;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 6px 14px rgba(20,20,40,.12);transform:rotate(-3.5deg)}
.pl:nth-child(even) .thumb{transform:rotate(3deg)}
.thumb .im{aspect-ratio:1;background:#f3f3f4;display:flex;align-items:center;justify-content:center;color:#c6c6ca;overflow:hidden}
.thumb .im img,.pol .im img{width:100%;height:100%;object-fit:cover;display:block}
.pl .txt{flex:1;min-width:0}
.pl-top{display:flex;align-items:center;gap:6px}
.pl-top h3{font-size:17px;font-weight:600;letter-spacing:-.2px}
.pl-top .ico{width:13px;height:13px;color:#4a74c9}
.pl .d{font-size:11.5px;color:var(--ink3)}
.pl p{font-size:12.5px;color:var(--ink2);margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pl p.empty{color:var(--ink3)}
.pl-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px}
.price{font-family:var(--num);font-size:16px;font-weight:500}
.price i{font-style:normal;font-size:11px;font-weight:400;margin-right:1px}
.tags{display:flex;gap:5px}
.tags em{font-style:normal;font-size:10.5px;padding:2px 8px;border-radius:99px;background:#eef3ff;color:#4a74c9}
.tags em.p{background:#ffeaf3;color:#c75a8a}

.empty-box{text-align:center;color:var(--ink3);padding:56px 0;font-size:13px}
.empty-box .ico{width:34px;height:34px;margin:0 auto 10px;stroke-width:1.2}

/* ---------- 旅途：角色选择 / 快捷入口 ---------- */
.picker{padding:6px 22px 20px}
.picker .mask{display:flex;align-items:center;gap:8px;margin:8px 0 16px;color:var(--ink3);font-size:12px}
.picker .mask b{color:var(--ink);font-weight:600}
.picker .mask .pill{background:#f3f3f4;border-radius:99px;padding:3px 10px;color:var(--ink2)}
.picker h2{font-size:26px;font-weight:600;letter-spacing:-.4px;line-height:1.25}
.picker .sub{font-size:12.5px;color:var(--ink3);margin-top:4px;margin-bottom:18px}
.picker-list{display:flex;flex-direction:column;gap:10px}
.char-pick{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:#fff;border:1px solid var(--line2);border-radius:18px;padding:12px 14px;transition:transform .15s}
.char-pick:active{transform:scale(.985)}
.char-pick .avp{width:46px;height:46px;border-radius:50%;background:#f3f3f4;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;font-size:17px;font-weight:600;color:var(--ink2)}
.char-pick .avp img{width:100%;height:100%;object-fit:cover;display:block}
.char-pick .ci{flex:1;min-width:0}
.char-pick .ci b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.char-pick .ci small{display:block;font-size:11.5px;color:var(--ink3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.char-pick .arrow{color:var(--ink3)}
.refresh{display:inline-flex;align-items:center;gap:6px;margin-top:14px;height:34px;padding:0 14px;border-radius:99px;border:1px solid var(--line2);font-size:12px;color:var(--ink2);background:#fff}
.refresh .ico{width:14px;height:14px}
.refresh:active{background:#f7f7f8}
.refresh.spin .ico{animation:spin .8s linear infinite}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:0 0 16px}
.quick button{display:flex;align-items:center;justify-content:center;gap:6px;height:46px;border-radius:14px;border:1px solid var(--line2);font-size:12.5px;color:var(--ink2);background:#fff}
.quick button .ico{width:16px;height:16px}
.quick button:active{background:#f7f7f8}
.invite-box{border:1px solid var(--line2);border-radius:18px;padding:14px 14px 4px;margin-bottom:12px}
.invite-box .rowline{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.invite-box .rowline:first-child{border-top:0}
.invite-box label{font-size:12px;color:var(--ink3);flex:none;width:56px}
.invite-box .inp{border:0;padding:4px 0;border-radius:0;flex:1;min-width:0;width:auto;background:transparent}
.share-char{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.share-char::-webkit-scrollbar{display:none}
.share-char button{flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:58px;font-size:10.5px;color:var(--ink3);background:none;border:0;padding:0}
.share-char button .sc-av{width:40px;height:40px;border-radius:50%;background:#f3f3f4;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:15px;font-weight:600;color:var(--ink2);border:2px solid transparent}
.share-char button .sc-av img{width:100%;height:100%;object-fit:cover;display:block}
.share-char button.on{color:var(--ink);font-weight:600}
.share-char button.on .sc-av{border-color:var(--ink)}
.sc-row{display:flex;align-items:center;gap:10px;margin:4px 0 10px}
.sc-row b{font-size:13px;font-weight:500}
.sc-row small{font-size:11px;color:var(--ink3)}

/* ---------- floating dock ---------- */
.dockwrap{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 18px);display:flex;justify-content:center;align-items:center;gap:10px;z-index:40;pointer-events:none}
.dock,.addbtn{pointer-events:auto}
.dock{display:flex;gap:2px;padding:6px;border-radius:99px;background:rgba(255,255,255,.82);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);
  box-shadow:0 0 0 1px rgba(0,0,0,.06),0 12px 32px rgba(20,20,40,.14)}
.dk{display:flex;align-items:center;height:44px;padding:0 13px;border-radius:99px;color:var(--ink3);font-size:13px;font-weight:500;transition:background .3s,color .3s,padding .3s}
.dk span{max-width:0;opacity:0;white-space:nowrap;overflow:hidden;transition:max-width .3s,opacity .3s,margin .3s}
.dk .ico{width:19px;height:19px}
.dk.on{background:var(--ink);color:#fff;padding:0 18px}
.dk.on span{max-width:64px;opacity:1;margin-left:7px}
.addbtn{width:56px;height:56px;border-radius:50%;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 1px rgba(0,0,0,.06),0 12px 32px rgba(20,20,40,.14);transition:transform .2s}
.addbtn:active{transform:scale(.92)}
.addbtn .ico{width:22px;height:22px;stroke-width:1.7}

/* ---------- sheet ---------- */
.ov{position:fixed;inset:0;background:rgba(20,20,30,.34);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s;display:flex;justify-content:center;align-items:flex-end}
.ov.show{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:480px;max-height:90vh;max-height:90dvh;overflow-y:auto;background:#fff;border-radius:26px 26px 0 0;padding:8px 20px calc(env(safe-area-inset-bottom) + 28px);transform:translateY(100%);transition:transform .34s cubic-bezier(.2,.9,.3,1)}
.ov.show .sheet{transform:none}
.grab{width:38px;height:4px;border-radius:4px;background:#dedee2;margin:4px auto 14px}
.sh-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sh-head h3{font-size:15px;font-weight:600;letter-spacing:.5px}
.sh-title{font-size:16px;font-weight:600;margin-bottom:14px}
.acts{display:flex;gap:8px}
.act{width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;transition:.2s}
.act.on{background:var(--ink);border-color:var(--ink);color:#fff}
.act.done{color:#2f9a82;border-color:#bfe6da}
.act.spin .ico{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* 隐藏滚动条（右侧下滑与横向选择栏） */
html,body,#view,.trace,.tfs,.share-char,.sheet{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar,#view::-webkit-scrollbar,.trace::-webkit-scrollbar,.tfs::-webkit-scrollbar,.share-char::-webkit-scrollbar,.sheet::-webkit-scrollbar{display:none;width:0;height:0}

.bigtk .tk::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(190,210,255,.38) 44%,rgba(255,200,225,.38) 56%,transparent 70%);transform:translateX(-120%);animation:sweep 1.5s .35s ease forwards;pointer-events:none}
@keyframes sweep{to{transform:translateX(120%)}}

.meta{display:flex;margin-top:16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.meta div{flex:1;padding:11px 0;text-align:center}
.meta div+div{border-left:1px solid var(--line)}
.meta small{display:block;font-size:10.5px;color:var(--ink3)}
.meta b{font-size:13.5px;font-weight:500}

.us-title h2{font-size:26px;font-weight:600;letter-spacing:-.4px;line-height:1.2}
.us-title .d{font-size:12px;color:var(--ink3);margin-top:2px}
.us-title .cost{margin-top:14px}
.us-title .cost small{display:block;font-size:11.5px;color:var(--ink3)}
.us-title .cost b{font-family:var(--num);font-size:30px;font-weight:300;letter-spacing:-1px}
.us-title .cost b i{font-style:normal;font-size:14px;font-weight:400;margin-right:2px;position:relative;top:-9px}

.sec{margin-top:24px}
.sec h4{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:10px}
.sec h4 .ico{width:15px;height:15px}
.sec h4 em{font-style:normal;font-weight:400;color:var(--ink3);font-size:11.5px;margin-left:auto}
.read{border:1px solid var(--line2);border-radius:16px;padding:14px 16px;font-size:13.5px;line-height:1.85;color:#2c2c2e;white-space:pre-wrap;min-height:52px}
.read.empty{color:var(--ink3);border-style:dashed}
textarea.ta,.inp{width:100%;border:1px solid var(--line2);border-radius:14px;padding:12px 14px;font-size:14px;outline:none;background:#fff;resize:none;line-height:1.7;transition:border-color .2s}
textarea.ta{min-height:112px}
textarea.ta:focus,.inp:focus{border-color:var(--ink)}
.btn{width:100%;margin-top:12px;padding:13px;border-radius:99px;background:var(--ink);color:#fff;font-size:14px;font-weight:600;letter-spacing:.5px}
.btn:active{opacity:.85}
.btn.line{background:#fff;color:var(--ink);border:1px solid var(--line2)}

/* skeleton */
.sk{background:linear-gradient(90deg,#f1f1f3 25%,#fafafb 50%,#f1f1f3 75%);background-size:200% 100%;animation:shine 1.2s linear infinite;border-radius:8px}
@keyframes shine{to{background-position:-200% 0}}
.read .sk{height:12px;margin:8px 0}
.read .sk.l2{width:86%}.read .sk.l3{width:58%}

/* panel */
.panel{margin-top:16px;border:1px solid var(--line2);border-radius:20px;padding:16px 16px 14px;animation:pop .28s cubic-bezier(.2,.9,.3,1)}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}}
.panel h5{font-size:14px;font-weight:600}
.panel .hint{font-size:11.5px;color:var(--ink3);margin:2px 0 8px}
.opt{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.opt .oi{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.opt .ot{flex:1;min-width:0}
.opt .ot b{display:block;font-size:13.5px;font-weight:500}
.opt .ot small{font-size:11.5px;color:var(--ink3)}
.sw{flex:none;width:46px;height:28px;border-radius:99px;background:#e4e4e7;position:relative;transition:background .25s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s}
.sw.on{background:var(--ink)}
.sw.on::after{transform:translateX(18px)}
.sw.lock{opacity:.4;pointer-events:none}

/* polaroid */
.pol-block{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;padding:8px 0 4px;box-sizing:border-box}
.pol-wrap{display:flex;justify-content:center;width:100%;padding:0;box-sizing:border-box}
.pol{width:min(216px,100%);max-width:100%;box-sizing:border-box;background:#fff;padding:10px 10px 42px;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 10px 26px rgba(20,20,40,.16);transform:rotate(-1.8deg);position:relative}
.pol .im{width:100%;aspect-ratio:1;background:#f3f3f4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#bcbcc1;font-size:12px;overflow:hidden;border-radius:2px}
.pol .im img{max-width:100%;max-height:100%}
.pol .im .ico{width:30px;height:30px;stroke-width:1.2}
.pol .cap{position:absolute;left:10px;right:10px;bottom:13px;text-align:center;font-size:12px;color:var(--ink2);letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pol-gen{display:inline-flex;align-items:center;justify-content:center;gap:6px;width:min(216px,100%);height:38px;border-radius:999px;border:1px solid var(--line2);background:#fff;color:var(--ink2);font-size:12px;flex:none}
.pol-gen .ico{width:15px;height:15px}
.pol-gen:active{background:#f7f7f8}

.who{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;margin-bottom:7px}
.av{width:24px;height:24px;border-radius:50%;background:#f1f1f3;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.av .ico{width:14px;height:14px}
.note-gap{height:18px}

.leg{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.leg:first-of-type{border-top:0}
.leg .ln{flex:1;min-width:0;font-size:13.5px;font-weight:500}
.leg .ln small{display:block;font-size:11px;color:var(--ink3);font-weight:400}
.leg .lp{font-family:var(--num);font-size:14px}

/* add form */
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
.tp{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 0 10px;border:1px solid var(--line2);border-radius:16px;font-size:12px;color:var(--ink2);transition:.2s}
.tp.on{border-color:var(--ink);color:var(--ink)}
.f2{display:flex;gap:10px}
.f2>*{flex:1;min-width:0}
.fl{font-size:11.5px;color:var(--ink3);margin:14px 0 6px}

/* 完整旅程回顾 */
.journey{display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow:auto;padding:2px 2px 4px}
.jr{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.65}
.jr .jr-who{flex:none;width:54px;text-align:right;font-size:11.5px;color:var(--ink3);padding-top:2px}
.jr .jr-bubble{flex:1;min-width:0;padding:9px 12px;border-radius:14px;background:#f6f6f7;color:var(--ink);white-space:pre-wrap;word-break:break-word}
.jr.char .jr-bubble{background:#eef4ff}
.jr.me .jr-bubble{background:#fdf0f4}
.jr.narr .jr-bubble{background:transparent;padding:2px 0;color:var(--ink3);font-style:italic;text-align:center}
.jr.photo .jr-bubble{padding:6px;background:#fff;border:1px solid var(--line2)}
.jr.photo img{width:100%;max-height:240px;object-fit:cover;border-radius:10px;display:block}
.jr.photo .jr-cap{font-size:11.5px;color:var(--ink3);margin-top:6px;text-align:center}

.toast{position:fixed;left:50%;bottom:112px;transform:translate(-50%,10px);background:rgba(27,27,29,.92);color:#fff;font-size:12.5px;padding:9px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:99;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
/* ================= 配置 / 对接口子 ================= */
const TravelAPI = window.NanoTravelAPI || window.TravelAPI || {};
const TravelStore = window.NanoTravelStore || {};
let CHAR_NAME = "TA";
let ME_NAME   = "我";
const DEMO    = false;

/* 当前 user 面具 / 角色 / 路由参数 */
const QS = new URLSearchParams(location.search || '');
let MASK = { id: '', name: '我', setting: '' };
let CHAR = null;
let CHARS = [];
let PENDING_TRIP = String(QS.get('trip') || '');
let PENDING_INVITE = QS.get('invite') === '1';

/* 点「生成」时调用。
   req = { kind:'trip'|'us', record, thought:boolean, polaroid:boolean, fresh?:boolean }
   返回 { thought?:'心得文字', polaroid?:'图片url' }  */
window.onGenerate = async function(req){ return travelGenerate(req); };

/* 点「分享」时调用。req = { kind, record, message, charId } */
window.onShare = async function(req){ return travelShare(req); };

/* 外部生成好拍立得后可直接调用：setPolaroid(记录id, 图片url, 'trip'|'us') */
window.setPolaroid = function(id, url, kind){
  const r = (kind==='us'?together:trips).find(x=>x.id===id); if(!r) return;
  r.polaroid = url; render();
  if(CUR && CUR.id===id && CUR.kind===kind) renderBoxes();
  savePolaroid(id, url, kind);
};

/* ================= 数据（示例，均为占位） ================= */
const TYPES = {
  plane:{n:'飞机',   t:'登机牌',  a:'航班', b:'座位', icon:'i-plane',bg:'#e4eeff',fg:'#4a74c9'},
  train:{n:'火车',   t:'火车票',  a:'车次', b:'座位', icon:'i-train',bg:'#efe8ff',fg:'#7a5ccc'},
  hsr:  {n:'高铁',   t:'高铁票',  a:'车次', b:'座位', icon:'i-hsr',  bg:'#dff4ee',fg:'#2f9a82'},
  taxi: {n:'出租车', t:'行程单',  a:'车牌', b:'里程', icon:'i-taxi', bg:'#fff3d1',fg:'#b88a1c'},
  bike: {n:'单车',   t:'骑行记录',a:'车号', b:'时长', icon:'i-bike', bg:'#e6f5da',fg:'#5f9a32'},
  bus:  {n:'大巴',   t:'客票',    a:'班次', b:'座位', icon:'i-bus',  bg:'#ffe5e5',fg:'#c75d5d'}
};
const PH = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="#f1f1f2"/><circle cx="140" cy="62" r="20" fill="#fff"/><path d="M0 160l50-60 38 42 36-30 76 58v30H0z" fill="#dcdcdf"/><path d="M0 178l60-36 48 24 92-40v74H0z" fill="#c8c8cc"/></svg>');

let uid = 100;
const trips = [];
const together = [];

/* ================= 工具 ================= */
const S = {view:'pick', tab:'char', type:'all', dest:'all', enter:true, panel:null, gen:{thought:true,polaroid:true}, busy:null, shareChar:''};
let CUR = null;
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic = (id,cls='') => `<svg class="ico ${cls}"><use href="#${id}"/></svg>`;
const fmtD = d => d.replace(/-/g,'.');
const fmtM = n => Number(n||0).toLocaleString('zh-CN',{maximumFractionDigits:2});
const fmtP = n => Number(n) ? fmtM(n) : '--';
const wait = ms => new Promise(r=>setTimeout(r,ms));
const legsOf = p => (p.legs||[]).map(id=>trips.find(t=>t.id===id)).filter(Boolean);
const costOf = p => (p.cost!=null && p.cost!=='') ? Number(p.cost) : legsOf(p).reduce((s,t)=>s+(Number(t.price)||0),0);
const curRec = () => (CUR.kind==='us'?together:trips).find(x=>x.id===CUR.id);
const uniq = a => [...new Set(a)];

/* ================= 页面渲染 ================= */
function render(){
  const dock = document.querySelector('.dockwrap');
  if(S.view==='pick'){
    if(dock) dock.style.display = 'none';
    const v = $('#view');
    v.className = 'enter';
    v.innerHTML = viewPick();
    S.enter = false;
    return;
  }
  if(dock) dock.style.display = '';
  $('#dkChar').textContent = CHAR_NAME + '的';
  document.querySelectorAll('#dock .dk').forEach(b=>b.classList.toggle('on', b.dataset.tab===S.tab));
  const v = $('#view');
  v.className = S.enter ? 'enter' : '';
  v.innerHTML = S.tab==='us' ? viewUs() : viewTrips();
  S.enter = false;
}

function viewPick(){
  const mask = MASK || { name:'我', id:'' };
  const rows = CHARS.length ? CHARS.map(c=>{
    const av = c.avatar ? `<span class="avp"><img src="${esc(c.avatar)}" alt=""></span>` : `<span class="avp">${esc(String(c.name||'C').charAt(0))}</span>`;
    const sub = String(c.setting || c.desc || c.persona || '还没有角色设定').replace(/\s+/g,' ').slice(0,44);
    return `<button class="char-pick" data-pick="${esc(String(c.id))}">${av}
      <span class="ci"><b>${esc(c.name)}</b><small>${esc(sub)}</small></span>
      <span class="arrow">›</span></button>`;
  }).join('') : `<div class="empty-box">${ic('i-user')}这个面具下还没有可用的角色<br>先在私聊里创建或绑定角色吧<br><button class="refresh" id="reloadChars" style="margin:14px auto 0">重新读取角色</button></div>`;
  return `<section class="picker">
    <div class="mask">${ic('i-user')}<span>当前面具</span><b>${esc(mask.name||'我')}</b><span class="pill">只看这个面具下的角色</span></div>
    <h2>你想和谁<br>一起看旅途？</h2>
    <p class="sub">选一个角色，进入 TA 的出行记录、你的记录，和你们一起走过的地方。</p>
    <div class="picker-list">${rows}</div>
  </section>`;
}

function hero(o){
  return `<section class="hero"><h2>${o.title}</h2><p class="sub">${o.sub}</p>
    ${o.action?`<div>${o.action}</div>`:''}
    <div class="spend">
      <div><small>累计花费</small><div class="amt"><i>¥</i>${fmtM(o.amt)}</div></div>
      <div class="figs">${o.figs.map(f=>`<div><b>${f[0]}</b><small>${f[1]}</small></div>`).join('')}</div>
    </div></section>`;
}

function traceHtml(names){
  let h = `<div class="lab">去哪儿</div><div class="trace"><button class="node ${S.dest==='all'?'on':''}" data-dest="all"><span class="dot"></span><em>全部</em></button>`;
  names.forEach(n=>{ h += `<span class="link"></span><button class="node ${S.dest===n?'on':''}" data-dest="${esc(n)}"><span class="dot"></span><em>${esc(n)}</em></button>`; });
  return h + `</div>`;
}

function typeRow(){
  let h = `<div class="lab">出行方式</div><div class="tfs"><button class="tf ${S.type==='all'?'on':''}" data-type="all"><span class="tc line" style="--tc:#fff;--td:#1b1b1d">${ic('i-all')}</span><em>全部</em></button>`;
  Object.entries(TYPES).forEach(([k,v])=>{
    h += `<button class="tf ${S.type===k?'on':''}" data-type="${k}"><span class="tc" style="--tc:${v.bg};--td:${v.fg}">${ic(v.icon)}</span><em>${v.n}</em></button>`;
  });
  return h + `</div>`;
}

function viewTrips(){
  const all = trips.filter(t=>t.owner===S.tab);
  const asc = [...all].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const isChar = S.tab==='char';
  let h = hero({
    title: isChar ? `${CHAR_NAME}的出行` : '我的出行',
    sub: isChar ? `点开票根，看 ${CHAR_NAME} 写的心得` : '点开票根，写下这一程的心得',
    action: isChar ? `<button class="refresh" id="refreshChar">${ic('i-refresh')}刷新 ${esc(CHAR_NAME)} 的出行</button>` : '',
    amt: all.reduce((s,t)=>s+(Number(t.price)||0),0),
    figs: [[all.length,'出行'],[uniq(all.map(t=>t.to)).length,'目的地'],[all.filter(t=>t.note).length,'心得']]
  });
  h += traceHtml(uniq(asc.map(t=>t.to)));
  h += typeRow();

  const rows = all.filter(t=>(S.type==='all'||t.type===S.type)&&(S.dest==='all'||t.to===S.dest))
                  .sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  if(!rows.length) return h + `<div class="empty-box">${ic('i-ticket')}没有符合条件的票根</div>`;
  let cur='', i=0;
  rows.forEach(t=>{
    const m = t.date.slice(0,7).replace('-','年')+'月';
    if(m!==cur){ if(cur) h += `</div>`; cur=m; h += `<div class="month">${m}</div><div class="list">`; }
    h += ticket(t,true,i++);
  });
  return h + `</div>`;
}

function ticket(t, clickable, i=0){
  const T = TYPES[t.type];
  const emptyMsg = t.owner==='char' ? `点开，让 ${CHAR_NAME} 写下心得` : '点开写下这一程的心得';
  return `<div class="tkw" ${clickable?`data-trip="${t.id}"`:''} style="--i:${Math.min(i,6)}">
    <div class="tk" style="--tc:${T.bg};--td:${T.fg}">
      <div class="tk-main">
        <div class="tk-top"><span class="tk-type"><span class="tc s">${ic(T.icon)}</span>${T.t}</span><span class="tk-date">${t.shared?ic('i-share'):''}${fmtD(t.date)}</span></div>
        <div class="tk-route">
          <div class="c"><span class="cn">${esc(t.from)}</span><small>${esc(t.time||'')}</small></div>
          <div class="mid">${ic(T.icon)}</div>
          <div class="c r"><span class="cn">${esc(t.to)}</span><small>&nbsp;</small></div>
        </div>
        <div class="tk-note ${t.note?'':'empty'}">${t.note?esc(t.note):emptyMsg}</div>
      </div>
      <div class="tk-stub">
        <div class="pr"><small>票价</small><b><i>¥</i>${fmtP(t.price)}</b></div>
        <div class="bar"></div>
        <div class="no"><b>${esc(t.no||'--')}</b><small>${T.b} ${esc(t.seat||'--')}</small></div>
      </div>
    </div>
  </div>`;
}

function viewUs(){
  const asc = [...together].sort((a,b)=>a.date.localeCompare(b.date));
  let h = hero({
    title:'我们的旅途', sub:'一起去过的地方，两个人的感悟',
    amt: together.reduce((s,p)=>s+costOf(p),0),
    figs:[[together.length,'去过'],[together.filter(p=>p.noteMe||p.noteChar).length,'感悟'],[together.filter(p=>p.polaroid).length,'拍立得']]
  });
  h += traceHtml(uniq(asc.map(p=>p.place)));
  const rows = [...together].filter(p=>S.dest==='all'||p.place===S.dest).sort((a,b)=>b.date.localeCompare(a.date));
  if(!rows.length) return h + `<div class="empty-box">${ic('i-pin')}还没有一起去过的地方</div>`;
  h += `<div class="list" style="margin-top:22px">`;
  rows.forEach((p,i)=>{
    const snip = p.noteMe || p.noteChar;
    h += `<div class="pl" data-us="${p.id}" style="--i:${Math.min(i,6)}">
      <div class="thumb"><div class="im">${p.polaroid?`<img src="${p.polaroid}" alt="">`:ic('i-image')}</div></div>
      <div class="txt">
        <div class="pl-top"><h3>${esc(p.place)}</h3>${p.shared?ic('i-share'):''}</div>
        <div class="d">${fmtD(p.date)}</div>
        <p class="${snip?'':'empty'}">${snip?esc(snip):'点开，一起写下这次的感悟'}</p>
        <div class="pl-foot"><span class="price"><i>¥</i>${fmtM(costOf(p))}</span>
          <span class="tags">${p.noteChar?`<em>${esc(CHAR_NAME)}心得</em>`:''}${p.polaroid?'<em class="p">拍立得</em>':''}</span></div>
      </div>
    </div>`;
  });
  return h + `</div>`;
}

/* ================= 弹层 ================= */
function openSheet(html){ $('#sheet').innerHTML = `<div class="grab"></div>`+html; $('#ov').classList.add('show'); $('#sheet').scrollTop = 0; }
function closeSheet(){ $('#ov').classList.remove('show'); CUR = null; }
$('#ov').addEventListener('click',e=>{ if(e.target.id==='ov') closeSheet(); });

const actShare = r => `<button class="act ${r.shared?'done':''}" id="actShare" aria-label="分享">${ic(r.shared?'i-check':'i-share')}</button>`;
const actGen = `<button class="act" id="actGen" aria-label="刷新">${ic('i-refresh')}</button>`;

function readBlock(txt, loading, emptyMsg){
  if(loading) return `<div class="read"><div class="sk"></div><div class="sk l2"></div><div class="sk l3"></div></div>`;
  return `<div class="read ${txt?'':'empty'}">${txt?esc(txt):emptyMsg}</div>`;
}
function polHtml(r, kind, loading, canGen){
  const img = loading ? `<div class="sk" style="width:100%;height:100%;border-radius:0"></div>`
            : r.polaroid ? `<img src="${r.polaroid}" alt="">` : ic('i-image')+'<span>还没有拍立得</span>';
  const gen = (!loading && canGen) ? `<button class="pol-gen" data-genpol="1">${ic('i-camera')} ${r.polaroid?'重新生成拍立得':'生成拍立得'}</button>` : '';
  return `<div class="pol-block"><div class="pol-wrap"><div class="pol"><div class="im">${img}</div><div class="cap">${esc(kind==='us'?r.place:r.to)}  ${fmtD(r.date).slice(2)}</div></div></div>${gen}</div>`;
}

function renderBoxes(init){
  if(!CUR) return;
  const r = curRec(), b = S.busy||{};
  if(CUR.kind==='trip'){
    const tb = $('#thoughtBox');
    if(r.owner==='me'){
      if(init) tb.innerHTML = `<textarea class="ta" id="noteIn" placeholder="这一程发生了什么、想到了什么……">${esc(r.note)}</textarea><button class="btn" id="saveTrip">保存心得</button>`;
    } else {
      tb.innerHTML = readBlock(r.note, b.thought, `${CHAR_NAME} 还没有写这一程的心得，点右上角刷新生成`);
    }
    $('#polSec').style.display = (r.owner==='me' && !r.polaroid) ? 'none' : '';
    $('#polBox').innerHTML = polHtml(r,'trip',b.polaroid,r.owner!=='me');
  } else {
    $('#taNote').innerHTML = readBlock(r.noteChar, b.thought, `${CHAR_NAME} 还没有写，点右上角刷新生成`);
    $('#polBox').innerHTML = polHtml(r,'us',b.polaroid,true);
  }
}

    el.innerHTML = `<div class="panel">
      <h5>${isUs?'生成设置':'刷新这一程'}</h5>
      <p class="hint">${isUs?'可以只选一个、都选，或者都不选，只看记录。':`每次刷新都会生成 ${esc(CHAR_NAME)} 的心得，拍立得可以选择要不要。`}</p>

function openReplayPage(id, cid){
  const p = together.find(x=>String(x.id)===String(id)||String(x.tripId||'')===String(id))
    || trips.find(x=>String(x.id)===String(id)||String(x.tripId||'')===String(id)) || {};
  const charId = String(cid || p.charId || (CHAR&&CHAR.id) || '');
  const charName = String(CHAR_NAME || (CHAR&&CHAR.name) || '');
  const params = new URLSearchParams();
  params.set('replay','1');
  params.set('from','travel');
  params.set('trip', String(id || p.tripId || p.id || ''));
  if(p.journeyId) params.set('journeyId', String(p.journeyId));
  params.set('char', charId);
  params.set('chatId', String(p.chatId || charId));
  params.set('name', charName);
  params.set('userId', String((MASK&&MASK.id) || ''));
  params.set('dest', String(p.place || p.dest || ''));
  params.set('date', String(p.date || ''));
  const url = 'travel-chat.html?' + params.toString();
  if(window.parent && window.parent !== window){
    try { window.parent.postMessage({ type:'openFullscreen', url, title:'旅途回顾', source:'chat_inner' }, '*'); } catch(e) {}
  } else {
    location.href = url;
  }
}

function dateStr(d){ d=d instanceof Date?d:new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function nowHM(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function charAvatar(c){ return c && c.avatar ? `<span class="avp"><img src="${esc(c.avatar)}" alt=""></span>` : `<span class="avp">${esc(String((c&&c.name)||'C').charAt(0))}</span>`; }
function mapTrip(t, owner){
  return Object.assign({}, t, {
    id: String(t.id || t.tripId || ('trip_'+Math.random().toString(36).slice(2))),
    owner: owner,
    note: t.thought || t.note || '',
    polaroid: t.polaroid || '',
    shared: !!t.shared
  });
}
function mapTogether(p){
  return Object.assign({}, p, {
    id: String(p.id || p.tripId || ('us_'+Math.random().toString(36).slice(2))),
    place: p.place || p.to || p.title || '一段旅程',
    noteMe: p.noteMe || '',
    noteChar: p.noteChar || p.summary || p.thought || '',
    polaroid: p.polaroid || '',
    shared: !!p.shared,
    journey: Array.isArray(p.journey) ? p.journey : []
  });
}
function journeyHtml(p){
  const list=(p && Array.isArray(p.journey) ? p.journey : []).filter(Boolean);
  const hasText=!!(p && (p.summary || p.noteChar || p.thought));
  if(!list.length && !hasText) return '';
  const replayBtn=`<button class="btn" data-replay="${esc(String(p.id||p.tripId||''))}" data-replay-char="${esc(String(p.charId||(CHAR&&CHAR.id)||''))}" style="margin-bottom:10px">${ic('i-plane')} 打开当时的页面</button>`;
  if(!list.length) return `<div class="sec"><h4>${ic('i-heart')}完整回顾</h4>${replayBtn}<div class="empty-box">这段旅程只留下了总结，点上面的按钮回到当时的样子</div></div>`;
  const rows=list.map(m=>{
    const role=m.role;
    if(role==='photo'){
      const img=m.url?`<img src="${esc(m.url)}" alt="">`:(m.text?`<div>${esc(m.text)}</div>`:'');
      return `<div class="jr photo"><div class="jr-who">拍立得</div><div class="jr-bubble">${img}${m.caption?`<div class="jr-cap">${esc(m.caption)}</div>`:''}</div></div>`;
    }
    if(role==='narr'){
      return `<div class="jr narr"><div class="jr-who"></div><div class="jr-bubble">${esc(m.text||m.translation||'')}</div></div>`;
    }
    const isMe=role==='user';
    const txt=String(m.translation||m.text||'').trim();
    if(!txt) return '';
    return `<div class="jr ${isMe?'me':'char'}"><div class="jr-who">${isMe?'我':esc(CHAR_NAME)}</div><div class="jr-bubble">${esc(txt)}</div></div>`;
  }).join('');
  return `<div class="sec"><h4>${ic('i-heart')}完整回顾 <em>${list.length} 段</em></h4>${replayBtn}<div class="journey">${rows}</div></div>`;
}
function syncArrays(){
  trips.length = 0;
  together.length = 0;
  if(!CHAR) return;
  const uidv = MASK.id || 'default';
  TravelStore.listCharTrips(CHAR.id).forEach(t=>trips.push(mapTrip(t,'char')));
  TravelStore.listUserTrips(uidv).forEach(t=>trips.push(mapTrip(t,'me')));
  TravelStore.listTogether(uidv, CHAR.id).forEach(p=>together.push(mapTogether(p)));
}
async function refreshTravelFromStore(){
  try{
    await TravelStore.load(true);
    syncArrays();
    render();
    setTimeout(()=>{ recoverTravelImages().catch(()=>{}); }, 300);
  }catch(e){}
}
// 旧记录里可能还是生图站返回的临时 URL：只要还能访问，就转成本地 dataURL，
// 避免链接过期后旅途里的照片变成空白/被“销毁”。
let recoveringTravelImages = false;
async function recoverTravelImages(){
  if(recoveringTravelImages || !window.NanoImageCache || !NanoImageCache.toDataUrl) return;
  recoveringTravelImages = true;
  let changed = false;
  const all = (trips||[]).concat(together||[]);
  for (const p of all) {
    if (!p || !p.polaroid || !/^https?:\/\//i.test(p.polaroid)) continue;
    try {
      let local = await NanoImageCache.toDataUrl(p.polaroid);
      if (local && /^data:image\//i.test(local)) {
        if (local.length > 500000 && NanoImageCache.shrinkDataUrl) {
          const small = await NanoImageCache.shrinkDataUrl(local, 1280, 0.82);
          if (small) local = small;
        }
        p.polaroid = local;
        await TravelStore.updateTrip(p.id, { polaroid: local });
        changed = true;
      }
    } catch (e) {}
  }
  recoveringTravelImages = false;
  if (changed) { try { render(); if(CUR) renderBoxes(); } catch(e) {} }
}
window.addEventListener('message', function(e){
  var d=e&&e.data;
  if(d&&(d.type==='nanoTravelCardAdded'||d.type==='nanoTravelUpdated'||d.type==='nanoTravelReportPending')){
    refreshTravelFromStore();
  }
});
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState==='visible') refreshTravelFromStore();
});

function tripPatch(t){
  return { type:t.type, from:t.from, to:t.to, place:t.place||t.to, date:t.date, time:t.time || '',
    no:t.no || '', seat:t.seat || '', price:Number(t.price)||0, thought:t.note || t.thought || '',
    note:t.note || t.thought || '', caption:t.caption || '', polaroid:t.polaroid || '',
    shared:!!t.shared, tripId:t.tripId || '', charId:CHAR?String(CHAR.id):'' };
}
function togetherPatch(p){
  return { place:p.place, date:p.date, cost:p.cost, legs:p.legs||[], noteMe:p.noteMe||'',
    noteChar:p.noteChar||'', summary:p.summary||p.noteChar||'', polaroid:p.polaroid||'', shared:!!p.shared,
    days:p.days||'', ticketNo:p.ticketNo||'', places:p.places||[], tripId:p.tripId||'', charId:CHAR?String(CHAR.id):'' };
}
async function persistTrip(t){ if(!t) return; await TravelStore.updateTrip(t.id, tripPatch(t)); }
async function persistTogether(p){ if(!p) return; await TravelStore.updateTrip(p.id, togetherPatch(p)); }
function savePolaroid(id,url,kind){ TravelStore.updateTrip(id,{polaroid:url}); }

function validType(t){ return TYPES[t] ? t : 'hsr'; }
function normalizeTripJson(j,c){
  const t = j || {};
  const type = validType(String(t.type||'').toLowerCase());
  const date = /^\d{4}-\d{2}-\d{2}$/.test(String(t.date||'')) ? String(t.date) : dateStr();
  let time = String(t.time || '');
  if(!/^\d{1,2}:\d{2}$/.test(time)) time = nowHM();
  return {
    type, from: String(t.from || '住处'), to: String(t.to || t.place || '附近'),
    place: String(t.place || t.to || '附近'), date, time,
    no: String(t.no || ''), seat: String(t.seat || ''), price: Number(t.price)||0,
    note: String(t.thought || t.note || '').trim(), thought: String(t.thought || t.note || '').trim(),
    caption: String(t.caption || '').trim(), photoPrompt: String(t.photoPrompt || '').trim(),
    owner: 'char', source: 'api', charId: String(c.id), charName: c.name || 'TA'
  };
}
function charPersona(c){
  const cd = TravelStore.getCharData(c.id);
  return String((cd.settings && cd.settings.persona) || c.setting || c.desc || c.persona || '');
}
// 只有开启「允许生图」的角色才允许在旅途里生成图片。
function charAllowsImage(id){
  try{
    const raw = localStorage.getItem('chat_setting_allowImage_' + String(id || ''));
    if(raw === null) return false;
    let v = raw;
    try{ v = JSON.parse(raw); }catch(e){}
    return v === true || v === 1 || v === 'true' || v === '1';
  }catch(e){ return false; }
}
// 角色在线下时，线上不再发送旅途分享。
function charOffline(id){
  try{ return String(localStorage.getItem('nano_chat_mode_' + String(id || '')) || '') === 'offline'; }catch(e){ return false; }
}
async function generateTripRecordAI(c, opts){
  opts = opts || {};
  const persona = charPersona(c);
  const mask = MASK || { name:'我' };
  const sys = '你是角色「' + (c.name||'TA') + '」。请以第一人称，生成一条真实、具体的个人出行记录。'
    + '必须严格保持人设，严禁 OOC、霸总腔、油腻情话、爹味说教；不要命令、强迫或贬低用户。'
    + (persona ? ('角色设定：' + String(persona).slice(0, 1600) + '。') : '')
    + '只输出合法 JSON，不要任何解释。格式：'
    + '{"type":"hsr|train|plane|taxi|bike|bus","from":"出发地","to":"到达地","place":"目的地/地点","date":"YYYY-MM-DD","time":"HH:MM","no":"车次/航班/车牌","seat":"座位/里程","price":数字,"thought":"一句真实心得，40字以内","caption":"拍立得的一句话说明","photoPrompt":"用于生图的画面描述"}'
    + '。要求：地点、交通方式符合角色的国籍、城市、职业和生活习惯；票根信息要像真的；不要每次都去同一个地方；thought 要像角色自己写的一句话，不要解释成旁白。';
  const usr = '今天是 ' + dateStr() + '。' + (opts.report ? '你要向「' + (mask.name||'用户') + '」报备一段你最近的出行。' : '请生成一段你最近独自出门的记录。')
    + (opts.place ? ('目的地可以是：' + opts.place + '。') : '')
    + (opts.from ? ('出发地：' + opts.from + '。') : '');
  const j = await TravelAPI.callJson({ messages:[{role:'system',content:sys},{role:'user',content:usr}], temperature:0.95, maxTokens:1000 });

}

function polaroidPrompt(c, record, sceneOnly){
  const persona = charPersona(c);
  const place = record.place || record.to || '旅行途中';
  const base = '拍立得旅行摄影，真实自然光，柔和胶片颗粒，暖色调，生活纪实感。'
    + '场景：' + place + '，' + (record.date||'') + ' ' + (record.time||'') + '。'
    + (record.caption ? ('画面说明：' + record.caption + '。') : '')
    + (record.note ? ('心情：' + record.note + '。') : '')
    + (record.photoPrompt ? ('构图：' + record.photoPrompt + '。') : '');
  if(sceneOnly){
    return base
      + '不要出现人物正脸；只拍随手拍的风景、街角、食物、车票、窗边、影子或手部等真实生活细节，画面可以留白、有生活痕迹。'
      + '不出现文字、水印、边框和多余人物。';
  }
  return base
    + '角色：' + (c.name||'TA') + (persona ? ('（' + String(persona).slice(0,700) + '）') : '') + '。'
    + (record.owner==='us'
        ? ('画面里可以出现' + ME_NAME + '的手、背影或侧影，作为同行者，不抢主体；')
        : ('画面里只有' + (c.name||'TA') + '一个人；'))
    + '不出现文字、水印、边框和多余人物。';
}
async function genPolaroidFor(c, record, opts){
  // 未开启「允许生图」的角色，任何入口都不生成图片。
  if(!c || !charAllowsImage(c.id)) return '';
  const sceneOnly = !!(opts && opts.sceneOnly);
  const out = await TravelAPI.generateImage({
    prompt: polaroidPrompt(c, record, sceneOnly),
    charId: sceneOnly ? '' : String(c.id),
    charName: sceneOnly ? '' : (c.name || '')
  });
  return out && out.src ? out.src : '';
}
async function travelGenerate(req){
  const kind = req.kind, record = req.record;
  if(kind === 'us'){
    if(req.thought) record.noteChar = await generateUsThought(record);
    if(req.polaroid) record.polaroid = await genPolaroidFor(CHAR, { place:record.place, date:record.date, caption:'', note:record.noteChar||'', owner:'us' }, { sceneOnly: Math.random()<0.5 });
    await persistTogether(record);
    return { thought: record.noteChar, polaroid: record.polaroid };
  }
  if(record.owner === 'me') return { thought: record.note };
  if(req.thought) await regenerateTripRecord(record);
  if(req.polaroid) record.polaroid = await genPolaroidFor(CHAR, record, { sceneOnly: Math.random()<0.55 });
  await persistTrip(record);
  return { thought: record.note, polaroid: record.polaroid };
}
function travelCharForeign(c){
  if(!c) return false;
  const lang = String(c.language || '').trim();
  if(lang && !/中文|汉语|漢語|chinese/i.test(lang)) return true;
  const nat = String(c.nationality || c.country || '').trim();
  if(!nat || /未知|无|unknown/i.test(nat)) return false;
  return !/中国|中國|china/i.test(nat);
}
async function travelShare(req){
  const charId = String(req.charId || (CHAR && CHAR.id) || '');
  if(!charId) throw new Error('没有选择角色');
  const target = CHARS.find(c=>String(c.id)===charId) || CHAR;
  const thought = req.kind==='us' ? req.record.noteChar : req.record.note;
  let thoughtZh = String(req.record.thoughtZh || '').trim();
  if(!thoughtZh && thought && travelCharForeign(target)){
    try{
      const tr = await TravelAPI.callChat({ messages:[
        {role:'system',content:'把下面这段文字翻译成自然、口语化的中文，只输出译文，不要解释。'},
        {role:'user',content:String(thought)}
      ], temperature:0.2, maxTokens:400 });
      thoughtZh = String(tr || '').trim();
    }catch(e){}
  }
  const trip = {
    tripId: req.record.tripId || req.record.id,
    place: req.kind==='us' ? req.record.place : (req.record.place || req.record.to),
    date: req.record.date, thought: thought,
    thoughtZh: thoughtZh,
    noteMe: req.record.noteMe, noteChar: req.record.noteChar, polaroid: req.record.polaroid,
    caption: req.record.caption, title: req.record.place || req.record.to
  };
  await TravelStore.shareTripToChat({ charId, trip, message:req.message || '', fromName: ME_NAME, charName: target ? target.name : CHAR_NAME });
  return true;
}

async function maybeRandomPolaroid(){
  if(!CHAR || !window.TravelAPI || S.busy) return;
  const maskId = MASK.id || 'default';
  const state = TravelStore.polaroidState();
  // 约 3 天分享一次旅程；与私聊里的随机旅途报备共用同一把锁，避免两条路径重复分享。
  const shareKey = 'nano_travel_share_at_' + maskId;
  try{
    const shared = JSON.parse(localStorage.getItem(shareKey) || 'null');
    if(shared && Date.now() - Number(shared.at || 0) < 3*86400000) return;
  }catch(e){}
  if(state.lastAt && Date.now() - Number(state.lastAt) < 3*86400000) return;
  // 只挑近 24 小时还在聊天的角色，很久没聊的不打扰
  const recent = TravelStore.recentChatChars(24);
  if(!recent.length) return;
  const cands = CHARS.filter(c=>recent.indexOf(String(c.id)) !== -1 && !charOffline(c.id));
  if(!cands.length) return;
  const lockKey = 'nano_travel_photo_lock_'+maskId;
  try{
    const lock = JSON.parse(localStorage.getItem(lockKey) || 'null');
    if(lock && Date.now()-Number(lock.at||0) < 10*60000) return;
    localStorage.setItem(lockKey, JSON.stringify({at:Date.now()}));
  }catch(e){}
  try{
    const c = cands[Math.floor(Math.random()*cands.length)];
    let trip = TravelStore.listCharTrips(c.id)[0];
    if(!trip){ trip = await generateTripRecordAI(c, {}); trip.tripId = trip.tripId || TravelStore.uid('trip'); await TravelStore.addCharTrip(c.id, trip); }
    // 分享时 75% 概率生图；且只有开启「允许生图」的角色才真的生成图片。
    // 画面随机：人像 / 风景 / 随机角落 / 生活细节都会出现。
    let url = '';
    if(charAllowsImage(c.id) && Math.random() < 0.75){
      try{
        const cfg = await TravelAPI.readApiConfig();
        if(cfg && cfg.imgUrl) url = await genPolaroidFor(c, trip, { sceneOnly: Math.random() < 0.58 });
      }catch(e){}
    }
    if(url) await TravelStore.updateTrip(trip.id, { polaroid:url, caption:trip.caption||'' });
    await TravelStore.addPendingReport(c.id, {
      tripId: trip.tripId || trip.id, title: trip.place || trip.to, place: trip.place || trip.to,
      date: trip.date, thought: trip.thought || trip.note, caption: trip.caption, note: trip.thought || trip.note, img: url
    });
    TravelStore.savePolaroidState(Object.assign({}, state, { lastAt:Date.now(), charId:String(c.id), tripId:trip.id }));
    try{ localStorage.setItem(shareKey, JSON.stringify({ at:Date.now(), charId:String(c.id) })); }catch(e){}
    if(String(c.id) === String(CHAR.id)){ await TravelStore.load(true); syncArrays(); render(); }
    toast(url ? (c.name+' 发来一张旅途拍立得') : (c.name+' 分享了一段旅途'));
  }catch(e){}
  finally{ try{ localStorage.removeItem(lockKey); }catch(e){} }
}

      date:$('#aDate').value||dateStr(), time:$('#aTime').value, no:$('#aNo').value.trim(), seat:$('#aSeat').value.trim(),
      price:Number($('#aPrice').value)||0, note:($('#aNote')?$('#aNote').value.trim():''), thought:($('#aNote')?$('#aNote').value.trim():''), polaroid:'', shared:false };
    if(S.tab==='char' && CHAR){ trip.owner='char'; await TravelStore.addCharTrip(CHAR.id, trip); }
    else { trip.owner='me'; await TravelStore.addUserTrip(MASK.id, trip); }
    await TravelStore.load(true); syncArrays(); closeSheet(); render(); toast('票根已生成');
  }
  else if(g('#addUs')){
    const place=$('#uPlace').value.trim(); if(!place){ toast('请填写地点'); return; }
    if(!CHAR){ toast('先选择角色'); return; }
    const c=$('#uCost').value;
    const p = { id:TravelStore.uid('us'), place, date:$('#uDate').value||dateStr(), cost:c===''?0:Number(c), legs:[],
      noteMe:$('#uNote').value.trim(), noteChar:'', polaroid:'', shared:false, charId:String(CHAR.id), userId:String(MASK.id||'') };
    await TravelStore.addTogether(MASK.id, CHAR.id, p);
    await TravelStore.load(true); syncArrays(); closeSheet(); render(); toast('已添加');
  }
});

/* 先渲染一次选择页，避免角色/面具读取较慢时整页空白 */
try{ render(); }catch(e){}
loadApp().catch(()=>{ render(); toast('旅途加载失败，请重试'); });
setTimeout(()=>{ recoverTravelImages().catch(()=>{}); }, 900);
setTimeout(()=>{ try{ const v=$('#view'); if(v && !v.innerHTML.trim()) render(); }catch(e){} }, 1600);
</script>
</body>
</html>
