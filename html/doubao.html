<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="../js/nano-runtime.js?v=20261027f"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>豆包 · Char 对话</title>
<script src="../js/appearance.js?v=20261026d"></script>
<style>
:root{
  --bg:#fff;
  --text:#111;
  --sub:#a0a0a0;
  --line:#e8e8e8;
  --soft:#f7f7f7;
  --blue:#1677ff;
  --blue2:#0b6ff5;
  --shadow:0 2px 12px rgba(0,0,0,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;color:var(--text);overflow:hidden}
button,input,textarea{font:inherit}
button{border:0;background:none;color:inherit}
.app{
  width:100%;
  height:100%;
  min-height:100dvh;
  background:#fff;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.topbar{
  min-height:40px;
  flex:none;
  padding:6px 10px 6px;
  border-top:max(0px, var(--safe-top, 0px), env(safe-area-inset-top, 0px)) solid transparent;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#fff;
  position:relative;
  z-index:5;
}
.left-tools,.right-tools{display:flex;align-items:center;gap:8px;z-index:1}
.right-tools{justify-content:flex-end}
.icon-btn{
  width:32px;height:32px;
  display:grid;place-items:center;
  cursor:pointer;
  border-radius:9px;
}
.icon-btn:active{background:#f2f2f2}
.icon-btn svg{width:20px;height:20px;stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}
.title-wrap{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  white-space:nowrap;
  line-height:1;
  pointer-events:none;
}
.title{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:3px;
  font-size:17px;
  font-weight:600;
  letter-spacing:-.2px;
}
.title svg{width:10px;height:10px;stroke:#aaa;stroke-width:2.3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.subtitle{
  margin-top:4px;
  color:#b8b8b8;
  font-size:10.5px;
  font-weight:400;
  letter-spacing:0;
}
.chat{
  flex:1;
  min-height:0;
  overflow-y:auto;
  overscroll-behavior:contain;
  padding:4px 14px 150px;
  scrollbar-width:none;
}
.chat::-webkit-scrollbar{display:none}
.message{display:flex;width:100%;margin:0 0 14px}
.message.char{justify-content:flex-end}
.message.ai{justify-content:flex-start}
.bubble{
  max-width:calc(100% - 20px);
  line-height:1.62;
  font-size:15.5px;
  letter-spacing:.1px;
}
.char .bubble{
  max-width:78%;
  background:var(--blue);
  color:white;
  padding:9px 14px 10px;
  border-radius:19px 19px 6px 19px;
  box-shadow:0 1px 2px rgba(0,0,0,.03);
}
.ai-card{
  width:100%;
  background:#f7f7f7;
  border-radius:17px;
  padding:14px 16px 13px;
  font-size:15px;
  line-height:1.62;
}
.ai-card h3{
  margin:0 0 10px;
  font-size:17px;
  font-weight:700;
  line-height:1.32;
}
.ai-card p{margin:0 0 10px}
.ai-card p:last-child{margin-bottom:0}
.ai-card strong{font-weight:700}
.ai-card .quote{
  margin:10px 0 2px;
  padding:1px 0 1px 13px;
  border-left:2px solid #d7d7d7;
  color:#777;
}
.ai-card .small{font-size:13.5px;color:#777}
.list{
  margin:7px 0 10px;
  padding-left:20px;
}
.list li{margin:4px 0}
.strong-line{font-weight:700}
.db-empty{color:#b2b2b2;font-size:13px;text-align:center;padding:48px 20px;line-height:1.8}
.bottom{
  position:fixed;
  z-index:10;
  left:0;right:0;bottom:0;
  background:linear-gradient(to bottom,rgba(255,255,255,.96),#fff 20%);
  padding:0 14px calc(10px + env(safe-area-inset-bottom));
}
.jump{
  width:42px;height:42px;
  margin:0 auto 10px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 4px 16px rgba(0,0,0,.13);
  display:grid;place-items:center;
  cursor:pointer;
}
.jump svg{width:21px;height:21px;stroke:#111;stroke-width:2.3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.quick{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:0 0 10px;
  scrollbar-width:none;
}
.quick::-webkit-scrollbar{display:none}
.quick button{
  height:38px;
  padding:0 12px;
  border:1px solid #e1e1e1;
  background:#fff;
  border-radius:10px;
  white-space:nowrap;
  font-size:13px;
  display:flex;align-items:center;gap:6px;
  box-shadow:0 1px 3px rgba(0,0,0,.02);
  cursor:pointer;
}
.quick button:active{background:#f6f6f6}
.quick svg{width:16px;height:16px;stroke:#111;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.composer{
  height:56px;
  border:1px solid #e5e5e5;
  border-radius:18px;
  box-shadow:0 2px 12px rgba(0,0,0,.08);
  background:#fff;
  display:flex;
  align-items:center;
  padding:0 9px 0 14px;
  gap:8px;
}
.camera{
  width:28px;height:28px;display:grid;place-items:center;flex:0 0 28px
}
.camera svg{width:22px;height:22px;stroke:#111;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.placeholder{
  flex:1;
  min-width:0;
  color:#a4a4a4;
  font-size:14.5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.voice,.plus{
  width:32px;height:32px;border-radius:50%;
  display:grid;place-items:center;flex:0 0 32px;
  cursor:pointer;
}
.voice:active,.plus:active{background:#f2f2f2}
.voice svg,.plus svg{width:22px;height:22px;stroke:#111;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:700px){
  .topbar{min-height:38px;flex:none;padding:5px 8px;border-top:max(0px, var(--safe-top, 0px), env(safe-area-inset-top, 0px)) solid transparent}
  .left-tools,.right-tools{gap:4px}
  .icon-btn{width:30px;height:30px;border-radius:8px}
  .icon-btn svg{width:19px;height:19px;stroke-width:2}
  .title{font-size:15.5px}
  .subtitle{font-size:9.5px;margin-top:3px}
  .chat{padding:4px 11px 142px}
  .message{margin-bottom:12px}
  .char .bubble{font-size:15px;max-width:80%;padding:8px 13px 9px;border-radius:18px 18px 6px 18px}
  .ai-card{border-radius:15px;padding:12px 13px;font-size:14px}
  .ai-card h3{font-size:16px;margin-bottom:9px}
  .ai-card .small{font-size:12.5px}
  .bottom{padding:0 8px calc(7px + env(safe-area-inset-bottom))}
  .jump{width:39px;height:39px;margin-bottom:8px}
  .quick{gap:6px;padding-bottom:7px}
  .quick button{height:36px;padding:0 11px;font-size:12.5px;border-radius:9px}
  .quick svg{width:15px;height:15px}
  .composer{height:51px;border-radius:16px;padding-left:12px;gap:7px}
  .placeholder{font-size:13.5px}
  .camera{width:26px;height:26px;flex-basis:26px}
  .camera svg{width:21px;height:21px}
  .voice,.plus{width:30px;height:30px;flex-basis:30px}
  .voice svg,.plus svg{width:21px;height:21px}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="left-tools">
      <button class="icon-btn" aria-label="返回" onclick="phoneBack()">
        <svg viewBox="0 0 24 24"><path d="M14.5 5 7.5 12l7 7"/></svg>
      </button>
      <button class="icon-btn" aria-label="菜单" onclick="noop()">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <button class="icon-btn" aria-label="新对话" onclick="noop()">
        <svg viewBox="0 0 24 24"><path d="M5 19h4L19 9a2.2 2.2 0 0 0-4-4L5 15v4Z"/><path d="M13.5 6.5 17.5 10.5"/></svg>
      </button>
    </div>

    <div class="title-wrap">
      <div class="title">豆包
        <svg viewBox="0 0 16 16"><path d="m5 3 5 5-5 5"/></svg>
      </div>
      <div class="subtitle">AI 生成内容可能有误 请核实</div>
    </div>

    <div class="right-tools">
      <button class="icon-btn" aria-label="刷新" id="refreshBtn" onclick="phoneRefresh()">
        <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.9-3.8L4 9"/><path d="M4 5v4h4"/><path d="M4 13a8 8 0 0 0 14.9 3.8L20 15"/><path d="M20 19v-4h-4"/></svg>
      </button>
      <button class="icon-btn" aria-label="电话" onclick="noop()">
        <svg viewBox="0 0 24 24"><path d="M6.5 4.5c.7-.7 1.8-.7 2.5 0l1.7 2c.6.7.6 1.7 0 2.3L9.4 10c1 2.1 2.5 3.6 4.6 4.6l1.2-1.3c.6-.6 1.6-.6 2.3 0l2 1.7c.7.7.7 1.8 0 2.5l-1 1c-.8.8-2 1.1-3.1.8C9.2 18 6 14.8 4.7 10.6c-.3-1.1 0-2.3.8-3.1l1-1Z"/></svg>
      </button>
      <button class="icon-btn" aria-label="静音" onclick="noop()">
        <svg viewBox="0 0 24 24"><path d="M5 10v4h3l4 4V6L8 10H5Z"/><path d="m16 9 4 4m0-4-4 4"/></svg>
      </button>
    </div>
  </header>

  <main class="chat" id="chat"></main>

  <div class="bottom">
    <button class="jump" id="jumpBtn" aria-label="回到底部" onclick="scrollBottom()">
      <svg viewBox="0 0 24 24"><path d="M12 5v13"/><path d="m6.5 12.5 5.5 5.5 5.5-5.5"/></svg>
    </button>

    <div class="quick">
      <button onclick="noop()">
        <svg viewBox="0 0 24 24"><path d="M5 6.5h14v9H9l-4 3v-12Z"/><path d="M8 10h8"/></svg>
        对话
      </button>
      <button onclick="noop()">
        <svg viewBox="0 0 24 24"><path d="m12 3 1.6 5.1L19 10l-5.4 1.9L12 17l-1.6-5.1L5 10l5.4-1.9L12 3Z"/></svg>
        AI创作
      </button>
      <button onclick="noop()">
        <svg viewBox="0 0 24 24"><path d="m7 4 10-1 2 15-10 2L7 4Z"/><path d="m9 7 5-1m-4 5 5-1m-4 5 5-1"/></svg>
        出行用豆包
      </button>
      <button onclick="noop()">
        <svg viewBox="0 0 24 24"><path d="M6.5 4.5c.7-.7 1.8-.7 2.5 0l1.7 2c.6.7.6 1.7 0 2.3L9.4 10c1 2.1 2.5 3.6 4.6 4.6l1.2-1.3c.6-.6 1.6-.6 2.3 0l2 1.7c.7.7.7 1.8 0 2.5l-1 1c-.8.8-2 1.1-3.1.8C9.2 18 6 14.8 4.7 10.6c-.3-1.1 0-2.3.8-3.1l1-1Z"/></svg>
        打电话
      </button>
      <button onclick="noop()">
        <svg viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7L6 8Z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>
        买前问豆包
      </button>
      <button onclick="noop()">
        <svg viewBox="0 0 24 24"><path d="M12 4a4 4 0 0 0-4 4v4a4 4 0 0 0 8 0V8a4 4 0 0 0-4-4Z"/><path d="M5 11v1a7 7 0 0 0 14 0v-1M12 19v2M9 21h6"/></svg>
        AI播客
      </button>
      <button onclick="noop()">
        <svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3"/></svg>
        视频通话
      </button>
      <button onclick="noop()">
        <svg viewBox="0 0 24 24"><path d="M4 8v8m4-11v14m4-16v18m4-15v12m4-9v6"/></svg>
        同声
      </button>
    </div>

    <div class="composer">
      <button class="camera" aria-label="相机" onclick="noop()">
        <svg viewBox="0 0 24 24"><path d="M4 8h3l1.5-2h7L17 8h3v10H4V8Z"/><circle cx="12" cy="13" r="3.2"/></svg>
      </button>
      <div class="placeholder" id="placeholder">发消息或按住说话...</div>
      <button class="voice" aria-label="语音" onclick="noop()">
        <svg viewBox="0 0 24 24"><path d="M12 4a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0V7a3 3 0 0 0-3-3Z"/><path d="M5 11v1a7 7 0 0 0 14 0v-1M12 19v2M9 21h6"/></svg>
      </button>
      <button class="plus" aria-label="更多" onclick="noop()">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
function noop(){}

function phoneBack(){
  try{
    if(window.parent && window.parent !== window){ window.parent.postMessage({ type:"phoneAppClose" }, "*"); return; }
  }catch(e){}
  history.back();
}
function phoneRefresh(){
  try{
    if(window.__phoneRefresh){ window.__phoneRefresh(); return; }
  }catch(e){}
  refreshConversation();
}

function scrollBottom(){
  const chat=document.getElementById('chat');
  chat.scrollTo({top:chat.scrollHeight,behavior:'smooth'});
}

function makeMessage(role,text){
  const wrap=document.createElement('div');
  wrap.className='message '+role;
  if(role==='char'){
    const b=document.createElement('div');
    b.className='bubble';
    b.textContent=text;
    wrap.appendChild(b);
  }else{
    const card=document.createElement('div');
    card.className='ai-card';
    const p=document.createElement('p');
    p.textContent=text;
    card.appendChild(p);
    wrap.appendChild(card);
  }
  return wrap;
}

function refreshConversation(){
  const btn=document.getElementById('refreshBtn');
  if(btn) btn.animate(
    [{transform:'rotate(0deg)'},{transform:'rotate(180deg)'},{transform:'rotate(360deg)'}],
    {duration:520,easing:'ease-out'}
  );
  scrollBottom();
}

// 由宿主（查手机）注入数据：[{role:'char'|'ai', content:'...'}]
window.renderDoubaoConversation=function(messages){
  const chat=document.getElementById('chat');
  chat.innerHTML='';
  const list=Array.isArray(messages)?messages:[];
  const valid=list.filter(function(m){ return m && (m.content||m.text); });
  if(!valid.length){
    const empty=document.createElement('div');
    empty.className='db-empty';
    empty.textContent='暂无与豆包的对话\n返回刷新即可生成';
    chat.appendChild(empty);
    return;
  }
  valid.forEach(function(item){
    const role=(item.role==='char'||item.role==='user')?'char':'ai';
    chat.appendChild(makeMessage(role,String(item.content||item.text||'')));
  });
  scrollBottom();
};
</script>
</body>
</html>
