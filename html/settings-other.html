<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<script src="../js/nano-runtime.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>其他</title>
<link rel="icon" href="../icons/icon-192.png">
<script>window.__NANO_FONT_ONLY = true;</script>
<script src="../js/appearance.js"></script>
<script src="../js/nano-idb.js"></script>
<link rel="stylesheet" href="../css/settings.css">
</head>
<body data-page="other">
<div class="app">
  <header class="nav">
    <a class="back" href="settings.html" aria-label="返回">
      <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <h1>其他</h1>
    <div class="spacer"></div>
  </header>

  <main class="scroll">
    <section class="list">
      <div class="row">
        <span class="row-label">悬浮球</span>
        <span class="ball-preview" id="ballPreview"><i class="ball-core"></i></span>
        <span class="switch"><input type="checkbox" id="ballToggle"><i></i></span>
      </div>
      <div class="row">
        <span class="row-label">悬浮球大小</span>
        <input class="range" id="ballSize" type="range" min="36" max="80" step="2">
        <span class="row-value" id="ballSizeValue">52</span>
      </div>
      <button class="row" id="ballResetPos">
        <span class="row-label">重置悬浮球位置</span>
        <span class="chev">›</span>
      </button>

      <div class="row">
        <span class="row-label">顶栏位置</span>
        <span class="nudge">
          <button class="nudge-btn" data-target="top" data-dir="-1" type="button">上移</button>
          <span class="nudge-value" id="topShiftVal">0</span>
          <button class="nudge-btn" data-target="top" data-dir="1" type="button">下移</button>
          <button class="nudge-btn" data-target="top" data-dir="0" type="button">恢复</button>
        </span>
      </div>
      <label class="row">
        <span class="row-label">灵动岛安全区</span>
        <span class="switch"><input type="checkbox" id="insetToggle"><i></i></span>
      </label>
      <div class="row" id="insetNudgeRow" style="display:none;">
        <span class="row-label">安全区高度</span>
        <span class="nudge">
          <button class="nudge-btn" data-target="inset" data-dir="-1" type="button">上移</button>
          <span class="nudge-value" id="insetShiftVal">48</span>
          <button class="nudge-btn" data-target="inset" data-dir="1" type="button">下移</button>
          <button class="nudge-btn" data-target="inset" data-dir="0" type="button">恢复</button>
        </span>
      </div>
      <div class="row">
        <span class="row-label">底栏位置</span>
        <span class="nudge">
          <button class="nudge-btn" data-target="bottom" data-dir="-1" type="button">上移</button>
          <span class="nudge-value" id="bottomShiftVal">0</span>
          <button class="nudge-btn" data-target="bottom" data-dir="1" type="button">下移</button>
          <button class="nudge-btn" data-target="bottom" data-dir="0" type="button">恢复</button>
        </span>
      </div>

      <label class="row">
        <span class="row-label">纳米助手</span>
        <span class="switch"><input type="checkbox" id="nanoToggle"><i></i></span>
      </label>
      <button class="row" id="interfaceSettings">
        <span class="row-label">字体与美化</span>
        <span class="row-value">美化</span>
        <span class="chev">›</span>
      </button>
      <button class="row" id="otherSettings">
        <span class="row-label">更多设置</span>
        <span class="row-value">后台 / 推送</span>
        <span class="chev">›</span>
      </button>
    </section>
    <p class="hint">界面位置用于适配 iPhone 顶栏、底栏和灵动岛安全区；纳米助手开启后会出现在角色列表中。</p>
  </main>
</div>
<div class="toast" id="toast"></div>
<script src="../js/settings.js"></script>
</body>
</html>
