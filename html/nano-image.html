<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="../js/nano-runtime.js?v=20261028e"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Nano 生图室</title>
  <link rel="stylesheet" href="../css/nano.css?v=20261025b">
  <link rel="stylesheet" href="../css/nano-image.css?v=20261029b">
  <script src="../js/localforage.min.js?v=20261027a"></script>
</head>
<body class="ni-body">
  <div class="ni-app">
    <header class="ni-top">
      <button class="ni-top-btn" id="niBack" data-back aria-label="返回">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="ni-title">
        <b>Nano 生图室</b>
        <small id="niSub">聊天 · 生图 · 风格参考</small>
      </div>
      <button class="ni-top-btn" id="niSessionsBtn">窗口</button>
      <button class="ni-top-btn" id="niSettingsBtn">设置</button>
    </header>

    <div class="ni-scroll" id="niScroll">
      <section class="ni-hero">
        <div class="ni-hero-head">
          <div class="ni-hero-main">
            <span>当前窗口</span>
            <b id="niSessionName">生图 1</b>
          </div>
          <button class="ni-mini-btn" id="niRenameBtn">改名</button>
        </div>
        <div class="ni-chips" id="niChips"></div>
      </section>

      <div class="ni-feed" id="niFeed"></div>
      <div class="ni-empty" id="niEmpty">
        <b>和 Nano 聊天，或直接说「画一张…」</b>
        可以正常聊天，也可以发图片让 Nano 识别画风；生成的图片会自动保存到图库。
      </div>
    </div>

    <div class="ni-composer">
      <div class="ni-composer-box">
        <div class="ni-quote-bar" id="niQuoteBar" hidden>
          <div class="ni-quote-main">
            <b>引用 <span id="niQuoteWho"></span></b>
            <span id="niQuoteText"></span>
          </div>
          <button type="button" class="ni-quote-close" id="niQuoteClose" aria-label="取消引用">×</button>
        </div>
        <div class="ni-attach-preview" id="niAttachPreview" hidden>
          <img id="niAttachThumb" alt="">
          <button type="button" class="ni-attach-remove" id="niAttachRemove" aria-label="移除图片">×</button>
        </div>
        <textarea id="niPrompt" placeholder="和 Nano 聊天，或直接说「画一张雨夜东京街头的照片」…" rows="2"></textarea>
        <div class="ni-composer-tools">
          <button type="button" class="ni-tool-btn ni-plus-btn" id="niPlusBtn" aria-label="更多" title="更多">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <select class="ni-size" id="niSize" aria-label="图片比例" title="图片比例（指令里写比例会覆盖这里）">
            <option value="1024x1024">1:1 / 4:4 方图</option>
            <option value="768x1024">3:4 竖图</option>
            <option value="1024x768">4:3 横图</option>
            <option value="1024x1536">2:3 竖长</option>
            <option value="1536x1024">3:2 横长</option>
            <option value="768x1344">9:16 手机</option>
            <option value="1344x768">16:9 宽屏</option>
          </select>
          <input type="file" id="niImageFile" accept="image/*" hidden>
          <input type="file" id="niDocFile" accept=".txt,.doc,.docx,.json,.md" hidden>
          <span class="ni-composer-spacer"></span>
          <button class="ni-generate" id="niGenerate">发送</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 窗口列表 -->
  <div class="ni-sheet" id="niSessionSheet">
    <div class="ni-sheet-card">
      <div class="ni-sheet-head">
        <b>生图窗口</b>
        <button class="ni-close" id="niSessionClose" aria-label="关闭">✕</button>
      </div>
      <div id="niSessionList"></div>
      <button class="ni-mini-btn primary" id="niNewSession" style="width:100%;height:40px;margin-top:6px">＋ 新建窗口</button>
      <div class="ni-hint">每个窗口独立保存聊天与生成记录，可随时改名或删除。</div>
    </div>
  </div>

  <!-- 更多 -->
  <div class="ni-sheet ni-more-sheet" id="niMoreSheet">
    <div class="ni-more-card">
      <div class="ni-more-grid">
        <button type="button" class="ni-more-item" data-more="reroll">
          <span class="ni-more-icon" style="background:#007AFF"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.6 6.4"/><path d="M20 4v7h-7"/></svg></span>
          <span>重roll</span>
        </button>
        <button type="button" class="ni-more-item" data-more="image">
          <span class="ni-more-icon" style="background:#FF9500"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5-5 5-3-3-5 5"/></svg></span>
          <span>图片</span>
        </button>
        <button type="button" class="ni-more-item" data-more="file">
          <span class="ni-more-icon" style="background:#FF4D94"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h4"/></svg></span>
          <span>文件</span>
        </button>
        <button type="button" class="ni-more-item" data-more="settings">
          <span class="ni-more-icon" style="background:#5856D6"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M4 12h4M12 12h8"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/><circle cx="10" cy="12" r="2"/></svg></span>
          <span>设置</span>
        </button>
        <button type="button" class="ni-more-item" data-more="sessions">
          <span class="ni-more-icon" style="background:#34C759"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
          <span>窗口</span>
        </button>
        <button type="button" class="ni-more-item" data-more="clear">
          <span class="ni-more-icon" style="background:#FF3B30"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg></span>
          <span>清空</span>
        </button>
      </div>
      <button type="button" class="ni-more-cancel" id="niMoreCancel">取消</button>
    </div>
  </div>

  <!-- 双击气泡菜单（与私聊小菜单一致） -->
  <div class="ni-longpress-menu" id="niMsgSheet">
    <button type="button" class="ni-menu-item" data-msg-act="quote" id="niMsgQuote"><span class="ni-mi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 17l-5-5 5-5"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/></svg></span><span>引用</span></button>
    <button type="button" class="ni-menu-item" data-msg-act="copy" id="niMsgCopy"><span class="ni-mi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg></span><span>复制</span></button>
    <button type="button" class="ni-menu-item" data-msg-act="edit" id="niMsgEdit"><span class="ni-mi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3z"/><path d="M13.5 6.5l3 3"/></svg></span><span>编辑</span></button>
    <button type="button" class="ni-menu-item" data-msg-act="favorite" id="niMsgFavorite"><span class="ni-mi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.2 1 5.9-5.2-2.7-5.2 2.7 1-5.9L3.5 9.2l5.9-.9z"/></svg></span><span>收藏</span></button>
    <button type="button" class="ni-menu-item" data-msg-act="reroll" id="niMsgReroll"><span class="ni-mi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.9-3M4 4v4h4M4 13a8 8 0 0 0 14.9 3M20 20v-4h-4"/></svg></span><span>重roll</span></button>
    <button type="button" class="ni-menu-item" data-msg-act="download" id="niMsgDownload"><span class="ni-mi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg></span><span>下载</span></button>
    <button type="button" class="ni-menu-item" data-msg-act="ref" id="niMsgRef"><span class="ni-mi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5-5 5-3-3-5 5"/></svg></span><span>作为参考图</span></button>
    <div class="ni-menu-divider"></div>
    <button type="button" class="ni-menu-item danger" data-msg-act="delete"><span class="ni-mi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></span><span>删除</span></button>
  </div>

  <!-- 图片大图（与私聊图片查看器一致） -->
  <div class="ni-image-viewer" id="niImageViewer">
    <img id="niIvImg" src="" alt="图片">
    <div class="ni-iv-actions">
      <div class="ni-iv-act" id="niIvClose">取消</div>
      <div class="ni-iv-act" id="niIvReroll">重roll</div>
      <div class="ni-iv-act" id="niIvDownload">保存</div>
    </div>
  </div>

  <div class="ni-toast" id="niToast"></div>

  <script src="../js/nano-idb.js?v=20261028e"></script>
  <script src="../js/nano-gallery.js?v=20261028e"></script>
  <script src="../js/nano-image.js?v=20261028e"></script>
  <script src="../js/nano-image-studio.js?v=20261029h"></script>
  <script src="../swipe-back.js"></script>
</body>
</html>
