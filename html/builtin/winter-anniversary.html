<style>
 *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
 html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif}
 .card{position:relative;height:100%;background:rgba(255,255,255,calc(.78 * var(--wo,1)));backdrop-filter:blur(calc(9px * var(--wo,1))) saturate(145%);-webkit-backdrop-filter:blur(calc(9px * var(--wo,1))) saturate(145%);border-radius:6vw;border:1px solid rgba(238,242,246,calc(var(--wo,1)));box-shadow:0 1px 5px rgba(0,0,0,calc(.05 * var(--wo,1)));overflow:hidden;font-size:3.4vw}
 [contenteditable]{outline:none;caret-color:#bbb}
 .slot{position:absolute;background:#e4e4e4;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
 .slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
 .slot.has img{display:block}.slot.has .ph{display:none}
 .cap{position:absolute;left:0;right:0;bottom:5%;display:flex;align-items:center;justify-content:center;gap:.35em;color:#c9c9c9;font-style:italic;font-weight:500;white-space:nowrap}
</style>
<div class="card">
<div class="slot" data-k="p1" style="left:4.5%;top:21%;width:23.5%;height:53%;transform:rotate(-3deg)"><svg class="ph" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-4.5 4 3.5 3-2.5 4.5 3.5"/></svg><img alt=""></div><div class="slot" data-k="p2" style="left:28%;top:23%;width:22.5%;height:53%;transform:rotate(0deg)"><svg class="ph" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-4.5 4 3.5 3-2.5 4.5 3.5"/></svg><img alt=""></div><div class="slot" data-k="p3" style="left:50%;top:21%;width:23.5%;height:53%;transform:rotate(4deg)"><svg class="ph" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-4.5 4 3.5 3-2.5 4.5 3.5"/></svg><img alt=""></div><div class="slot" data-k="p4" style="left:73.5%;top:23%;width:22%;height:53%;transform:rotate(0deg)"><svg class="ph" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-4.5 4 3.5 3-2.5 4.5 3.5"/></svg><img alt=""></div>
  <div class="cap"><span contenteditable="true" spellcheck="false" data-t="cap">我们的冬天 未完待续</span></div>
</div>
<input id="pick" type="file" accept="image/*" hidden>
<script>
// 点灰色图片位选图，自动保存；点文字直接修改
var W=window.__nanoWidgetId||'',imgs=window.__nanoWidgetImages||{},pick=document.getElementById('pick'),cur='';
function setImg(k,src){document.querySelectorAll('.slot[data-k="'+k+'"]').forEach(function(b){b.querySelector('img').src=src;b.classList.add('has')})}
Object.keys(imgs).forEach(function(k){if(imgs[k])setImg(k,imgs[k])});
document.querySelectorAll('.slot').forEach(function(el){el.onclick=function(){cur=el.getAttribute('data-k');pick.value='';pick.click()}});
pick.onchange=function(){var f=pick.files&&pick.files[0];if(!f||!cur)return;var K=cur,r=new FileReader();
 r.onload=function(){var im=new Image();im.onload=function(){var max=900,s=Math.min(1,max/Math.max(im.width,im.height));
  var c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);var d=c.toDataURL('image/jpeg',.86);
  setImg(K,d);parent.postMessage({type:'nanoWidgetImage',widget:W,key:K,data:d},'*')};im.src=r.result};r.readAsDataURL(f)};
var SK='nanoTxt_'+W,saved={};try{saved=JSON.parse(localStorage.getItem(SK)||'{}')}catch(e){}
document.querySelectorAll('[data-t]').forEach(function(el){var k=el.getAttribute('data-t');
 if(saved[k]!=null)el.textContent=saved[k];
 el.addEventListener('input',function(){saved[k]=el.textContent;try{localStorage.setItem(SK,JSON.stringify(saved))}catch(e){}});
 el.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();el.blur()}})});

</script>
