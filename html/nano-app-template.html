<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Nano 应用模板</title>
<!--
  ============================================================
  Nano App 完整模板 v3（可读、可改、可整份重写）
  ------------------------------------------------------------
  结构：
    · 首页 home       —— 应用入口
    · 清单 items      —— 一个完整的增删改查示例
    · 详情 item       —— 从清单点进去的二级页
    · 设置 settings   —— 名称 / 图标 / 字体 / 角色 / 权限
    · 指南 guide      —— 页面写法、返回逻辑、Nano API

  返回逻辑（重点）：
    · 首页按返回  → 直接回 AppStore
    · 清单/设置按返回 → 先回首页，再按一次才回 AppStore
    · 二级页按返回 → 回到打开它的上一页
    · 每个页面都可以写 onBack(params) 自己接管返回：
        return true   自己处理完了
        return false  交给上一级（默认）
        return 'exit' 直接退出到 AppStore

  想加页面：
    App.define('my-page', {
      title: '我的页面',
      hideTab: true,
      html: function (params) { return '<div>内容</div>'; },
      mount: function (el, params) { ... },
      onBack: function (params) { return false; }
    });
    App.go('my-page');

  这个文件不依赖任何构建工具，直接保存成 .html 导入 AppStore 即可。
  ============================================================
-->
<script type="application/json" id="nano-manifest">{
  "id": "my-nano-app",
  "name": "Nano 应用模板",
  "icon": "◆",
  "color": "#5B6CFF",
  "desc": "完整可改写的 App 模板：首页 / 示例清单 / 二级页 / 设置 / DIY 返回栈 / 高权限",
  "version": "3.0.0",
  "highPermission": true,
  "permissions": ["*", "characters", "persona", "worldbook", "memory", "api", "chat", "image", "tts", "files", "gallery", "notify", "clipboard", "apps", "storage", "openUrl"]
}</script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --theme:#5B6CFF;
    --theme-soft:color-mix(in srgb,var(--theme) 11%,#fff);
    --ink:#171925;
    --ink-2:#4c5064;
    --muted:#8a8fa3;
    --line:rgba(25,30,60,.09);
    --bg:#f5f6fa;
    --surface:#fff;
    --danger:#ff3b30;
    --ok:#1fa971;
    --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
    --shadow:0 12px 34px rgba(30,35,80,.08);
  }
  html,body{width:100%;height:100%;overflow:hidden;position:fixed;inset:0;
    background:var(--bg);color:var(--ink);font-family:var(--font)}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  img{display:block}
  .app{position:absolute;inset:0;display:flex;flex-direction:column;
    background:radial-gradient(120% 65% at 50% -10%,var(--theme-soft),transparent 55%),var(--bg)}

  /* 顶栏：背景一直铺到灵动岛/刘海后面，按钮用 --safe-top 躲开它 */
  .topbar{flex:none;z-index:20;display:flex;align-items:center;gap:8px;
    padding:calc(var(--safe-top) + 8px) 12px 8px;min-height:56px;
    background:rgba(245,246,250,.82);
    -webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2);
    border-bottom:1px solid var(--line)}
  .tb-btn{width:38px;height:38px;border-radius:13px;flex:none;display:grid;place-items:center;
    background:rgba(255,255,255,.72);border:1px solid var(--line);color:var(--ink)}
  .tb-btn:active{transform:scale(.95)}
  .tb-btn svg{width:20px;height:20px}
  .tb-main{flex:1;min-width:0}
  .tb-title{font-size:17px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tb-sub{font-size:10.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tb-actions{display:flex;gap:6px;flex:none}
  .tb-action{padding:8px 11px;border-radius:11px;background:rgba(255,255,255,.72);
    border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--theme)}
  .tb-action:active{transform:scale(.96)}

  .screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 14px calc(92px + var(--safe-bottom));
    scrollbar-width:none;overscroll-behavior:contain}
  .screen::-webkit-scrollbar{display:none}
  .screen.enter{animation:screenIn .22s cubic-bezier(.3,.8,.35,1)}
  @keyframes screenIn{from{opacity:.35;transform:translateY(8px)}to{opacity:1;transform:none}}

  .tabbar{position:absolute;left:10px;right:10px;bottom:calc(8px + var(--safe-bottom));
    display:flex;justify-content:space-around;align-items:center;padding:7px 6px;
    background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:22px;
    box-shadow:var(--shadow);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);z-index:12}
  .tabbar[hidden]{display:none}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;
    border-radius:15px;color:var(--muted);font-size:10.5px;font-weight:700}
  .tab svg{width:21px;height:21px}
  .tab.on{color:var(--theme);background:var(--theme-soft)}

  .hero{padding:14px 2px 4px}
  .hero-row{display:flex;align-items:center;gap:12px}
  .avatar{width:54px;height:54px;border-radius:19px;flex:none;overflow:hidden;
    background:var(--theme-soft);display:grid;place-items:center;color:var(--theme);
    font-weight:800;font-size:21px}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .hero-name{font-size:23px;font-weight:850;letter-spacing:-.5px}
  .hero-sub{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.55}
  .section{margin-top:22px}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 10px}
  .section-title{font-size:13px;font-weight:800;color:var(--ink-2)}
  .section-more{font-size:11px;color:var(--theme);font-weight:700}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:20px;
    padding:15px;box-shadow:0 8px 24px rgba(30,35,80,.045)}
  .quick{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;min-height:112px}
  .quick:active{transform:scale(.98)}
  .quick .emoji{font-size:25px;line-height:1}
  .quick b{font-size:14.5px;font-weight:800}
  .quick span{font-size:11.5px;line-height:1.55;color:var(--muted)}
  .quick .tagline{font-size:10px;font-weight:800;color:var(--theme);background:var(--theme-soft);
    border-radius:999px;padding:3px 8px;margin-top:auto}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
  .stat .n{font-size:20px;font-weight:850;color:var(--theme)}
  .stat .l{font-size:10px;color:var(--muted);margin-top:3px}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;
    background:var(--surface);border:1px solid var(--line);font-size:11.5px;color:var(--ink-2);font-weight:600}
  .chip .dot{width:6px;height:6px;border-radius:50%;background:var(--theme)}
  .char-row{display:flex;gap:10px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
  .char-row::-webkit-scrollbar{display:none}
  .char{width:64px;flex:none;text-align:center}
  .char .avatar{width:56px;height:56px;border-radius:19px;margin:0 auto 5px;font-size:20px}
  .char .name{font-size:10.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .row{display:flex;align-items:center;gap:11px;width:100%;padding:12px 13px;
    background:var(--surface);border:1px solid var(--line);border-radius:16px;text-align:left}
  .row:active{background:#fafbff}
  .row .icon{width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-items:center;
    background:var(--theme-soft);color:var(--theme);font-size:17px;font-weight:800}
  .row .main{flex:1;min-width:0}
  .row .t{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .d{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.45;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .v{font-size:10.5px;color:var(--muted);flex:none}
  .row .chev{width:8px;height:13px;flex:none;color:#c7c9d6}
  .list{display:flex;flex-direction:column;gap:8px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:11px 16px;border-radius:14px;background:var(--theme);color:#fff;
    font-size:13.5px;font-weight:750;box-shadow:0 8px 20px color-mix(in srgb,var(--theme) 28%,transparent)}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:var(--surface);color:var(--ink-2);border:1px solid var(--line);box-shadow:none}
  .btn.soft{background:var(--theme-soft);color:var(--theme);box-shadow:none}
  .btn.danger{background:rgba(255,59,48,.1);color:var(--danger);box-shadow:none}
  .btn.block{width:100%}
  .btn.sm{padding:7px 11px;font-size:12px;border-radius:11px;box-shadow:none}
  .btn:disabled{opacity:.4}

  .empty{padding:46px 18px;text-align:center;color:var(--muted)}
  .empty .big{font-size:32px;color:#d4d6e2;margin-bottom:10px}
  .empty b{display:block;font-size:14px;color:var(--ink-2);margin-bottom:5px}
  .empty span{font-size:12px;line-height:1.65}
  .notice{font-size:11px;line-height:1.65;color:var(--muted);margin-top:10px}
  .notice b{color:var(--ink-2)}

  .field{margin:10px 0}
  .field label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px}
  .field input,.field textarea,.field select{width:100%;border:1px solid var(--line);
    border-radius:13px;padding:10px 12px;font-size:14px;outline:none;background:var(--surface);
    color:var(--ink);font-family:inherit}
  .field textarea{min-height:78px;resize:vertical;line-height:1.55}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--theme)}
  .field-row{display:flex;gap:8px;align-items:center}
  .field-row input[type=color]{width:46px;height:40px;border:1px solid var(--line);
    border-radius:12px;background:#fff;padding:2px;flex:none}
  .toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:11px 0;border-top:1px solid var(--line)}
  .toggle:first-child{border-top:0}
  .toggle .tl{font-size:13px;font-weight:600}
  .toggle .ts{font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.4}
  .sw{width:46px;height:28px;border-radius:16px;background:#e3e4ec;position:relative;
    transition:.18s;flex:none;border:0}
  .sw::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;
    background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.18s}
  .sw.on{background:var(--theme)}
  .sw.on::after{left:20px}

  .addbar{display:flex;gap:8px;margin:2px 0 12px}
  .addbar input{flex:1;border:1px solid var(--line);border-radius:14px;padding:11px 13px;
    font-size:14px;outline:none;background:var(--surface);font-family:inherit}
  .addbar input:focus{border-color:var(--theme)}
  .addbar .btn{flex:none;padding:0 15px;height:44px}

  .detail-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;
    padding:16px;margin-top:8px;box-shadow:0 8px 24px rgba(30,35,80,.045)}
  .detail-meta{font-size:11px;color:var(--muted);margin-bottom:12px}

  .guide-block{margin-top:12px;padding:12px 14px;border-radius:15px;background:var(--surface);
    border:1px solid var(--line);font-size:12px;line-height:1.75;color:var(--muted)}
  .guide-block b{color:var(--ink-2)}
  .guide-block code{background:var(--theme-soft);border-radius:6px;padding:1px 6px;
    font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--theme)}
  .code{white-space:pre-wrap;word-break:break-word;background:#f7f8fc;border:1px solid var(--line);
    border-radius:13px;padding:12px;margin-top:8px;font-family:ui-monospace,Menlo,monospace;
    font-size:10.5px;line-height:1.65;color:#4c5064;max-height:260px;overflow:auto}
  .perm-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .perm{font-size:10px;font-weight:700;padding:4px 8px;border-radius:999px;
    background:var(--theme-soft);color:var(--theme)}

  .toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-bottom));transform:translate(-50%,10px);
    background:rgba(23,25,37,.92);color:#fff;font-size:12.5px;padding:10px 16px;border-radius:999px;
    opacity:0;transition:.2s;pointer-events:none;z-index:80;max-width:82%;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .modal{position:fixed;inset:0;z-index:90;background:rgba(20,22,45,.42);
    display:none;align-items:center;justify-content:center;padding:22px}
  .modal.on{display:flex}
  .modal-card{width:100%;max-width:340px;max-height:calc(100vh - 44px);overflow-y:auto;
    background:#fff;border-radius:22px;padding:20px;box-shadow:0 24px 70px rgba(20,22,45,.22)}
  .modal-card h3{font-size:16px;font-weight:800;margin-bottom:8px}
  .modal-card p{font-size:12.5px;line-height:1.65;color:var(--muted)}
  .modal-card input{width:100%;margin-top:12px;border:1px solid var(--line);border-radius:12px;
    padding:11px 12px;font-size:14px;outline:none;font-family:inherit}
  .modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}
  .modal-btn{height:44px;border-radius:13px;font-size:13.5px;font-weight:700;
    background:#f1f2f7;color:var(--ink-2)}
  .modal-btn.primary{background:var(--theme);color:#fff}
  .modal-btn.danger{background:var(--danger);color:#fff}
  .boot{padding:70px 24px;text-align:center;color:var(--muted);font-size:13px;line-height:1.7}
  .boot b{display:block;color:var(--ink);font-size:17px;margin-bottom:8px}
  @media(max-width:360px){.grid2{grid-template-columns:1fr}.quick{min-height:auto}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="tb-btn" id="tbBack" aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="tb-main">
      <div class="tb-title" id="tbTitle">Nano 应用模板</div>
      <div class="tb-sub" id="tbSub">首页返回 AppStore · 内部页面自己 DIY</div>
    </div>
    <div class="tb-actions" id="tbActions"></div>
  </header>
  <main class="screen" id="screenHost"></main>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="modal-card" id="modalCard"></div></div>
<script src="../js/nano-app-bridge.js?v=20261023d"></script>
<script>
(function () {
  'use strict';

  var DEFAULT = {
    name: 'Nano 应用模板',
    icon: { letter: '◆', color: '#5B6CFF', image: '' },
    charIds: [],
    useCharPersona: true,
    useUserPersona: true,
    useWorldbook: true,
    useMemory: true,
    fontUrl: '',
    welcome: '这是一个完整的 App 模板，直接改内容就能用。'
  };

  var App = {
    defs: {},
    config: null,
    user: {},
    chars: [],
    apiConnected: false,
    items: [],
    current: 'home',
    tab: 'home',
    params: {},
    stack: [],
    booted: false
  };
  var saveTimer = null;
  var modalResolve = null;

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function byId(id) { return App.chars.filter(function (c) { return c.id === id; })[0] || null; }
  function avatarOf(o, me) {
    var a = me ? (App.user && App.user.avatar) : (o && o.avatar);
    var n = (o && (o.name || o.id)) || '?';
    return '<div class="avatar">' + (a ? '<img src="' + esc(a) + '" alt="">' : esc(String(n).charAt(0))) + '</div>';
  }
  function toast(text) {
    var el = $('toast');
    el.textContent = text; el.classList.add('show');
    clearTimeout(el._t); el._t = setTimeout(function () { el.classList.remove('show'); }, 1700);
  }
  function merge(a, b) {
    var out = {};
    Object.keys(a || {}).forEach(function (k) { out[k] = a[k]; });
    Object.keys(b || {}).forEach(function (k) {
      out[k] = (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k])) ? merge(a[k] || {}, b[k]) : b[k];
    });
    if (b && b.icon) out.icon = merge(a.icon || {}, b.icon);
    return out;
  }
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try {
        Nano.store.set('app_state_v3', {
          config: App.config,
          items: App.items.slice(0, 800),
          savedAt: Date.now()
        }).catch(function () {});
      } catch (e) {}
    }, 120);
  }

  /* ---------------- 路由：所有页面都在这里 ---------------- */
  App.define = function (id, def) { App.defs[id] = def || {}; };
  App.go = function (id, params) {
    if (!App.defs[id]) { toast('页面不存在：' + id); return; }
    if (['home', 'items', 'settings'].indexOf(id) > -1) { App.switchTab(id); return; }
    if (App.current) App.stack.push({ id: App.current, params: App.params, tab: App.tab });
    App.current = id; App.params = params || {};
    App.render();
  };
  App.switchTab = function (tab) {
    if (!App.defs[tab]) return;
    App.tab = tab; App.current = tab; App.params = {}; App.stack = [];
    App.render();
  };
  App.home = function () { App.switchTab('home'); };
  App.exit = function () {
    try { Nano.close(); } catch (e) { try { history.back(); } catch (e2) {} }
  };
  // 返回：页面自己的 onBack → 弹窗 → 页面栈 → 回到所属 tab → 回首页 → false（交给 AppStore）
  App.back = function () {
    var def = App.defs[App.current];
    if (def && typeof def.onBack === 'function') {
      var r = def.onBack(App.params);
      if (r === true) return true;
      if (r === 'exit') { App.exit(); return true; }
    }
    if ($('modal').classList.contains('on')) { closeModal(); return true; }
    if (App.stack.length) {
      var prev = App.stack.pop();
      App.current = prev.id; App.params = prev.params || {}; App.tab = prev.tab || App.tab;
      App.render();
      return true;
    }
    if (App.current !== App.tab) { App.current = App.tab; App.params = {}; App.render(); return true; }
    if (App.tab !== 'home') { App.switchTab('home'); return true; }
    return false;
  };
  App.render = function () {
    var def = App.defs[App.current] || App.defs.home;
    if (!def) return;
    var theme = (App.config && App.config.icon && App.config.icon.color) || '#5B6CFF';
    $('app') /* not used */;
    document.querySelector('.app').style.setProperty('--theme', theme);
    var title = typeof def.title === 'function' ? def.title(App.params) : (def.title || App.config.name);
    $('tbTitle').textContent = title;
    $('tbSub').textContent = typeof def.sub === 'function' ? def.sub(App.params) : (def.sub || '');
    var actions = typeof def.actions === 'function' ? def.actions(App.params) : (def.actions || []);
    $('tbActions').innerHTML = (actions || []).map(function (a) {
      return '<button class="tb-action" data-tbact="' + esc(a.id) + '">' + esc(a.label) + '</button>';
    }).join('');
    Array.prototype.forEach.call($('tbActions').querySelectorAll('[data-tbact]'), function (btn) {
      btn.onclick = function () {
        var id = btn.getAttribute('data-tbact');
        if (def.onAction) def.onAction(id, App.params);
      };
    });
    var host = $('screenHost');
    host.classList.remove('enter');
    host.innerHTML = typeof def.html === 'function' ? def.html(App.params) : (def.html || '');
    void host.offsetWidth;
    host.classList.add('enter');
    $('tabbar').hidden = !!def.hideTab;
    renderTabs();
    if (def.mount) {
      try { def.mount(host, App.params); } catch (e) { console.warn(e); }
    }
  };
  function renderTabs() {
    var tabs = [
      { id: 'home', label: '首页', icon: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>' },

  function confirmBox(title, text, okText) {
    return new Promise(function (resolve) {
      openModal('<h3>' + esc(title) + '</h3><p>' + esc(text) + '</p>' +
        '<div class="modal-actions"><button class="modal-btn" data-m="0">取消</button>' +
        '<button class="modal-btn primary" data-m="1">' + esc(okText || '确定') + '</button></div>');
      modalResolve = resolve;
      $('modalCard').querySelector('[data-m="0"]').onclick = function () { closeModal(); };
      $('modalCard').querySelector('[data-m="1"]').onclick = function () {
        $('modal').classList.remove('on'); modalResolve = null; resolve(true);
      };
    });
  }
  function promptBox(title, value, placeholder) {
    return new Promise(function (resolve) {
      openModal('<h3>' + esc(title) + '</h3>' +
        '<input id="promptInput" value="' + esc(value || '') + '" placeholder="' + esc(placeholder || '') + '">' +
        '<div class="modal-actions"><button class="modal-btn" data-m="0">取消</button>' +
        '<button class="modal-btn primary" data-m="1">确定</button></div>');
      modalResolve = resolve;
      var input = $('promptInput');
      setTimeout(function () { try { input.focus(); input.select(); } catch (e) {} }, 80);
      if (input) input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          var ok = $('modalCard').querySelector('[data-m="1"]');
          if (ok) ok.click();
        }
      });
      $('modalCard').querySelector('[data-m="0"]').onclick = function () { closeModal(); };
      $('modalCard').querySelector('[data-m="1"]').onclick = function () {
        var v = input.value.trim();
        $('modal').classList.remove('on'); modalResolve = null; resolve(v || '');
      };
    });
  }

        '二级页按返回 → 回到打开它的上一页。<br>' +
        '页面里的 <code>onBack</code> 可以自己接管：<code>return true</code> 自己处理，<code>return false</code> 交给上一级，<code>return \'exit\'</code> 直接退出。</div>' +
        '<div class="guide-block"><b>3. 加一个二级页</b><br>照着 <code>item</code> 页面抄：<code>App.go(\'detail\', {id})</code> 打开，按返回会自动回到示例清单。</div>' +
        '<div class="guide-block"><b>4. 高权限 API</b><br>' +
        'Nano.characters / currentUser / persona / worldbook / memory<br>' +
        'Nano.chat({ charIds, messages, system })<br>' +
        'Nano.image.generate(prompt, opts)<br>' +
        'Nano.tts.speak(text, opts)<br>' +
        'Nano.files.add / list / remove<br>' +
        'Nano.gallery.add / list / remove<br>' +
        'Nano.store.get / set / remove<br>' +
        'Nano.notify(title, body) · Nano.clipboard.write(text)<br>' +
        'Nano.openApp(id) · Nano.openUrl(url)<br>' +
        '所有调用都返回 Promise。</div>' +
        '<div class="guide-block"><b>5. 字体</b><br>设置里可以填字体直链。Catbox 这类直链通常能直接加载；如果字体站禁止跨域或国内访问不了，点「用代理」会生成 Worker 的 <code>/font?url=</code> 地址（需要部署新版 push-worker）。</div>' +
        '<button class="btn block" id="cpPrompt" style="margin-top:14px">复制 AI 改造提示词</button>' +
        '<button class="btn ghost block" id="cpSkeleton" style="margin-top:8px">复制页面骨架</button>' +
        '<button class="btn ghost block" id="backHome" style="margin-top:8px">回到首页</button>';
    },
    mount: function (el) {
      var skeleton = "App.define('my-page', {\n  title: '我的页面',\n  hideTab: true,\n  html: function (p) {\n    return '<div>内容</div>';\n  },\n  mount: function (el, p) {\n    // el 是本页容器\n  },\n  onBack: function (p) {\n    return false;\n  }\n});\n\nApp.go('my-page');";
      var prompt = '你在改一个运行在 Nano AppStore 里的单文件 HTML 应用。请保留 <script id="nano-manifest">、App.define / App.go / App.back 这套结构，权限写 ["*"]。\n' +
        '要求：首页按返回直接回 AppStore；清单/设置先回首页；二级页返回回到打开它的上一页；页面可以用 onBack 自己接管返回。\n' +
        '新功能要完整可操作，状态用 Nano.store 存档。只输出完整 HTML，不要解释。';
      var p1 = $('cpPrompt'); if (p1) p1.onclick = function () { Nano.clipboard.write(prompt).then(function () { toast('已复制提示词'); }).catch(function () { toast('复制失败'); }); };
      var p2 = $('cpSkeleton'); if (p2) p2.onclick = function () { Nano.clipboard.write(skeleton).then(function () { toast('已复制骨架'); }).catch(function () { toast('复制失败'); }); };
      var back = $('backHome'); if (back) back.onclick = function () { App.switchTab('home'); };
    },
    onBack: function () { return false; }
  });

  /* ---------------- 字体 ---------------- */
  function applyFont() {
    var url = String((App.config && App.config.fontUrl) || '').trim();
    var style = document.getElementById('nanoFontStyle');
    if (!style) {
      style = document.createElement('style');
      style.id = 'nanoFontStyle';
      document.head.appendChild(style);
    }
    if (!url) {
      style.textContent = '';
      document.documentElement.style.removeProperty('--font');
      return;
    }
    style.textContent = '@font-face{font-family:"NanoCustom";src:url(' + JSON.stringify(url) + ');font-display:swap}';
    document.documentElement.style.setProperty('--font', '"NanoCustom",-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif');
  }

  /* ---------------- 新建清单 ---------------- */
  function newItemFlow() {
    promptBox('新建一条', '', '比如：明天买牛奶').then(function (title) {
      if (!title) return;
      addItem(title);
      App.switchTab('items');
      toast('已添加');
    });
  }

  /* ---------------- 顶栏 & 启动 ---------------- */
  $('tbBack').onclick = function () {
    if (!App.back()) App.exit();
  };
  $('modal').addEventListener('click', function (e) { if (e.target === $('modal')) closeModal(); });
  try {
    Nano.onBack(function () { return App.back(); });
  } catch (e) {}

  (async function boot() {
    try {
      if (!window.Nano) throw new Error('Nano 桥未加载');
      if (window.parent === window) throw new Error('这个文件要在 Nano AppStore 里导入运行');
      await Promise.race([
        Nano.ready(),
        new Promise(function (_, reject) { setTimeout(function () { reject(new Error('连接宿主超时')); }, 5000); })
      ]);
      var r = await Promise.all([
        Nano.store.get('app_state_v3'),
        Nano.characters(),
        Nano.currentUser(),
        Nano.apiConfig()
      ]);
      App.chars = r[1] || [];
      App.user = r[2] || {};
      App.apiConnected = !!(r[3] && r[3].connected);
      var saved = r[0] || {};
      App.config = merge(DEFAULT, saved.config || {});
      App.config.icon = merge(DEFAULT.icon, App.config.icon || {});
      if (!Array.isArray(App.config.charIds)) App.config.charIds = [];
      App.items = Array.isArray(saved.items) ? saved.items : [];
      App.booted = true;
      applyFont();
      App.switchTab('home');
    } catch (e) {
      $('screenHost').innerHTML = '<div class="boot"><b>无法启动</b>' + esc((e && e.message) || e) + '<br><br>请确认是从 AppStore 打开这个应用。</div>';
      $('tabbar').hidden = true;
    }
  })();
})();
</script>
</body>
</html>
