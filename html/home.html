<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="../js/nano-runtime.js?v=20261023a"></script>
<meta charset="UTF-8">
<script src="../js/nano-idb.js"></script>
<script>window.__NANO_FONT_ONLY = true;</script>
<script src="../js/appearance.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="../icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>纳米桌面</title>
<style>
:root{--ink:#141414;--ic:60px;--dock-h:86px;--safe-b:env(safe-area-inset-bottom);--safe-t:env(safe-area-inset-top)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;color:var(--ink);overscroll-behavior:none;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",sans-serif}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
svg{display:block}
img{-webkit-user-drag:none;user-drag:none}

.phone{position:fixed;inset:0;max-width:480px;margin:0 auto;background:#fff;overflow:hidden}
/* 开屏期间隐藏主界面，避免开屏淡出时闪一下桌面 */

/* ---------- pages ---------- */
.pager{position:absolute;left:0;right:0;top:var(--safe-t);bottom:calc(var(--dock-h) + 13px + var(--safe-b) + 38px);display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;touch-action:pan-x pan-y;overscroll-behavior:contain}
.pager::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;width:100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow-x:hidden;overflow-y:auto;scrollbar-width:none;overscroll-behavior-y:contain}
.page::-webkit-scrollbar{display:none}
.grid{position:relative;margin:var(--gt,44px) 18px 8px}

/* ---------- items ---------- */
.it{position:absolute;touch-action:inherit;outline:none}
.it.lift{opacity:0;animation:none!important}
.ghost{position:fixed!important;z-index:200;pointer-events:none;animation:none!important;filter:drop-shadow(0 14px 22px rgba(0,0,0,.2));transition:none}
.ghost .del{display:none!important}

.it.app,.it.dk{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.icon-wrap{width:var(--ic);height:var(--ic);border-radius:calc(var(--ic)*.3);display:grid;place-items:center;flex:none;background:linear-gradient(160deg,#2b2b2b,#0e0e0e);box-shadow:0 6px 14px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.12)}
.icon-wrap svg{width:calc(var(--ic)*.45);height:calc(var(--ic)*.45);fill:currentColor;color:#fff}
.icon-wrap img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.app-icon-custom{width:var(--ic);height:var(--ic);object-fit:contain;display:block;flex:none}
.app-icon-custom.fill{object-fit:cover;border-radius:inherit}
.icon-wrap.custom-fill{overflow:hidden;padding:0;background:#f2f2f7}
.icon-wrap.custom-fill .app-icon-custom.fill{width:100%;height:100%;border-radius:inherit}
.app-name{font-size:11px;font-weight:520;line-height:1.2;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;color:#333;letter-spacing:-.15px}
.it.dk{position:relative}
.it.dk .icon-wrap{width:57px;height:57px;border-radius:18px}
.it.dk .icon-wrap svg{width:26px;height:26px}
.it.dk .app-icon-custom{width:57px;height:57px}
.it.dk .app-name{display:none}

.it.wd{cursor:default}
.wi{position:absolute;left:0;top:0;transform-origin:0 0;font-size:14px;line-height:1.25;color:var(--ink);--wo:1}
.card{background:rgba(255,255,255,var(--wo));border:1px solid rgba(0,0,0,calc(.07 * var(--wo)));border-radius:26px;box-shadow:0 8px 22px rgba(0,0,0,calc(.055 * var(--wo)))}
.del{display:none;position:absolute;left:-9px;top:-9px;width:26px;height:26px;border-radius:50%;background:#141414;color:#fff;place-items:center;z-index:6;box-shadow:0 2px 8px rgba(0,0,0,.25);border:2px solid #fff}
.editing .it.wd .del{display:grid}
.editing .it.wd .wi *{pointer-events:none}

[data-k]{outline:none}
[contenteditable="true"]{-webkit-user-select:text;user-select:text;background:rgba(0,0,0,.06);border-radius:6px;box-shadow:0 0 0 3px rgba(0,0,0,.06);cursor:text}

.img-slot{position:relative;overflow:hidden;display:grid;place-items:center;background:#efefef;color:#bdbdbd;cursor:pointer}
.img-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.img-slot svg{width:36%;height:36%;max-width:44px;max-height:44px}

/* call */
.wi.call{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px}
.call .av{width:62px;height:62px;border-radius:50%;flex:none}
.nm{font-size:16px;font-weight:650;letter-spacing:-.2px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.call .bt{display:flex;gap:8px}
.pill{width:66px;height:32px;border-radius:16px;display:grid;place-items:center;color:#fff;cursor:pointer;transition:transform .12s}
.pill:active{transform:scale(.94)}
.pill.dark{background:#111}
.pill.grey{background:#a9a9a9}

/* bubbles */
.wi.bub{display:flex;justify-content:space-around;align-items:center}
.bub .col{display:flex;flex-direction:column;align-items:center;gap:15px;width:160px}
.bubble{position:relative;background:#141414;color:#fff;border-radius:18px;padding:9px 16px;font-size:14px;font-weight:560;text-align:center;min-width:62px;max-width:158px;box-shadow:0 6px 16px rgba(0,0,0,.14)}
.bubble:after{content:"";position:absolute;left:50%;bottom:-5px;width:11px;height:11px;margin-left:-5.5px;background:#141414;transform:rotate(45deg);border-radius:3px}
.bubble span{position:relative;z-index:1;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ring{width:92px;height:92px;border-radius:50%;padding:5px;border:2px solid #141414;box-shadow:0 0 0 4px #efefef;background:#fff}
.ring .img-slot{width:100%;height:100%;border-radius:50%}
.wi.bub.sm .col{width:80px;gap:11px}
.bub.sm .bubble{font-size:12px;padding:6px 11px;min-width:42px;max-width:80px;border-radius:14px;box-shadow:0 4px 10px rgba(0,0,0,.12)}
.bub.sm .bubble:after{width:8px;height:8px;bottom:-4px;margin-left:-4px;border-radius:2px}
.bub.sm .ring{width:60px;height:60px;padding:3px;border-width:1.5px;box-shadow:0 0 0 3px #efefef}

/* send */
.wi.snd{background:rgba(240,240,240,var(--wo));border-radius:26px;padding:13px 14px;display:flex;flex-direction:column;justify-content:space-between}
.snd .h{display:flex;align-items:center;gap:6px;font-size:17px;font-weight:700;padding-left:2px}
.snd .r2{display:flex;align-items:center;gap:12px}
.snd .sq{width:40px;height:40px;border-radius:12px;flex:none;background:#e0e0e0}
.snd .lb{flex:1;font-size:16px;font-weight:500;min-width:0}
.snd .lb span{display:inline-block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
.snd .chev{color:#a9a9a9;flex:none}
.snd .msg{background:#fff;border-radius:16px;height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;font-size:14px;color:#8c8c8c;gap:10px}
.snd .msg span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.snd .msg .tag{color:#5d6e93;flex:none;max-width:40%}
.snd .r4{display:flex;gap:10px;align-items:center}
.snd .inp{flex:1;min-width:0;height:40px;background:#fff;border-radius:20px;border:0;padding:0 15px;font-size:16px;outline:none;font-family:inherit;color:var(--ink);-webkit-user-select:text;user-select:text;-webkit-appearance:none}
.snd .go{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:15px;font-weight:600;cursor:pointer;flex:none;transition:transform .12s}
.snd .go:active{transform:scale(.92)}

/* stats */
.wi.st{padding:17px 18px 0;display:flex;flex-direction:column}
.st .top{display:flex;align-items:center;gap:16px}
.st .av{width:62px;height:62px;border-radius:50%;flex:none}
.st .tt{min-width:0;flex:1}
.st .nm{font-size:19px;font-weight:700}
.st .sub{display:block;color:#c2c2c2;font-size:14px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .nums{display:flex;justify-content:space-around;margin-top:auto;padding-bottom:16px}
.st .nums>div{text-align:center;min-width:56px}
.st .n{display:block;font-size:18px;font-weight:550}
.st .l{font-size:12.5px;color:#b5b5b5;margin-top:3px}

/* post */
.wi.po{padding:14px;display:flex;flex-direction:column}
.po .hd{display:flex;align-items:center;gap:11px}
.po .av{width:42px;height:42px;border-radius:50%;flex:none}
.po .who{flex:1;min-width:0}
.po .nm{font-size:16px;font-weight:600}
.po .tm{display:block;font-size:12px;color:#a8a8a8;margin-top:2px}
.po .more{color:#b0b0b0;flex:none}
.po .tx{display:block;font-size:15px;margin:11px 2px 9px;color:#2c2c2c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.po .pic{flex:1;min-height:0;border-radius:16px}
.po .ft{display:flex;justify-content:space-around;margin-top:11px;padding-top:11px;border-top:1px solid #e8e8e8;color:#a0a0a0;font-size:14px}
.po .ft>div{display:flex;align-items:center;gap:6px;cursor:pointer}
.po .ft .on{color:#141414}
.po .ft .on svg{fill:#141414}

/* menu */
.wi.mn{}
.mn .avl{position:absolute;left:20px;top:16px;width:76px;height:76px;border-radius:50%;z-index:2}
.mn .mh{position:absolute;left:112px;top:24px;right:16px;min-width:0}
.mn .nm{font-size:20px;font-weight:700}
.mn .id{font-size:14px;color:#8a8a8a;font-weight:550;margin-top:3px;white-space:nowrap}
.mn .panel{position:absolute;left:8px;right:8px;bottom:8px;top:72px;background:rgba(245,245,245,var(--wo));border-radius:24px;padding:36px 18px 4px;display:flex;flex-direction:column}
.mn .sig{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14.5px;font-weight:500;height:50px;border-bottom:1px solid #e6e6e6;flex:none}
.mn .sig span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mn .sig svg{color:#c4c4c4;flex:none}
.mn .row{flex:1;display:flex;align-items:center;gap:18px;font-size:16px;font-weight:550;cursor:pointer}
.mn .row+.row{background:linear-gradient(#e8e8e8,#e8e8e8) 40px 0/calc(100% - 40px) 1px no-repeat}
.mn .row .t{flex:1}
.mn .row .chev{color:#c4c4c4}

/* photo */
.wi.ph{border-radius:26px;overflow:hidden;border:1px solid rgba(0,0,0,calc(.07 * var(--wo)));box-shadow:0 8px 22px rgba(0,0,0,calc(.055 * var(--wo)))}
.ph .img-slot{width:100%;height:100%;background:#f1f1f1}

/* about */
.wi.ab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding-top:34px}
.ab .bb{position:absolute;right:34px;top:14px;background:#ababab;color:#fff;border-radius:24px;padding:12px 24px;font-size:15px;font-weight:550;min-width:116px;max-width:190px;text-align:center}
.ab .bb:after{content:"";position:absolute;left:18px;bottom:-12px;width:18px;height:14px;background:#ababab;clip-path:polygon(0 0,100% 0,0 100%)}
.ab .bb span,.ab .q span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab .rg{width:132px;height:132px;border-radius:50%;border:4px solid #c8c8c8;overflow:hidden;background:#fff;flex:none}
.ab .rg .img-slot{width:100%;height:100%;border-radius:50%;background:#fafafa}
.ab .sr{width:calc(100% - 52px);height:48px;border-radius:24px;background:#ececec;display:flex;align-items:center;padding:0 10px 0 16px;gap:10px;flex:none}
.ab .q{flex:1;text-align:center;font-size:18px;font-weight:650;min-width:0}
.ab .xx{width:28px;height:28px;border-radius:50%;background:#8e8e93;color:#fff;display:grid;place-items:center;flex:none}

/* moment */
.wi.mo{display:flex;flex-direction:column;align-items:center;gap:12px}
.mo .mc{flex:1;min-height:0;width:100%;padding:14px 14px 12px;display:flex;flex-direction:column;gap:12px;border-radius:30px}
.mo .hd{display:flex;align-items:center;gap:12px;flex:none}
.mo .av{width:50px;height:50px;border-radius:50%;flex:none}
.mo .who{flex:1;min-width:0}
.mo .nm{font-size:16px;font-weight:650}
.mo .tm{display:block;font-family:"Songti SC","Noto Serif SC","Source Han Serif SC",serif;font-size:13px;color:#9a9a9a;font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mo .go{color:#141414;flex:none}
.mo .pics{flex:1;min-height:0;display:flex;gap:7px}
.mo .pics .img-slot{flex:1;border-radius:16px;background:#e9e9e9}
.mo .ft{display:flex;justify-content:space-around;align-items:center;font-family:"Songti SC","Noto Serif SC","Source Han Serif SC",serif;font-size:17px;font-weight:600;flex:none}
.mo .ft>div{display:flex;align-items:center;gap:6px}
.mo .ft span[data-act]{display:grid;cursor:pointer}
.mo .ft .on svg{fill:#141414}
.mo .pl{height:46px;width:150px;border-radius:23px;background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.08);border:1px solid rgba(0,0,0,.05);display:flex;align-items:center;justify-content:center;gap:26px;flex:none}
.mo .pl i{width:1.5px;height:14px;background:#555;border-radius:1px}

/* profile grid */
.wi.gd{display:flex;flex-direction:column;gap:14px}
.gd .gc{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;border-radius:32px}
.gd .gh{display:flex;align-items:center;gap:14px;padding:14px 16px;flex:none}
.gd .av{width:62px;height:62px;border-radius:50%;flex:none}
.gd .tt{min-width:0;flex:1}
.gd .nm{font-size:17px;font-weight:700}
.gd .sub{display:block;color:#b0b0b0;font-size:13px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gd .gg{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:2px}
.gd .gg .img-slot{border-radius:0;background:#e6e6e6;min-height:0}
.gd .gs{display:flex;justify-content:space-around;padding:12px 8px 14px;flex:none}
.gd .gs>div{min-width:60px}
.gd .n{display:block;font-size:17px;font-weight:700}
.gd .l{font-size:12.5px;color:#444;margin-top:2px}
.gd .mnu{width:70%;background:rgba(236,236,236,var(--wo));border-radius:30px;padding:16px 22px;display:flex;flex-direction:column;gap:16px;flex:none}
.gd .mnu>div{display:flex;align-items:center;gap:16px;font-size:17px;font-weight:500;cursor:pointer}

/* custom html */
.wi.cu{border-radius:22px;overflow:hidden}
.cu iframe{border:0;width:100%;height:100%;display:block;pointer-events:none;background:transparent}
.cu.live iframe{pointer-events:auto}
.cu .img-slot{width:100%;height:100%;border-radius:22px;background:#f3f3f3}
/* 有包裹的小组件：统一白色轻毛玻璃；时钟/照片/自定义 HTML 等无包裹的不处理 */
.card,.wi.snd,.mn .panel,.gd .mnu,.pr .fr,.pf2,.wi.mq,.wi.cp{
  background:rgba(255,255,255,calc(.78 * var(--wo,1)));
  backdrop-filter:blur(calc(9px * var(--wo,1))) saturate(145%);
  -webkit-backdrop-filter:blur(calc(9px * var(--wo,1))) saturate(145%);
}
.editing .it.wd .cu{outline:1.5px dashed rgba(0,0,0,.2);outline-offset:-1px}

/* resize / edit badges */
.rsz,.edc{display:none;position:absolute;width:26px;height:26px;border-radius:50%;background:#fff;color:#141414;place-items:center;z-index:6;box-shadow:0 2px 8px rgba(0,0,0,.2);border:1px solid rgba(0,0,0,.08)}
.rsz{right:-8px;bottom:-8px}
.edc{right:-8px;top:-8px}
.editing .it.wd .rsz,.editing .it.wd .edc{display:grid}
.ghost .rsz,.ghost .edc{display:none!important}

/* html editor */
.edbody{padding:6px 18px 0;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.edbody textarea{width:100%;height:170px;border:0;border-radius:16px;background:#f4f4f4;padding:12px 14px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;color:#141414;resize:none;outline:none;-webkit-user-select:text;user-select:text;-webkit-appearance:none}
.edname{flex:1;min-width:0;height:38px;border:0;border-radius:12px;background:#f4f4f4;padding:0 12px;font-size:14px;color:#141414;outline:none;-webkit-user-select:text;user-select:text;-webkit-appearance:none}
.edname::placeholder{color:#b5b5b5}
.edrow{display:flex;align-items:center;gap:10px}
.edrow>span{font-size:13px;color:#8a8a8a;flex:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 12px;border-radius:15px;background:#f1f1f1;font-size:13px;cursor:pointer}
.chip.on{background:#141414;color:#fff}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}
.chk input{width:18px;height:18px;accent-color:#141414}
.grow{flex:1}
.btn{height:42px;padding:0 20px;border-radius:21px;display:grid;place-items:center;font-size:14px;font-weight:600;background:#f1f1f1;cursor:pointer}
.btn.dark{background:#141414;color:#fff;flex:1}


/* ---- ins profile ---- */
.wi.ig{padding:10px 14px 11px;display:flex;flex-direction:column;justify-content:space-between;gap:5px}
.ig .top{display:flex;align-items:center;gap:7px;flex:none;height:24px}
.ig .bk{display:grid;flex:none}
.ig .bk svg,.ig .rt svg{width:18px;height:18px}
.ig .nmx{flex:1;display:flex;align-items:center;gap:5px;font-size:14.5px;font-weight:800;letter-spacing:.2px;min-width:0}
.ig .nmx>span[data-k]{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ig .vf{flex:none;display:grid}
.ig .vf svg{width:15px;height:15px}
.ig .rt{display:flex;gap:12px;align-items:center;flex:none}
.ig .main{display:flex;align-items:center;gap:13px;flex:none}
.ig .rg2{width:58px;height:58px;border-radius:50%;border:2px solid #dedede;padding:2px;flex:none;background:#fff}
.ig .rg2 .img-slot{width:100%;height:100%;border-radius:50%}
.ig .info{flex:1;min-width:0}
.ig .dn{display:block;font-size:13px;font-weight:600;margin-bottom:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ig .st3{display:flex;justify-content:space-between;gap:6px}
.ig .st3>div{min-width:0}
.ig .n{display:block;font-size:13.5px;font-weight:800;white-space:nowrap}
.ig .st3 i{font-style:normal;font-size:10.5px;color:#8f8f8f}
.ig .hb{flex:none;line-height:1.35}
.ig .hd1{display:block;font-size:12.5px;font-weight:600}
.ig .bio{display:block;font-size:10.5px;color:#8a8a8a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ig .bt3{display:flex;gap:7px;flex:none}
.ig .b1{flex:1;height:30px;border-radius:9px;background:#f1f1f1;display:flex;align-items:center;justify-content:center;gap:5px;font-size:12.5px;font-weight:700}
.ig .b2{width:38px;height:30px;border-radius:9px;background:#f1f1f1;display:grid;place-items:center}
.ig.h1{padding:0 14px;flex-direction:row;align-items:center;justify-content:flex-start;gap:10px}
.ig.h1 .top{display:none}
.ig.h1 .main{flex:1;min-width:0;gap:10px}
.ig.h1 .rg2{width:36px;height:36px;border-width:1.5px;padding:1px}
.ig.h1 .dn,.ig.h1 .hb,.ig.h1 .bt3{display:none}
.ig.h1 .st3{justify-content:flex-end;gap:14px}
.ig.h1 .n{font-size:12.5px}
.ig.h1 .st3 i{font-size:9.5px}

/* ---- music player ---- */
.wi.mp{padding:14px 18px 12px;display:flex;flex-direction:column;justify-content:space-between}
.mp .top{display:flex;align-items:center;gap:14px}
.mp .cv{width:54px;height:54px;border-radius:12px;flex:none;box-shadow:0 8px 14px rgba(0,0,0,.16)}
.mp .tx2{flex:1;min-width:0}
.mp .ttl{display:block;font-size:20px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp .art{display:block;font-size:14px;color:#8d8d8d;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp .cast{color:#3a3a3a;flex:none;display:grid}

/* 旧版内置小组件文案迁移：让已经放在桌面上的小组件也用上新文案 */
(function(){
  const map={
    "I MISS U, nano":"NANO FAN CLUB",
    "“你是降落在手心的幸运星”":"“为你心动 第 10086 次”",
    "Winter Anniversary":"我们的冬天 未完待续",
    "nano 今天也在等你的消息…":"今天也把想说的话，都留给你…",
    "·想我的话 请给我打电话":"·今天也有好好想你"
  };
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(!k||k.indexOf('nanoTxt_')!==0)continue;
      let o;try{o=JSON.parse(localStorage.getItem(k)||'{}')}catch(e){continue}
      if(!o||typeof o!=='object')continue;
      let changed=false;
      Object.keys(o).forEach(key=>{
        if(typeof o[key]==='string'&&map[o[key]]!=null){o[key]=map[o[key]];changed=true}
      });
      if(changed)try{localStorage.setItem(k,JSON.stringify(o))}catch(e){}
    }
  }catch(e){}
})();

});
function loadBuiltinTemplates(){
  if(btLoading)return btLoading;
  btLoading=Promise.all(BUILTIN_TEMPLATES.filter(t=>!BT_CODE[t.file]).map(t=>fetch(t.file+'?v=20261020w').then(r=>r.ok?r.text():'').then(code=>{if(code)BT_CODE[t.file]=code}).catch(()=>{}))).then(()=>{
    try{if(typeof S!=='undefined'&&S&&S.pages)render()}catch(e){}
    if($('sheet').classList.contains('open'))openSheet();
  });

const pxToRows=H=>H>=M.rh?Math.max(.5,Math.round(((H+M.vgap)/(M.rh+M.vgap))*10)/10):Math.max(.3,Math.round((H/M.rh)*10)/10);
const autoH=(t,w)=>pxToRows(heightPxFor(t,w));

function calcM(){
  const pw=pager.clientWidth||360, ph=pager.clientHeight||600;
  const gap=12,vgap=8,padX=18,gridTop=44;
  const cw=(pw-padX*2-gap*3)/4, rh=cw+6;
  const rNow=Math.max(5,Math.floor((ph-gridTop-10+vgap)/(rh+vgap)));
  if(!ROWS)ROWS=Math.max(rNow,S.rows||0);
  return {pw,ph,gap,vgap,padX,gridTop,cw,rh,R:ROWS,RU:ROWS*10,uh:(rh+vgap)/10};
}
const DWf=w=>w*80+(w-1)*12;
const itemPx=it=>{
  const {w,h}=sz(it),W=w*M.cw+(w-1)*M.gap;

};

/* ---------- 网格工具 ---------- */
function fits(items,c,r,w,h,ign){
  const ru=rowU(r),hu=Math.max(1,rowU(h));
  if(c<0||ru<0||c+w>COLS||ru+hu>M.RU)return false;
  return !items.some(o=>{if(o.id===ign)return false;const s=sz(o),oru=rowU(o.r),ohu=Math.max(1,rowU(s.h));return c<o.c+s.w&&c+w>o.c&&ru<oru+ohu&&ru+hu>oru});
}
function itemAt(items,c,ru,ign){return items.find(o=>{if(o.id===ign)return false;const s=sz(o),oru=rowU(o.r);return c>=o.c&&c<o.c+s.w&&ru>=oru&&ru<oru+Math.max(1,rowU(s.h))})||null}
function firstFit(items,w,h){const hu=Math.max(1,rowU(h));for(let ru=0;ru<=M.RU-hu;ru++)for(let c=0;c<=COLS-w;c++)if(fits(items,c,ru/10,w,h))return {c,r:ru/10};return null}
function findSpot(items,w,h,c0,r0,ign){
  let best=null,bd=1e9;const hu=Math.max(1,rowU(h));
  for(let ru=0;ru<=M.RU-hu;ru++)for(let c=0;c<=COLS-w;c++){
    if(!fits(items,c,ru/10,w,h,ign))continue;
    const d=(c-c0)*(c-c0)+(ru/10-r0)*(ru/10-r0);if(d<bd){bd=d;best={c,r:ru/10}}
  }
  return best;
}
function placeAnywhere(it,start=0){
  const {w,h}=sz(it);
  for(let p=start;p<start+60;p++){
    if(!S.pages[p])S.pages[p]=[];
    const sp=firstFit(S.pages[p],w,h);
    if(sp){it.c=sp.c;it.r=sp.r;S.pages[p].push(it);return p}
  }
  return -1;
}

function compactPages(list){

    sorted.forEach(it=>{
      const s=sz(it),hu=Math.max(1,rowU(s.h));
      let ru=null;
      for(let u=0;u<=M.RU-hu;u++){
        if(fits(out,it.c,u/10,s.w,s.h)){ru=u;break}

async function loadState(){
  let j=null, savedImgs=null, idbImgs=null;
  try{ j=await NanoIDB.get(IDB_LAYOUT); }catch(e){}
  try{ idbImgs=await NanoIDB.get(IDB_IMGS); }catch(e){}
  if(!j){ try{ j=JSON.parse(localStorage.getItem(KEY)); }catch(e){} }
  if(!idbImgs){ try{ savedImgs=JSON.parse(localStorage.getItem(IKEY)); }catch(e){} }
  try{Object.assign(IMG,idbImgs||savedImgs||{})}catch(e){}
  if(!idbImgs&&savedImgs){ try{ NanoIDB.set(IDB_IMGS,IMG); }catch(e){} }
  if(!j||!Array.isArray(j.pages)||!Array.isArray(j.dock))return false;
  S.rows=(j.ver>=2)?(j.rows||0):0; ROWS=0; M=calcM();
  S.lib=Array.isArray(j.lib)?j.lib.filter(l=>l&&l.id&&typeof l.code==='string').map(l=>({id:l.id,name:String(l.name||'自定义小组件').slice(0,16),code:l.code,live:!!l.live,w:(Number.isInteger(l.w)&&l.w>=1&&l.w<=4)?l.w:2,h:(Number.isFinite(l.h)&&l.h>=0.3&&l.h<=6)?Math.round(l.h*10)/10:2})):[];
  const seen=new Set(); S.pages=[]; S.dock=[null,null,null,null];
  const oldVer=(j.ver||0)<4;
  j.pages.forEach(pg=>{
    const out=[];
    (pg||[]).forEach(o=>{
      if(!o||seen.has(o.id))return;
      if(APP[o.id]){seen.add(o.id);const it=APPITEM[o.id];it.c=o.c;it.r=o.r;out.push(it)}
      else if(WD[o.t]){
        seen.add(o.id);
        const w=(Number.isFinite(o.w)&&o.w>=1&&o.w<=4)?Math.round(o.w*10)/10:undefined;
        const h=(Number.isFinite(o.h)&&o.h>=0.1&&o.h<=6)?Math.round(o.h*10)/10:undefined;
        const ov=(typeof o.o==='number'&&o.o>=0&&o.o<1)?o.o:undefined;
        out.push({id:o.id,t:o.t,c:o.c,r:o.r,d:o.d||{},w,h,o:ov,lib:o.lib||null});
      }
    });
    S.pages.push(out);
  });
  j.dock.slice(0,4).forEach((id,i)=>{if(id&&APP[id]&&!seen.has(id)){seen.add(id);S.dock[i]=id}});
  if(!S.pages.length)S.pages=[[]];
  S.pages.forEach(pg=>pg.forEach(it=>{
    if(it.t!=='custom'||it.lib||!it.d||!it.d.code||it.d.detached)return;
    const lid='c'+it.id;
    const lw=it.w||WD.custom.w;
    if(!S.lib.some(l=>l.id===lid))S.lib.push({id:lid,name:String(it.d.name||'自定义小组件').slice(0,16),code:it.d.code,live:!!it.d.live,w:lw,h:autoH('custom',lw)});
    it.lib=lid;
  }));
  /* 超出范围 / 重叠的放回去；新增的应用补进来 */
  const lost=[];
  S.pages.forEach((pg,pi)=>{const ok=[];pg.forEach(it=>{const s=sz(it);if(Number.isInteger(it.c)&&Number.isFinite(it.r)&&it.r>=0&&fits(ok,it.c,it.r,s.w,s.h))ok.push(it);else lost.push([it,pi])});pg.length=0;pg.push(...ok)});
  APPS.forEach(a=>{if(!seen.has(a.id))lost.push([APPITEM[a.id],0])});
  lost.forEach(([it,pi])=>placeAnywhere(it,pi));
  /* 新增 Q&A：默认布局里插到「窥屏」前面 */
  {
    const qa=S.pages.flat().find(o=>o.id==='qa');
    const peekPage=S.pages.find(pg=>pg.some(o=>o.id==='peek'));
    const peek=peekPage&&peekPage.find(o=>o.id==='peek');
    const qaPage=qa&&S.pages.find(pg=>pg.includes(qa));
    if(qa&&peekPage&&peek&&!(qaPage===peekPage&&qa.c===peek.c-1&&qa.r===peek.r)){
      const market=peekPage.find(o=>o.id==='market');
      if(peek.c===2&&peek.r===3&&market&&market.c===3&&market.r===3){
        peekPage.splice(peekPage.indexOf(market),1);
        const moved=placeAnywhere(market,1);
        if(moved>=0){
          peek.c=3;
          if(qaPage&&qaPage!==peekPage)qaPage.splice(qaPage.indexOf(qa),1);
          if(!peekPage.includes(qa))peekPage.push(qa);
          qa.c=2;qa.r=3;
        }else{
          peekPage.push(market);
        }
      }
    }
  }
  /* 新增番茄钟：尽量放在 Q&A 右侧 */
  {
    const pomo=S.pages.flat().find(o=>o.id==='pomodoro');
    const qa=S.pages.flat().find(o=>o.id==='qa');
    const pg=qa&&S.pages.find(p=>p.includes(qa));
    if(pomo&&qa&&pg&&pg.includes(pomo)){
      const spot=findSpot(pg.filter(o=>o!==pomo),1,1,qa.c+1,qa.r,pomo.id);
      if(spot){pomo.c=spot.c;pomo.r=spot.r}
    }
  }
  /* Nano 独立 App：尽量放在番茄钟右侧 */
  {
    const nano=S.pages.flat().find(o=>o.id==='nano');
    const pomo=S.pages.flat().find(o=>o.id==='pomodoro');
    const pg=pomo&&S.pages.find(p=>p.includes(pomo));
    if(nano&&pomo&&pg&&pg.includes(nano)){
      const spot=findSpot(pg.filter(o=>o!==nano),1,1,pomo.c+1,pomo.r,nano.id);
      if(spot){nano.c=spot.c;nano.r=spot.r}
    }
  }
  S.pages.forEach(pg=>pg.forEach(migrateWidgetCopy));
  if(oldVer)compactPages();
  save();
  return true;
}

  el.style.width=W+'px';el.style.height=H+'px';

function wiEl(it,W,H){

  el.className='wi '+def.cls+(it.d&&it.d.live?' live':'')+((def.small&&def.w<=2)?' sm':'')+' w'+cs.w+' '+hcls(cs.h);
  el.style.setProperty('--wo',it.o==null?1:it.o);
  if(def.fit){
    el.style.width=W+'px';el.style.height=H+'px';
  }else{
    const s=W/dw;

  el.innerHTML=def.inner(it);return el;

  closeEditor();
  if(!edTarget){
    const lib={id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name,code,live,w,h};
    S.lib=[...(S.lib||[]),lib];
    const it=newWidget('custom');it.d={code,live};it.w=w;it.h=h;it.lib=lib.id;
    const p=placeAnywhere(it,Math.min(pageIndex(),S.pages.length));
    if(p<0){S.lib=S.lib.filter(l=>l.id!==lib.id);toast('没有空位了');return}
    save();render();curPage=p;pager.scrollTo({left:p*pager.clientWidth,behavior:'smooth'});
  }else{
    const it=edTarget;it.d.code=code;it.d.live=live;
    const lib=it.lib?(S.lib||[]).find(l=>l.id===it.lib):null;
    const sized=applySize(it,w,h);
    if(lib){lib.name=name;lib.code=code;lib.live=live;lib.w=it.w||w;lib.h=autoH('custom',lib.w)}
    else it.d.name=name;
    if(!sized)toast('这个尺寸放不下，保留原大小');
    save();render();
  }
};

/* =====================================================
   添加小组件
===================================================== */
function openSheet(){
  const gal=$('gal');gal.innerHTML='';
  const inner=Math.min(phone.clientWidth,480)-36,sc=Math.min(.5,((inner-12)/2)/DWf(4));
  const gh=h=>h*86+Math.max(0,h-1)*10;
  function makePv(t,it,name,pick,delFn,dims){
    const def=WD[t],pw=dims?dims.w:def.w,ph=dims?dims.h:def.h,W=DWf(pw),H=gh(ph);
    const box=document.createElement('div');box.className='pvbox';box.style.width=W*sc+'px';box.style.height=H*sc+'px';
    const pin=document.createElement('div');pin.className='pin';pin.style.cssText=`width:${W}px;height:${H}px;transform:scale(${sc})`;
    const wi=document.createElement('div');wi.className='wi '+def.cls+((def.small&&def.w<=2)?' sm':'')+' w'+pw+' '+hcls(ph);wi.style.cssText=`width:${DWf(def.w)}px;height:${gh(def.h)}px;transform-origin:0 0;transform:scale(${Math.min(W/DWf(def.w),H/gh(def.h))})`;wi.innerHTML=def.inner(it);
    pin.appendChild(wi);box.appendChild(pin);
    const pv=document.createElement('div');pv.className='pv';pv.appendChild(box);
    const lb=document.createElement('span');lb.textContent=name;pv.appendChild(lb);
    if(delFn){
      const x=document.createElement('div');x.className='pvdel';x.innerHTML=ic('x',11,3);x.setAttribute('aria-label','永久删除');
      x.onclick=e=>{e.stopPropagation();delFn()};pv.appendChild(x);
    }
    pv.onclick=pick;return pv;
  }
  WORDER.forEach(t=>{
    const def=WD[t],it={id:'pv_'+t,t,c:0,r:0,d:{}};
    gal.appendChild(makePv(t,it,def.name,()=>{closeSheet();if(t==='custom')openEditor(null);else addWidget(t)}));
  });
  if(BUILTIN_TEMPLATES.length){
    BUILTIN_TEMPLATES.forEach(t=>{
      const code=BT_CODE[t.file];
      if(!code){
        const ph=document.createElement('div');ph.className='pvbox';ph.style.cssText='width:120px;height:54px;display:grid;place-items:center;font-size:11px;color:#aaa;border-radius:14px;background:#f7f7f7';ph.textContent='加载中…';gal.appendChild(ph);
        return;
      }
      const it={id:'pvbt_'+t.file,t:t.type,c:0,r:0,d:{code:code,live:false}};
      try{localStorage.setItem('nanoTxt_'+it.id,JSON.stringify(t.copy||{}))}catch(e){}
      gal.appendChild(makePv(t.type,it,t.label||t.name,()=>{closeSheet();addBuiltinWidget(t)},null,{w:t.w,h:t.h}));
    });
    if(BUILTIN_TEMPLATES.some(t=>!BT_CODE[t.file]))loadBuiltinTemplates();
  }
  {
    const def=WD.custom,it={id:'pv_custom',t:'custom',c:0,r:0,d:{}};
    gal.appendChild(makePv('custom',it,def.name,()=>{closeSheet();openEditor(null)}));
  }
  if((S.lib||[]).length){
    const head=document.createElement('div');head.className='galhead';head.textContent='我的小组件';gal.appendChild(head);
    S.lib.forEach(lib=>{
      const it={id:'pvlib_'+lib.id,t:'custom',c:0,r:0,d:{code:lib.code,live:lib.live}};
      gal.appendChild(makePv('custom',it,lib.name||'自定义小组件',()=>{closeSheet();addLibWidget(lib)},()=>delLib(lib)));
    });
  }
  gal.scrollTop=0;$('sheet').classList.add('open');
}
function closeSheet(){$('sheet').classList.remove('open')}
$('sheetMask').onclick=closeSheet;
function addWidget(t){
  const it=newWidget(t);
  if(t==='post')it.d.text=nextPostCaption();
  const start=Math.min(pageIndex(),S.pages.length);
  const p=placeAnywhere(it,start);
  if(p<0){toast('没有空位了');return}
  save();render();curPage=p;
  pager.scrollTo({left:p*pager.clientWidth,behavior:'smooth'});
}
function addLibWidget(lib){
  const it=newWidget('custom');it.d={code:lib.code||'',live:!!lib.live};it.lib=lib.id;it.w=lib.w||2;it.h=lib.h||2;
  const p=placeAnywhere(it,Math.min(pageIndex(),S.pages.length));
  if(p<0){toast('没有空位了');return}
  save();render();curPage=p;
  pager.scrollTo({left:p*pager.clientWidth,behavior:'smooth'});
}
function addBuiltinWidget(t){
  const code=BT_CODE[t.file];
  if(!code){toast('模板还没加载好，正在重试…');btLoading=null;loadBuiltinTemplates().then(()=>{if(BT_CODE[t.file])addBuiltinWidget(t);else toast('模板加载失败')});return}
  const it=newWidget(t.type);
  it.d={code:code,live:true};
  it.w=t.w||4;it.h=t.h||2;
  try{ if(t.copy)localStorage.setItem('nanoTxt_'+it.id,JSON.stringify(t.copy)); }catch(e){}
  const p=placeAnywhere(it,Math.min(pageIndex(),S.pages.length));
  if(p<0){toast('没有空位了');return}
  save();render();curPage=p;
  pager.scrollTo({left:p*pager.clientWidth,behavior:'smooth'});
}
function delLib(lib){
  if(!window.confirm('永久删除「'+(lib.name||'自定义小组件')+'」？'))return;
  const st=$('gal').scrollTop;
  S.lib=(S.lib||[]).filter(l=>l.id!==lib.id);
  S.pages.forEach(pg=>pg.forEach(it=>{if(it.lib===lib.id){it.lib=null;it.d=it.d||{};it.d.detached=true}}));
  save();openSheet();$('gal').scrollTop=st;toast('已永久删除');
}

/* =====================================================
   Toast
===================================================== */
let toastTimer;
function toast(text,label,fn){
  const el=$('toast');el.innerHTML='<span></span>';el.firstChild.textContent=text;
  if(label){const b=document.createElement('b');b.textContent=label;b.onclick=()=>{fn&&fn();el.classList.remove('show')};el.appendChild(b)}
  el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),label?3500:1500);
}

/* =====================================================
   启动
===================================================== */
window.addEventListener('message', function(e){
  const d=e.data;
  if(!d||!d.type) return;
  if(d.type==='nanoDesktopChanged') reloadDesktop(!!d.layout);
  if(d.type==='nanoWidgetImage'){
    if(!d.widget||!d.key||typeof d.data!=='string'||!d.data.startsWith('data:image/'))return;
    if(S.pages.some(pg=>pg.some(it=>it.id===d.widget))||(S.dock||[]).some(id=>id===d.widget)){IMG[d.widget+'.'+d.key]=d.data;saveImgs()}
  }
});
function init(){
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(function(){}); }catch(e){}
  M=calcM();
  defaultState();
  applyDesktopBg();
  render();
  loadDesktopCustom().then(function(){ applyDesktopBg(); render(); });
  loadBuiltinTemplates();
  (async function hydrate(){
    try{
      const ok=await loadState();
      if(!ok) defaultState();
      else if(isOldInitialLayout()){
        // 老用户的「初始布局」还是旧版 5 页结构：只迁移完全没有改动过的默认布局。
        defaultState();
        try{ localStorage.setItem('nanoHomeLayoutV2','1'); }catch(e) {}
      }
      save();
      render();
    }catch(e){}
  })();
}
let lastW=0;
window.addEventListener('resize',()=>{if(drag)return;const w=phone.clientWidth;if(w!==lastW){lastW=w;render()}});
lastW=phone.clientWidth;
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
</script>
