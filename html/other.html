<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="../js/nano-runtime.js?v=20261023a"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>其他</title>
    <link rel="stylesheet" href="../css/other.css?v=20261018b">
    <link rel="stylesheet" href="../css/panel-ui.css?v=20261020j">
</head>
<body class="panel-other">
    <header class="top-bar">
        <button class="top-back" id="backBtn" aria-label="返回" data-back>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="top-copy">
            <span class="top-bar-title">其他</span>
        </div>
    </header>

    <div class="container">
        <div class="seg-bar" id="segBar">
            <button class="seg-btn active" data-seg="bg" type="button">
                <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
                <span>后台</span>
            </button>
            <button class="seg-btn" data-seg="notify" type="button">
                <svg viewBox="0 0 24 24"><path d="M18 9a6 6 0 1 0-12 0c0 5-2 6-2 6h16s-2-1-2-6"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>
                <span>通知</span>
            </button>
            <button class="seg-btn" data-seg="push" type="button">
                <svg viewBox="0 0 24 24"><path d="M12 19V5"/><path d="m6.5 10.5 5.5-5.5 5.5 5.5"/></svg>
                <span>推送</span>
            </button>
            <button class="seg-btn" data-seg="ball" type="button">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>
                <span>悬浮球</span>
            </button>
            <button class="seg-btn" data-seg="ui" type="button">
                <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M8 9v11"/></svg>
                <span>界面</span>
            </button>
        </div>

        <!-- 后台 -->
        <section class="card-group seg-panel active" data-seg="bg">
            <div class="group-title">后台运行</div>
            <div class="list-group">
                <div class="list-item switch-row">
                    <div class="item-info">
                        <span class="item-title">保活</span>
                    </div>
                    <label class="ios-switch"><input type="checkbox" id="keepAliveToggle"><span class="ios-switch-track"></span></label>
                </div>
                <div class="list-item switch-row">
                    <div class="item-info">
                        <span class="item-title">通知</span>
                    </div>
                    <label class="ios-switch"><input type="checkbox" id="notifyToggle"><span class="ios-switch-track"></span></label>
                </div>
                <div class="list-item status-row">
                    <div class="item-info">
                        <span class="item-title">后台运行状态</span>
                        <span class="item-desc" id="bgStatus">—</span>
                    </div>
                    <span class="status-dot"></span>
                </div>
            </div>
        </section>

        <!-- 通知声音 -->
        <section class="card-group seg-panel" data-seg="notify">
            <div class="group-title">通知声音</div>
            <div class="list-group" id="soundGroup">
                <div class="list-item sound-row">
                    <span class="item-title">提示音</span>
                    <div class="sound-controls">
                        <select class="sound-select" id="soundSelect"></select>
                        <button class="preview-btn" id="soundPreview" type="button">试听</button>
                    </div>
                </div>
            </div>
            <div class="group-title spaced">分应用提示音</div>
            <div class="list-group" id="channelSoundList"></div>
        </section>

        <!-- Bark 推送 -->
        <section class="card-group seg-panel" data-seg="push">
            <div class="group-title">iPhone 后台推送（Bark）</div>
            <div class="list-group">
                <div class="list-item switch-row">
                    <div class="item-info">
                        <span class="item-title">Bark 推送</span>
                    </div>
                    <label class="ios-switch"><input type="checkbox" id="barkToggle"><span class="ios-switch-track"></span></label>
                </div>
                <div class="list-item switch-row">
                    <div class="item-info">
                        <span class="item-title">Bark 密钥</span>
                    </div>
                </div>
                <div class="list-item key-row">
                    <input id="barkKeyInput" type="text" class="key-input" placeholder="粘贴 Bark 密钥" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-masked-key="1">
                    <button class="preview-btn" id="barkKeySave" type="button">保存</button>
                    <button class="preview-btn ghost" id="barkKeyTest" type="button">测试</button>
                </div>
                <div class="list-item note-row">
                    <span id="barkStatus" class="note-text">未设置</span>
                </div>
            </div>
            <div class="group-title spaced">无后台 Web Push（推荐）</div>
            <div class="list-group">
                <div class="list-item">
                    <div class="item-info">
                        <span class="item-title">Web Push</span>
                        <span class="item-desc" id="webPushStatus">正在检查…</span>
                    </div>
                    <button class="preview-btn" id="webPushBtn" type="button">开启</button>
                </div>
            </div>
        </section>

        <!-- 悬浮球 -->
        <section class="card-group seg-panel" data-seg="ball">
            <div class="group-title">API 悬浮球</div>
            <div class="list-group">
                <div class="list-item switch-row">
                    <div class="item-info">
                        <span class="item-title">显示悬浮球</span>
                    </div>
                    <label class="ios-switch"><input type="checkbox" id="apiBallToggle"><span class="ios-switch-track"></span></label>
                </div>
                <div class="list-item slider-row">
                    <span class="item-title">大小</span>
                    <div class="slider-control">
                        <input type="range" class="ball-range" id="apiBallSize" min="36" max="80" step="2" value="52">
                    </div>
                    <span class="slider-value" id="apiBallSizeVal">52</span>
                </div>
                <div class="list-item tap-row" id="apiBallResetPos">
                    <span class="item-title">重置悬浮球位置</span>
                    <svg class="row-chevron" viewBox="0 0 8 13" width="8" height="13"><path d="M1 1.5L6.5 6.5L1 11.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </div>
            </div>
            <div class="group-title spaced">悬浮球外观</div>
            <div class="list-group">
                <div class="list-item tap-row" id="apiBallPickImage">
                    <div class="item-info">
                        <span class="item-title">自定义图片</span>
                        <span class="item-desc" id="apiBallImageDesc">未设置 · 使用默认圆环</span>
                    </div>
                    <span class="ball-thumb" id="apiBallThumb"></span>
                </div>
                <div class="list-item tap-row" id="apiBallClearImage" style="display:none;">
                    <span class="item-title danger">恢复默认外观</span>
                </div>
            </div>
        </section>

        <!-- 界面 -->
        <section class="card-group seg-panel" data-seg="ui">
            <div class="group-title">界面位置</div>
            <div class="list-group">
                <div class="list-item">
                    <span class="item-title">顶栏位置</span>
                    <div class="nudge-controls">
                        <button class="nudge-btn" data-target="top" data-dir="-1" type="button">上移</button>
                        <span class="nudge-value" id="topShiftVal">0</span>
                        <button class="nudge-btn" data-target="top" data-dir="1" type="button">下移</button>
                        <button class="nudge-btn reset" data-target="top" data-dir="0" type="button">恢复</button>
                    </div>
                </div>
                <div class="list-item switch-row">
                    <div class="item-info">
                        <span class="item-title">灵动岛安全区</span>
                    </div>
                    <label class="ios-switch"><input type="checkbox" id="insetToggle"><span class="ios-switch-track"></span></label>
                </div>
                <div class="list-item" id="insetNudgeRow" style="display:none;">
                    <div class="item-info">
                        <span class="item-title">安全区高度</span>
                    </div>
                    <div class="nudge-controls">
                        <button class="nudge-btn" data-target="inset" data-dir="-1" type="button">上移</button>
                        <span class="nudge-value" id="insetShiftVal">48</span>
                        <button class="nudge-btn" data-target="inset" data-dir="1" type="button">下移</button>
                        <button class="nudge-btn reset" data-target="inset" data-dir="0" type="button">恢复</button>
                    </div>
                </div>
                <div class="list-item">
                    <span class="item-title">底栏位置</span>
                    <div class="nudge-controls">
                        <button class="nudge-btn" data-target="bottom" data-dir="-1" type="button">上移</button>
                        <span class="nudge-value" id="bottomShiftVal">0</span>
                        <button class="nudge-btn" data-target="bottom" data-dir="1" type="button">下移</button>
                        <button class="nudge-btn reset" data-target="bottom" data-dir="0" type="button">恢复</button>
                    </div>
                </div>
            </div>
        </section>

    </div>

    <input type="file" accept="image/*" id="apiBallImageInput" hidden>

    <script src="../js/appearance.js"></script>
    <script src="../js/nano-notify.js?v=20261024b"></script>
    <script src="../js/other.js?v=20261024b"></script>
    <script src="../js/api-float.js"></script>
    <script src="../swipe-back.js"></script>
</body>
</html>
