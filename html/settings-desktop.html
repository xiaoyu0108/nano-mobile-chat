<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<script src="../js/nano-runtime.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>桌面</title>
<link rel="icon" href="../icons/icon-192.png">
<script>window.__NANO_FONT_ONLY = true;</script>
<script src="../js/appearance.js"></script>
<script src="../js/nano-idb.js"></script>
<link rel="stylesheet" href="../css/settings.css?v=20261020j">
</head>
<body data-page="desktop">
<div class="app">
  <header class="nav">
    <a class="back" href="settings.html" aria-label="返回">
      <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <h1>桌面</h1>
    <button class="nav-refresh" type="button" aria-label="刷新" onclick="location.reload()">
      <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.34 5.66"/><polyline points="20 4 20 11 13 11"/></svg>
    </button>
  </header>

  <main class="scroll">
    <section class="list">
      <button class="row" id="rowBg">
        <span class="row-icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="m21 15-5-5L5 20"/></svg></span>
        <span class="row-label">桌面背景</span>
        <span class="row-value" id="bgValue">默认</span>
        <span class="chev">›</span>
      </button>
      <button class="row" id="rowApps">
        <span class="row-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>
        <span class="row-label">App 图标与名称</span>
        <span class="row-value" id="appsValue">默认</span>
        <span class="chev">›</span>
      </button>
      <button class="row" id="rowPresets">
        <span class="row-icon"><svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5"/><path d="m3 16 9 5 9-5"/></svg></span>
        <span class="row-label">桌面装饰预设</span>
        <span class="row-value" id="presetsValue">0 个</span>
        <span class="chev">›</span>
      </button>
      <button class="row" id="rowImport">
        <span class="row-icon"><svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg></span>
        <span class="row-label">导入桌面装饰</span>
        <span class="chev">›</span>
      </button>
      <button class="row" id="rowExport">
        <span class="row-icon"><svg viewBox="0 0 24 24"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg></span>
        <span class="row-label">导出桌面装饰</span>
        <span class="chev">›</span>
      </button>
      <button class="row" id="rowReset">
        <span class="row-icon"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></span>
        <span class="row-label">还原默认桌面</span>
        <span class="chev">›</span>
      </button>
    </section>
    <p class="hint">桌面装饰包含背景、App 图标与名称、桌面布局和小组件图片。</p>
  </main>
</div>

<div class="modal" id="modal">
  <div class="sheet">
    <div class="sheet-head">
      <div class="sheet-title" id="sheetTitle">设置</div>
      <button class="sheet-close" id="sheetClose" aria-label="关闭">×</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="bgFile" accept="image/*" class="hidden">
<input type="file" id="iconFile" accept="image/*" class="hidden">
<input type="file" id="importFile" accept="application/json,.json" class="hidden">

<script src="../js/settings.js?v=20261020j"></script>
</body>
</html>
