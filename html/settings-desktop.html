<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<script src="../js/nano-runtime.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>桌面</title>
<link rel="icon" href="../icons/icon-192.png">
<script>window.__NANO_FONT_ONLY = true;</script>
<script src="../js/appearance.js"></script>
<script src="../js/nano-idb.js"></script>
<link rel="stylesheet" href="../css/settings.css">
</head>
<body data-page="desktop">
<div class="app">
  <header class="nav">
    <a class="back" href="settings.html" aria-label="返回">
      <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <h1>桌面</h1>
    <div class="spacer"></div>
  </header>

  <main class="scroll">
    <div class="desk-deco" aria-hidden="true">
      <svg viewBox="0 0 236 128" fill="none">
        <path d="M8 104c18-38 42-58 72-61 25-2.5 42 8 58 26" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="2 7"/>
        <path d="M18 26h34M18 36h22M18 46h28" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
        <rect x="74" y="18" width="58" height="42" rx="12" stroke="currentColor" stroke-width="1.5"/>
        <path d="M88 48l12-14 8 8 7-7 9 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="115" cy="31" r="3.5" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="164" cy="38" r="15" stroke="currentColor" stroke-width="1.4"/>
        <path d="M164 29v9l6 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M145 66l-7 10 9 2M186 20l8-7M198 41h10M176 14V6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <circle cx="204" cy="73" r="2.2" fill="currentColor" opacity=".4"/>
        <circle cx="66" cy="84" r="1.8" fill="currentColor" opacity=".35"/>
      </svg>
    </div>
    <section class="list">
      <button class="row" id="rowBg">
        <span class="row-label">桌面背景</span>
        <span class="row-value" id="bgValue">默认</span>
        <span class="chev">›</span>
      </button>
      <button class="row" id="rowApps">
        <span class="row-label">App 图标与名称</span>
        <span class="row-value" id="appsValue">默认</span>
        <span class="chev">›</span>
      </button>
      <button class="row" id="rowPresets">
        <span class="row-label">桌面装饰预设</span>
        <span class="row-value" id="presetsValue">0 个</span>
        <span class="chev">›</span>
      </button>
      <button class="row" id="rowImport">
        <span class="row-label">导入桌面装饰</span>
        <span class="chev">›</span>
      </button>
      <button class="row" id="rowExport">
        <span class="row-label">导出桌面装饰</span>
        <span class="chev">›</span>
      </button>
      <button class="row" id="rowReset">
        <span class="row-label">还原默认桌面</span>
        <span class="chev">›</span>
      </button>
    </section>
    <p class="hint">桌面装饰包含背景、App 图标与名称、桌面布局和小组件图片。</p>
  </main>
</div>

<div class="modal" id="modal">
  <div class="sheet">
    <div class="sheet-head">
      <div class="sheet-title" id="sheetTitle">设置</div>
      <button class="sheet-close" id="sheetClose" aria-label="关闭">×</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="bgFile" accept="image/*" class="hidden">
<input type="file" id="iconFile" accept="image/*" class="hidden">
<input type="file" id="importFile" accept="application/json,.json" class="hidden">

<script src="../js/settings.js?v=20261019a"></script>
</body>
</html>
