<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<script src="../js/nano-runtime.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>设置</title>
<link rel="icon" href="../icons/icon-192.png">
<script>window.__NANO_FONT_ONLY = true;</script>
<script src="../js/appearance.js"></script>
<script src="../js/nano-idb.js"></script>
<link rel="stylesheet" href="../css/settings.css">
</head>
<body data-page="settings">
<div class="app">
  <header class="nav">
    <button class="back" id="backBtn" aria-label="返回">
      <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <h1>设置</h1>
    <div class="spacer"></div>
  </header>

  <main class="scroll">
    <!-- 装饰信息卡片：不可点击 -->
    <section class="id-card" id="idCard" aria-label="账户信息">
      <div class="id-avatar" id="idAvatar">纳</div>
      <div class="id-info">
        <div class="id-name" id="idName">纳米用户</div>
        <div class="id-sub" id="idSub">纳米 ID · 本地账号</div>
      </div>
      <span class="id-edit" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </span>
    </section>

    <nav class="cards" aria-label="设置分类">
      <a class="card" href="settings-desktop.html">
        <span class="card-icon">
          <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        </span>
        <span class="card-main">
          <span class="card-title">桌面</span>
          <span class="card-sub">背景、图标、名字与预设</span>
        </span>
        <span class="card-chev">›</span>
      </a>

      <a class="card" href="settings-notifications.html">
        <span class="card-icon">
          <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </span>
        <span class="card-main">
          <span class="card-title">通知</span>
          <span class="card-sub">后台、通知与推送</span>
        </span>
        <span class="card-chev">›</span>
      </a>

      <button class="card" data-open="storage.html" data-title="储存">
        <span class="card-icon">
          <svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.66 3.58 3 8 3s8-1.34 8-3V5"/><path d="M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3"/></svg>
        </span>
        <span class="card-main">
          <span class="card-title">储存</span>
          <span class="card-sub">空间与缓存</span>
        </span>
        <span class="card-chev">›</span>
      </button>

      <a class="card" href="settings-other.html">
        <span class="card-icon">
          <svg viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
        </span>
        <span class="card-main">
          <span class="card-title">其他</span>
          <span class="card-sub">悬浮球、界面与助手</span>
        </span>
        <span class="card-chev">›</span>
      </a>

      <button class="card" data-open="backup.html" data-title="备份">
        <span class="card-icon">
          <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="5" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></svg>
        </span>
        <span class="card-main">
          <span class="card-title">备份</span>
          <span class="card-sub">完整数据备份与恢复</span>
        </span>
        <span class="card-chev">›</span>
      </button>
    </nav>
    <div class="version">纳米 · 本机设置</div>
  </main>
</div>
<div class="modal" id="modal">
  <div class="sheet">
    <div class="sheet-head">
      <div class="sheet-title" id="sheetTitle">编辑资料</div>
      <button class="sheet-close" id="sheetClose" aria-label="关闭">×</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="avatarFile" accept="image/*" class="hidden">
<script src="../js/settings.js"></script>
</body>
</html>
