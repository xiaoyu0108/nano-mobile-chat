<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="../js/nano-runtime.js?v=20261028e"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>语音电话</title>
    <link rel="stylesheet" href="../css/voice-call.css?v=20261024i">

    <link rel="dns-prefetch" href="https://unpkg.com">
    <script src="../js/localforage.min.js?v=20261027a"></script>
    <script src="../js/appearance.js?v=20261026d"></script>
</head>
<body>

    <video class="call-bg-video" id="callBgVideo" muted loop playsinline autoplay></video>

    <!-- ===== 只有缩小按钮，没有返回栏 ===== -->
    <div class="float-minimize" id="minimizeBtn" title="缩小">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round">
            <path d="M5 15l4-4-4-4"/>
            <path d="M19 7l-4 4 4 4"/>
        </svg>
    </div>

    <!-- ===== 通话设置（右上角） ===== -->
    <button class="btn-bg btn-settings" id="bgBtn" title="通话设置" aria-label="通话设置">
        <svg class="settings-dots" viewBox="0 0 24 24" fill="white" stroke="none">
            <circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/>
        </svg>
    </button>

    <!-- ===== 头像 + 名字 + 计时 ===== -->
    <div class="avatar-section">
        <div class="avatar" id="avatarBox">
            <svg id="avatarSvg" viewBox="0 0 24 24">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
            <img id="contactAvatar" alt="头像" style="display:none; width:100%; height:100%; border-radius:50%; object-fit:cover;">
        </div>
        <div class="name-display" id="contactName">AI 助手</div>
        <div class="status-display" id="callStatus">00:00</div>
    </div>

    <!-- ===== 通话设置面板 ===== -->
    <div class="bg-panel" id="bgPanel">
        <div class="bg-panel-title">通话设置</div>
        <div class="call-setting-block">
            <div class="call-setting-label">谁先说话</div>
            <div class="first-speaker">
                <button type="button" data-first-speaker="me">我先说</button>
                <button type="button" data-first-speaker="char">对方先说</button>
            </div>
        </div>
        <div class="call-setting-block">
            <div class="call-setting-label">来电铃声</div>
            <div class="ringtone-row">
                <button type="button" id="ringtonePick">选择 MP3</button>
                <button type="button" id="ringtoneReset">默认</button>
            </div>
            <div class="ringtone-name" id="ringtoneName">默认铃声</div>
            <input type="file" id="ringtoneInput" accept="audio/mpeg,audio/mp3,.mp3" hidden>
        </div>
        <div class="call-setting-label">通话背景</div>
        <div class="bg-options">
            <div class="bg-option bg-option-avatar active" data-bg="avatar" title="头像"><span>头像</span></div>
            <div class="bg-option bg-option-black" data-bg="#000000" title="黑"></div>
            <div class="bg-option bg-option-white" data-bg="#ffffff" title="白"></div>
            <label class="bg-upload" id="bgUploadLabel">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 5v14"/>
                    <path d="M5 12h14"/>
                </svg>
                <input type="file" class="bg-upload-input" id="bgUploadInput" accept="image/*">
            </label>
        </div>
    </div>

    <!-- ===== 多选栏 ===== -->
    <div class="ms-bar" id="msBar">
        <div class="ms-left"><span id="msCount">已选 0 条</span></div>
        <div class="ms-right">
            <button class="ms-btn" id="msCancel">取消</button>
            <button class="ms-btn ms-delete" id="msDelete">删除</button>
        </div>
    </div>

    <!-- ===== 消息区 ===== -->
    <div class="chat-area" id="chatArea">
        <div class="typing-indicator" id="typingIndicator">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
    </div>

    <!-- ===== 消息操作菜单 ===== -->
    <div class="msg-menu" id="msgMenu">
        <button class="msg-menu-item" data-action="delete">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
            <span>删除</span>
        </button>
        <button class="msg-menu-item" data-action="recall">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            <span>撤回</span>
        </button>
        <button class="msg-menu-item" data-action="edit">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            <span>编辑</span>
        </button>
        <button class="msg-menu-item" data-action="multiselect">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M17.5 14.5l2 2 4-4"/></svg>
            <span>多选</span>
        </button>
    </div>

    <!-- ===== 底部输入区 ===== -->
    <div class="bottom-area">
        <div class="input-row">
            <button class="btn-icon" id="rerollBtn" title="重roll">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12a9 9 0 1 1-9-9m0 0v6m0-6h-6"/>
                </svg>
            </button>

            <div class="input-wrapper">
                <input type="text" id="messageInput" placeholder="输入消息..." autocomplete="off">
            </div>

            <button class="btn-icon btn-reply" id="replyBtn" title="发送">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 19V5"/>
                    <path d="m6.5 10.5 5.5-5.5 5.5 5.5"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- ===== 来电接听/拒接（微信风格大圆按钮） ===== -->
<div class="incoming-actions" id="incomingActions">
    <button class="incoming-btn decline" id="declineBtn" title="挂断">
        <svg viewBox="0 0 24 24" fill="white">
            <path d="M20 15.5c-1.2 0-2.4-.2-3.6-.6-.3-.1-.7 0-1 .2l-2.2 2.2c-2.8-1.4-5.1-3.8-6.6-6.6l2.2-2.2c.3-.3.4-.7.2-1-.4-1.2-.6-2.4-.6-3.6 0-.6-.4-1-1-1H4c-.6 0-1 .4-1 1 0 9.4 7.6 17 17 17 .6 0 1-.4 1-1v-3.5c0-.6-.4-1-1-1z"/>
        </svg>
    </button>
    <button class="incoming-btn answer" id="answerBtn" title="接听">
        <svg viewBox="0 0 24 24" fill="white">
            <path d="M20 15.5c-1.2 0-2.4-.2-3.6-.6-.3-.1-.7 0-1 .2l-2.2 2.2c-2.8-1.4-5.1-3.8-6.6-6.6l2.2-2.2c.3-.3.4-.7.2-1-.4-1.2-.6-2.4-.6-3.6 0-.6-.4-1-1-1H4c-.6 0-1 .4-1 1 0 9.4 7.6 17 17 17 .6 0 1-.4 1-1v-3.5c0-.6-.4-1-1-1z"/>
        </svg>
    </button>
</div>

    <!-- ===== 底部通话操作：免提 / 挂断 / 录音 ===== -->
    <div class="hangup-wrapper" id="hangupWrapper">
        <div class="call-actions">
            <button class="call-btn call-btn-speaker" id="speakerBtn" title="语音朗读（TTS）" aria-label="语音朗读（TTS）">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 5 6 9H3v6h3l5 4V5z"/>
                    <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
                    <path d="M18.5 5.5a9 9 0 0 1 0 13"/>
                </svg>
            </button>
            <button class="btn-hangup" id="hangupBtn" title="挂断" aria-label="挂断">
                <svg viewBox="0 0 24 24" fill="white">
                    <path d="M20 15.5c-1.2 0-2.4-.2-3.6-.6-.3-.1-.7 0-1 .2l-2.2 2.2c-2.8-1.4-5.1-3.8-6.6-6.6l2.2-2.2c.3-.3.4-.7.2-1-.4-1.2-.6-2.4-.6-3.6 0-.6-.4-1-1-1H4c-.6 0-1 .4-1 1 0 9.4 7.6 17 17 17 .6 0 1-.4 1-1v-3.5c0-.6-.4-1-1-1z"/>
                </svg>
            </button>
            <button class="call-btn call-btn-record" id="recordBtn" title="录音转文字" aria-label="录音转文字">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="3" width="6" height="11" rx="3"/>
                    <path d="M5 11a7 7 0 0 0 14 0"/>
                    <line x1="12" y1="18" x2="12" y2="21"/>
                </svg>
            </button>
        </div>
    </div>

    <script src="../js/nano-tts.js?v=20261024f"></script>
<script src="../js/nano-call-audio.js?v=20261024f"></script>
<script src="../js/nano-call-ringtone.js?v=20261024a"></script>
<script src="../js/nano-call-bg.js?v=20261024b"></script>
<script src="../js/reroll-reason.js?v=20261022a"></script>
<script src="../js/nano-prompts.js?v=20261029e"></script>
<script src="../js/voice-call.js?v=20261024j"></script>
<script src="../js/api-float.js"></script>
<script src="../swipe-back.js"></script>
</body>
</html>
