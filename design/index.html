<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Phone</title>
<style>
:root{--ink:#141414;--ic:60px;--dock-h:86px;--safe-b:env(safe-area-inset-bottom);--safe-t:env(safe-area-inset-top)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;color:var(--ink);overscroll-behavior:none;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",sans-serif}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
svg{display:block}
img{-webkit-user-drag:none;user-drag:none}

.phone{position:fixed;inset:0;max-width:480px;margin:0 auto;background:#fff;overflow:hidden}
/* 开屏期间隐藏主界面，避免开屏淡出时闪一下桌面 */
.phone.pre-splash{visibility:hidden}

/* ---------- pages ---------- */
.pager{position:absolute;left:0;right:0;top:var(--safe-t);bottom:calc(var(--dock-h) + 13px + var(--safe-b) + 38px);display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;touch-action:pan-x pan-y;overscroll-behavior:contain}
.pager::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;width:100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow-x:hidden;overflow-y:auto;scrollbar-width:none;overscroll-behavior-y:contain}
.page::-webkit-scrollbar{display:none}
.grid{position:relative;margin:var(--gt,44px) 18px 8px}

/* ---------- items ---------- */
.it{position:absolute;touch-action:inherit;outline:none}
.it.lift{opacity:0;animation:none!important}
.ghost{position:fixed!important;z-index:200;pointer-events:none;animation:none!important;filter:drop-shadow(0 14px 22px rgba(0,0,0,.2));transition:none}
.ghost .del{display:none!important}

.it.app,.it.dk{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.icon-wrap{width:var(--ic);height:var(--ic);border-radius:calc(var(--ic)*.3);display:grid;place-items:center;flex:none;background:linear-gradient(160deg,#2b2b2b,#0e0e0e);box-shadow:0 6px 14px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.12)}
.icon-wrap svg{width:calc(var(--ic)*.45);height:calc(var(--ic)*.45);fill:currentColor;color:#fff}
.app-name{font-size:11px;font-weight:520;line-height:1.2;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;color:#333;letter-spacing:-.15px}
.it.dk{position:relative}
.it.dk .icon-wrap{width:57px;height:57px;border-radius:18px}
.it.dk .icon-wrap svg{width:26px;height:26px}
.it.dk .app-name{display:none}

.it.wd{cursor:default}
.wi{position:absolute;left:0;top:0;transform-origin:0 0;font-size:14px;line-height:1.25;color:var(--ink)}
.card{background:#fff;border:1px solid rgba(0,0,0,.07);border-radius:26px;box-shadow:0 8px 22px rgba(0,0,0,.055)}
.del{display:none;position:absolute;left:-9px;top:-9px;width:26px;height:26px;border-radius:50%;background:#141414;color:#fff;place-items:center;z-index:6;box-shadow:0 2px 8px rgba(0,0,0,.25);border:2px solid #fff}
.editing .it.wd .del{display:grid}
.editing .it.wd .wi *{pointer-events:none}

[data-k]{outline:none}
[contenteditable="true"]{-webkit-user-select:text;user-select:text;background:rgba(0,0,0,.06);border-radius:6px;box-shadow:0 0 0 3px rgba(0,0,0,.06);cursor:text}

.img-slot{position:relative;overflow:hidden;display:grid;place-items:center;background:#efefef;color:#bdbdbd;cursor:pointer}
.img-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.img-slot svg{width:36%;height:36%;max-width:44px;max-height:44px}

/* call */
.wi.call{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px}
.call .av{width:62px;height:62px;border-radius:50%;flex:none}
.nm{font-size:16px;font-weight:650;letter-spacing:-.2px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.call .bt{display:flex;gap:8px}
.pill{width:66px;height:32px;border-radius:16px;display:grid;place-items:center;color:#fff;cursor:pointer;transition:transform .12s}
.pill:active{transform:scale(.94)}
.pill.dark{background:#111}
.pill.grey{background:#a9a9a9}

/* bubbles */
.wi.bub{display:flex;justify-content:space-around;align-items:center}
.bub .col{display:flex;flex-direction:column;align-items:center;gap:15px;width:160px}
.bubble{position:relative;background:#141414;color:#fff;border-radius:18px;padding:9px 16px;font-size:14px;font-weight:560;text-align:center;min-width:62px;max-width:158px;box-shadow:0 6px 16px rgba(0,0,0,.14)}
.bubble:after{content:"";position:absolute;left:50%;bottom:-5px;width:11px;height:11px;margin-left:-5.5px;background:#141414;transform:rotate(45deg);border-radius:3px}
.bubble span{position:relative;z-index:1;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ring{width:92px;height:92px;border-radius:50%;padding:5px;border:2px solid #141414;box-shadow:0 0 0 4px #efefef;background:#fff}
.ring .img-slot{width:100%;height:100%;border-radius:50%}
.wi.bub.sm .col{width:80px;gap:11px}
.bub.sm .bubble{font-size:12px;padding:6px 11px;min-width:42px;max-width:80px;border-radius:14px;box-shadow:0 4px 10px rgba(0,0,0,.12)}
.bub.sm .bubble:after{width:8px;height:8px;bottom:-4px;margin-left:-4px;border-radius:2px}
.bub.sm .ring{width:60px;height:60px;padding:3px;border-width:1.5px;box-shadow:0 0 0 3px #efefef}

/* send */
.wi.snd{background:#f0f0f0;border-radius:26px;padding:13px 14px;display:flex;flex-direction:column;justify-content:space-between}
.snd .h{display:flex;align-items:center;gap:6px;font-size:17px;font-weight:700;padding-left:2px}
.snd .r2{display:flex;align-items:center;gap:12px}
.snd .sq{width:40px;height:40px;border-radius:12px;flex:none;background:#e0e0e0}
.snd .lb{flex:1;font-size:16px;font-weight:500;min-width:0}
.snd .lb span{display:inline-block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
.snd .chev{color:#a9a9a9;flex:none}
.snd .msg{background:#fff;border-radius:16px;height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;font-size:14px;color:#8c8c8c;gap:10px}
.snd .msg span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.snd .msg .tag{color:#5d6e93;flex:none;max-width:40%}
.snd .r4{display:flex;gap:10px;align-items:center}
.snd .inp{flex:1;min-width:0;height:40px;background:#fff;border-radius:20px;border:0;padding:0 15px;font-size:16px;outline:none;font-family:inherit;color:var(--ink);-webkit-user-select:text;user-select:text;-webkit-appearance:none}
.snd .go{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:15px;font-weight:600;cursor:pointer;flex:none;transition:transform .12s}
.snd .go:active{transform:scale(.92)}

/* stats */
.wi.st{padding:17px 18px 0;display:flex;flex-direction:column}
.st .top{display:flex;align-items:center;gap:16px}
.st .av{width:62px;height:62px;border-radius:50%;flex:none}
.st .tt{min-width:0;flex:1}
.st .nm{font-size:19px;font-weight:700}
.st .sub{display:block;color:#c2c2c2;font-size:14px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .nums{display:flex;justify-content:space-around;margin-top:auto;padding-bottom:35px}
.st .nums>div{text-align:center;min-width:56px}
.st .n{display:block;font-size:18px;font-weight:550}
.st .l{font-size:12.5px;color:#b5b5b5;margin-top:3px}
.st .plus{position:absolute;left:50%;bottom:-9px;margin-left:-22px;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 50% 15%,#626262,#151515 78%);color:#fff;display:grid;place-items:center;box-shadow:0 7px 14px rgba(0,0,0,.22);cursor:pointer;transition:transform .12s}
.st .plus:active{transform:scale(.93)}

/* post */
.wi.po{padding:14px;display:flex;flex-direction:column}
.po .hd{display:flex;align-items:center;gap:11px}
.po .av{width:42px;height:42px;border-radius:50%;flex:none}
.po .who{flex:1;min-width:0}
.po .nm{font-size:16px;font-weight:600}
.po .tm{display:block;font-size:12px;color:#a8a8a8;margin-top:2px}
.po .more{color:#b0b0b0;flex:none}
.po .tx{display:block;font-size:15px;margin:11px 2px 9px;color:#2c2c2c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.po .pic{flex:1;min-height:0;border-radius:16px}
.po .ft{display:flex;justify-content:space-around;margin-top:11px;padding-top:11px;border-top:1px solid #e8e8e8;color:#a0a0a0;font-size:14px}
.po .ft>div{display:flex;align-items:center;gap:6px;cursor:pointer}
.po .ft .on{color:#141414}
.po .ft .on svg{fill:#141414}

/* menu */
.wi.mn{}
.mn .avl{position:absolute;left:20px;top:16px;width:76px;height:76px;border-radius:50%;z-index:2}
.mn .mh{position:absolute;left:112px;top:24px;right:16px;min-width:0}
.mn .nm{font-size:20px;font-weight:700}
.mn .id{font-size:14px;color:#8a8a8a;font-weight:550;margin-top:3px;white-space:nowrap}
.mn .panel{position:absolute;left:8px;right:8px;bottom:8px;top:72px;background:#f5f5f5;border-radius:24px;padding:36px 18px 4px;display:flex;flex-direction:column}
.mn .sig{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14.5px;font-weight:500;height:50px;border-bottom:1px solid #e6e6e6;flex:none}
.mn .sig span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mn .sig svg{color:#c4c4c4;flex:none}
.mn .row{flex:1;display:flex;align-items:center;gap:18px;font-size:16px;font-weight:550;cursor:pointer}
.mn .row+.row{background:linear-gradient(#e8e8e8,#e8e8e8) 40px 0/calc(100% - 40px) 1px no-repeat}
.mn .row .t{flex:1}
.mn .row .chev{color:#c4c4c4}

/* photo */
.wi.ph{border-radius:26px;overflow:hidden;border:1px solid rgba(0,0,0,.07);box-shadow:0 8px 22px rgba(0,0,0,.055)}
.ph .img-slot{width:100%;height:100%;background:#f1f1f1}

/* about */
.wi.ab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding-top:34px}
.ab .bb{position:absolute;right:34px;top:14px;background:#ababab;color:#fff;border-radius:24px;padding:12px 24px;font-size:15px;font-weight:550;min-width:116px;max-width:190px;text-align:center}
.ab .bb:after{content:"";position:absolute;left:18px;bottom:-12px;width:18px;height:14px;background:#ababab;clip-path:polygon(0 0,100% 0,0 100%)}
.ab .bb span,.ab .q span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab .rg{width:132px;height:132px;border-radius:50%;border:4px solid #c8c8c8;overflow:hidden;background:#fff;flex:none}
.ab .rg .img-slot{width:100%;height:100%;border-radius:50%;background:#fafafa}
.ab .sr{width:calc(100% - 52px);height:48px;border-radius:24px;background:#ececec;display:flex;align-items:center;padding:0 10px 0 16px;gap:10px;flex:none}
.ab .q{flex:1;text-align:center;font-size:18px;font-weight:650;min-width:0}
.ab .xx{width:28px;height:28px;border-radius:50%;background:#8e8e93;color:#fff;display:grid;place-items:center;flex:none}

/* moment */
.wi.mo{display:flex;flex-direction:column;align-items:center;gap:12px}
.mo .mc{flex:1;min-height:0;width:100%;padding:14px 14px 12px;display:flex;flex-direction:column;gap:12px;border-radius:30px}
.mo .hd{display:flex;align-items:center;gap:12px;flex:none}
.mo .av{width:50px;height:50px;border-radius:50%;flex:none}
.mo .who{flex:1;min-width:0}
.mo .nm{font-size:16px;font-weight:650}
.mo .tm{display:block;font-family:"Songti SC","Noto Serif SC","Source Han Serif SC",serif;font-size:13px;color:#9a9a9a;font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mo .go{color:#141414;flex:none}
.mo .pics{flex:1;min-height:0;display:flex;gap:7px}
.mo .pics .img-slot{flex:1;border-radius:16px;background:#e9e9e9}
.mo .ft{display:flex;justify-content:space-around;align-items:center;font-family:"Songti SC","Noto Serif SC","Source Han Serif SC",serif;font-size:17px;font-weight:600;flex:none}
.mo .ft>div{display:flex;align-items:center;gap:6px}
.mo .ft span[data-act]{display:grid;cursor:pointer}
.mo .ft .on svg{fill:#141414}
.mo .pl{height:46px;width:150px;border-radius:23px;background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.08);border:1px solid rgba(0,0,0,.05);display:flex;align-items:center;justify-content:center;gap:26px;flex:none}
.mo .pl i{width:1.5px;height:14px;background:#555;border-radius:1px}

/* profile grid */
.wi.gd{display:flex;flex-direction:column;gap:14px}
.gd .gc{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;border-radius:32px}
.gd .gh{display:flex;align-items:center;gap:14px;padding:14px 16px;flex:none}
.gd .av{width:62px;height:62px;border-radius:50%;flex:none}
.gd .tt{min-width:0;flex:1}
.gd .nm{font-size:17px;font-weight:700}
.gd .sub{display:block;color:#b0b0b0;font-size:13px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gd .gg{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:2px}
.gd .gg .img-slot{border-radius:0;background:#e6e6e6;min-height:0}
.gd .gs{display:flex;justify-content:space-around;padding:12px 8px 14px;flex:none}
.gd .gs>div{min-width:60px}
.gd .n{display:block;font-size:17px;font-weight:700}
.gd .l{font-size:12.5px;color:#444;margin-top:2px}
.gd .mnu{width:70%;background:#ececec;border-radius:30px;padding:16px 22px;display:flex;flex-direction:column;gap:16px;flex:none}
.gd .mnu>div{display:flex;align-items:center;gap:16px;font-size:17px;font-weight:500;cursor:pointer}

/* custom html */
.wi.cu{border-radius:22px;overflow:hidden}
.cu iframe{border:0;width:100%;height:100%;display:block;pointer-events:none;background:transparent}
.cu.live iframe{pointer-events:auto}
.cu .img-slot{width:100%;height:100%;border-radius:22px;background:#f3f3f3}
.editing .it.wd .cu{outline:1.5px dashed rgba(0,0,0,.2);outline-offset:-1px}

/* resize / edit badges */
.rsz,.edc{display:none;position:absolute;width:26px;height:26px;border-radius:50%;background:#fff;color:#141414;place-items:center;z-index:6;box-shadow:0 2px 8px rgba(0,0,0,.2);border:1px solid rgba(0,0,0,.08)}
.rsz{right:-8px;bottom:-8px}
.edc{right:-8px;top:-8px}
.editing .it.wd .rsz,.editing .it.wd .edc{display:grid}
.ghost .rsz,.ghost .edc{display:none!important}

/* html editor */
.edbody{padding:6px 18px 0;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.edbody textarea{width:100%;height:170px;border:0;border-radius:16px;background:#f4f4f4;padding:12px 14px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;color:#141414;resize:none;outline:none;-webkit-user-select:text;user-select:text;-webkit-appearance:none}
.edrow{display:flex;align-items:center;gap:10px}
.edrow>span{font-size:13px;color:#8a8a8a;flex:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 12px;border-radius:15px;background:#f1f1f1;font-size:13px;cursor:pointer}
.chip.on{background:#141414;color:#fff}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}
.chk input{width:18px;height:18px;accent-color:#141414}
.grow{flex:1}
.btn{height:42px;padding:0 20px;border-radius:21px;display:grid;place-items:center;font-size:14px;font-weight:600;background:#f1f1f1;cursor:pointer}
.btn.dark{background:#141414;color:#fff;flex:1}


/* ---- ins profile ---- */
.wi.ig{padding:12px 16px 14px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.ig .top{display:flex;align-items:center;gap:8px;flex:none;height:30px}
.ig .bk{display:grid;flex:none}
.ig .nmx{flex:1;display:flex;align-items:center;gap:6px;font-size:17px;font-weight:800;letter-spacing:.2px;min-width:0}
.ig .nmx>span[data-k]{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ig .vf{flex:none;display:grid}
.ig .rt{display:flex;gap:16px;align-items:center;flex:none}
.ig .main{display:flex;align-items:center;gap:18px;flex:none}
.ig .rg2{width:88px;height:88px;border-radius:50%;border:3px solid #d2d2d2;padding:3px;flex:none;background:#fff}
.ig .rg2 .img-slot{width:100%;height:100%;border-radius:50%}
.ig .info{flex:1;min-width:0}
.ig .dn{display:block;font-size:15px;font-weight:600;margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ig .st3{display:flex;justify-content:space-between;gap:6px}
.ig .st3>div{min-width:0}
.ig .n{display:block;font-size:15px;font-weight:800;white-space:nowrap}
.ig .st3 i{font-style:normal;font-size:12px;color:#222}
.ig .hb{flex:none;line-height:1.35}
.ig .hd1{display:block;font-size:14px;font-weight:600}
.ig .bio{display:block;font-size:11.5px;color:#777}
.ig .bt3{display:flex;gap:8px;flex:none}
.ig .b1{flex:1;height:36px;border-radius:11px;background:#efefef;display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:700}
.ig .b2{width:44px;height:36px;border-radius:11px;background:#efefef;display:grid;place-items:center}
.ig.h2 .hb,.ig.h2 .bt3{display:none}

/* ---- music player ---- */
.wi.mp{padding:14px 18px 12px;display:flex;flex-direction:column;justify-content:space-between}
.mp .top{display:flex;align-items:center;gap:14px}
.mp .cv{width:54px;height:54px;border-radius:12px;flex:none;box-shadow:0 8px 14px rgba(0,0,0,.16)}
.mp .tx2{flex:1;min-width:0}
.mp .ttl{display:block;font-size:20px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp .art{display:block;font-size:14px;color:#8d8d8d;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp .cast{color:#3a3a3a;flex:none;display:grid}
.mp .ctl{display:flex;justify-content:space-between;align-items:center;padding:0 4px;color:#3c3c3c}
.mp .b{display:grid;place-items:center;width:36px;height:32px;cursor:pointer}
.mp .b.on svg{fill:#141414}
.mp .lyr{font-size:21px;font-weight:700}
.mp .prog{display:flex;align-items:center;gap:10px;font-size:13px;color:#8a8a8a;font-variant-numeric:tabular-nums}
.mp .trk{flex:1;height:5px;border-radius:3px;background:#e6e6e6;position:relative}
.mp .trk i{position:absolute;left:0;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:#3a3a3a}
.mp.h1{flex-direction:row;align-items:center;gap:12px;padding:0 16px}
.mp.h1 .top{flex:1;min-width:0}
.mp.h1 .cast,.mp.h1 .prog,.mp.h1 .ctl .b:not(.play){display:none}
.mp.h1 .ctl{flex:none;padding:0}
.mp.h1 .cv{width:48px;height:48px}
.mp.h1 .ttl{font-size:17px}

/* ---- polaroid ---- */
.pic2{border-radius:3px;background:#e9e9e9}
.wi.pr{overflow:visible}
.pr .fr{position:absolute;inset:8px 4px 2px 4px;background:#fff;border:1px solid rgba(0,0,0,.06);border-radius:8px;box-shadow:0 8px 22px rgba(0,0,0,.1);padding:11px 11px 9px;display:flex;flex-direction:column;gap:6px}
.pr .pic2{flex:1;min-height:0}
.pr .ic3{display:flex;justify-content:center;gap:16px;color:#bdbdbd;flex:none;height:16px;align-items:center}
.pr .ic3 span{display:grid;cursor:pointer}
.pr .ic3 .on{color:#141414}.pr .ic3 .on svg{fill:#141414}
.pr .cap{display:block;font-size:8.5px;letter-spacing:.9px;line-height:1.35;color:#222;max-height:23px;overflow:hidden;flex:none}
.pr .clip{position:absolute;right:-2px;top:-4px;transform:rotate(14deg);color:#555;filter:drop-shadow(0 1px 1px rgba(0,0,0,.2));display:grid}
.wi.pr2{overflow:visible}

<!-- ============ 开屏动画（nano-splash.html）复制从这里开始 ============ -->
<script>
(function () {
  var TOTAL = 2800;   // 总载入时长（毫秒）
  var HOP   = 1800;   // 兔兔跳进场时长（毫秒）
  var FAST  = 5;      // 点击后的加速倍数
  var SEGS  = 20;     // 进度条格数（像素风分段）
  var INK = '#4a4850', PINK = '#f9c4de', CHEEK = '#fcd5e5';

  // 15 x 16 像素米菲兔头  # 描边  p 粉  w 白  c 腮红
  var GRID = [
    '...###...###...',
    '..#..##.#...#..',
    '..#...#.#...#..',
    '..#...#.#...#..',
    '..#...#.#...#..',
    '..#...#.#...#..',
    '..#p..#.#...#..',
    '..pwp..#....#..',
    '.pwpwp.......#.',
    '.#pwp........#.',
    '#..p..........#',
    '#...#.....#...#',
    '#...#.....#...#',
    '.#.cc..#..cc.#.',
    '..#.........#..',
    '...#########...'
  ];
  var COLOR = { '#': INK, p: PINK, w: '#fff', c: CHEEK };
  var rects = '';
  GRID.forEach(function (row, y) {
    for (var x = 0; x < row.length; x++) {
      var c = COLOR[row[x]];
      if (c) rects += '<rect x="' + x + '" y="' + y + '" width="1" height="1" fill="' + c + '"/>';
    }
  });

  var css =
    '#nano-splash{position:fixed;top:0;left:0;right:0;bottom:0;z-index:2147483000;background:#fff;' +
      'display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;' +
      'touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:opacity .4s ease}' +
    '#nano-splash.out{opacity:0;pointer-events:none}' +
    '#nano-splash .ns-run{display:flex;flex-direction:column;align-items:center}' +
    '#nano-splash .ns-hop{width:90px;height:96px;transform-origin:50% 100%}' +
    '#nano-splash .ns-hop.idle{animation:ns-idle 1.4s ease-in-out infinite}' +
    '#nano-splash svg{display:block;width:100%;height:100%;shape-rendering:crispEdges}' +
    '#nano-splash .ns-shadow{width:64px;height:6px;margin-top:6px;border-radius:50%;background:rgba(74,72,80,.12)}' +
    '#nano-splash .ns-barwrap{display:flex;justify-content:center;margin-top:20px}' +
    '#nano-splash .ns-bar{box-sizing:border-box;width:min(44vw,170px);height:14px;padding:2px;' +
      'border:2px solid ' + INK + ';background:#fff}' +
    '#nano-splash .ns-fill{height:100%;width:0;background:' + PINK + '}' +
    '@keyframes ns-idle{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.96)}}';

  function init() {
    var style = document.createElement('style');
    style.textContent = css;
    document.head.appendChild(style);

    var el = document.createElement('div');
    el.id = 'nano-splash';
    el.innerHTML =
      '<div class="ns-run">' +
        '<div class="ns-hop"><svg viewBox="0 0 15 16" xmlns="http://www.w3.org/2000/svg">' + rects + '</svg></div>' +
        '<div class="ns-shadow"></div>' +
      '</div>' +
      '<div class="ns-barwrap"><div class="ns-bar"><div class="ns-fill"></div></div></div>';
    document.body.insertBefore(el, document.body.firstChild);

    var run = el.querySelector('.ns-run');
    var hop = el.querySelector('.ns-hop');
    var shadow = el.querySelector('.ns-shadow');
    var fill = el.querySelector('.ns-fill');

    // 从屏幕左侧外面，三连跳到中间
    var startX = -(window.innerWidth / 2 + 100);
    var anims = [];
    anims.push(run.animate(
      [{ transform: 'translateX(' + startX + 'px)' }, { transform: 'translateX(0)' }],
      { duration: HOP, easing: 'cubic-bezier(.25,.5,.5,1)', fill: 'both' }
    ));

    var hopFrames = [{ offset: 0, transform: 'translateY(0) scale(1,1)', easing: 'ease-out' }];
    var shFrames  = [{ offset: 0, transform: 'scale(1)', opacity: 1, easing: 'ease-out' }];
    for (var i = 0; i < 3; i++) {
      var b = i / 3;
      hopFrames.push(
        { offset: b + 0.05, transform: 'translateY(0) scale(1.12,.86)',   easing: 'ease-out' },
        { offset: b + 0.17, transform: 'translateY(-34px) scale(.92,1.1)', easing: 'ease-in' },
        { offset: b + 0.30, transform: 'translateY(0) scale(1.14,.84)',   easing: 'ease-out' }
      );
      shFrames.push(
        { offset: b + 0.05, transform: 'scale(1)',  opacity: 1,  easing: 'ease-out' },
        { offset: b + 0.17, transform: 'scale(.6)', opacity: .5, easing: 'ease-in' },
        { offset: b + 0.30, transform: 'scale(1)',  opacity: 1,  easing: 'ease-out' }
      );
    }
    hopFrames.push({ offset: 1, transform: 'translateY(0) scale(1,1)' });
    shFrames.push({ offset: 1, transform: 'scale(1)', opacity: 1 });

    var hopAnim = hop.animate(hopFrames, { duration: HOP });
    anims.push(hopAnim);
    anims.push(shadow.animate(shFrames, { duration: HOP }));
    hopAnim.onfinish = function () { hop.classList.add('idle'); };

    // 进度条
    var t = 0, last = performance.now(), speed = 1, finished = false;
    function ease(x) { return x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }
    function tick(now) {
      var dt = Math.min(now - last, 100);
      last = now;
      t += dt * speed;
      var p = Math.min(1, t / TOTAL);
      fill.style.width = (Math.floor(ease(p) * SEGS) / SEGS * 100) + '%';
      if (p >= 1) finish(); else requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    function finish() {
      if (finished) return;
      finished = true;
      setTimeout(function () {
        el.classList.add('out');
        setTimeout(function () {
          if (el.parentNode) el.parentNode.removeChild(el);
          document.dispatchEvent(new Event('nano-splash-done'));
        }, 450);
      }, 200 / speed);
    }

    // 点屏幕任意位置：加速跳过
    function skip() {
      if (speed === FAST) return;
      speed = FAST;
      anims.forEach(function (a) { a.playbackRate = FAST; });
    }
    el.addEventListener('pointerdown', skip);
    window.NanoSplash = { skip: skip };
  }

  if (document.body) init();
  else document.addEventListener('DOMContentLoaded', init);
})();
</script>

function calcM(){
  const pw=pager.clientWidth||360, ph=pager.clientHeight||600;
  const gap=12,vgap=10,padX=18,gridTop=44;
  const cw=(pw-padX*2-gap*3)/4, rh=cw+6;
  const rNow=Math.max(5,Math.floor((ph-gridTop-10+vgap)/(rh+vgap)));
  if(!ROWS)ROWS=Math.max(rNow,S.rows||0);
  return {pw,ph,gap,vgap,padX,gridTop,cw,rh,R:ROWS};
}
const DWf=w=>w*80+(w-1)*12;
const itemPx=it=>{const {w,h}=sz(it);return {W:w*M.cw+(w-1)*M.gap,H:h*M.rh+(h-1)*M.vgap}};

/* ---------- 网格工具 ---------- */
function fits(items,c,r,w,h,ign){
  if(c<0||r<0||c+w>COLS||r+h>M.R)return false;
  return !items.some(o=>{if(o.id===ign)return false;const s=sz(o);return c<o.c+s.w&&c+w>o.c&&r<o.r+s.h&&r+h>o.r});
}
function itemAt(items,c,r,ign){return items.find(o=>{if(o.id===ign)return false;const s=sz(o);return c>=o.c&&c<o.c+s.w&&r>=o.r&&r<o.r+s.h})||null}
function firstFit(items,w,h){for(let r=0;r<=M.R-h;r++)for(let c=0;c<=COLS-w;c++)if(fits(items,c,r,w,h))return {c,r};return null}
function findSpot(items,w,h,c0,r0,ign){
  let best=null,bd=1e9;
  for(let r=0;r<=M.R-h;r++)for(let c=0;c<=COLS-w;c++){
    if(!fits(items,c,r,w,h,ign))continue;
    const d=(c-c0)*(c-c0)+(r-r0)*(r-r0);if(d<bd){bd=d;best={c,r}}
  }
  return best;
}
function placeAnywhere(it,start=0){
  const {w,h}=sz(it);
  for(let p=start;p<start+60;p++){
    if(!S.pages[p])S.pages[p]=[];
    const sp=firstFit(S.pages[p],w,h);
    if(sp){it.c=sp.c;it.r=sp.r;S.pages[p].push(it);return p}
  }
  return -1;
}

function loadState(){
  try{Object.assign(IMG,JSON.parse(localStorage.getItem(IKEY))||{})}catch(e){}
  let j=null;try{j=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!j||!Array.isArray(j.pages)||!Array.isArray(j.dock))return false;
  S.rows=(j.ver===2)?(j.rows||0):0; ROWS=0; M=calcM();
  const seen=new Set(); S.pages=[]; S.dock=[null,null,null,null];
  j.pages.forEach(pg=>{
    const out=[];
    (pg||[]).forEach(o=>{
      if(!o||seen.has(o.id))return;
      if(APP[o.id]){seen.add(o.id);const it=APPITEM[o.id];it.c=o.c;it.r=o.r;out.push(it)}
      else if(WD[o.t]){seen.add(o.id);const w=(Number.isInteger(o.w)&&o.w>=1&&o.w<=4)?o.w:undefined,h=(Number.isInteger(o.h)&&o.h>=1&&o.h<=5)?o.h:undefined;const ov=(typeof o.o==='number'&&o.o>=.1&&o.o<1)?o.o:undefined;out.push({id:o.id,t:o.t,c:o.c,r:o.r,d:o.d||{},w,h,o:ov})}
    });
    S.pages.push(out);
  });
  j.dock.slice(0,4).forEach((id,i)=>{if(id&&APP[id]&&!seen.has(id)){seen.add(id);S.dock[i]=id}});
  if(!S.pages.length)S.pages=[[]];
  /* 超出范围 / 重叠的放回去；新增的应用补进来 */
  const lost=[];
  S.pages.forEach((pg,pi)=>{const ok=[];pg.forEach(it=>{const s=sz(it);if(Number.isInteger(it.c)&&Number.isInteger(it.r)&&fits(ok,it.c,it.r,s.w,s.h))ok.push(it);else lost.push([it,pi])});pg.length=0;pg.push(...ok)});
  APPS.forEach(a=>{if(!seen.has(a.id))lost.push([APPITEM[a.id],0])});
  lost.forEach(([it,pi])=>placeAnywhere(it,pi));
  return true;
}

let press=null,drag=null,suppressUntil=0,ignoreMouse=0;
const ind=document.createElement('div');ind.className='ind';

function pressStart(x,y,target){
  if(document.querySelector('.sheet.open'))return;
  if(target.closest('.del,.rsz,.edc')||target.closest('[contenteditable="true"]')||target.closest('input'))return;
  const el=target.closest('.it');
  const blank=!el&&!!(target.closest('.grid')||target.classList.contains('page'));
  if(!el&&!blank)return;
  press={x,y,el,fired:false};
  press.timer=setTimeout(()=>{if(!press)return;press.fired=true;if(press.el)beginDrag(press.el,press.x,press.y);else enterEdit()},editing?150:380);
}
function pressMove(x,y,e){
  if(drag){if(e.cancelable)e.preventDefault();dragMove(x,y);return}
  if(press&&!press.fired&&Math.hypot(x-press.x,y-press.y)>9){clearTimeout(press.timer);press=null}
}
function pressEnd(x,y){
  if(drag)dragEnd(true);
  if(press){clearTimeout(press.timer);press=null}
}
[pager,dockEl].forEach(root=>{
  root.addEventListener('touchstart',e=>{ignoreMouse=Date.now()+800;if(e.touches.length===1)pressStart(e.touches[0].clientX,e.touches[0].clientY,e.target);else{clearTimeout(press&&press.timer);press=null}},{passive:true});
  root.addEventListener('mousedown',e=>{if(Date.now()<ignoreMouse||e.button!==0)return;pressStart(e.clientX,e.clientY,e.target)});
  root.addEventListener('contextmenu',e=>e.preventDefault());
});
document.addEventListener('touchmove',e=>{const t=e.touches[0];if(t)pressMove(t.clientX,t.clientY,e)},{passive:false});
document.addEventListener('touchend',e=>{ignoreMouse=Date.now()+800;const t=e.changedTouches[0];pressEnd(t?t.clientX:0,t?t.clientY:0)},{passive:true});
document.addEventListener('touchcancel',()=>{if(drag)dragEnd(false);if(press){clearTimeout(press.timer);press=null}},{passive:true});
document.addEventListener('mousemove',e=>{if(Date.now()<ignoreMouse)return;if(press||drag)pressMove(e.clientX,e.clientY,e)});
document.addEventListener('mouseup',e=>{if(Date.now()<ignoreMouse)return;pressEnd(e.clientX,e.clientY)});

function whereIs(it){
  for(let p=0;p<S.pages.length;p++)if(S.pages[p].includes(it))return {zone:'page',p};
  const s=S.dock.indexOf(it.id);return s>=0?{zone:'dock',s}:null;

function beginDrag(el,x,y){
  const it=find(el.dataset.id);if(!it)return;hideSizePop();
  enterEdit();
  const r=el.getBoundingClientRect(),ghost=el.cloneNode(true);
  ghost.classList.add('ghost');ghost.classList.remove('lift');
  ghost.style.cssText=`left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;margin:0;transform:scale(1.06)`;
  document.body.appendChild(ghost);el.classList.add('lift');
  drag={it,el,ghost,ox:x-r.left,oy:y-r.top,src:whereIs(it),target:null,px:x,py:y,edgeDir:0,edgeT:0};
  suppressUntil=Date.now()+600;
  updateTarget(x,y);
}
function dragMove(x,y){
  const d=drag;d.px=x;d.py=y;
  d.ghost.style.left=(x-d.ox)+'px';d.ghost.style.top=(y-d.oy)+'px';
  updateTarget(x,y);checkEdge(x);
}
function checkEdge(x){
  const d=drag;if(!d)return;const pr=pager.getBoundingClientRect();
  const dir=x<pr.left+28?-1:(x>pr.right-28?1:0);
  if(dir===d.edgeDir)return;
  clearTimeout(d.edgeT);d.edgeDir=dir;
  if(dir)d.edgeT=setTimeout(()=>{
    if(!drag)return;const nx=pageIndex()+dir;
    if(nx>=0&&nx<pager.children.length)pager.scrollTo({left:nx*pager.clientWidth,behavior:'smooth'});
    d.edgeDir=0;setTimeout(()=>{if(drag)checkEdge(drag.px)},650);
  },430);
}
function clearInd(){ind.remove();dockEl.querySelectorAll('.slot.over').forEach(s=>s.classList.remove('over'))}
function showInd(grid,c,r,w,h,rad){
  ind.style.left=c*(M.cw+M.gap)+'px';ind.style.top=r*(M.rh+M.vgap)+'px';
  ind.style.width=(w*M.cw+(w-1)*M.gap)+'px';ind.style.height=(h*M.rh+(h-1)*M.vgap)+'px';
  ind.style.borderRadius=(rad||22)+'px';grid.appendChild(ind);
}
function updateTarget(x,y){
  const d=drag,it=d.it;clearInd();d.target=null;
  const dr=dockEl.getBoundingClientRect();
  if(isApp(it)&&y>dr.top-14){
    const inner=dr.width-16,slot=Math.max(0,Math.min(3,Math.floor((x-dr.left-8)/(inner/4))));
    d.target={zone:'dock',slot};dockEl.children[slot].classList.add('over');return;
  }
  const pg=pageIndex(),pageEl=pager.children[pg];if(!pageEl)return;
  const grid=pageEl.firstChild,gr=grid.getBoundingClientRect(),items=S.pages[pg]||[];
  const {w,h}=sz(it),sx=M.cw+M.gap,sy=M.rh+M.vgap;
  const pc=Math.floor((x-gr.left)/sx),pr=Math.floor((y-gr.top)/sy);
  const occ=(pc>=0&&pr>=0)?itemAt(items,pc,pr,it.id):null;
  if(occ){
    const os=sz(occ);
    if(os.w===w&&os.h===h&&(d.src.zone==='page'||isApp(occ))){
      d.target={zone:'page',pg,swap:occ};showInd(grid,occ.c,occ.r,w,h,isApp(occ)?20:26);return;
    }
  }
  let c=Math.round((x-d.ox-gr.left)/sx),r=Math.round((y-d.oy-gr.top)/sy);
  c=Math.max(0,Math.min(COLS-w,c));r=Math.max(0,Math.min(M.R-h,r));
  const spot=fits(items,c,r,w,h,it.id)?{c,r}:findSpot(items,w,h,c,r,it.id);
  if(!spot)return;
  d.target={zone:'page',pg,c:spot.c,r:spot.r};showInd(grid,spot.c,spot.r,w,h,isApp(it)?20:26);
}
function takeOut(it){
  for(const pg of S.pages){const i=pg.indexOf(it);if(i>=0){pg.splice(i,1);return {zone:'page',pg,c:it.c,r:it.r}}}
  const s=S.dock.indexOf(it.id);if(s>=0){S.dock[s]=null;return {zone:'dock',s}}
  return {zone:'none'};
}
function commit(it,t){
  const src=takeOut(it);
  if(t.zone==='dock'){
    const cur=S.dock[t.slot];S.dock[t.slot]=it.id;
    if(cur){const occ=APPITEM[cur];if(src.zone==='page'){occ.c=src.c;occ.r=src.r;src.pg.push(occ)}else if(src.zone==='dock')S.dock[src.s]=cur;else placeAnywhere(occ,0)}
    return;
  }
  while(S.pages.length<=t.pg)S.pages.push([]);
  const tp=S.pages[t.pg];
  if(t.swap){
    const occ=t.swap,oc=occ.c,orr=occ.r;tp.splice(tp.indexOf(occ),1);
    if(src.zone==='page'){occ.c=src.c;occ.r=src.r;src.pg.push(occ)}else if(src.zone==='dock')S.dock[src.s]=occ.id;
    it.c=oc;it.r=orr;tp.push(it);
  }else{it.c=t.c;it.r=t.r;tp.push(it)}
}
function dragEnd(ok){
  const d=drag;drag=null;clearTimeout(d.edgeT);
  d.ghost.remove();d.el.classList.remove('lift');clearInd();
  suppressUntil=Date.now()+400;
  if(ok&&d.target){commit(d.it,d.target);save()}
  else if(ok)toast('这一页没有空位了');
  render();
}

/* =====================================================
   点击 / 编辑文字 / 换图 / 删除
===================================================== */
function openApp(app){toast('打开 '+app.name);document.dispatchEvent(new CustomEvent('phoneappopen',{detail:{id:app.id,name:app.name}}))}
[pager,dockEl].forEach(root=>root.addEventListener('click',e=>{
  if(Date.now()<suppressUntil)return;
  const el=e.target.closest('.it');if(!el)return;
  const it=find(el.dataset.id);if(!it)return;
  if(editing){if(e.target.closest('.del'))delWidget(it);else if(e.target.closest('.rsz'))resizeWidget(it);else if(e.target.closest('.edc'))openEditor(it);return}
  if(isApp(it)){openApp(APP[it.id]);return}
  if(e.target.closest('[contenteditable="true"]')||e.target.closest('input'))return;
  const act=e.target.closest('[data-act]'),kEl=e.target.closest('[data-k]'),sl=e.target.closest('.img-slot');
  if(act)doAct(act,it,el);
  else if(kEl)startEdit(kEl,it);
  else if(sl)pickImage(it,sl.dataset.slot,+sl.dataset.max||600);
}));

function emit(name,it,extra){document.dispatchEvent(new CustomEvent('widgetaction',{detail:Object.assign({action:name,widget:it.t,id:it.id},extra||{})}))}
function doAct(a,it,el){
  const k=a.dataset.act;it.d=it.d||{};
  if(k==='call'){toast('呼叫 '+v(it,'name'));emit('call',it)}
  else if(k==='hang'){toast('已挂断');emit('hangup',it)}
  else if(k==='follow'){it.d.f=!it.d.f;a.innerHTML=ic(it.d.f?'check':'plus',22,2.4);save();emit('follow',it,{on:it.d.f})}
  else if(k==='like'){it.d.like=!it.d.like;(a.closest('.ft>div')||a).classList.toggle('on',it.d.like);save();emit('like',it,{on:it.d.like})}
  else if(k==='cmt'){emit('comment',it)}
  else if(k==='share'){emit('share',it)}
  else if(k==='send'){
    const inp=el.querySelector('.inp'),val=inp.value.trim();if(!val)return;
    it.d.t=val;el.querySelector('[data-k="t"]').textContent=val;inp.value='';inp.blur();save();emit('send',it,{text:val});
  }
  else if(k==='play'){it._play=!it._play;a.innerHTML=icf(it._play?'pause':'play',a.classList.contains('play')?28:20);emit('play',it,{on:it._play})}
  else if(k==='dot'){it.d.off=!it.d.off;a.classList.toggle('off',it.d.off);save()}
  else if(k==='row'){openApp({id:a.dataset.app,name:a.dataset.name})}
}
function startEdit(el,it){
  const key=el.dataset.k;
  el.contentEditable='true';el.focus();
  const r=document.createRange();r.selectNodeContents(el);r.collapse(false);const s=getSelection();s.removeAllRanges();s.addRange(r);
  el.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();el.blur()}};
  el.onpaste=e=>{e.preventDefault();const t=(e.clipboardData||window.clipboardData).getData('text').replace(/\s+/g,' ');document.execCommand('insertText',false,t)};
  el.onblur=()=>{
    el.contentEditable='false';el.onblur=el.onkeydown=el.onpaste=null;
    const val=el.textContent.trim()||WD[it.t].d[key];el.textContent=val;
    it.d=it.d||{};it.d[key]=val;save();
  };
}
const fileIn=$('file');let pending=null;
function pickImage(it,slotKey,max,after){pending={id:it.id,slot:slotKey,max,after};fileIn.value='';fileIn.click()}
fileIn.addEventListener('change',()=>{
  const f=fileIn.files&&fileIn.files[0];if(!f||!pending)return;const p=pending;pending=null;
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();im.onload=()=>{
    const sc=Math.min(1,p.max/Math.max(im.width,im.height)),w=Math.round(im.width*sc),h=Math.round(im.height*sc);
    const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(im,0,0,w,h);
    IMG[p.id+'.'+p.slot]=c.toDataURL('image/jpeg',.86);saveImgs();
    document.querySelectorAll(`.img-slot[data-iid="${p.id}"][data-slot="${p.slot}"]`).forEach(s=>s.innerHTML=slotInner(p.id,p.slot,'i'));if(p.after)p.after();
  };im.onerror=()=>toast('图片读取失败');im.src=fr.result};
  fr.readAsDataURL(f);
});

let lastDel=null;
function delWidget(it){
  hideSizePop();
  const pi=S.pages.findIndex(pg=>pg.includes(it));if(pi<0)return;
  S.pages[pi].splice(S.pages[pi].indexOf(it),1);
  const imgs={};Object.keys(IMG).forEach(k=>{if(k.startsWith(it.id+'.')){imgs[k]=IMG[k];delete IMG[k]}});
  lastDel={it,pi,imgs};save();saveImgs();render();
  toast('已删除','撤销',()=>{
    if(!lastDel)return;const L=lastDel;lastDel=null;
    Object.assign(IMG,L.imgs);saveImgs();placeAnywhere(L.it,Math.min(L.pi,S.pages.length-1));save();render();
  });
}

function applySize(it,w,h){
  const items=S.pages.find(p=>p.includes(it));if(!items)return false;
  let c=Math.min(it.c,COLS-w),r=Math.min(it.r,M.R-h);
  if(!fits(items,c,r,w,h,it.id)){const sp=findSpot(items,w,h,c,r,it.id);if(!sp)return false;c=sp.c;r=sp.r}
  it.w=w;it.h=h;it.c=c;it.r=r;return true;
}
let sizeTarget=null;
function renderSizePop(){
  const it=sizeTarget,pop=$('sizePop');pop.innerHTML='';if(!it)return;
  const cur=sz(it),list=WD[it.t].sizes||[];
  if(list.length>1){
    const row=document.createElement('div');row.className='spr';
    list.forEach(sv=>{
      const c=document.createElement('div');c.className='chip'+(sv[0]===cur.w&&sv[1]===cur.h?' on':'');c.textContent=sv[0]+'×'+sv[1];
      c.onclick=e=>{e.stopPropagation();if(applySize(it,sv[0],sv[1])){save();render();renderSizePop()}else toast('这一页放不下这个尺寸')};
      row.appendChild(c);
    });
    pop.appendChild(row);
  }
  const val=Math.round((it.o==null?1:it.o)*100),op=document.createElement('div');op.className='oprow';
  op.innerHTML=`<span>透明度</span><input type="range" min="10" max="100" step="5" value="${val}"><b>${val}%</b>`;
  const inp=op.querySelector('input'),lab=op.querySelector('b');
  inp.oninput=()=>{const v=+inp.value;lab.textContent=v+'%';if(v>=100)delete it.o;else it.o=v/100;const w=document.querySelector(`.it[data-id="${it.id}"] .wi`);if(w)w.style.opacity=it.o==null?'':it.o};
  inp.onchange=()=>save();
  pop.appendChild(op);
}
function hideSizePop(){sizeTarget=null;$('sizePop').classList.remove('show')}
function resizeWidget(it){
  if(sizeTarget===it&&$('sizePop').classList.contains('show')){hideSizePop();return}
  sizeTarget=it;renderSizePop();$('sizePop').classList.add('show');
}
document.addEventListener('click',e=>{if(!e.target.closest('#sizePop')&&!e.target.closest('.rsz'))hideSizePop()},true);
let edTarget=null,edSize=[2,2];
function openEditor(it){
  edTarget=it||null;const cur=it?sz(it):{w:2,h:2};edSize=[cur.w,cur.h];
  $('edCode').value=it?(it.d.code||''):SAMPLE;$('edLive').checked=!!(it&&it.d.live);
  buildChips();$('editor').classList.add('open');
}
function buildChips(){
  const box=$('edSizes');box.innerHTML='';
  const base=WD.custom.sizes,same=(a,b)=>a[0]===b[0]&&a[1]===b[1];
  (base.some(s=>same(s,edSize))?base:[...base,edSize]).forEach(s=>{
    const c=document.createElement('div');c.className='chip'+(same(s,edSize)?' on':'');c.textContent=s[0]+'×'+s[1];
    c.onclick=()=>{edSize=s;buildChips()};box.appendChild(c);
  });
}
function closeEditor(){$('editor').classList.remove('open');$('edCode').blur()}
$('edMask').onclick=$('edCancel').onclick=closeEditor;
$('edImport').onclick=()=>{$('edFile').value='';$('edFile').click()};
$('edFile').onchange=()=>{const f=$('edFile').files[0];if(f)f.text().then(t=>{$('edCode').value=t}).catch(()=>toast('文件读取失败'))};
$('edSave').onclick=()=>{
  const code=$('edCode').value,live=$('edLive').checked,[w,h]=edSize;
  if(!code.trim()){toast('代码是空的');return}
  closeEditor();
  if(!edTarget){
    const it=newWidget('custom');it.d={code,live};it.w=w;it.h=h;
    const p=placeAnywhere(it,Math.min(pageIndex(),S.pages.length));
    if(p<0){toast('没有空位了');return}
    save();render();curPage=p;pager.scrollTo({left:p*pager.clientWidth,behavior:'smooth'});
  }else{
    const it=edTarget;it.d.code=code;it.d.live=live;
    if(!applySize(it,w,h))toast('这个尺寸放不下，保留原大小');
    save();render();
  }
};

/* =====================================================
   添加小组件
===================================================== */
function openSheet(){
  const gal=$('gal');gal.innerHTML='';
  const inner=Math.min(phone.clientWidth,480)-36,sc=Math.min(.5,((inner-12)/2)/DWf(4));
  WORDER.forEach(t=>{
    const def=WD[t],it={id:'pv_'+t,t,c:0,r:0,d:{}};
    const W=DWf(def.w),H=def.h*86+(def.h-1)*10;
    const box=document.createElement('div');box.className='pvbox';box.style.width=W*sc+'px';box.style.height=H*sc+'px';
    const pin=document.createElement('div');pin.className='pin';pin.style.cssText=`width:${W}px;height:${H}px;transform:scale(${sc})`;
    const wi=document.createElement('div');wi.className='wi '+def.cls+((def.small&&def.w<=2)?' sm':'')+' w'+def.w+' h'+def.h;wi.style.cssText=`width:${W}px;height:${H}px`;wi.innerHTML=def.inner(it);
    pin.appendChild(wi);box.appendChild(pin);
    const pv=document.createElement('div');pv.className='pv';pv.appendChild(box);
    const lb=document.createElement('span');lb.textContent=def.name;pv.appendChild(lb);
    pv.onclick=()=>{closeSheet();if(t==='custom')openEditor(null);else addWidget(t)};gal.appendChild(pv);
  });
  gal.scrollTop=0;$('sheet').classList.add('open');
}
function closeSheet(){$('sheet').classList.remove('open')}
$('sheetMask').onclick=closeSheet;
function addWidget(t){
  const it=newWidget(t);
  const start=Math.min(pageIndex(),S.pages.length);
  const p=placeAnywhere(it,start);
  if(p<0){toast('没有空位了');return}
  save();render();curPage=p;
  pager.scrollTo({left:p*pager.clientWidth,behavior:'smooth'});
}

/* =====================================================
   Toast
===================================================== */
let toastTimer;
function toast(text,label,fn){
  const el=$('toast');el.innerHTML='<span></span>';el.firstChild.textContent=text;
  if(label){const b=document.createElement('b');b.textContent=label;b.onclick=()=>{fn&&fn();el.classList.remove('show')};el.appendChild(b)}
  el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),label?3500:1500);
}

/* =====================================================
   启动
===================================================== */
function init(){
  try{Object.assign(IMG,JSON.parse(localStorage.getItem(IKEY))||{})}catch(e){}
  M=calcM();
  if(!loadState()){defaultState();save()}
  else save();
  render();
  /* 开屏结束后再显示主界面：如果开屏还在跑就先等它，避免桌面提前露出来 */
  var splashDone = function(){ try{ phone.classList.remove('pre-splash'); }catch(e){} };
  if(document.getElementById('nano-splash')){ document.addEventListener('nano-splash-done', splashDone, {once:true}); }
  else { splashDone(); }
}
let lastW=0;
window.addEventListener('resize',()=>{if(drag)return;const w=phone.clientWidth;if(w!==lastW){lastW=w;render()}});
lastW=phone.clientWidth;
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
</script>
