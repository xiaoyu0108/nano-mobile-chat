<style>
 *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
 html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif}
 .card{height:100%;border-radius:22px;background:rgba(246,248,252,calc(.20 * var(--wo,1)));padding:12px 14px 13px;display:flex;flex-direction:column;gap:9px;border:1px solid rgba(255,255,255,calc(.55 * var(--wo,1)))}
 .top{display:flex;align-items:center;gap:10px;flex:none}
 .av{position:relative;width:52px;height:52px;flex:none}
 .av .ring{width:100%;height:100%;border-radius:50%;background:#e4e4e4;border:1.5px solid #dff1fb;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer}
 .av img{width:100%;height:100%;object-fit:cover;display:none}
 .av.has img{display:block}.av.has .ph{display:none}
 .plus{position:absolute;right:-3px;bottom:-3px;width:17px;height:17px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
 .bubble{position:absolute;left:44px;top:-8px;padding:2px 9px;border-radius:7px;background:#e8f6fd;color:#8a97a3;font:700 11px/1.4 -apple-system,sans-serif;white-space:nowrap;z-index:2}
 .mid{flex:1;min-width:0;padding-left:6px}
 .t{font-size:15px;font-weight:800;color:#a9aeb3;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .s{font-size:10.5px;font-weight:600;color:#c3c6c9;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .right{flex:none;text-align:right}
 .d1{font-size:13px;font-weight:800;color:#a9aeb3;letter-spacing:.3px}
 .d2{font-size:11px;font-weight:700;color:#b4b8bc;margin-top:3px}
 [contenteditable]{outline:none;caret-color:#8fcbea}
 .line{height:1px;background:#eef1f4;flex:none}
 .row{flex:1;min-height:0;display:flex;gap:9px}
 .p{flex:1;min-width:0;border-radius:12px;overflow:hidden;background:#e4e4e4;position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center}
 .p img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
 .p.has img{display:block}.p.has .ph{display:none}
</style>
<div class="card">
 <div class="top">
  <div class="av" id="av">
   <div class="ring" data-k="avatar">
    <svg class="ph" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.5 20c.8-4 3.8-6 7.5-6s6.7 2 7.5 6"/></svg>
    <img alt="">
   </div>
   <div class="plus" data-k="avatar"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#a9aeb3" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.5v9M7.5 12h9"/></svg></div>
   <div class="bubble" id="time" contenteditable="true" spellcheck="false" data-t="time">12:20</div>
  </div>
  <div class="mid">
   <div class="t" id="title" contenteditable="true" spellcheck="false" data-t="title"></div>
   <div class="s" id="sub" contenteditable="true" spellcheck="false" data-t="sub"></div>
  </div>
  <div class="right">
   <div class="d1" id="day" contenteditable="true" spellcheck="false" data-t="day">TUE</div>
   <div class="d2" id="date" contenteditable="true" spellcheck="false" data-t="date">2026/08/04</div>
  </div>
 </div>
 <div class="line"></div>
 <div class="row">
  <div class="p" data-k="p1"><svg class="ph" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-4.5 4 3.5 3-2.5 4.5 3.5"/></svg><img alt=""></div>
  <div class="p" data-k="p2"><svg class="ph" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-4.5 4 3.5 3-2.5 4.5 3.5"/></svg><img alt=""></div>
  <div class="p" data-k="p3"><svg class="ph" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-4.5 4 3.5 3-2.5 4.5 3.5"/></svg><img alt=""></div>
 </div>
</div>
<input id="pick" type="file" accept="image/*" hidden>
<script>
// 点头像 / 加号 / 三张图 → 选图，自动保存到小部件
// 点文字直接修改；时间和日期默认自动更新，改过后就固定为你写的内容
var W=window.__nanoWidgetId||'';
var imgs=window.__nanoWidgetImages||{};
var pick=document.getElementById('pick'),curKey='';

function setImg(k,src){
 var boxes=document.querySelectorAll('[data-k="'+k+'"]');
 boxes.forEach(function(b){
  var host=b.classList.contains('plus')?null:b;
  if(!host)return;
  var im=host.querySelector('img');
  if(im){im.src=src;(k==='avatar'?document.getElementById('av'):host).classList.add('has');}
 });
}
Object.keys(imgs).forEach(function(k){if(imgs[k])setImg(k,imgs[k]);});

document.querySelectorAll('[data-k]').forEach(function(el){
 el.onclick=function(){curKey=el.getAttribute('data-k');pick.value='';pick.click();};
});

pick.onchange=function(){
 var f=pick.files&&pick.files[0];if(!f||!curKey)return;
 var K=curKey;
 var r=new FileReader();
 r.onload=function(){
  var im=new Image();
  im.onload=function(){
   var max=K==='avatar'?400:900,s=Math.min(1,max/Math.max(im.width,im.height));
   var c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
   c.getContext('2d').drawImage(im,0,0,c.width,c.height);
   var data=c.toDataURL('image/jpeg',.86);
   setImg(K,data);
   parent.postMessage({type:'nanoWidgetImage',widget:W,key:K,data:data},'*');
  };
  im.src=r.result;
 };
 r.readAsDataURL(f);
};

// 文案：修改后自动保存
var SK='nanoTxt_'+W;
function load(){try{return JSON.parse(localStorage.getItem(SK)||'{}')}catch(e){return{}}}
var saved=load();
var DAYS=['SUN','MON','TUE','WED','THU','FRI','SAT'];
function p2(n){return(n<10?'0':'')+n}
function tick(){
 var d=new Date();
 var auto={time:p2(d.getHours())+':'+p2(d.getMinutes()),day:DAYS[d.getDay()],date:d.getFullYear()+'/'+p2(d.getMonth()+1)+'/'+p2(d.getDate())};
 ['time','day','date'].forEach(function(k){
  var el=document.querySelector('[data-t="'+k+'"]');
  if(saved[k]==null&&document.activeElement!==el)el.textContent=auto[k];
 });
}
document.querySelectorAll('[data-t]').forEach(function(el){
 var k=el.getAttribute('data-t');
 if(saved[k]!=null)el.textContent=saved[k];
 el.addEventListener('input',function(){
  saved[k]=el.textContent;
  try{localStorage.setItem(SK,JSON.stringify(saved))}catch(e){}
 });
 el.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();el.blur();}});
});
tick();setInterval(tick,15000);
</script>
