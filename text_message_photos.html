<style>
 *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
 html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif}
 .card{height:100%;background:rgba(246,248,252,calc(.20 * var(--wo,1)));border-radius:5.2vw;padding:3.4vw 4.4vw 4vw;display:flex;flex-direction:column;gap:2.6vw;box-shadow:0 1px 6px rgba(0,0,0,calc(.07 * var(--wo,1)));border:1px solid rgba(255,255,255,calc(.55 * var(--wo,1)))}
 [contenteditable]{outline:none;caret-color:#bbb}
 .top{flex:none;display:flex;align-items:center;gap:2.6vw}
 .tag{flex:none;width:9vw;height:9vw;border-radius:50%;background:#f4f4f4;display:flex;align-items:center;justify-content:center;cursor:pointer}
 .tag svg{width:4.6vw;height:4.6vw}
 .msg{flex:1;min-width:0;height:9vw;border-radius:5vw;background:#f6f6f6;padding:0 3.6vw;display:flex;align-items:center;font-size:4.2vw;font-weight:700;color:#b3b3b3;white-space:nowrap;overflow:hidden}
 .msg span{display:block;width:100%;overflow:hidden;text-overflow:ellipsis}
 .box{flex:1;min-height:0;border:1px solid #f1f1f1;border-radius:3.2vw;padding:1.8vw;display:flex;gap:1.4vw}
 .slot{position:relative;flex:1;min-width:0;background:#f4f4f4;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:.6vw}
 .slot.fr{background:#e6e6e6;border:1.6vw solid #f7f7f7;box-shadow:0 0 0 1px #ececec;border-radius:1vw}
 .slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
 .slot.has img{display:block}.slot.has .ph{display:none}
 .slot.has{background:#e6e6e6}
 .ph{width:9vw;height:9vw}
</style>
<div class="card">
 <div class="top">
  <div class="tag" id="tag"><svg viewBox="0 0 24 24" fill="#d2d2d2"><path d="M12.600 2.800l7.100 2.400a1.500 1.500 0 011 1l.1 6.900a2 2 0 01-.6 1.500l-6.300 6.200a2.400 2.400 0 01-3.400 0l-4.600-4.600a2.400 2.400 0 010-3.400l5.400-6.500a2 2 0 011.300-.5z"/><circle cx="15.800" cy="8.200" r="1.500" fill="#f4f4f4"/></svg></div>
  <div class="msg"><span contenteditable="true" spellcheck="false" data-t="msg"></span></div>
 </div>
 <div class="box">
  <div class="slot" data-k="p1"><svg class="ph" viewBox="0 0 24 24" fill="#d2d2d2"><path d="M9 4.500l-1.200 2H5.500A2.500 2.500 0 003 9v8.500A2.500 2.500 0 005.500 20h13a2.500 2.500 0 002.500-2.500V9a2.500 2.500 0 00-2.500-2.500h-2.300L15 4.500z"/><circle cx="12" cy="13" r="3.600" fill="#f4f4f4"/><circle cx="12" cy="13" r="2" fill="#d2d2d2"/></svg><img alt=""></div>
  <div class="slot fr" data-k="p2"><svg class="ph" viewBox="0 0 24 24" fill="#fff"><path d="M9 4.500l-1.200 2H5.500A2.500 2.500 0 003 9v8.500A2.500 2.500 0 005.500 20h13a2.500 2.500 0 002.500-2.500V9a2.500 2.500 0 00-2.500-2.500h-2.300L15 4.500z"/><circle cx="12" cy="13" r="3.600" fill="#e6e6e6"/><circle cx="12" cy="13" r="2" fill="#fff"/></svg><img alt=""></div>
  <div class="slot fr" data-k="p3"><svg class="ph" viewBox="0 0 24 24" fill="#fff"><path d="M9 4.500l-1.200 2H5.500A2.500 2.500 0 003 9v8.500A2.500 2.500 0 005.500 20h13a2.500 2.500 0 002.500-2.500V9a2.500 2.500 0 00-2.500-2.500h-2.300L15 4.500z"/><circle cx="12" cy="13" r="3.600" fill="#e6e6e6"/><circle cx="12" cy="13" r="2" fill="#fff"/></svg><img alt=""></div>
 </div>
</div>
<input id="pick" type="file" accept="image/*" hidden>
<script>
// 点三个图片位选图，自动保存；点 Text message 直接改文字
var W=window.__nanoWidgetId||'',imgs=window.__nanoWidgetImages||{},pick=document.getElementById('pick'),cur='';
function setImg(k,src){document.querySelectorAll('.slot[data-k="'+k+'"]').forEach(function(b){b.querySelector('img').src=src;b.classList.add('has')})}
Object.keys(imgs).forEach(function(k){if(imgs[k])setImg(k,imgs[k])});
document.querySelectorAll('.slot').forEach(function(el){el.onclick=function(){cur=el.getAttribute('data-k');pick.value='';pick.click()}});
document.getElementById('tag').onclick=function(){var m=document.querySelector('[data-t="msg"]');m.focus()};
pick.onchange=function(){var f=pick.files&&pick.files[0];if(!f||!cur)return;var K=cur,r=new FileReader();
 r.onload=function(){var im=new Image();im.onload=function(){var max=900,s=Math.min(1,max/Math.max(im.width,im.height));
  var c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);var d=c.toDataURL('image/jpeg',.86);
  setImg(K,d);parent.postMessage({type:'nanoWidgetImage',widget:W,key:K,data:d},'*')};im.src=r.result};r.readAsDataURL(f)};
var SK='nanoTxt_'+W,saved={};try{saved=JSON.parse(localStorage.getItem(SK)||'{}')}catch(e){}
document.querySelectorAll('[data-t]').forEach(function(el){var k=el.getAttribute('data-t');
 if(saved[k]!=null)el.textContent=saved[k];
 el.addEventListener('input',function(){saved[k]=el.textContent;try{localStorage.setItem(SK,JSON.stringify(saved))}catch(e){}});
 el.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();el.blur()}})});
</script>
