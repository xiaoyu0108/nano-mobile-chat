<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>外卖卡片</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 300px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      border: 1px solid #e5e5e5;
    }

    /* 顶部状态栏 */
    .card-header {
      background: #111111;
      color: #ffffff;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
    }

    .status i {
      font-size: 13px;
      color: #a0a0a0;
    }

    .time {
      font-size: 12px;
      color: #b0b0b0;
    }

    /* 主内容区 */
    .main-section {
      padding: 16px 14px 12px;
      text-align: center;
      border-bottom: 1px solid #f0f0f0;
    }

    .main-label {
      font-size: 11px;
      color: #888888;
      margin-bottom: 2px;
    }

    .amount {
      font-size: 26px;
      font-weight: 700;
      color: #111111;
      letter-spacing: -0.5px;
    }

    .amount span {
      font-size: 16px;
      font-weight: 500;
      margin-right: 1px;
    }

    /* 信息两列布局 */
    .info-section {
      padding: 12px 14px 8px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 12px;
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-box {
      width: 30px;
      height: 30px;
      background: #f5f5f5;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon-box i {
      font-size: 12px;
      color: #333333;
    }

    .info-content {
      min-width: 0;
    }

    .info-label {
      font-size: 10px;
      color: #999999;
      margin-bottom: 1px;
    }

    .info-value {
      font-size: 12px;
      color: #111111;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 备注 */
    .message-box {
      margin: 10px 14px 0;
      background: #f8f8f8;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      color: #444444;
      line-height: 1.35;
    }

    /* 底部按钮 */
    .card-footer {
      padding: 12px 14px 14px;
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      height: 38px;
      border-radius: 10px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: #111111;
      color: #ffffff;
    }

    .btn-primary:hover {
      background: #333333;
    }

    .btn-secondary {
      background: #f5f5f5;
      color: #333333;
    }

    .btn-secondary:hover {
      background: #e8e8e8;
    }

    .btn i {
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- 顶部状态 -->
    <div class="card-header">
      <div class="status">
        <i class="fa-solid fa-utensils"></i>
        <span>外卖订单</span>
      </div>
      <div class="time">今天 18:15</div>
    </div>

    <!-- 金额 -->
    <div class="main-section">
      <div class="main-label">订单金额</div>
      <div class="amount"><span>¥</span>48.50</div>
    </div>

    <!-- 两列信息 -->
    <div class="info-section">
      <div class="info-grid">
        <div class="info-item">
          <div class="icon-box">
            <i class="fa-solid fa-store"></i>
          </div>
          <div class="info-content">
            <div class="info-label">店名</div>
            <div class="info-value">麦当劳</div>
          </div>
        </div>

        <div class="info-item">
          <div class="icon-box">
            <i class="fa-solid fa-burger"></i>
          </div>
          <div class="info-content">
            <div class="info-label">食品</div>
            <div class="info-value">巨无霸套餐</div>
          </div>
        </div>

        <div class="info-item">
          <div class="icon-box">
            <i class="fa-solid fa-hashtag"></i>
          </div>
          <div class="info-content">
            <div class="info-label">订单号</div>
            <div class="info-value">WD20261019</div>
          </div>
        </div>

        <div class="info-item">
          <div class="icon-box">
            <i class="fa-solid fa-clock"></i>
          </div>
          <div class="info-content">
            <div class="info-label">预计送达</div>
            <div class="info-value">30 分钟</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 备注 -->
    <div class="message-box">
      备注：不要辣，多加番茄酱
    </div>

    <!-- 底部按钮 -->
    <div class="card-footer">
      <button class="btn btn-secondary">
        <i class="fa-solid fa-xmark"></i>
        取消
      </button>
      <button class="btn btn-primary">
        <i class="fa-solid fa-check"></i>
        确认
      </button>
    </div>
  </div>

</body>
</html>
