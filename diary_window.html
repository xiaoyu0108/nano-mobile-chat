<style>
 *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
 html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif}
 .win{position:relative;height:100%;background:rgba(246,248,252,calc(.20 * var(--wo,1)));border-radius:1.3em;padding:.8em 1.1em 1em;display:flex;flex-direction:column;font-size:3.2vw;overflow:hidden}
 [contenteditable]{outline:none;caret-color:#f2a7bd}
 .bar{flex:none;display:flex;align-items:center;gap:.9em;height:2.6em}
 .bar svg{width:1.45em;height:1.45em;flex:none}
 .ttl{position:relative;margin-left:auto;margin-right:.6em;background:#fcebf0;padding:.2em 1.1em;font:1.2em "Songti SC","Noto Serif SC",serif;color:#555;white-space:nowrap}
 .ttl:before,.ttl:after{content:"";position:absolute;width:.42em;height:.42em;border-radius:50%;background:#f7b9cb}
 .ttl:before{left:-.1em;top:-.3em}.ttl:after{right:-.3em;bottom:-.3em}
 .body{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;margin-top:.5em}
 .sb{position:absolute;right:0;top:.2em;bottom:.2em;width:1.5em;background:#c9c9c9}
 .sb:before{content:"";position:absolute;left:0;right:0;top:34%;height:22%;background:#e6e6e6;border-radius:.8em}
 .sb svg{position:absolute;left:.35em;width:.8em;height:.5em}
 .txt{flex:none;margin:0 2em .7em 1.4em;font:.78em/1.45 "Songti SC","Noto Serif SC",serif;color:#555}
 .card{flex:1;min-height:0;margin:0 2em 0 .7em;border:1px solid rgba(255,255,255,calc(.55 * var(--wo,1)));border-radius:1.6em;padding:1.1em 1.3em .9em;display:flex;flex-direction:column;background:rgba(246,248,252,calc(.22 * var(--wo,1)));box-shadow:0 1px 4px rgba(0,0,0,calc(.04 * var(--wo,1)))}
 .slot{position:relative;background:#e4e4e4;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center}
 .slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
 .slot.has img{display:block}.slot.has .ph{display:none}
 .photo{flex:1;min-height:0}
 .likes{position:absolute;left:.9em;bottom:.5em;font-size:.95em;color:#777;font-weight:300;z-index:2}
 .badge{position:absolute;right:0;bottom:0;background:#fff;padding:.25em .5em;display:flex;align-items:center;gap:.35em;font-weight:700;font-size:.9em;color:#333;z-index:2}
 .badge span{display:flex;align-items:center;gap:.2em}
 .info{flex:none;display:flex;align-items:center;margin-top:.8em;gap:.6em}
 .l{flex:1;min-width:0}
 .name{display:flex;align-items:flex-start;font-size:1.45em;font-weight:800;color:#333;line-height:1.1}
 .name svg{width:.6em;height:.6em;margin:-.1em 0 0 .1em}
 .desc{font:.68em/1.5 "Songti SC","Noto Serif SC",serif;color:#666;margin-top:.5em}
 .clk{flex:none;width:7.6em;height:7.6em}
</style>

  <div class="txt">

   </div>
  </div>
 </div>
</div>
<input id="pick" type="file" accept="image/*" hidden>
<script>
// 点灰色图片位选图，自动保存；点文字直接修改
var W=window.__nanoWidgetId||'',imgs=window.__nanoWidgetImages||{},pick=document.getElementById('pick'),cur='';
function setImg(k,src){document.querySelectorAll('.slot[data-k="'+k+'"]').forEach(function(b){b.querySelector('img').src=src;b.classList.add('has')})}
Object.keys(imgs).forEach(function(k){if(imgs[k])setImg(k,imgs[k])});
document.querySelectorAll('.slot').forEach(function(el){el.onclick=function(){cur=el.getAttribute('data-k');pick.value='';pick.click()}});
pick.onchange=function(){var f=pick.files&&pick.files[0];if(!f||!cur)return;var K=cur,r=new FileReader();
 r.onload=function(){var im=new Image();im.onload=function(){var max=900,s=Math.min(1,max/Math.max(im.width,im.height));
  var c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);var d=c.toDataURL('image/jpeg',.86);
  setImg(K,d);parent.postMessage({type:'nanoWidgetImage',widget:W,key:K,data:d},'*')};im.src=r.result};r.readAsDataURL(f)};
var SK='nanoTxt_'+W,saved={};try{saved=JSON.parse(localStorage.getItem(SK)||'{}')}catch(e){}
document.querySelectorAll('[data-t]').forEach(function(el){var k=el.getAttribute('data-t');
 if(saved[k]!=null)el.textContent=saved[k];
 el.addEventListener('input',function(){saved[k]=el.textContent;try{localStorage.setItem(SK,JSON.stringify(saved))}catch(e){}});
 el.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();el.blur()}})});
function tick(){var d=new Date(),s=d.getSeconds(),m=d.getMinutes()+s/60,h=(d.getHours()%12)+m/60;
 document.getElementById('hh').setAttribute('transform','rotate('+h*30+' 50 50)');
 document.getElementById('mm').setAttribute('transform','rotate('+m*6+' 50 50)');
 document.getElementById('ss').setAttribute('transform','rotate('+s*6+' 50 50)');
 document.getElementById('wd').textContent=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()]}
tick();setInterval(tick,1000);
</script>
