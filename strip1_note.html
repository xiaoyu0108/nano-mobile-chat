<style>
 *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
 html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif}
 .card{position:relative;height:100%;border-radius:18px;background:rgba(246,248,252,calc(.20 * var(--wo,1)));border:1px solid rgba(255,255,255,calc(.55 * var(--wo,1)));padding:0 12px;display:flex;align-items:center;gap:10px;overflow:hidden}
 .slot{position:relative;flex:none;background:#e4e4e4;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center}
 .slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
 .slot.has img{display:block}.slot.has .ph{display:none}
 .round{border-radius:50%;border:1.5px solid #dff1fb}
 .mid{flex:1;min-width:0}
 .t{font-size:13px;font-weight:800;color:#a3a9ae;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .s{font-size:10px;font-weight:600;color:#c3c6c9;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .pill{flex:none;padding:3px 10px;border-radius:9px;background:#e8f6fd;color:#8a97a3;font:700 12px/1.4 -apple-system,sans-serif}.pill:empty{display:none}
 [contenteditable]{outline:none;caret-color:#8fcbea}
</style>
<div class="card"><div class="slot round" data-k="avatar" style="width:36px;height:36px"><svg class="ph" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.5 20c.8-4 3.8-6 7.5-6s6.7 2 7.5 6"/></svg><img alt=""></div><div class="mid"><div class="t" contenteditable="true" spellcheck="false" data-t="title"></div><div class="s" contenteditable="true" spellcheck="false" data-t="sub"></div></div><div class="pill" contenteditable="true" spellcheck="false" data-t="time"></div></div>
<input id="pick" type="file" accept="image/*" hidden>
<script>
// 点灰色图片位选图，自动保存；点文字直接修改
var W=window.__nanoWidgetId||'',imgs=window.__nanoWidgetImages||{},pick=document.getElementById('pick'),cur='';
function setImg(k,src){document.querySelectorAll('.slot[data-k="'+k+'"]').forEach(function(b){b.querySelector('img').src=src;b.classList.add('has')})}
Object.keys(imgs).forEach(function(k){if(imgs[k])setImg(k,imgs[k])});
document.querySelectorAll('.slot').forEach(function(el){el.onclick=function(){cur=el.getAttribute('data-k');pick.value='';pick.click()}});
pick.onchange=function(){var f=pick.files&&pick.files[0];if(!f||!cur)return;var K=cur,r=new FileReader();
 r.onload=function(){var im=new Image();im.onload=function(){var max=600,s=Math.min(1,max/Math.max(im.width,im.height));
  var c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);var d=c.toDataURL('image/jpeg',.86);
  setImg(K,d);parent.postMessage({type:'nanoWidgetImage',widget:W,key:K,data:d},'*')};im.src=r.result};r.readAsDataURL(f)};
var SK='nanoTxt_'+W,saved={};try{saved=JSON.parse(localStorage.getItem(SK)||'{}')}catch(e){}
document.querySelectorAll('[data-t]').forEach(function(el){var k=el.getAttribute('data-t');
 if(saved[k]!=null)el.textContent=saved[k];
 el.addEventListener('input',function(){saved[k]=el.textContent;try{localStorage.setItem(SK,JSON.stringify(saved))}catch(e){}});
 el.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();el.blur()}})});

</script>
