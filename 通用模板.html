<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>通用卡片模板</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    /* ==================== 通用重置 ==================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 20px;
    }

    /* ==================== 卡片基础 ==================== */
    .card {
      width: 100%;
      max-width: 300px;               /* 统一宽度 */
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      border: 1px solid #e5e5e5;
    }

    /* ==================== 顶部状态栏 ==================== */
    .card-header {
      background: #111111;
      color: #ffffff;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
    }

    .status i {
      font-size: 13px;
      color: #a0a0a0;
    }

    .time {
      font-size: 12px;
      color: #b0b0b0;
    }

    /* ==================== 主内容区（金额 / 礼物等） ==================== */
    .main-section {
      padding: 16px 14px 12px;
      text-align: center;
      border-bottom: 1px solid #f0f0f0;
    }

    /* 图标容器（礼物、红包等可用） */
    .main-icon {
      width: 42px;
      height: 42px;
      background: #f5f5f5;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 8px;
    }

    .main-icon i {
      font-size: 20px;
      color: #222222;
    }

    .main-label {
      font-size: 11px;
      color: #888888;
      margin-bottom: 2px;
    }

    .main-title {
      font-size: 17px;
      font-weight: 700;
      color: #111111;
    }

    /* 金额专用样式 */
    .amount {
      font-size: 26px;
      font-weight: 700;
      color: #111111;
      letter-spacing: -0.5px;
    }

    .amount span {
      font-size: 16px;
      font-weight: 500;
      margin-right: 1px;
    }

    /* ==================== 信息区（两列布局） ==================== */
    .info-section {
      padding: 12px 14px 8px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 12px;
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-box {
      width: 30px;
      height: 30px;
      background: #f5f5f5;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon-box i {
      font-size: 12px;
      color: #333333;
    }

    .info-content {
      min-width: 0;
    }

    .info-label {
      font-size: 10px;
      color: #999999;
      margin-bottom: 1px;
    }

    .info-value {
      font-size: 12px;
      color: #111111;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ==================== 留言区（可选） ==================== */
    .message-box {
      margin: 10px 14px 0;
      background: #f8f8f8;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      color: #444444;
      line-height: 1.35;
    }

    /* ==================== 底部按钮 ==================== */
    .card-footer {
      padding: 12px 14px 14px;
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      height: 38px;
      border-radius: 10px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: #111111;
      color: #ffffff;
    }

    .btn-primary:hover {
      background: #333333;
    }

    .btn-secondary {
      background: #f5f5f5;
      color: #333333;
    }

    .btn-secondary:hover {
      background: #e8e8e8;
    }

    .btn i {
      font-size: 12px;
    }
  </style>
</head>
<body>

  <!-- ==================== 通用卡片结构 ==================== -->
  <div class="card">

    <!-- 1. 顶部状态栏 -->
    <div class="card-header">
      <div class="status">
        <i class="fa-solid fa-circle-check"></i>   <!-- 可替换图标 -->
        <span>状态文字</span>                     <!-- 可替换文字 -->
      </div>
      <div class="time">今天 14:28</div>         <!-- 可替换时间 -->
    </div>

    <!-- 2. 主内容区（金额 / 礼物 / 标题） -->
    <div class="main-section">
      <!-- 方式A：金额类（转账、红包） -->
      <!--
      <div class="main-label">转账金额</div>
      <div class="amount"><span>¥</span>1,280.00</div>
      -->

      <!-- 方式B：图标+标题类（礼物、优惠券等） -->
      <div class="main-icon">
        <i class="fa-solid fa-gift"></i>
      </div>
      <div class="main-label">收到一份礼物</div>
      <div class="main-title">精美礼盒</div>
    </div>

    <!-- 3. 信息区（固定两列） -->
    <div class="info-section">
      <div class="info-grid">
        <!-- 信息项 1 -->
        <div class="info-item">
          <div class="icon-box">
            <i class="fa-solid fa-user"></i>
          </div>
          <div class="info-content">
            <div class="info-label">标签</div>
            <div class="info-value">内容</div>
          </div>
        </div>

        <!-- 信息项 2 -->
        <div class="info-item">
          <div class="icon-box">
            <i class="fa-solid fa-calendar-day"></i>
          </div>
          <div class="info-content">
            <div class="info-label">标签</div>
            <div class="info-value">内容</div>
          </div>
        </div>

        <!-- 信息项 3 -->
        <div class="info-item">
          <div class="icon-box">
            <i class="fa-solid fa-hashtag"></i>
          </div>
          <div class="info-content">
            <div class="info-label">标签</div>
            <div class="info-value">内容</div>
          </div>
        </div>

        <!-- 信息项 4 -->
        <div class="info-item">
          <div class="icon-box">
            <i class="fa-solid fa-box"></i>
          </div>
          <div class="info-content">
            <div class="info-label">标签</div>
            <div class="info-value">内容</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 4. 留言区（可选，不需要就删掉） -->
    <div class="message-box">
      「这里是留言内容」
    </div>

    <!-- 5. 底部按钮（统一：退换 + 接受） -->
    <div class="card-footer">
      <button class="btn btn-secondary">
        <i class="fa-solid fa-rotate-left"></i>
        退换
      </button>
      <button class="btn btn-primary">
        <i class="fa-solid fa-hand-holding-dollar"></i>
        接受
      </button>
    </div>

  </div>

</body>
</html>
